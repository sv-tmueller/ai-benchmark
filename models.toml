# ──────────────────────────────────────────────
# Model Registry
# ──────────────────────────────────────────────
# Every entry describes one endpoint you can benchmark.
#
# Fields:
#   provider      – arbitrary label, groups models in reports
#   base_url      – OpenAI-compatible base URL (without /v1 suffix,
#                   unless your server expects it — some do, some don't)
#   api_key_env   – environment variable holding the API key
#   model         – the model name the API expects
#   price_in      – USD per 1 M input tokens (optional, for cost reporting)
#   price_out     – USD per 1 M output tokens (optional)
#   max_tokens    – default max completion tokens (override per-prompt if needed)
#
# Add as many as you like. Keys ("openai-gpt4o" etc.) are just identifiers
# you pass to the runner with --model.

[models.openai_gpt4o]
provider        = "openai"
base_url        = "https://api.openai.com/v1"
api_key_env     = "OPENAI_API_KEY"
model           = "gpt-4o"
price_in        = 2.50
price_out       = 10.00
max_tokens      = 1024

