# ──────────────────────────────────────────────
# Model Registry
# ──────────────────────────────────────────────
# Every entry describes one endpoint you can benchmark.
#
# Fields:
#   provider      – arbitrary label, groups models in reports
#   base_url      – OpenAI-compatible base URL
#   api_key_env   – environment variable holding the API key
#   model         – the model name the API expects
#   price_in      – USD per 1 M input tokens (optional)
#   price_out     – USD per 1 M output tokens (optional)
#   max_tokens    – default max completion tokens

# ── Kimi K3 (Moonshot AI) ──
[models.kimi_k3]
provider        = "moonshot"
base_url        = "https://api.moonshot.cn/v1"
api_key_env     = "MOONSHOT_API_KEY"
model           = "kimi-k3"
price_in        = 0.0
price_out       = 0.0
max_tokens      = 4096

# ── GLM 5.2 (Zhipu / Z.ai) ──
[models.glm_5_2]
provider        = "zhipu"
base_url        = "https://ai.noris.de/v1"
api_key_env     = "AI_NORIS_API_KEY"
model           = "release/glm-5-2"
price_in        = 0.0
price_out       = 0.0
max_tokens      = 4096

