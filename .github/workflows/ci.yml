name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python version
        run: python --version

      - name: Validate all TOML files parse correctly
        run: |
          python - <<'PY'
          import tomllib, sys, glob

          errors = []
          for f in sorted(glob.glob("*.toml") + glob.glob("prompts/*.toml")):
              if f.endswith(".fixtures.toml"):
                  continue
              try:
                  with open(f, "rb") as fh:
                      tomllib.load(fh)
                  print(f"  OK  {f}")
              except Exception as e:
                  errors.append(f"{f}: {e}")
                  print(f"  ERR {f}: {e}")

          if errors:
              print(f"\n{len(errors)} TOML file(s) failed to parse!")
              sys.exit(1)
          else:
              print(f"\nAll TOML files parsed successfully.")
          PY

      - name: Validate models.toml has required fields
        run: |
          python - <<'PY'
          import tomllib, sys

          with open("models.toml", "rb") as fh:
              data = tomllib.load(fh)

          models = data.get("models", {})
          if not models:
              print("WARNING: models.toml has no model entries")
              sys.exit(0)

          required = ["provider", "base_url", "api_key_env", "model"]
          errors = []
          for key, val in models.items():
              for field in required:
                  if field not in val:
                      errors.append(f"models.{key} missing required field '{field}'")
              print(f"  OK  {key} -> {val.get('model', '?')}")

          if errors:
              print(f"\n{len(errors)} validation error(s):")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          else:
              print(f"\nAll {len(models)} model(s) validated.")
          PY

      - name: Validate all prompt TOMLs have required fields
        run: |
          python - <<'PY'
          import tomllib, sys, glob

          required_top = ["id", "user"]
          errors = []
          count = 0

          for f in sorted(glob.glob("prompts/*.toml")):
              if f.endswith(".fixtures.toml"):
                  continue
              count += 1
              with open(f, "rb") as fh:
                  data = tomllib.load(fh)

              for field in required_top:
                  if field not in data:
                      errors.append(f"{f}: missing required field '{field}'")

              user_block = data.get("user", {})
              if isinstance(user_block, dict):
                  if not user_block.get("text", "").strip():
                      errors.append(f"{f}: user.text is empty or missing")
              elif isinstance(user_block, str):
                  if not user_block.strip():
                      errors.append(f"{f}: user text is empty")

              prompt_id = data.get("id", "<missing>")
              print(f"  OK  {f} -> id='{prompt_id}'")

          # Check for duplicate IDs (after fixture expansion)
          from bench.config import load_prompts
          from pathlib import Path
          prompts = load_prompts(Path("prompts"))
          ids = [p.id for p in prompts]
          seen = {}
          for pid in ids:
              if pid in seen:
                  errors.append(f"Duplicate id '{pid}' (appears more than once)")
              else:
                  seen[pid] = True

          if errors:
              print(f"\n{len(errors)} validation error(s):")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          else:
              print(f"\nAll {count} prompt(s) validated. {len(ids)} unique IDs after expansion.")
          PY

      - name: Verify all modules import cleanly
        run: |
          python -c "from bench.config import load_models, load_prompts, load_runner_config; print('config OK')"
          python -c "from bench.executor import execute_once, SingleResult; print('executor OK')"
          python -c "from bench.reporting import write_json, write_markdown, print_console_summary; print('reporting OK')"
          python -c "from bench.grader import grade_result, has_grading; print('grader OK')"
          python -c "from bench.streaming_executor import execute_streaming, StreamedResult; print('streaming OK')"
          python -c "from bench.comparison import write_comparison_markdown, write_game_comparison_html; print('comparison OK')"
          python -c "from bench.vision import encode_image_file, load_images_from_prompt; print('vision OK')"
          python -c "from bench.parameterize import expand_prompt, load_fixtures, find_placeholders; print('parameterize OK')"
          python -c "from bench.scoring import compute_scores, format_leaderboard, leaderboard_to_dict; print('scoring OK')"
          python -c "import ast; ast.parse(open('analyze.py').read()); print('analyze.py syntax OK')"

      - name: Run benchmark dry-run
        run: |
          echo "::group::Dry run with all prompts and all models"
          python run.py --dry-run
          echo "::endgroup::"

          echo "::group::Dry run filtered by category"
          python run.py --dry-run --category game-generation
          echo "::endgroup::"

          echo "::group::Dry run filtered by difficulty"
          python run.py --dry-run --difficulty hard
          echo "::endgroup::"

          echo "::group::Dry run with streaming flag"
          python run.py --dry-run --stream --model glm_5_2 --prompt-id math-addition
          echo "::endgroup::"

          echo "::group::Dry run with compare flag"
          python run.py --dry-run --compare --model glm_5_2 --model chatgpt_5_6
          echo "::endgroup::"

      - name: Smoke test individual modules
        run: |
          python - <<'PY'
          # Grader
          from bench.grader import grade_result
          g, d = grade_result("42", {"mode": "contains", "expected": "42"})
          assert g == 1.0, f"grader failed: {g}"
          print("grader smoke test OK")

          # Scoring
          from bench.scoring import compute_scores, format_leaderboard
          from bench.executor import SingleResult
          mock = [SingleResult(model_key="m1", model_name="m1", provider="p",
              prompt_id="p", prompt_title="t", category="c", difficulty="e",
              repeat_index=0, tokens_per_second=100, cost_usd=0.01, grade=0.8)]
          lb = compute_scores(mock)
          assert len(lb) == 1
          print("scoring smoke test OK")

          # Parameterize
          from bench.parameterize import find_placeholders, slugify
          ph = find_placeholders("Hello {{name}}, {{lang}}")
          assert set(ph) == {"name", "lang"}
          assert slugify("English to German") == "english-to-german"
          print("parameterize smoke test OK")

          # Vision
          from bench.vision import encode_image_file
          uri = encode_image_file("prompts/assets/shapes.png")
          assert uri.startswith("data:image/png;base64,"), f"bad URI: {uri[:30]}"
          print("vision smoke test OK")

          print("\nAll smoke tests passed!")
          PY
