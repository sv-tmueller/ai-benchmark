name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-prompts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python version
        run: python --version

      - name: Validate all TOML files parse correctly
        run: |
          python - <<'PY'
          import tomllib, sys, glob

          errors = []
          for f in sorted(glob.glob("*.toml") + glob.glob("prompts/*.toml")):
              if f.endswith(".fixtures.toml"):
                  continue
              try:
                  with open(f, "rb") as fh:
                      tomllib.load(fh)
                  print(f"  OK  {f}")
              except Exception as e:
                  errors.append(f"{f}: {e}")
                  print(f"  ERR {f}: {e}")

          if errors:
              print(f"\n{len(errors)} TOML file(s) failed to parse!")
              sys.exit(1)
          else:
              print(f"\nAll TOML files parsed successfully.")
          PY

      - name: Validate all prompt TOMLs have required fields
        run: |
          python - <<'PY'
          import tomllib, sys, glob

          required_top = ["id", "user"]
          errors = []
          count = 0

          for f in sorted(glob.glob("prompts/*.toml")):
              if f.endswith(".fixtures.toml"):
                  continue
              count += 1
              with open(f, "rb") as fh:
                  data = tomllib.load(fh)

              for field in required_top:
                  if field not in data:
                      errors.append(f"{f}: missing required field '{field}'")

              user_block = data.get("user", {})
              if isinstance(user_block, dict):
                  if not user_block.get("text", "").strip():
                      errors.append(f"{f}: user.text is empty or missing")
              elif isinstance(user_block, str):
                  if not user_block.strip():
                      errors.append(f"{f}: user text is empty")

              prompt_id = data.get("id", "<missing>")
              print(f"  OK  {f} -> id='{prompt_id}'")

          if errors:
              print(f"\n{len(errors)} validation error(s):")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          else:
              print(f"\nAll {count} prompt(s) validated.")
          PY
