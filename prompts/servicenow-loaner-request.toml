# Reworked in #285. The original asked for six user stories with Gherkin
# acceptance criteria as markdown. The rework asks for the implementation of
# those six stories instead: one update set XML that the reviewer imports
# into a Personal Developer Instance (Retrieved Update Sets > Import Update
# Set from XML), previews, commits and then tests by hand. The domain
# contract and the per-story minimums are carried over; the per-story
# minimums are now the behaviour the committed update set must show.
id          = "servicenow-loaner-request"
title       = "Equipment Loan Desk as one importable ServiceNow update set (XML)"
category    = "servicenow"
difficulty  = "hard"
temperature = 0.2
max_tokens  = 65536
save_as     = "xml"
file_prefix = "servicenow-loaner-request"

[system]
text = '''
You are a senior ServiceNow developer. You deliver work as update sets that
preview without errors and commit cleanly on a fresh instance. You use
precise ServiceNow artefacts (custom table, dictionary entries, choices,
number maintenance, business rule, client script, UI policy, scheduled script
execution, event and email notification, role, ACL, form and list layout) and
you never invent tables, fields or APIs that do not exist in the platform.
'''

[user]
text = '''
CONTEXT
An internal IT department runs an equipment loan desk (laptops, projectors,
test gear borrowed by employees for short periods). The desk must be stood up
on a clean ServiceNow Personal Developer Instance (latest release, Australia
era) as a custom Global-scope application. I will import your file under
System Update Sets > Retrieved Update Sets > "Import Update Set from XML",
preview it, commit it, and then test the result by hand.

YOUR TASK
Produce one update set, exported as XML, that implements all six stories
below. No story may be left out or stubbed.

  Story 1 — LOAN DESK SCHEMA: "Loan Request table (schema foundation)"
  Story 2 — SERVER GOVERNANCE: "Approval gatekeeper business rule"
  Story 3 — FORM USABILITY: "Form usability client scripts"
  Story 4 — NIGHTLY AUTOMATION: "Overdue loan sweep (scheduled job + notification)"
  Story 5 — SECURITY MODEL: "Roles and ACLs for the loan desk"
  Story 6 — PRESENTATION LAYER: "Loan Request form and list that display overdue tracking"

DOMAIN CONTRACT (all six stories build on this shared model; do not
contradict it)
Custom table u_loan_request (extends task, Global scope, label "Loan
Request"):
  - u_requester   reference to sys_user, mandatory
  - u_asset_tag   string (40), mandatory, display column
  - u_loan_status choice: requested / approved / rejected / returned,
                  default requested
  - u_due_date    date
  - u_overdue     boolean, default false — set exclusively by the nightly
                  sweep (Story 4), displayed by the form (Story 6)
  - u_notes       multiline text (4000)
Auto-numbering: prefix LN, starting LN0001001, seven digits.
Roles: lab_borrower, lab_supervisor.

REQUIRED BEHAVIOUR AFTER COMMIT (this is what I will test)
  Story 1: the table exists in Global scope with the stated columns, labels,
           defaults, mandatory flags, choices and LN auto-numbering; a module
           "Loan Requests" under an application menu "Loan Desk" opens its
           list.
  Story 2: requested -> returned is aborted server-side with a clear error
           message regardless of entry point (REST, UI, import); approving
           without a due date is aborted; the legal path due date -> approve
           -> return succeeds.
  Story 3: notes are hidden until a requester is chosen; a warning is shown
           when status flips to returned while due date is empty; no warnings
           on legitimate edits.
  Story 4: a scheduled script execution, daily at 02:00, sets u_overdue=true
           on approved loans past their due date; re-runs are idempotent
           (already-flagged loans untouched); returned and not-yet-due loans
           untouched; the requester receives the "Loan Overdue Alert" email
           naming asset tag and due date. "Execute Now" on the job must work.
  Story 5: lab_borrower may read and create but neither delete nor approve
           (may not set u_loan_status to approved or rejected);
           lab_supervisor may read, create, write, delete and approve; users
           without either role may not read.
  Story 6: the form has three titled sections (Identification, Scheduling,
           Remarks) with the state trio (loan status, due date, overdue)
           together in the Scheduling section and u_overdue read-only; the
           list shows number, requester, asset tag, loan status, due date,
           overdue.

UPDATE SET RULES
- The file is a complete update set export: one <unload> root containing
  exactly one sys_remote_update_set record, named "Loan Desk", application
  Global, state "loaded", followed by one sys_update_xml record per
  customer update, each linked to that update set and each carrying its
  record in its payload element, as the platform exports it (the record XML
  entity-escaped, or in a CDATA section that is never broken by a nested
  "]]>"), with the correct name, type, target_name and action.
- Everything the six stories need is in the update set and nothing else:
  table and dictionary definitions with labels and choices, the number
  record, application menu and module, the business rule(s), client
  script(s) and/or UI policies, the scheduled job, the event registration
  and email notification, the roles, the ACLs, the form sections and
  elements, and the list layout.
- Every sys_id is a unique 32-character lowercase hex string, used
  consistently wherever the record is referenced. References to baseline
  records (sys_user, the task table, the admin role and so on) use table
  names or the values that exist on every instance, never invented sys_ids.
- All server-side and client-side scripts are complete and follow platform
  best practice: no hard-coded sys_ids, GlideRecord queries are filtered, no
  current.update() in a business rule on its own table, client scripts guard
  isLoading, messages go through gs.addErrorMessage / g_form.
- The update set's description lists the six stories, one line each, and a
  short manual test plan for each (what to click, what to expect).
- Well-formed XML: correct escaping, every CDATA section closed properly and
  none nested inside another, UTF-8.

CONSTRAINTS
- Stay inside baseline platform capabilities: custom tables, business rules,
  client scripts, UI policies, scheduled script executions, events and email
  notifications, roles, ACLs, form/list configuration. No IntegrationHub
  spokes, no paid plugins, no Flow Designer, no scoped application.
- Field labels and messages in English.

SELF-CHECK BEFORE ANSWERING
Verify mentally: (1) the file is well-formed XML with one update set record
and every update linked to it, (2) the preview would report no missing
references and no collisions on a fresh instance, (3) after commit a new Loan
Request gets number LN0001001 and the form shows the three sections, (4) each
story's required behaviour above is implemented by a record in the file,
(5) the domain contract is respected everywhere (field names, statuses,
numbering, roles), (6) no sys_id is used for two different records.

The deliverable is one file, servicenow-loaner-request.xml, starting with <?xml version="1.0" encoding="UTF-8"?>, no markdown fences, no explanations.
'''
