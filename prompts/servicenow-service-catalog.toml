id          = "servicenow-service-catalog"
title       = "Five Service Catalog user stories with Gherkin acceptance criteria"
category    = "servicenow"
difficulty  = "medium"
temperature = 0.2
max_tokens  = 16384
save_as     = "md"
file_prefix = "servicenow-catalog-stories"

[system]
text = '''
You are a senior ServiceNow ITSM consultant and backlog owner. You write user
stories and acceptance criteria that an implementation team can build from
without asking clarifying questions. You use precise ServiceNow terminology
(catalog item, Record Producer, RITM, SCTASK, approvals, Flow Designer,
variable sets) and you never invent features that do not exist in the platform.
'''

[user]
text = '''
CONTEXT
We are standing up a clean ServiceNow instance for an enterprise client. Their
internal IT department wants five individually scoped Service Catalog items
covering three practice areas: Incident Management, Request Fulfillment, and
Problem Management. Every catalog item lives in its own story; the two Request
catalog items additionally require a simple fulfillment flow on the RITM.

YOUR TASK
Produce exactly 5 user stories — no fewer, no filler stories. Distribute them
as follows:

  Story 1 — INCIDENT catalog item: "Report a Hardware Issue"
  Story 2 — INCIDENT catalog item: "Report a Software or Application Issue"
  Story 3 — REQUEST catalog item: "Order a Standard Laptop"
  Story 4 — REQUEST catalog item: "Request a Software License"
  Story 5 — PROBLEM catalog item: "Log a Recurring IT Problem"

STORY FORMAT (apply identically to all 5 stories)
For each story provide, in this order:

  1. Title               — "<Story N>: ..." heading
  2. User statement      — "As a <persona>, I want <capability>, so that <benefit>."
                           Personas must vary sensibly (employee, contractor,
                           IT technician, problem manager, requester's manager).
  3. Item configuration  — a compact spec for the catalog item:
                             - Table/classification (Record Producer vs.
                               traditional catalog item) and the target table
                               (incident, sc_request, problem)
                             - Catalog/category placement and availability
                               (Employee Center and/or Service Portal)
                             - Full variable list: name, type (per ServiceNow
                               variable types), label, mandatory Y/N, and any
                               dependent/reference qualifiers worth stating
                             - Submission behavior (which record is created,
                               what is mapped, what the user sees afterwards)
  4. Flow description    — only for Stories 3 and 4 (see FLOW REQUIREMENT);
                           for the others, state the minimal fulfillment
                           expectation (assignment group suggestion, priority
                           derivation, or problem triage handover).
  5. Acceptance Criteria — Gherkin, per the rules below.

FLOW REQUIREMENT (Stories 3 and 4 only)
Both Request catalog items share the same simple flow shape — implement it as
described, differing only in the specifics called out per story:

  Step 1 — RITM-level approval: after catalog submission creates the REQ/RITMs,
           a single approval activity sits on the RITM (not the REQ). The
           approver is resolved dynamically as the requester's manager via a
           manager lookup. Approve advances the flow; Reject closes the RITM
           as "Closed Incomplete", cancels/not-creates any downstream tasks,
           and notifies the requester.
  Step 2 — Sequential Task A: on approval, the first catalog task (SCTASK) is
           created for a named fulfillment group. Nothing else happens until
           this task reaches Closed Complete.
  Step 3 — Sequential Task B: only after Task A closes does the second SCTASK
           open for its own fulfillment group. Its completion closes the RITM
           as "Closed Complete".
  The two tasks MUST run strictly sequentially — never in parallel. Name the
  groups, task short descriptions, and expected SLA posture concretely per
  story (Story 3: procurement prep then IT provisioning/hand-over;
  Story 4: license entitlement check then installation/grant).

GHERKIN RULES (correct spelling throughout: Gherkin)
- One Feature block per story, titled after the catalog item.
- Cover at minimum per story: (a) the happy-path submission producing the
  correct record with correct field/variable values, (b) mandatory-variable /
  invalid-input behavior blocking or guiding the user, and (c) for Stories 3
  and 4: the full approval lifecycle — approve leads to Task A, Task A closing
  unlocks Task B, both closing closes the RITM, and Reject terminates the flow
  with no orphaned tasks.
- Scenarios must be independently executable statements about observable
  behavior (portal, My Requests, fulfillment views) — not implementation
  internals like script fragments or table joins.
- Use Scenario Outline with an Examples table anywhere repetition begs for it
  (at least once across the document).
- Steps must be concrete: name actual variables, statuses, and actors from the
  story spec. No vague steps like "the system processes the request".

CONSTRAINTS
- Stay inside latest ServiceNow (Australia release era) capabilities:
  Service Catalog, Flow Designer, Approval activities, catalog tasks. No
  custom applications, no IntegrationHub spokes, no paid plugins.
- Realistic corporate flavor: consistent fake org details (company name,
  assignment groups like "End User Computing", "Software Asset Management",
  "Network Operations"), believable locations and cost centers reused across
  stories so the set feels coherent.
- Professional, implementation-ready tone. Tables allowed for variable lists.

QUALITY BAR / SELF-CHECK BEFORE ANSWERING
Verify mentally: (1) exactly 5 stories in the stated order, (2) every story
has a user statement, item configuration, and Gherkin acceptance criteria,
(3) Stories 3 and 4 encode the approval + 2 strictly sequential tasks on the
RITM including the reject path, (4) all Gherkin parses conceptually
(Feature/Scenario/Examples keywords correct), (5) no contradictions between
story text and its scenarios.

OUTPUT
Markdown. Start directly with the Story 1 heading — no preamble, no meta
commentary about the task.
'''
