<script type="module">
/*
LAST FLIGHT — one-file Three.js superhero rescue game.
Sections in order: config / core (renderer loop input audio pool math events) /
world (sky city river clouds stadium ground collision) /
entities (hero flight laser airliner holding jet missile wreck) /
vfx (particles explosions trails speedlines) /
shaders (radialBlur grade fire water windows cloud) /
game (mission camera hud cinematics scoring debug) /
selftest (flightChecks collisionChecks holdingChecks missionChecks) / main.
Tuning tips:
 1) CONFIG.THRUST and CONFIG.VMAX_BOOST set how violent flight feels — raise both for more Superman.
 2) CONFIG.TURN_LO / TURN_HI control momentum: lower TURN_HI makes high-speed turns wider and heavier.
 3) CONFIG.CAM_LAG and CONFIG.FOV_ADD shape the sense of speed — more lag + more FOV = more drama.
*/
import * as THREE from 'three';
import {Sky} from 'three/addons/objects/Sky.js';
import {Lensflare,LensflareElement} from 'three/addons/objects/Lensflare.js';
import {GUI} from 'three/addons/libs/lil-gui.module.min.js';
import {EffectComposer,RenderPass,EffectPass,Effect,GodRaysEffect,BloomEffect,ChromaticAberrationEffect,VignetteEffect,NoiseEffect,ToneMappingEffect,ToneMappingMode,SMAAEffect,SMAAPreset} from 'postprocessing';

/*============================ config ============================*/
const CONFIG={
 THRUST:60,            // m/s^2 forward thrust (W)
 BOOST_MULT:2.2,       // thrust multiplier while boosting
 VMAX_CRUISE:65,       // m/s terminal speed, cruise
 VMAX_BOOST:190,       // m/s terminal speed, boost
 TURN_LO:2.5,          // rad/s max turn rate at 0 m/s
 TURN_HI:0.7,          // rad/s max turn rate at VMAX_BOOST
 BRAKE_DRAG:6,         // drag multiplier while air-braking (S)
 VERT_ACC:25,          // m/s^2 Space/Ctrl vertical accel
 STRAFE_ACC:20,        // m/s^2 A/D strafe in hover
 GRAV_COAST:2.5,       // m/s^2 gravity while coasting
 GRAV_STUN:9.8,        // m/s^2 gravity while stunned
 BOOST_DRAIN:4,        // s to drain boost meter
 BOOST_REFILL:3,       // s to refill boost meter
 BOOST_LOCK:1,         // s lockout at empty
 SUPERSONIC:140,       // m/s sonic boom threshold
 SS_REARM:120,         // m/s re-arm threshold
 HERO_HP:100, REGEN:10, REGEN_DELAY:4, // hero health (hp, hp/s, s)
 HIT_TRACER:8, HIT_MISSILE:35,         // damage to hero
 HERO_R:0.9,           // m collision sphere radius
 RESTITUTION:0.25, CRASH_KEEP:0.4, STUN_T:0.5, // wall impact response
 HARD_LAND:30,         // m/s hard landing threshold
 CITY_LIMIT:4500,      // m soft boundary — overridden east for the intercept
 LASER_RANGE:1500,     // m beam range
 LASER_DPS_JET:35, LASER_DPS_MIS:60,   // HP/s laser damage
 HEAT_UP:4, HEAT_DOWN:3, OVERHEAT_T:2, // s to overheat / cool / lockout
 JET_HP:100, JET_SPEED:180, JET_TURN:1.6, JET_FLOOR:250, // enemy jets
 MIS_SPEED:250, MIS_TURN:1.2, MIS_HP:20, MIS_PERIOD:12,  // missiles
 HOLD_BRAKE_MAX:12,    // m/s^2 max push-back while holding (S)
 HOLD_GRAV:8, HOLD_LIFT:25, HOLD_DOWN:10, HOLD_FWD:6, // m/s^2 holding forces
 STRESS_DECAY:20,      // stress units/s decay when gentle
 HULL:100,             // airliner hull HP
 PLANE_SPEED:110, PLANE_SINK0:18, PLANE_SINK1:30, // m/s airliner trajectory
 CAM_DIST_LO:5, CAM_DIST_HI:13, // m camera distance hover->supersonic
 CAM_LAG:0.12,         // s camera spring lag at cruise
 FOV:72, FOV_ADD:30,   // deg base FOV and speed widening
 SENS:0.0022,          // rad/px mouse sensitivity
 CELL:48, GRID:64, STREET:14, // m city grid
 SEED:1227,            // city rng seed
};

/*============================ core: math ============================*/
const MU=THREE.MathUtils,V3=THREE.Vector3;
const T1=new V3(),T2=new V3(),T3=new V3(),T4=new V3(),TQ=new THREE.Quaternion(),TM=new THREE.Matrix4();
const UP=new V3(0,1,0);
const clamp=MU.clamp,lerp=MU.lerp;
function expd(cur,tgt,tau,dt){return tgt+(cur-tgt)*Math.exp(-dt/Math.max(tau,1e-4));}
function aimVec(yaw,pitch,out){const c=Math.cos(pitch);out.set(-Math.sin(yaw)*c,Math.sin(pitch),-Math.cos(yaw)*c);return out;}
function safeNorm(v){const l=v.length();if(l>1e-8)v.multiplyScalar(1/l);else v.set(0,0,-1);return v;}
function rotToward(dir,tgt,maxAng){const a=dir.angleTo(tgt);if(a<1e-5)return dir;T4.crossVectors(dir,tgt);if(T4.lengthSq()<1e-10)T4.set(0,1,0);safeNorm(T4);TQ.setFromAxisAngle(T4,Math.min(a,maxAng));return dir.applyQuaternion(TQ);}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function fin(v){return Number.isFinite(v.x)&&Number.isFinite(v.y)&&Number.isFinite(v.z);}

/*============================ core: events ============================*/
function makeEvents(){const m={};return{
 on(e,f){(m[e]||(m[e]=[])).push(f);},
 emit(e,a){const l=m[e];if(l)for(const f of l)f(a);}
};}

/*============================ core: pool ============================*/
function makePool(mk,n){const items=[];for(let i=0;i<n;i++){const o=mk();o._live=false;items.push(o);}return{
 items,
 alloc(){for(const o of items)if(!o._live){o._live=true;return o;}return null;},
 free(o){o._live=false;},
 each(f){for(const o of items)if(o._live)f(o);}
};}

/*============================ core: input ============================*/
function createInput(cfg,events){
 const k={},st={aimYaw:0,aimPitch:0,locked:false,sens:cfg.SENS,fire:false};
 addEventListener('keydown',e=>{if(e.repeat)return;k[e.code]=true;events.emit('anykey');
  if(e.code==='KeyE')events.emit('keyE');
  if(e.code==='KeyR')events.emit(e.shiftKey?'restart':'retry');
  if(e.code==='KeyF')events.emit('freefly');
  if(e.code==='Backquote')events.emit('debug');
  if(e.code==='BracketLeft')st.sens=Math.max(.0005,st.sens*.85);
  if(e.code==='BracketRight')st.sens=Math.min(.01,st.sens*1.18);
  if(['Space','ControlLeft','ShiftLeft'].includes(e.code))e.preventDefault();});
 addEventListener('keyup',e=>{k[e.code]=false;});
 addEventListener('mousemove',e=>{if(!st.locked)return;st.aimYaw+=e.movementX*st.sens;st.aimPitch=clamp(st.aimPitch-e.movementY*st.sens,-1.48,1.48);});
 addEventListener('mousedown',e=>{events.emit('click');if(e.button===0)st.fire=true;if(e.button===2)events.emit('lock');});
 addEventListener('mouseup',e=>{if(e.button===0)st.fire=false;});
 addEventListener('contextmenu',e=>e.preventDefault());
 document.addEventListener('pointerlockchange',()=>{st.locked=document.pointerLockElement!==null;document.getElementById('hint').style.display=st.locked?'none':'block';});
 return{state:st,
  capture(){try{document.body.requestPointerLock();}catch(e){}},
  sample(dt,out){ // arrow-key fallback steering
   if(!st.locked){const r=1.8*dt;if(k.ArrowLeft)st.aimYaw-=r;if(k.ArrowRight)st.aimYaw+=r;if(k.ArrowUp)st.aimPitch=clamp(st.aimPitch+r,-1.48,1.48);if(k.ArrowDown)st.aimPitch=clamp(st.aimPitch-r,-1.48,1.48);}
   out.aimYaw=st.aimYaw;out.aimPitch=st.aimPitch;
   out.thrust=!!k.KeyW;out.brake=!!k.KeyS;out.boost=!!(k.ShiftLeft||k.ShiftRight);
   out.up=!!k.Space;out.down=!!(k.ControlLeft||k.ControlRight);out.left=!!k.KeyA;out.right=!!k.KeyD;out.fire=st.fire;return out;},
  update(){},dispose(){}};
}

/*============================ core: audio ============================*/
function createAudio(cfg){
 let ac=null,master,windG,windF,boostG,laserG,laserO,droneG,droneF,noiseBuf,kickT=0,combat=false,ts=1;
 function noise(){const b=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
 function src(loop){const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=loop;return s;}
 function init(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=ac.createGain();master.gain.value=.6;master.connect(ac.destination);noiseBuf=noise();
  windF=ac.createBiquadFilter();windF.type='bandpass';windF.frequency.value=300;windF.Q.value=.8;
  windG=ac.createGain();windG.gain.value=0;const ws=src(true);ws.connect(windF).connect(windG).connect(master);ws.start();
  const bo=ac.createOscillator();bo.type='sawtooth';bo.frequency.value=55;const bf=ac.createBiquadFilter();bf.type='lowpass';bf.frequency.value=220;
  boostG=ac.createGain();boostG.gain.value=0;bo.connect(bf).connect(boostG).connect(master);bo.start();
  laserO=ac.createOscillator();laserO.type='sawtooth';laserO.frequency.value=90;
  laserG=ac.createGain();laserG.gain.value=0;laserO.connect(laserG).connect(master);laserO.start();
  const d1=ac.createOscillator(),d2=ac.createOscillator();d1.type=d2.type='sawtooth';d1.frequency.value=55;d2.frequency.value=55.7;
  droneF=ac.createBiquadFilter();droneF.type='lowpass';droneF.frequency.value=300;
  const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.07;lg.gain.value=180;lfo.connect(lg).connect(droneF.frequency);lfo.start();
  droneG=ac.createGain();droneG.gain.value=.05;d1.connect(droneF);d2.connect(droneF);droneF.connect(droneG).connect(master);d1.start();d2.start();}
 function burst(dur,f0,f1,g){if(!ac)return;const s=src(false),fl=ac.createBiquadFilter(),gn=ac.createGain();fl.type='lowpass';
  fl.frequency.setValueAtTime(f0,ac.currentTime);fl.frequency.exponentialRampToValueAtTime(Math.max(f1,20),ac.currentTime+dur);
  gn.gain.setValueAtTime(g,ac.currentTime);gn.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
  s.connect(fl).connect(gn).connect(master);s.start();s.stop(ac.currentTime+dur);}
 function tone(f0,f1,dur,g,type){if(!ac)return;const o=ac.createOscillator(),gn=ac.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f0,ac.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),ac.currentTime+dur);
  gn.gain.setValueAtTime(g,ac.currentTime);gn.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
  o.connect(gn).connect(master);o.start();o.stop(ac.currentTime+dur);}
 return{init,
  update(dt,s){if(!ac)return;ts=s.timeScale;
   windF.frequency.value=lerp(300,1200,clamp(s.speed/190,0,1))*ts;windG.gain.value=lerp(0,.5,clamp(s.speed/190,0,1));
   boostG.gain.value=expd(boostG.gain.value,s.boosting?.3:0,.15,dt);
   laserG.gain.value=expd(laserG.gain.value,s.firing?.12:0,.06,dt);laserO.frequency.value=(90+s.heat*1.6)*ts;
   combat=s.combat;if(combat){kickT-=dt;if(kickT<=0){kickT=.6;burst(.12,150,40,.5);}}
   droneG.gain.value=expd(droneG.gain.value,s.phase==='RESULTS'?.12:.05,1,dt);},
  boom(){burst(.4,900,80,.9);tone(120,30,.4,.5,'sine');},
  explosion(d){const g=clamp(1-d/2000,0,1);if(g>0){burst(.7,1200,60,.8*g);tone(70,25,.5,.4*g);}},
  shot(){burst(.06,3000,800,.12);},
  whiz(){tone(2000,500,.2,.06,'sine');},
  warn(rate){tone(900,900,.08,.15,'square');},
  groan(){tone(70,40,1.2,.4,'sawtooth');},
  scream(){tone(1400,200,.9,.3,'sawtooth');burst(.9,2000,200,.4);},
  crunch(){burst(.15,500,100,.35);},
  thud(){burst(.3,200,40,.7);},
  clunk(){tone(180,90,.15,.3,'square');},
  chirp(){tone(1200,1600,.07,.12,'sine');},
  roar(g){burst(2.5,800,300,.5*g);},
  whoosh(){burst(.25,2500,400,.25);},
  dispose(){}};
}

/*============================ core: loop ============================*/
function createLoop(step,sim,draw){
 let last=performance.now(),acc=0,ts=1,slowT=0,slowS=1,running=true;
 const api={timeScale:1,
  slow(s,d){slowS=s;slowT=d;},
  update(){},
  frame(now){const raw=Math.min((now-last)/1000,.05);last=now;
   if(slowT>0){slowT-=raw;ts=slowS;}else ts=1;
   api.timeScale=ts;const dt=raw*ts;acc+=dt;let n=0;
   while(acc>=step&&n<12){sim(step,ts);acc-=step;n++;}
   draw(dt,raw,ts);},
  dispose(){running=false;}};
 function tick(now){if(!running)return;api.frame(now);requestAnimationFrame(tick);}
 requestAnimationFrame(tick);
 return api;
}

/*============================ shaders: radialBlur ============================*/
class RadialBlurEffect extends Effect{
 constructor(){super('RadialBlurFx',
 `uniform float uStr;
  void mainImage(const in vec4 inputColor,const in vec2 uv,out vec4 outputColor){
   vec2 d=(vec2(.5)-uv)*uStr/12.0;vec4 c=inputColor;vec2 p=uv;
   for(int i=1;i<12;i++){p+=d;c+=texture2D(inputBuffer,p);}
   outputColor=c/12.0;}`,
 {uniforms:new Map([['uStr',new THREE.Uniform(0)]])});}
}
/*============================ shaders: grade ============================*/
class GradeEffect extends Effect{
 constructor(){super('GradeFx',
 `void mainImage(const in vec4 c,const in vec2 uv,out vec4 o){
   vec3 x=clamp(c.rgb,0.0,1.0);
   vec3 s=x*x*(3.0-2.0*x);
   x=mix(x,s,0.55);
   float lum=dot(x,vec3(.299,.587,.114));
   x+=vec3(.05,.02,-.015)*(1.0-smoothstep(0.0,.55,lum));
   o=vec4(x,c.a);}`);}
}
/*============================ shaders: fire ============================*/
const FIRE_FRAG=`uniform float uT;varying vec2 vUv;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
void main(){vec2 u=vUv-.5;float d=length(u)*2.;
 float n=n2(u*5.+vec2(0.,-uT*4.))*.6+n2(u*11.+vec2(uT*2.,-uT*7.))*.4;
 float body=smoothstep(1.,.2,d+n*.6);
 float t=clamp(uT,0.,1.);
 vec3 col=mix(vec3(1.,.95,.6),vec3(1.,.35,.05),clamp(d+t*.8,0.,1.));
 col=mix(col,vec3(.08,.06,.05),t*t);
 gl_FragColor=vec4(col*2.2,body*(1.-t));}`;
/*============================ shaders: water ============================*/
const WATER_FRAG=`uniform float uT;uniform vec3 uSun;uniform vec3 uCam;varying vec3 vW;
void main(){
 float w1=sin(vW.x*.08+uT*1.1)+sin(vW.z*.07-uT*.9);
 float w2=sin((vW.x+vW.z)*.21+uT*1.7)+sin((vW.x-vW.z)*.17-uT*1.3);
 vec3 n=normalize(vec3(w1*.08+w2*.04,1.,w2*.08+w1*.04));
 vec3 v=normalize(uCam-vW);
 float fr=pow(1.-max(dot(v,n),0.),3.);
 vec3 deep=vec3(.02,.05,.08),sky=vec3(.9,.55,.3);
 vec3 r=reflect(-v,n);
 float spec=pow(max(dot(r,normalize(uSun)),0.),180.)*3.;
 vec3 col=mix(deep,sky,fr*.85)+vec3(1.,.8,.5)*spec;
 gl_FragColor=vec4(col,1.);}`;
/*============================ shaders: windows ============================*/
function windowShader(sh){
 sh.vertexShader=sh.vertexShader
  .replace('#include <common>','#include <common>\nvarying vec3 vWp;varying vec3 vNn;varying float vSd;')
  .replace('#include <begin_vertex>','#include <begin_vertex>\nvWp=(modelMatrix*instanceMatrix*vec4(position,1.)).xyz;vNn=normalize(mat3(instanceMatrix)*normal);vSd=fract(sin(float(gl_InstanceID)*12.99)*43758.5);');
 sh.fragmentShader=sh.fragmentShader
  .replace('#include <common>','#include <common>\nvarying vec3 vWp;varying vec3 vNn;varying float vSd;\nfloat whs(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}')
  .replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
   vec3 wn=normalize(vNn);
   if(abs(wn.y)<.5){
    vec2 wuv=(abs(wn.x)>abs(wn.z)?vWp.zy:vWp.xy)/3.0;
    vec2 g=fract(wuv);
    float win=step(.18,g.x)*step(g.x,.82)*step(.25,g.y)*step(g.y,.78);
    float lit=step(.7,whs(floor(wuv)+vSd*100.0));
    totalEmissiveRadiance+=vec3(1.0,.72,.42)*win*lit*1.4;
   }`);
}
/*============================ shaders: cloud ============================*/
const CLOUD_VERT=`varying vec2 vUv;varying float vL;uniform vec3 uSun;
void main(){vUv=uv;
 vec4 c=modelViewMatrix*instanceMatrix*vec4(0.,0.,0.,1.);
 vec3 wp=(modelMatrix*instanceMatrix*vec4(0.,0.,0.,1.)).xyz;
 vL=clamp(dot(normalize(wp),normalize(uSun))*.5+.6,.4,1.3);
 vec3 sc=vec3(length(instanceMatrix[0].xyz),length(instanceMatrix[1].xyz),1.);
 c.xy+=position.xy*sc.xy;
 gl_Position=projectionMatrix*c;}`;
const CLOUD_FRAG=`varying vec2 vUv;varying float vL;uniform sampler2D uMap;
void main(){vec4 t=texture2D(uMap,vUv);

/*============================ world: city (data) ============================*/
function makeCityData(cfg){
 const rng=mulberry(cfg.SEED),N=cfg.GRID,C=cfg.CELL,O=-N*C/2;
 const cells=new Array(N*N).fill(null),buildings=[];
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const x=O+i*C+C/2,z=O+j*C+C/2;
  const rj=26+6*Math.sin(i*.15)+3*Math.sin(i*.05+2);
  const river=Math.abs(j-rj)<2.5;
  const stad=(i>=0&&i<=5&&j>=29&&j<=34);
  const plaza=((i===40&&j===40)||(i===22&&j===18)||(i===50&&j===25));
  const r1=rng(),r2=rng(),r3=rng(),r4=rng();
  if(river||stad||plaza){cells[i*N+j]={river,stad,plaza,b:null};continue;}
  const dist=Math.hypot(x,z),tall=Math.max(0,1-dist/800);
  let h;if(r1<.08+.3*tall)h=160+r2*260;else if(r1<.3)h=70+r2*90;else h=18+r2*52;
  const hx=12+r3*5,hz=12+r4*5;
  const b={x,z,hx,hz,h,glass:rng()<.35};
  buildings.push(b);cells[i*N+j]={river:false,stad:false,plaza:false,b};
 }
 return{N,C,O,cells,buildings,
  cellAt(x,z){const i=Math.floor((x-O)/C),j=Math.floor((z-O)/C);
   return(i<0||j<0||i>=N||j>=N)?null:cells[i*N+j];},
  surfaceY(x,z){const c=this.cellAt(x,z);if(c&&c.b){const b=c.b;
    if(Math.abs(x-b.x)<b.hx&&Math.abs(z-b.z)<b.hz)return b.h;}
   return 0;}};
}

/*============================ world: collision ============================*/
function createCollision(cfg,city,events){
 function overlapGrid(p,r){
  const i0=Math.floor((p.x-city.O)/city.C),j0=Math.floor((p.z-city.O)/city.C);
  for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){
   const i=i0+di,j=j0+dj;if(i<0||j<0||i>=city.N||j>=city.N)continue;
   const c=city.cells[i*city.N+j];if(!c||!c.b)continue;const b=c.b;
   const cx=clamp(p.x,b.x-b.hx,b.x+b.hx),cy=clamp(p.y,0,b.h),cz=clamp(p.z,b.z-b.hz,b.z+b.hz);
   const dx=p.x-cx,dy=p.y-cy,dz=p.z-cz;
   if(dx*dx+dy*dy+dz*dz<r*r)return b;}
  return null;}
 function overlapBrute(p,r){
  for(const b of city.buildings){
   const cx=clamp(p.x,b.x-b.hx,b.x+b.hx),cy=clamp(p.y,0,b.h),cz=clamp(p.z,b.z-b.hz,b.z+b.hz);
   const dx=p.x-cx,dy=p.y-cy,dz=p.z-cz;
   if(dx*dx+dy*dy+dz*dz<r*r)return b;}
  return null;}
 function pushOut(p,r,b,v){
  const minx=b.x-b.hx,maxx=b.x+b.hx,minz=b.z-b.hz,maxz=b.z+b.hz;
  const cx=clamp(p.x,minx,maxx),cy=clamp(p.y,0,b.h),cz=clamp(p.z,minz,maxz);
  let nx=0,ny=0,nz=0;
  const dx=p.x-cx,dy=p.y-cy,dz=p.z-cz,d2=dx*dx+dy*dy+dz*dz;
  if(d2>1e-9){const d=Math.sqrt(d2);nx=dx/d;ny=dy/d;nz=dz/d;
   p.x=cx+nx*r;p.y=cy+ny*r;p.z=cz+nz*r;}
  else{ // centre inside the box: exit through the nearest face
   const pens=[[p.x-minx,-1,0,0,minx-r,'x'],[maxx-p.x,1,0,0,maxx+r,'x'],
               [b.h-p.y,0,1,0,b.h+r,'y'],
               [p.z-minz,0,0,-1,minz-r,'z'],[maxz-p.z,0,0,1,maxz+r,'z']];
   pens.sort((a,b2)=>a[0]-b2[0]);const f=pens[0];
   nx=f[1];ny=f[2];nz=f[3];
   if(f[5]==='x')p.x=f[4];else if(f[5]==='y')p.y=f[4];else p.z=f[4];}
  if(v){const vn=v.x*nx+v.y*ny+v.z*nz;
   if(vn<0){v.x-=nx*vn*(1+cfg.RESTITUTION);v.y-=ny*vn*(1+cfg.RESTITUTION);v.z-=nz*vn*(1+cfg.RESTITUTION);
    v.multiplyScalar(cfg.CRASH_KEEP);return Math.abs(vn);}}
  return 0;}
 return{overlapGrid,overlapBrute,pushOut,
  nearDist(p){ // distance to nearest building surface within 3x3 cells (for near-miss)
   let best=1e9;const i0=Math.floor((p.x-city.O)/city.C),j0=Math.floor((p.z-city.O)/city.C);
   for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){
    const i=i0+di,j=j0+dj;if(i<0||j<0||i>=city.N||j>=city.N)continue;
    const c=city.cells[i*city.N+j];if(!c||!c.b)continue;const b=c.b;if(p.y>b.h+2)continue;
    const dx=Math.max(Math.abs(p.x-b.x)-b.hx,0),dz=Math.max(Math.abs(p.z-b.z)-b.hz,0);
    best=Math.min(best,Math.hypot(dx,dz));}
   return best;},
  rayCity(o,d,maxD){ // coarse march against grid AABBs + ground
   let t=0;const step=12;
   while(t<maxD){T3.copy(o).addScaledVector(d,t);
    if(T3.y<0)return{t,point:T3.clone(),kind:'ground'};
    const c=city.cellAt(T3.x,T3.z);
    if(c&&c.b){const b=c.b;
     if(T3.y<b.h&&Math.abs(T3.x-b.x)<b.hx&&Math.abs(T3.z-b.z)<b.hz)return{t,point:T3.clone(),kind:'building'};}
    t+=step;}
   return null;},
  resolve(fl,dt){ // hero sphere vs city, ground, bounds
   const p=fl.pos,v=fl.vel;
   const b=overlapGrid(p,cfg.HERO_R);
   if(b){const imp=pushOut(p,cfg.HERO_R,b,v);
    if(imp>3){fl.stunT=cfg.STUN_T;fl.mode='stunned';events.emit('heroCrash',imp);}}
   const surf=city.surfaceY(p.x,p.z);
   if(p.y<surf+1.8){const vy=-v.y;p.y=surf+1.8;
    if(vy>cfg.HARD_LAND){v.y=vy*.3;v.x*=.5;v.z*=.5;fl.stunT=.4;fl.mode='stunned';events.emit('heroCrash',vy);}
    else{v.y=Math.max(v.y,0);
     if(Math.hypot(v.x,v.z)<8&&fl.mode!=='holding'){fl.mode='landed';v.set(0,0,0);}}}
   const d=Math.hypot(p.x,p.z);fl.outside=d>cfg.CITY_LIMIT&&!fl.allowEast;
   if(d>cfg.CITY_LIMIT&&!(fl.allowEast&&p.x>0)){T1.set(-p.x,0,-p.z).normalize();v.addScaledVector(T1,30*dt);}
  },
  update(){},dispose(){}};
}

/*============================ entities: flight ============================*/
function createFlight(cfg,events){
 const st={pos:new V3(0,320,60),vel:new V3(),bodyQuat:new THREE.Quaternion(),
  aimYaw:0,aimPitch:0,boost:1,lock:0,heat:0,hp:cfg.HERO_HP,mode:'hover',
  stunT:0,dragK:cfg.THRUST/(cfg.VMAX_CRUISE*cfg.VMAX_CRUISE),boomArmed:true,
  bank:0,regenT:0,charge:0,outside:false,allowEast:false,boosting:false,modeT:1,prevHead:0};
 function turnRate(speed){return lerp(cfg.TURN_LO,cfg.TURN_HI,MU.smoothstep(speed,0,cfg.VMAX_BOOST));}
 function damage(d,dir){if(st.hp<=0)return;st.hp-=d;st.regenT=0;events.emit('heroHit',{d,dir});
  if(st.hp<=0){st.hp=0;st.mode='stunned';st.stunT=2;events.emit('heroDown');}}
 function update(dt,inp,groundY){
  const speed=st.vel.length();
  st.aimYaw=inp.aimYaw;st.aimPitch=inp.aimPitch;
  const aim=aimVec(st.aimYaw,st.aimPitch,T1);

  const desYaw=Math.atan2(-Math.sin(inp.aimYaw),-Math.cos(inp.aimYaw));
  const curYaw=Math.atan2(a.dir.x,a.dir.z);
  let dy=Math.atan2(a.dir.x,a.dir.z); // steer dir toward aim heading
  T1.set(-Math.sin(inp.aimYaw),0,-Math.cos(inp.aimYaw));
  const ang=a.dir.angleTo(T1);
  const yr=Math.min(ang,0.4*dt);st.yawRate=ang>1e-4?yr/dt:0;
  rotToward(a.dir,T1,yr);a.dir.y=0;safeNorm(a.dir);
  a.roll=expd(a.roll,clamp(-st.yawRate*2,-MU.degToRad(20),MU.degToRad(20)),.5,dt);
  // forces
  let ay=-cfg.HOLD_GRAV;
  if(inp.up)ay+=cfg.HOLD_LIFT;if(inp.down)ay-=cfg.HOLD_DOWN;
  st.ramp=clamp(st.ramp+(inp.brake?dt:-3*dt),0,1);
  let brake=st.ramp*cfg.HOLD_BRAKE_MAX;
  const deg15=MU.degToRad(15);
  if(a.pitch>deg15){brake+=4;ay+=2.5;}
  if(a.pitch<-deg15){ay-=3;v.addScaledVector(a.dir,3*dt);}
  const hs=Math.hypot(v.x,v.z);
  const nb=Math.min(brake*dt,hs); // never push the plane backward
  if(hs>1e-4){v.x-=v.x/hs*nb;v.z-=v.z/hs*nb;}
  if(inp.thrust)v.addScaledVector(a.dir,cfg.HOLD_FWD*dt);
  v.y+=ay*dt;
  // keep heading = dir
  const hs2=Math.hypot(v.x,v.z);v.x=a.dir.x*hs2;v.z=a.dir.z*hs2;
  a.pos.addScaledVector(v,dt);
  // stress
  const sink=-v.y;
  let sUp=12*Math.max(0,brake-7);
  if(st.yawRate>.3||hs2>130||sink>20)sUp+=15;
  if(sUp>0)st.stress=Math.min(100,st.stress+sUp*dt);
  else st.stress=Math.max(0,st.stress-cfg.STRESS_DECAY*dt);
  const wasB=st.buckling;st.buckling=st.stress>70;
  if(st.buckling&&!wasB)events.emit('buckling');
  if(st.stress>=100)airliner.hullHit(8*dt,'stress');
  if(!fin(a.pos)||!fin(v)){a.pos.set(-500,600,0);v.set(-30,0,0);}}
 return{st,start,end,update,dispose(){}};
}

/*============================ entities: jet + missile + wreck ============================*/
function createJets(cfg,events,ctx){
 const jets=[],tracers=makePool(()=>({pos:new V3(),vel:new V3(),t:0}),120);
 let killed=0,spawned=0,lateWave=false,waveTimer=0;
 function spawnWave(n,tgt){for(let i=0;i<n;i++){spawned++;
  const a=Math.random()*Math.PI*2;
  jets.push({id:spawned,pos:new V3(Math.cos(a)*2500,600+Math.random()*500,Math.sin(a)*2500),
   vel:new V3(0,0,0),dir:new V3(1,0,0),state:'approach',t:0,hp:cfg.JET_HP,
   burstT:0,fireT:0,misT:6+i*3,evCd:0,lasT:0,tgt,heroNearT:0,bank:0});}
  events.emit('wave',{n});}
 function target(j){
  if(j.tgt==='plane'&&j.heroNearT>3)return ctx.flight.pos;
  return j.tgt==='plane'?ctx.airliner.st.pos:ctx.flight.pos;}
 function update(dt){
  waveTimer+=dt;
  if(ctx.mission&&ctx.mission.phase==='ARREST'&&!lateWave&&(waveTimer>40||ctx.airliner.st.hull<50)){lateWave=true;spawnWave(3,'plane');}
  for(const j of jets){if(j.state==='dead')continue;j.t+=dt;
   const tp=target(j);
   const heroD=j.pos.distanceTo(ctx.flight.pos);
   j.heroNearT=heroD<200?j.heroNearT+dt:0;
   // laser damage comes from laser system via j.lasT
   if(j.lasT>.5&&j.evCd<=0){j.state='evade';j.t=0;j.evCd=4;}
   j.evCd=Math.max(0,j.evCd-dt);j.lasT=Math.max(0,j.lasT-dt*2);
   T1.subVectors(tp,j.pos);const d=T1.length();safeNorm(T1);
   let des=T1,turn=cfg.JET_TURN;
   if(j.state==='approach'){if(d<1500){j.state='attack';j.t=0;}}
   else if(j.state==='attack'){
    if(d<150||j.t>6){j.state='break';j.t=0;j.brk=Math.random()<.5?1:-1;}
    j.burstT-=dt;
    if(j.burstT<=0&&d<1200&&j.dir.dot(T1)>.92){j.fireT=.6;j.burstT=2;}
    if(j.fireT>0){j.fireT-=dt;
     if((j.fireT*8)%1<8*dt){const tr=tracers.alloc();
      if(tr){tr.t=0;tr.pos.copy(j.pos);
       tr.vel.copy(T1).multiplyScalar(600);
       tr.vel.x+=(Math.random()-.5)*16;tr.vel.y+=(Math.random()-.5)*16;tr.vel.z+=(Math.random()-.5)*16;
       ctx.audio.shot();}}}}
   else if(j.state==='break'){des=T2.set(-j.dir.z*j.brk,0.25,j.dir.x*j.brk);safeNorm(des);turn=2.2;
    if(j.t>2){j.state='reposition';j.t=0;}}
   else if(j.state==='reposition'){des=T2.copy(T1).negate();des.y=.3;safeNorm(des);
    if(d>800||j.t>5){j.state='attack';j.t=0;}}
   else if(j.state==='evade'){des=T2.set(-j.dir.z,0.5,j.dir.x);safeNorm(des);turn=2.6;
    if(j.t>1.2){j.state='break';j.t=0;j.brk=1;}}
   if(j.pos.y<cfg.JET_FLOOR){des=T2.copy(des);des.y=Math.max(des.y,.5);safeNorm(des);}
   const preDir=T3.copy(j.dir);
   rotToward(j.dir,des,turn*dt);safeNorm(j.dir);
   j.bank=expd(j.bank,clamp(preDir.angleTo(j.dir)/dt*-Math.sign(preDir.cross(j.dir).y)*.9,-1.1,1.1),.2,dt);
   j.pos.addScaledVector(j.dir,cfg.JET_SPEED*dt);
   // missiles
   j.misT-=dt;
   if(j.misT<=0&&j.pos.distanceTo(tp)>600){j.misT=cfg.MIS_PERIOD;ctx.missiles.fire(j.pos,tp===ctx.flight.pos?'hero':'plane');}
   if(j.hp<=0){j.state='dead';killed++;events.emit('jetKilled',{j,killed});}}
  // tracers
  tracers.each(tr=>{tr.t+=dt;tr.pos.addScaledVector(tr.vel,dt);
   if(tr.pos.distanceTo(ctx.flight.pos)<2.2){ctx.flight.damage(cfg.HIT_TRACER,tr.vel);tracers.free(tr);return;}
   if(tr.pos.distanceTo(ctx.airliner.st.pos)<9&&!ctx.airliner.st.landed){ctx.airliner.hullHit(4,'tracer');tracers.free(tr);return;}
   if(tr.t>2.5)tracers.free(tr);});}
 return{jets,tracers,spawnWave,update,
  get killed(){return killed;},
  alive(){return jets.filter(j=>j.state!=='dead');},
  reset(){jets.length=0;killed=0;spawned=0;lateWave=false;waveTimer=0;},
  dispose(){}};
}

     ctx.vfx.spawnSmoke(T1,T2.set(0,0,0),1.2,3,0xffffff);}}}
  // tracers rendered through the particle system
  ctx.jets.tracers.each(tr=>{ctx.vfx.spawn(tr.pos,T1.set(0,0,0),.06,6,0xffcc66,0,true);});},

function createMissiles(cfg,events,ctx){
 const pool=makePool(()=>({pos:new V3(),vel:new V3(),hp:cfg.MIS_HP,t:0,tgt:'hero',min:1e9}),16);
 const meshes=[];
 function fire(from,tgt){const m=pool.alloc();if(!m)return;
  m.pos.copy(from);m.hp=cfg.MIS_HP;m.t=0;m.tgt=tgt;m.min=1e9;
  T1.subVectors(tgt==='hero'?ctx.flight.pos:ctx.airliner.st.pos,from);safeNorm(T1);
  m.vel.copy(T1).multiplyScalar(cfg.MIS_SPEED);
  events.emit('missileLaunch');ctx.audio.warn();}
 function boom(m,hit){pool.free(m);events.emit('boomAt',{pos:m.pos.clone(),big:false});
  if(hit==='hero')ctx.flight.damage(cfg.HIT_MISSILE,m.vel);
  if(hit==='plane')ctx.airliner.hullHit(25,'missile');}
 function update(dt){pool.each(m=>{m.t+=dt;
  const tp=m.tgt==='hero'?ctx.flight.pos:ctx.airliner.st.pos;
  T1.subVectors(tp,m.pos);const d=T1.length();safeNorm(T1);
  T2.copy(m.vel);safeNorm(T2);rotToward(T2,T1,cfg.MIS_TURN*dt);
  m.vel.copy(T2).multiplyScalar(cfg.MIS_SPEED);
  m.pos.addScaledVector(m.vel,dt);
  if(d<m.min)m.min=d;else if(m.min<1e8&&d>m.min+8){boom(m,null);return;} // overshot: harmless
  const hitR=m.tgt==='hero'?6:10;
  if(d<hitR){boom(m,m.tgt==='hero'?'hero':'plane');return;}
  if(m.hp<=0){boom(m,null);return;}
  if(m.t>18)pool.free(m);
  if(Math.random()<dt*30)ctx.vfx.spawnSmoke(m.pos,T3.set(0,0,0),1.5,3,0xbbbbbb);});}
 return{pool,fire,update,
  nearestTo(p){let best=null,bd=1e9;pool.each(m=>{const d=m.pos.distanceTo(p);if(d<bd){bd=d;best=m;}});return best?{m:best,d:bd}:null;},
  dispose(){}};
}

/*============================ vfx: particles ============================*/
function createParticles(ctx){
 function sys(blend,count){
  const pos=new Float32Array(count*3),col=new Float32Array(count*3),att=new Float32Array(count*2); // size, lifeFrac
  const vel=new Float32Array(count*3),life=new Float32Array(count),maxl=new Float32Array(count),grav=new Float32Array(count);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aCol',new THREE.BufferAttribute(col,3));
  g.setAttribute('aAtt',new THREE.BufferAttribute(att,2));
  const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:blend,
   vertexShader:`attribute vec3 aCol;attribute vec2 aAtt;varying vec3 vC;varying float vL;
    void main(){vC=aCol;vL=aAtt.y;vec4 mv=modelViewMatrix*vec4(position,1.);
    gl_PointSize=aAtt.x*(900.0/max(-mv.z,1.0));gl_Position=projectionMatrix*mv;}`,
   fragmentShader:`varying vec3 vC;varying float vL;
    void main(){float d=length(gl_PointCoord-vec2(.5));
    float a=smoothstep(.5,.08,d)*vL;if(a<.01)discard;gl_FragColor=vec4(vC,a);}`});
  const pts=new THREE.Points(g,mat);pts.frustumCulled=false;ctx.scene.add(pts);
  let head=0;const C=new THREE.Color();
  return{spawn(p,v,lifeS,size,color,gr){const i=head;head=(head+1)%count;
    pos[i*3]=p.x;pos[i*3+1]=p.y;pos[i*3+2]=p.z;
    vel[i*3]=v.x;vel[i*3+1]=v.y;vel[i*3+2]=v.z;
    life[i]=maxl[i]=lifeS;grav[i]=gr;C.set(color);
    col[i*3]=C.r;col[i*3+1]=C.g;col[i*3+2]=C.b;att[i*2]=size;att[i*2+1]=1;},
   update(dt){for(let i=0;i<count;i++){if(life[i]<=0)continue;
    life[i]-=dt;if(life[i]<=0){att[i*2+1]=0;continue;}
    vel[i*3+1]-=grav[i]*dt;
    pos[i*3]+=vel[i*3]*dt;pos[i*3+1]+=vel[i*3+1]*dt;pos[i*3+2]+=vel[i*3+2]*dt;
    att[i*2+1]=life[i]/maxl[i];}
    g.attributes.position.needsUpdate=true;g.attributes.aAtt.needsUpdate=true;g.attributes.aCol.needsUpdate=true;}};}
 const add=sys(THREE.AdditiveBlending,14000),smoke=sys(THREE.NormalBlending,6000);
 return{
  spawn(p,v,l,s,c,gr){add.spawn(p,v,l,s,c,gr||0);},
  spawnSmoke(p,v,l,s,c){smoke.spawn(p,v,l,s,c,-.5);},
  burst(p,n,speed,l,s,c,gr){for(let i=0;i<n;i++){
   T4.set(Math.random()-.5,Math.random()-.5,Math.random()-.5);safeNorm(T4).multiplyScalar(speed*(.3+Math.random()*.7));
   add.spawn(p,T4,l*(.5+Math.random()*.5),s,c,gr||0);}},
  update(dt){add.update(dt);smoke.update(dt);},dispose(){}};
}

/*============================ game: mission ============================*/
function createMission(cfg,events,hooks){
 const PH=['TITLE','CINEMATIC','INTERCEPT','CATCH','ARREST','SETDOWN','RESULTS','FAILED'];
 const st={phase:'TITLE',t:0,reason:'',order:['TITLE'],checkpoint:'TITLE',freefly:false,failedFrom:null};
 function go(p){if(st.phase===p)return;st.phase=p;st.t=0;st.order.push(p);
  if(p==='INTERCEPT'||p==='CATCH'||p==='ARREST'||p==='SETDOWN'){st.checkpoint=p;if(hooks&&hooks.save)hooks.save(p);}
  events.emit('phaseChanged',p);}
 function fail(reason){if(st.phase==='FAILED'||st.phase==='RESULTS')return;
  st.failedFrom=st.checkpoint;st.reason=reason;go('FAILED');}
 events.on('planeImpact',()=>fail('FLIGHT 227 WENT DOWN'));
 events.on('hullZero',()=>fail('AIRFRAME DESTROYED'));
 events.on('heroDown',()=>fail('YOU FELL'));
 events.on('crashTouchdown',()=>fail('CRASH TOUCHDOWN'));
 events.on('caught',()=>{if(st.phase==='CATCH'||st.phase==='INTERCEPT')go('ARREST');});
 return{
  get phase(){return st.phase;},st,
  start(){if(st.phase==='TITLE')go('CINEMATIC');},
  skip(){if(st.phase==='CINEMATIC')go('INTERCEPT');},
  retry(){if(st.phase!=='FAILED')return;
   const back=st.failedFrom||'INTERCEPT';
   if(hooks&&hooks.load)hooks.load(back);
   st.phase=back;st.t=0;st.order.push(back);events.emit('phaseChanged',back);},
  update(dt,w){st.t+=dt;if(st.freefly)return;
   switch(st.phase){
    case 'CINEMATIC':if(st.t>=4)go('INTERCEPT');break;
    case 'INTERCEPT':if(w.distToPlane<1500)go('CATCH');break;
    case 'ARREST':if(w.planeDistToStadium<650&&w.planeSpeed<30)go('SETDOWN');break;
    case 'SETDOWN':if(w.released)go('RESULTS');break;}},
  fail,dispose(){}};
}

/*============================ game: camera ============================*/
function createCamera(cfg,ctx){
 const cam=ctx.camera;
 const pos=new V3(0,340,120),look=new V3();
 let fov=cfg.FOV,shakeA=0,kick=0,cine=0,cineKind='',t=0;
 ctx.events.on('boom',()=>{shakeA=Math.max(shakeA,1.5);});
 ctx.events.on('heroHit',()=>{shakeA=Math.max(shakeA,.8);});
 ctx.events.on('heroCrash',i=>{shakeA=Math.max(shakeA,Math.min(2,i/18));});
 ctx.events.on('caught',()=>{cine=1.4;cineKind='catch';});
 ctx.events.on('tailTorn',()=>{cine=1.6;cineKind='catch';});
 ctx.events.on('touchdown',()=>{cine=3.5;cineKind='setdown';});
 return{shake(a){shakeA=Math.max(shakeA,a);},
  onBoostPress(){kick=.07;},
  update(dt){t+=dt;
   const fl=ctx.flight.st,sp=fl.vel.length(),ph=ctx.mission.phase;
   const aim=aimVec(fl.aimYaw,fl.aimPitch,T1);
   let tgt,lk,tau=lerp(cfg.CAM_LAG,.2,fl.boosting?1:0);
   if(ph==='TITLE'){const a=t*.05;
    tgt=T2.set(Math.cos(a)*420,300+Math.sin(t*.1)*30,Math.sin(a)*420);lk=T3.set(0,180,0);tau=.8;}
   else if(ph==='CINEMATIC'){const a=t*.7;
    tgt=T2.copy(fl.pos).add(T4.set(Math.cos(a)*14,3+Math.sin(a*.5)*2,Math.sin(a)*14));lk=T3.copy(fl.pos);tau=.3;}
   else if(cine>0&&cineKind==='setdown'){cine-=dt;const a=t*.3;
    const p=ctx.airliner.st.pos;
    tgt=T2.copy(p).add(T4.set(Math.cos(a)*70,20,Math.sin(a)*70));lk=T3.copy(p);tau=.5;}
   else if(fl.mode==='holding'){
    if(cine>0)cine-=dt;
    const a2=ctx.airliner.st;
    const nose=ctx.airliner.nosePoint(T4);
    const d=cine>0?34:22;
    tgt=T2.copy(nose).addScaledVector(a2.dir,d).addScaledVector(UP,cine>0?6:2);
    const r=T3.set(-a2.dir.z,0,a2.dir.x);tgt.addScaledVector(r,8);
    lk=T3.copy(nose).addScaledVector(UP,1);tau=.25;}
   else{
    const dist=lerp(cfg.CAM_DIST_LO,cfg.CAM_DIST_HI,MU.smoothstep(sp,0,190));
    const h=lerp(2,3.5,MU.smoothstep(sp,0,190));
    tgt=T2.copy(fl.pos).addScaledVector(aim,-dist).addScaledVector(UP,h);
    const la=lerp(3,25,MU.smoothstep(sp,0,190));
    lk=T3.copy(fl.pos).addScaledVector(aim,la);
    if(ctx.lockTarget&&ctx.lockTarget.state!=='dead')lk.lerp(ctx.lockTarget.pos,.2);}
   // building avoidance
   const hit=ctx.collision.rayCity(lk,T4.subVectors(tgt,lk).normalize(),lk.distanceTo(tgt));
   if(hit&&fl.mode!=='holding')tgt.copy(lk).addScaledVector(T4,Math.max(hit.t-2,2));
   const k=1-Math.exp(-dt/tau);pos.lerp(tgt,k);look.lerp(lk,Math.min(1,k*1.6));
   // shake
   shakeA=expd(shakeA,0,.4,dt);
   const base=MU.smoothstep(sp,100,190)*.12+shakeA*.3;
   T4.set(Math.sin(t*31)+Math.sin(t*47),Math.sin(t*37)+Math.sin(t*53),Math.sin(t*41)).multiplyScalar(base*.5);
   cam.position.copy(pos).add(T4);
   cam.up.set(0,1,0).applyAxisAngle(T1.subVectors(look,pos).normalize(),-fl.bank*.35);
   cam.lookAt(look);
   kick=Math.max(0,kick-dt);
   const tf=cfg.FOV+cfg.FOV_ADD*MU.smoothstep(sp,0,cfg.VMAX_BOOST)+(kick>0?6:0);
   fov=expd(fov,tf,1/8,dt);cam.fov=fov;cam.updateProjectionMatrix();},
  dispose(){}};
}

function createScoring(ctx){

  finish(failed){if(failed)return null;
   const a=ctx.airliner.st,acc=ctx.laser.accuracy();

  const hold=createHolding(cfgA,ev,air);hold.st.active=true;
  const inp={aimYaw:Math.atan2(1,0)*0+ (Math.PI/2),aimPitch:0,brake:true,up:true,down:false,thrust:false};
  // aim west: dir(-1,0,0) => aimYaw with sin=1 => PI/2
  let tHit=-1;
  for(let i=0;i<120*12;i++){hold.update(1/120,inp);
   const hs=Math.hypot(air.st.vel.x,air.st.vel.z);
   if(hs<30&&tHit<0)tHit=i/120;}
  ok('holding: 8 m/s² brake, 110→30 m/s within 12 s',tHit>0&&tHit<12,tHit>0?tHit.toFixed(1)+' s':'never');
  const cfgB={...CONFIG,HOLD_BRAKE_MAX:10};const ev2=makeEvents();
  const air2=createAirliner(cfgB,ev2);air2.st.held=true;air2.st.vel.set(-110,-18,0);
  const hold2=createHolding(cfgB,ev2,air2);hold2.st.active=true;
  let crossed=false;
  for(let i=0;i<120*6;i++){hold2.update(1/120,{aimYaw:Math.PI/2,aimPitch:0,brake:true,up:true,down:false,thrust:false});
   if(hold2.st.stress>70)crossed=true;}
  ok('holding: 10 m/s² sustained crosses stress 70',crossed,'stress '+hold2.st.stress.toFixed(0));
  const ev3=makeEvents();let torn=false;ev3.on('tailTorn',()=>torn=true);
  const air3=createAirliner(CONFIG,ev3);air3.st.grab='tail';
  for(let i=0;i<120*1.6;i++)air3.update(1/120);
  ok('holding: tail grab tears at 1.5 s and drops hull by 30',torn&&Math.round(air3.st.hull)===70,'hull '+air3.st.hull.toFixed(0)+(torn?', torn':', intact'));}
 /* ---- missionChecks ---- */
 {const ev=makeEvents();let saved=[],loaded=[];
  const m=createMission(CONFIG,ev,{save:p=>saved.push(p),load:p=>loaded.push(p)});
  m.start();m.update(4.1,{distToPlane:9000,planeDistToStadium:9e3,planeSpeed:110,released:false});
  m.update(.1,{distToPlane:1400,planeDistToStadium:9e3,planeSpeed:110,released:false});
  ev.emit('caught');
  m.update(.1,{distToPlane:10,planeDistToStadium:500,planeSpeed:25,released:false});
  ev.emit('touchdown',{sink:3});
  m.update(.1,{distToPlane:10,planeDistToStadium:0,planeSpeed:0,released:true});
  const want='TITLE,CINEMATIC,INTERCEPT,CATCH,ARREST,SETDOWN,RESULTS';
  ok('mission: phases transition in order',m.st.order.join(',')===want,m.st.order.join('→'));
  const fails=[['planeImpact','FLIGHT 227 WENT DOWN'],['hullZero','AIRFRAME DESTROYED'],['heroDown','YOU FELL'],['crashTouchdown','CRASH TOUCHDOWN']];
  let allF=true,msg=[];
  for(const[e,r]of fails){const ev2=makeEvents();const m2=createMission(CONFIG,ev2,{});
   m2.start();m2.skip();ev2.emit(e);
   if(m2.phase!=='FAILED'||m2.st.reason!==r)allF=false;msg.push(m2.st.reason);}
  ok('mission: every fail state produces its reason',allF,msg.join(' / '));
  const ev3=makeEvents();let l3=[];const m3=createMission(CONFIG,ev3,{save:()=>{},load:p=>l3.push(p)});
  m3.start();m3.skip();m3.update(.1,{distToPlane:1400,planeDistToStadium:9e3,planeSpeed:110,released:false});
  ev3.emit('heroDown');m3.retry();
  ok('mission: retry restores the phase checkpoint',m3.phase==='CATCH'&&l3[0]==='CATCH','back to '+m3.phase);}
 // report
 const div=document.createElement('div');div.id='selout';
 let pass=0;
 for(const t of out){if(t.pass)pass++;
  const line=(t.pass?'PASS':'FAIL')+'  '+t.name+'  ['+t.val+']';
  console[t.pass?'log':'error'](line);
  const p=document.createElement('div');p.textContent=line;if(!t.pass)p.className='fail';div.appendChild(p);}
 const sum=document.createElement('div');sum.textContent=`\n${pass}/${out.length} checks passed`;div.appendChild(sum);
 console.log(`${pass}/${out.length} checks passed`);
 document.body.appendChild(div);
}

/*============================ main ============================*/
function main(){
 if(new URLSearchParams(location.search).has('selftest')){runSelfTests();return;}
 const events=makeEvents();
 const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance',stencil:false,depth:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.NoToneMapping; // tone mapping happens in the composer
 renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 document.body.appendChild(renderer.domElement);
 const scene=new THREE.Scene();
 const camera=new THREE.PerspectiveCamera(CONFIG.FOV,innerWidth/innerHeight,.3,26000);
 const ctx={CONFIG,events,renderer,scene,camera,celebrate:false,grabPrompt:'',lockTarget:null};
 ctx.city=makeCityData(CONFIG);
 ctx.audio=createAudio(CONFIG);
 ctx.vfx=createParticles(ctx);
 ctx.flight=createFlight(CONFIG,events);ctx.hero=ctx.flight;
 ctx.laser=createLaser(CONFIG,events);
 ctx.airliner=createAirliner(CONFIG,events);
 ctx.holding=createHolding(CONFIG,events,ctx.airliner);
 ctx.collision=createCollision(CONFIG,ctx.city,events);
 ctx.missiles=createMissiles(CONFIG,events,ctx);
 ctx.jets=createJets(CONFIG,events,ctx);
 const skyW=createSkyWorld(ctx);
 const cityVis=createCity(ctx),river=createRiver(ctx),clouds=createClouds(ctx),ground=createGround(ctx);
 ctx.stadium=createStadium(ctx);
 ctx.heroVis=createHero(ctx);
 const laserVis=createLaserVis(ctx);
 const airVis=createAirlinerVis(ctx);
 const jetVis=createJetVis(ctx),misVis=createMissileVis(ctx);
 const wrecks=createWrecks(ctx);
 const explosions=createExplosions(ctx);
 ctx.explosions=explosions;
 const trails=createTrails(ctx),speedlines=createSpeedlines(ctx);
 // checkpoints
 const cps={};
 ctx.mission=createMission(CONFIG,events,{
  save(p){cps[p]={hp:ctx.flight.st.hp,pos:ctx.flight.pos.clone(),vel:ctx.flight.vel.clone(),
   apos:ctx.airliner.st.pos.clone(),avel:ctx.airliner.st.vel.clone(),at:ctx.airliner.st.t,hull:ctx.airliner.st.hull,tail:ctx.airliner.st.tail};},
  load(p){const c=cps[p];if(!c)return;
   const fl=ctx.flight.st,a=ctx.airliner.st;
   fl.hp=CONFIG.HERO_HP;fl.pos.copy(c.pos);fl.vel.copy(c.vel);fl.mode='flight';fl.stunT=0;
   a.pos.copy(c.apos);a.vel.copy(c.avel);a.t=c.at;a.hull=Math.max(c.hull,40);a.tail=c.tail;
   a.impacted=false;a.landed=false;a.held=false;a.grab='none';
   ctx.holding.end();ctx.holding.st.stress=0;
   ctx.jets.reset();spawnFor(p);}});
 ctx.scoring=createScoring(ctx);
 ctx.cameraSys=createCamera(CONFIG,ctx);
 ctx.hud=createHud(ctx);
 const cines=createCinematics(ctx);
 const input=createInput(CONFIG,events);
 const debug=createDebug(CONFIG,events);
 ctx.flight.st.allowEast=true;
 function spawnFor(p){
  if(p==='INTERCEPT')ctx.jets.spawnWave(2,'hero');
  if(p==='CATCH')ctx.jets.spawnWave(3,'plane');
  if(p==='ARREST')ctx.jets.spawnWave(4,'plane');}
 events.on('phaseChanged',p=>{spawnFor(p);
  if(p==='CINEMATIC')setTimeout(()=>{},0);});
 events.on('click',()=>{ctx.audio.init();input.capture();
  if(ctx.mission.phase==='TITLE')ctx.mission.start();});
 events.on('anykey',()=>ctx.mission.skip());
 events.on('retry',()=>{if(ctx.mission.phase==='FAILED')ctx.mission.retry();
  else if(ctx.mission.phase==='RESULTS')location.reload();});
 events.on('restart',()=>location.reload());
 events.on('freefly',()=>{ctx.mission.st.freefly=!ctx.mission.st.freefly;});
 events.on('boom',()=>{ctx.audio.boom();
  ctx.vfx.burst(ctx.flight.pos,30,30,0.6,8,0xffffff,0);});
 events.on('overheat',()=>ctx.hud.pop('OVERHEAT'));
 events.on('caught',()=>{loop.slow(.3,1);ctx.audio.groan();});
 events.on('tailTorn',()=>{loop.slow(.3,1.2);ctx.audio.scream();ctx.hud.radio('The tail! The tail’s gone! Get the nose!');
  ctx.vfx.burst(ctx.airliner.tailPoint(T1),60,25,1.5,6,0xffaa66,9.8);
  const fl=ctx.flight.st;fl.mode='stunned';fl.stunT=.5;fl.vel.set((Math.random()-.5)*40,20,(Math.random()-.5)*40);
  ctx.holding.end();});
 events.on('jetKilled',({killed})=>{loop.slow(.5,.5);
  if(ctx.lockTarget&&ctx.lockTarget.state==='dead')ctx.lockTarget=null;});
 events.on('buckling',()=>{ctx.audio.crunch();ctx.hud.pop('NOSE BUCKLING');});
 events.on('hullHit',()=>{});
 events.on('lock',()=>{ // RMB lock-on toggle
  if(ctx.lockTarget){ctx.lockTarget=null;return;}
  const aim=aimVec(ctx.flight.st.aimYaw,ctx.flight.st.aimPitch,T1);
  let best=null,ba=MU.degToRad(15);
  for(const j of ctx.jets.alive()){T2.subVectors(j.pos,ctx.flight.pos);safeNorm(T2);
   const a=T2.angleTo(aim);if(a<ba){ba=a;best=j;}}
  ctx.lockTarget=best;});
 // grab/release
 events.on('keyE',()=>{
  const fl=ctx.flight.st,a=ctx.airliner.st;
  if(ctx.holding.st.active){ // release
   if(a.landed){events.emit('released');ctx.celebrate=true;ctx.stadium.setBoard('218 SAVED');
    loop.slow(.3,3);ctx.audio.roar(1);ctx.hud.radio('218 souls saved. The city will never forget this.');
    ctx.holding.end();fl.mode='hover';fl.vel.set(0,0,0);fl.pos.y=Math.max(fl.pos.y,3);}
   else{ctx.holding.end();fl.mode='flight';fl.vel.copy(a.vel);}
   return;}
  if(ctx.mission.phase!=='CATCH'&&ctx.mission.phase!=='ARREST'&&ctx.mission.phase!=='SETDOWN')return;
  if(a.held||a.landed||a.impacted)return;
  const rel=T1.subVectors(fl.vel,a.vel).length();
  ctx.airliner.nosePoint(T2);ctx.airliner.tailPoint(T3);
  const dn=fl.pos.distanceTo(T2),dtl=fl.pos.distanceTo(T3);
  if(rel>25)return;
  if(dn<6){ctx.holding.start();fl.mode='holding';}
  else if(dtl<6&&a.tail){a.grab='tail';a.tailT=0;fl.mode='holding';ctx.audio.groan();loop.slow(.3,1);}});
 // touchdown handling
 let misT=0,nearCd=0;
 function touchdownCheck(){
  const a=ctx.airliner.st;
  if(!ctx.holding.st.active||a.landed)return;
  const overField=T1.set(a.pos.x-ctx.stadium.pos.x,0,a.pos.z-ctx.stadium.pos.z).length()<110;
  if(a.pos.y<=7.6){
   const sink=Math.max(0,-a.vel.y);
   if(sink>10||!overField){events.emit('crashTouchdown');events.emit('boomAt',{pos:a.pos.clone(),big:true});return;}
   a.landed=true;a.vel.set(0,0,0);a.pos.y=7.6;
   if(sink>=4){ctx.airliner.hullHit(20,'hard');ctx.vfx.burst(a.pos,40,20,1.5,8,0xcbb391,9.8);}
   ctx.audio.thud();events.emit('touchdown',{sink});
   ctx.hud.pop(sink<4?'PERFECT TOUCHDOWN':'HARD TOUCHDOWN');
   ctx.hud.radio('Press E to release.');}}
 // laser raycast + damage
 const inp={aimYaw:0,aimPitch:0};
 function laserCast(dt){
  const fl=ctx.flight.st;
  const o=T1.copy(fl.pos).addScaledVector(UP,.7);
  let aim=aimVec(fl.aimYaw,fl.aimPitch,T2);
  // soft aim assist within 3°
  let mag=null,ma=MU.degToRad(3);
  for(const j of ctx.jets.alive()){T3.subVectors(j.pos,o);safeNorm(T3);
   const a=T3.angleTo(aim);if(a<ma){ma=a;mag=j;}}
  if(ctx.lockTarget){ // lock break conditions
   const lt=ctx.lockTarget;T3.subVectors(lt.pos,o);safeNorm(T3);
   if(lt.state==='dead'||T3.angleTo(aim)>MU.degToRad(30))ctx.lockTarget=null;}
  if(mag){T3.subVectors(mag.pos,o);safeNorm(T3);aim.lerp(T3,.5);safeNorm(aim);}
  let best=null,bd=CONFIG.LASER_RANGE;
  for(const j of ctx.jets.alive()){ // ray vs jet spheres
   T3.subVectors(j.pos,o);const t=T3.dot(aim);
   if(t>0&&t<bd&&T3.addScaledVector(aim,-t).length()<9){best={kind:'jet',obj:j,t};bd=t;}}
  ctx.missiles.pool.each(m=>{T3.subVectors(m.pos,o);const t=T3.dot(aim);
   if(t>0&&t<bd&&T3.addScaledVector(aim,-t).length()<3){best={kind:'missile',obj:m,t};bd=t;}});
  const ch=ctx.collision.rayCity(o,aim,bd);
  if(ch&&ch.t<bd){best={kind:ch.kind,t:ch.t};bd=ch.t;}
  const firing=ctx.laser.update(dt,input.state.fire&&ctx.mission.phase!=='TITLE'&&ctx.mission.phase!=='CINEMATIC',best);
  ctx.laser.st.hitPoint=firing?T4.copy(o).addScaledVector(aim,bd).clone():null;
  if(firing&&best){
   if(best.kind==='jet'){best.obj.hp-=CONFIG.LASER_DPS_JET*dt;best.obj.lasT+=dt*3;}
   if(best.kind==='missile')best.obj.hp-=CONFIG.LASER_DPS_MIS*dt;}}
 // fixed-step simulation
 function sim(dt,ts){
  const ph=ctx.mission.phase;
  input.sample(dt,inp);
  const surf=ctx.city.surfaceY(ctx.flight.pos.x,ctx.flight.pos.z);
  const wasB=ctx.flight.st.boosting;
  if(ph!=='TITLE')ctx.flight.update(dt,inp,surf);
  if(ctx.flight.st.boosting&&!wasB)ctx.cameraSys.onBoostPress();
  if(ctx.flight.st.mode!=='holding')ctx.collision.resolve(ctx.flight,dt);
  ctx.holding.update(dt,inp);
  if(ctx.holding.st.active){ // hero rides the nose
   ctx.airliner.nosePoint(ctx.flight.pos).addScaledVector(UP,-1.2);
   ctx.flight.vel.copy(ctx.airliner.st.vel);}
  if(ph!=='TITLE'&&ph!=='CINEMATIC')ctx.airliner.update(dt);
  ctx.jets.update(dt);ctx.missiles.update(dt);
  laserCast(dt);
  touchdownCheck();
  // near miss
  nearCd-=dt;
  const sp=ctx.flight.vel.length();
  if(sp>50&&nearCd<=0){const d=ctx.collision.nearDist(ctx.flight.pos);
   if(d>CONFIG.HERO_R&&d<9){nearCd=.6;events.emit('nearMiss');
    ctx.hud.pop('NEAR MISS +150');ctx.audio.whoosh();
    ctx.flight.vel.multiplyScalar(1+4/Math.max(sp,1));}}
  const w={distToPlane:ctx.flight.pos.distanceTo(ctx.airliner.st.pos),
   planeDistToStadium:T1.subVectors(ctx.stadium.pos,ctx.airliner.st.pos).length(),
   planeSpeed:Math.hypot(ctx.airliner.st.vel.x,ctx.airliner.st.vel.z),
   released:!ctx.holding.st.active&&ctx.airliner.st.landed&&ctx.celebrate};
  ctx.mission.update(dt,w);
  ctx.scoring.update(dt);}
 // per-frame drawing
 let sup=false;
 function draw(dt,raw,ts){
  skyW.update(dt);cityVis.update(dt);river.update(dt);clouds.update(dt);
  ctx.stadium.update(dt);ground.update(dt);
  ctx.heroVis.update(dt,dt);laserVis.update(dt);airVis.update(dt);
  jetVis.update(dt);misVis.update(dt);wrecks.update(dt);
  ctx.vfx.update(dt);explosions.update(dt);trails.update(dt);speedlines.update(dt);
  ctx.cameraSys.update(dt);cines.update(raw);ctx.hud.update(raw);
  // grab prompt
  const a=ctx.airliner.st,fl=ctx.flight.st;
  ctx.grabPrompt='';
  if(!a.held&&!a.landed&&!a.impacted&&(ctx.mission.phase==='CATCH'||ctx.mission.phase==='ARREST')){
   const dn=fl.pos.distanceTo(ctx.airliner.nosePoint(T1)),dtl=fl.pos.distanceTo(ctx.airliner.tailPoint(T2));
   const rel=T3.subVectors(fl.vel,a.vel).length();
   if(dn<60||dtl<60)ctx.grabPrompt=(dn<dtl?'NOSE':'TAIL — UNSTABLE')+((Math.min(dn,dtl)<6&&rel<25)?'  [E] GRAB':'  MATCH SPEED, GET CLOSE');}
  else if(ctx.holding.st.active&&a.landed)ctx.grabPrompt='[E] RELEASE';
  const sp=fl.vel.length();
  // post uniforms
  if(post){radial.uniforms.get('uStr').value=MU.smoothstep(sp,100,195)*.5;
   chrom.offset.set(.0006*MU.smoothstep(sp,60,190),.0004*MU.smoothstep(sp,60,190));}
  ctx.audio.update(raw,{speed:sp,boosting:fl.boosting,firing:ctx.laser.st.firing,heat:ctx.laser.st.heat,
   combat:ctx.jets.alive().length>0,timeScale:ts||1,phase:ctx.mission.phase});
  if(post)composer.render(dt);else renderer.render(scene,camera);}
 // post pipeline (fallback to plain render on failure)
 let composer=null,post=false,radial=null,chrom=null;
 try{
  composer=new EffectComposer(renderer,{frameBufferType:THREE.HalfFloatType,multisampling:4});
  composer.addPass(new RenderPass(scene,camera));
  const god=new GodRaysEffect(camera,skyW.sunMesh,{density:.96,decay:.92,weight:.3,samples:60,blur:true});
  const bloom=new BloomEffect({mipmapBlur:true,luminanceThreshold:.8,intensity:.9,radius:.6});
  radial=new RadialBlurEffect();
  chrom=new ChromaticAberrationEffect({offset:new THREE.Vector2(0,0),radialModulation:false,modulationOffset:0});
  const grade=new GradeEffect();
  const vig=new VignetteEffect({darkness:.5,offset:.3});
  const noi=new NoiseEffect({premultiply:true});noi.blendMode.opacity.value=.03;
  const tone=new ToneMappingEffect({mode:ToneMappingMode.ACES_FILMIC});
  const smaa=new SMAAEffect({preset:SMAAPreset.HIGH});
  composer.addPass(new EffectPass(camera,god,bloom,radial,chrom));
  composer.addPass(new EffectPass(camera,grade,vig,noi,tone,smaa));
  post=true;
 }catch(e){post=false;renderer.toneMapping=THREE.ACESFilmicToneMapping;}
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);if(post)composer.setSize(innerWidth,innerHeight);});
 const loop=createLoop(1/120,sim,draw);
 events.emit('phaseChanged','TITLE');
 ctx.mission.st.phase='TITLE';
}
main();
