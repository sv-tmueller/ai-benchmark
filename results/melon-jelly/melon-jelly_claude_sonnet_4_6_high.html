<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Melon Jelly</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;overflow:hidden;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0}

#tb{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;align-items:center;
  background:rgba(255,255,255,0.07);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.1);border-radius:12px;
  padding:7px 10px;z-index:10;white-space:nowrap
}
.btn{
  background:rgba(255,255,255,0.08);color:#aaa;
  border:1px solid rgba(255,255,255,0.12);border-radius:7px;
  padding:5px 12px;font-size:13px;cursor:pointer;transition:all .15s
}
.btn:hover{background:rgba(255,255,255,0.18);color:#fff}
.btn.on{background:rgba(80,200,120,0.25);border-color:rgba(80,200,120,0.4);color:#9f9}

#cw{position:relative}
#cpanel{
  position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:rgba(15,15,22,0.97);border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;padding:10px;z-index:20;min-width:192px;
  display:flex;flex-direction:column;gap:8px
}
#cpanel.h{display:none}
#swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .1s,border-color .1s}
.sw:hover{transform:scale(1.1)}
.sw.sel{border-color:#fff}
#cpk{width:100%;height:30px;border-radius:5px;border:none;cursor:pointer}

#pp{
  position:fixed;top:66px;right:14px;
  background:rgba(15,15,22,0.97);border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;padding:10px 14px;color:#aaa;font-size:12px;min-width:200px;z-index:10
}
#pp.h{display:none}
.pr{display:flex;justify-content:space-between;align-items:center;margin:5px 0;gap:8px}
.pr label{flex:0 0 68px}
.pr input[type=range]{flex:1}
.pr span{width:28px;text-align:right;font-variant-numeric:tabular-nums}

#fps{position:fixed;bottom:10px;right:10px;color:rgba(255,255,255,0.3);font-size:11px;font-family:monospace;z-index:10}
#fps.h{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tb">
  <button id="bgrab" class="btn on">Grab</button>
  <button id="bknife" class="btn">&#9986; Knife</button>
  <div id="cw">
    <button id="bcol" class="btn">Color</button>
    <div id="cpanel" class="h">
      <div id="swatches"></div>
      <input type="color" id="cpk" value="#e63030">
    </div>
  </div>
  <button id="breset" class="btn">&#8635; Reset</button>
  <button id="bfps" class="btn">FPS</button>
  <button id="bpar" class="btn">&#9881;</button>
</div>
<div id="pp" class="h">
  <div class="pr"><label>Stiffness</label><input type="range" id="ps"   min="1" max="10" step="1"  value="7" ><span id="vs">7</span></div>
  <div class="pr"><label>Damping</label>  <input type="range" id="pd"   min="1" max="20" step="1"  value="5" ><span id="vd">5</span></div>
  <div class="pr"><label>Gravity</label>  <input type="range" id="pg"   min="1" max="20" step="1"  value="10"><span id="vg">10</span></div>
  <div class="pr"><label>Wobble</label>   <input type="range" id="pw"   min="1" max="10" step="1"  value="5" ><span id="vw">5</span></div>
  <div class="pr"><label>Substeps</label> <input type="range" id="psub" min="4" max="20" step="2"  value="10"><span id="vsub">10</span></div>
</div>
<div id="fps" class="h">0 FPS</div>

<script>
'use strict';

/* ═══════════════════════════════════════
   CANVAS
═══════════════════════════════════════ */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H, dpr = window.devicePixelRatio || 1;

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', () => { resize(); reset(); });

/* ═══════════════════════════════════════
   TUNABLE PARAMS
═══════════════════════════════════════ */
const P = { stiffness:7, damping:5, gravity:10, wobble:5, substeps:10 };

function fleshComp()  { const t=(P.stiffness-1)/9; return Math.pow(10,-4-t*4); }
function rindComp()   { return fleshComp()*0.12; }
function areaComp()   { const t=(10-P.wobble)/10; return Math.pow(10,-3-t*4); }
function getGravity() { return P.gravity*60; }
function getDamping() { return P.damping*2e-4; }

/* ═══════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════ */
const FIXED_DT    = 1/120;
const COLS        = 32, ROWS = 16;
const RIND_R      = 0.88, PITH_R = 0.80;
const GRAB_R      = 55;
const MAX_VEL     = 2500;
const FRICTION    = 0.07;
const RESTITUTION = 0.30;

function getR()       { return Math.min(W*0.33, H*0.40); }
function getFloorY()  { return H*0.80; }
function getInitFlatY(){ return getFloorY() - getR()*0.40; }

/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
let particles=[], triangles=[], dcs=[];   // dcs = distance constraints
let seeds=[], cutEdges=new Set();
let fleshColor='#e63030', fleshRgb=[230,48,48];

let tool='grab';
let grabs=[];          // [{plist:[{idx,ox,oy,w}], tx, ty}]
let ptrs=new Map();    // pointerId → {x,y}

let knifeTrail=[], knifeActive=false, knifeT0=0;
let acc=0, lastT=0;
let fpsShow=false, fpsN=0, fpsTimer=0, fpsVal=0;

/* ═══════════════════════════════════════
   MESH GENERATION
═══════════════════════════════════════ */
function buildMesh() {
  particles=[]; triangles=[]; dcs=[]; seeds=[]; cutEdges=new Set();
  grabs=[]; ptrs.clear(); knifeTrail=[]; knifeActive=false; knifeT0=0;

  const R=getR(), flatY=getInitFlatY(), cx=W/2;
  const grid=[];

  /* Particle grid: local coords lx∈[-R,R], ly∈[0,R]
     screen: sx=cx+lx,  sy=flatY-ly  (y flipped) */
  for(let j=0; j<=ROWS; j++){
    grid[j]=new Array(COLS+1).fill(-1);
    for(let i=0; i<=COLS; i++){
      const lx=-R+(i/COLS)*2*R;
      const ly=(j/ROWS)*R;
      const lr=Math.hypot(lx,ly)/R;
      if(lr<=1.001){
        grid[j][i]=particles.length;
        particles.push({
          x:cx+lx, y:flatY-ly,
          px:cx+lx, py:flatY-ly,
          vx:0, vy:0,
          isRind:lr>=RIND_R,
          isPith:lr>=PITH_R && lr<RIND_R,
          lr
        });
      }
    }
  }

  const edgeMap=new Map();
  function addEdge(a,b){
    const k=a<b?`${a},${b}`:`${b},${a}`;
    if(edgeMap.has(k))return;
    const pa=particles[a], pb=particles[b];
    edgeMap.set(k,dcs.length);
    dcs.push({a,b,restLen:Math.hypot(pb.x-pa.x,pb.y-pa.y),
              isRind:pa.isRind||pb.isRind,active:true});
  }
  function addTri(a,b,c){
    if(a<0||b<0||c<0)return;
    const pa=particles[a],pb=particles[b],pc=particles[c];
    const area=0.5*((pb.x-pa.x)*(pc.y-pa.y)-(pb.y-pa.y)*(pc.x-pa.x));
    if(Math.abs(area)<0.5)return;
    triangles.push({a,b,c,restA:area,active:true});
    addEdge(a,b); addEdge(b,c); addEdge(c,a);
  }

  for(let j=0;j<ROWS;j++){
    for(let i=0;i<COLS;i++){
      const p00=grid[j][i],     p10=grid[j][i+1];
      const p01=grid[j+1]?grid[j+1][i]:-1;
      const p11=grid[j+1]?grid[j+1][i+1]:-1;
      if((i+j)%2===0){ addTri(p00,p10,p11); addTri(p00,p11,p01); }
      else            { addTri(p00,p10,p01); addTri(p10,p11,p01); }
    }
  }

  /* Seeds as barycentric coords in flesh triangles */
  for(let i=0;i<triangles.length;i++){
    if(Math.random()>0.11)continue;
    const tri=triangles[i];
    const avg=(particles[tri.a].lr+particles[tri.b].lr+particles[tri.c].lr)/3;
    if(avg>PITH_R-0.05||avg<0.12)continue;
    let u,v;
    do{ u=0.2+Math.random()*0.6; v=0.2+Math.random()*(0.78-u); }while(u+v>0.82);
    seeds.push({ti:i,u,v,rot:(Math.random()-0.5)*0.52,r:3+Math.random()*2.5});
  }
}

/* ═══════════════════════════════════════
   XPBD PHYSICS
═══════════════════════════════════════ */
function stepPhysics(dt){
  const sub  = dt/P.substeps;
  const sub2 = sub*sub;
  const fA   = fleshComp()/sub2;
  const rA   = rindComp()/sub2;
  const aA   = areaComp()/sub2;
  const grav = getGravity();
  const damp = getDamping();
  const fy   = getFloorY();
  const wL=8, wR=W-8;

  for(let s=0;s<P.substeps;s++){

    /* 1. Integrate velocity + position */
    for(const p of particles){
      p.vx*=(1-damp); p.vy*=(1-damp);
      p.vy+=grav*sub;
      p.px=p.x; p.py=p.y;
      p.x+=p.vx*sub; p.y+=p.vy*sub;
    }

    /* 2. Distance constraints  (all invM=1 → w1+w2=2) */
    for(const c of dcs){
      if(!c.active)continue;
      const pa=particles[c.a], pb=particles[c.b];
      const dx=pb.x-pa.x, dy=pb.y-pa.y;
      const d=Math.hypot(dx,dy);
      if(d<1e-9)continue;
      const alpha=c.isRind?rA:fA;
      const lam=-(d-c.restLen)/(2+alpha);
      const nx=dx/d, ny=dy/d;
      pa.x-=lam*nx; pa.y-=lam*ny;
      pb.x+=lam*nx; pb.y+=lam*ny;
    }

    /* 3. Area constraints */
    for(const tri of triangles){
      if(!tri.active)continue;
      const pa=particles[tri.a],pb=particles[tri.b],pc=particles[tri.c];
      const e1x=pb.x-pa.x,e1y=pb.y-pa.y,e2x=pc.x-pa.x,e2y=pc.y-pa.y;
      const area=0.5*(e1x*e2y-e1y*e2x);
      const err=area-tri.restA;
      /* Gradients of signed area w.r.t. each vertex */
      const g1x=0.5*(pb.y-pc.y), g1y=0.5*(pc.x-pb.x);
      const g2x=0.5*(pc.y-pa.y), g2y=0.5*(pa.x-pc.x);
      const g3x=0.5*(pa.y-pb.y), g3y=0.5*(pb.x-pa.x);
      const denom=(g1x*g1x+g1y*g1y)+(g2x*g2x+g2y*g2y)+(g3x*g3x+g3y*g3y)+aA;
      if(Math.abs(denom)<1e-10)continue;
      const lam=-err/denom;
      pa.x+=lam*g1x; pa.y+=lam*g1y;
      pb.x+=lam*g2x; pb.y+=lam*g2y;
      pc.x+=lam*g3x; pc.y+=lam*g3y;
    }

    /* 4. Soft grab constraints */
    for(const grab of grabs){
      for(const g of grab.plist){
        const p=particles[g.idx];
        const dx=grab.tx+g.ox-p.x, dy=grab.ty+g.oy-p.y;
        const compG=2e-6/(g.w+0.01);
        const lam=1/(1+compG/sub2);
        p.x+=lam*dx; p.y+=lam*dy;
      }
    }

    /* 5. Collisions: floor, walls, ceiling */
    for(const p of particles){
      if(p.y>fy){
        const ppyOld=p.py;
        p.y=fy;
        /* Position-based restitution: reflect prev-pos to create upward bounce */
        if(ppyOld<fy) p.py=fy+(fy-ppyOld)*RESTITUTION;
        p.x-=(p.x-p.px)*FRICTION;
      }
      if(p.x<wL) p.x=wL;
      if(p.x>wR) p.x=wR;
      if(p.y<0){p.y=0; p.py=0;}
    }

    /* 6. Update velocities from position delta */
    for(const p of particles){
      p.vx=(p.x-p.px)/sub;
      p.vy=(p.y-p.py)/sub;
      const spd2=p.vx*p.vx+p.vy*p.vy;
      if(spd2>MAX_VEL*MAX_VEL){const sc=MAX_VEL/Math.sqrt(spd2);p.vx*=sc;p.vy*=sc;}
      if(!isFinite(p.x)||!isFinite(p.y)){p.x=p.px;p.y=p.py;p.vx=0;p.vy=0;}
    }
  }
}

/* ═══════════════════════════════════════
   CUTTING
═══════════════════════════════════════ */
function segInt(x1,y1,x2,y2,x3,y3,x4,y4){
  const d1x=x2-x1,d1y=y2-y1,d2x=x4-x3,d2y=y4-y3;
  const cr=d1x*d2y-d1y*d2x;
  if(Math.abs(cr)<1e-10)return false;
  const dx=x3-x1,dy=y3-y1;
  const t=(dx*d2y-dy*d2x)/cr;
  const u=(dx*d1y-dy*d1x)/cr;
  return t>0.01&&t<0.99&&u>0.01&&u<0.99;
}

function doCut(x1,y1,x2,y2){
  if(Math.hypot(x2-x1,y2-y1)<5)return;
  let any=false;
  for(const c of dcs){
    if(!c.active)continue;
    const pa=particles[c.a],pb=particles[c.b];
    if(segInt(x1,y1,x2,y2,pa.x,pa.y,pb.x,pb.y)){
      c.active=false;
      cutEdges.add(c.a<c.b?`${c.a},${c.b}`:`${c.b},${c.a}`);
      any=true;
    }
  }
  if(any){
    for(const tri of triangles){
      if(!tri.active)continue;
      const e=[[tri.a,tri.b],[tri.b,tri.c],[tri.c,tri.a]];
      for(const[a,b]of e){
        if(cutEdges.has(a<b?`${a},${b}`:`${b},${a}`)){tri.active=false;break;}
      }
    }
  }
}

/* ═══════════════════════════════════════
   RENDERING
═══════════════════════════════════════ */
function hexRgb(h){
  return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
}

function pCol(p){
  if(p.isRind) return[36,108,36];
  if(p.isPith) return[228,240,208];
  const f=0.72+p.lr/PITH_R*0.28;
  return[fleshRgb[0]*f|0, fleshRgb[1]*f|0, fleshRgb[2]*f|0];
}

function tCol(tri){
  const[r1,g1,b1]=pCol(particles[tri.a]);
  const[r2,g2,b2]=pCol(particles[tri.b]);
  const[r3,g3,b3]=pCol(particles[tri.c]);
  return`rgb(${(r1+r2+r3)/3|0},${(g1+g2+g3)/3|0},${(b1+b2+b3)/3|0})`;
}

function render(){
  ctx.clearRect(0,0,W,H);

  const fy=getFloorY();

  /* Background */
  ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,W,H);

  /* Floor surface */
  ctx.fillStyle='#161b26'; ctx.fillRect(0,fy,W,H-fy);
  ctx.strokeStyle='#252d44'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,fy); ctx.lineTo(W,fy); ctx.stroke();

  drawShadow(fy);

  /* Triangles */
  for(const tri of triangles){
    if(!tri.active)continue;
    const pa=particles[tri.a],pb=particles[tri.b],pc=particles[tri.c];
    const col=tCol(tri);
    ctx.beginPath();
    ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.lineTo(pc.x,pc.y);
    ctx.closePath();
    ctx.fillStyle=col; ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=0.7; ctx.stroke();
  }

  /* Seeds */
  for(const s of seeds){
    const tri=triangles[s.ti];
    if(!tri||!tri.active)continue;
    const pa=particles[tri.a],pb=particles[tri.b],pc=particles[tri.c];
    const w3=1-s.u-s.v;
    const sx=s.u*pa.x+s.v*pb.x+w3*pc.x;
    const sy=s.u*pa.y+s.v*pb.y+w3*pc.y;
    const ang=Math.atan2(pb.y-pa.y,pb.x-pa.x)+s.rot;
    ctx.save();
    ctx.translate(sx,sy); ctx.rotate(ang); ctx.scale(1,0.42);
    ctx.beginPath(); ctx.ellipse(0,0,s.r,s.r,0,0,Math.PI*2);
    ctx.fillStyle='#191408'; ctx.fill();
    ctx.restore();
  }

  drawHighlight();
  drawKnifeTrail();

  /* Grab indicators */
  for(const g of grabs){
    ctx.beginPath(); ctx.arc(g.tx,g.ty,12,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(g.tx,g.ty,2.5,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fill();
  }

  if(fpsShow) document.getElementById('fps').textContent=fpsVal+' FPS';
}

function drawShadow(fy){
  let minX=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const p of particles){
    if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.y>maxY)maxY=p.y;
  }
  const cx=(minX+maxX)*0.5, w=(maxX-minX)*0.85;
  const dist=Math.max(0,fy-maxY);
  const alpha=0.38*Math.exp(-dist/90);
  if(alpha<0.01||w<10)return;
  ctx.save();
  ctx.scale(1,0.22);
  const fy2=fy/0.22;
  const gr=ctx.createRadialGradient(cx,fy2,0,cx,fy2,w*0.5);
  gr.addColorStop(0,`rgba(0,0,0,${alpha})`);
  gr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath(); ctx.arc(cx,fy2,w*0.5,0,Math.PI*2);
  ctx.fillStyle=gr; ctx.fill();
  ctx.restore();
}

function drawHighlight(){
  let sx=0,sy=0,cnt=0,minX=Infinity,maxX=-Infinity,minY=Infinity;
  for(const p of particles){
    sx+=p.x; sy+=p.y; cnt++;
    if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.y<minY)minY=p.y;
  }
  if(!cnt)return;
  const cx=sx/cnt, cy=sy/cnt;
  const r=(maxX-minX)*0.45;
  if(r<10)return;
  const hx=cx-r*0.1, hy=cy-r*0.3;
  const gr=ctx.createRadialGradient(hx,hy,0,hx,hy,r*0.62);
  gr.addColorStop(0,'rgba(255,255,255,0.14)');
  gr.addColorStop(0.45,'rgba(255,255,255,0.03)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  ctx.save();
  ctx.globalCompositeOperation='screen';
  ctx.fillStyle=gr;
  ctx.beginPath(); ctx.ellipse(cx,cy,r,r*0.65,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawKnifeTrail(){
  if(knifeTrail.length<2)return;
  let op=1;
  if(!knifeActive){
    if(!knifeT0)return;
    op=Math.max(0,1-(performance.now()-knifeT0)/600);
    if(op<0.01){knifeTrail=[];knifeT0=0;return;}
  }
  ctx.save();
  ctx.strokeStyle=`rgba(230,232,255,${op*0.85})`;
  ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.shadowBlur=10; ctx.shadowColor=`rgba(200,205,255,${op*0.5})`;
  ctx.beginPath(); ctx.moveTo(knifeTrail[0].x,knifeTrail[0].y);
  for(let i=1;i<knifeTrail.length;i++) ctx.lineTo(knifeTrail[i].x,knifeTrail[i].y);
  ctx.stroke();
  ctx.restore();
}

/* ═══════════════════════════════════════
   INPUT
═══════════════════════════════════════ */
function cPos(e){
  const r=canvas.getBoundingClientRect();
  return{x:e.clientX-r.left,y:e.clientY-r.top};
}

canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  const{x,y}=cPos(e);
  ptrs.set(e.pointerId,{x,y});
  if(tool==='knife'){
    knifeTrail=[{x,y}]; knifeActive=true; knifeT0=0;
  } else {
    const isAlt=e.button===2||e.shiftKey||(ptrs.size>1);
    doStartGrab(x,y,isAlt?1:0);
  }
});

canvas.addEventListener('pointermove',e=>{
  e.preventDefault();
  if(!ptrs.has(e.pointerId))return;
  const{x,y}=cPos(e);
  ptrs.set(e.pointerId,{x,y});
  if(tool==='knife'&&knifeActive){
    const last=knifeTrail[knifeTrail.length-1];
    doCut(last.x,last.y,x,y);
    knifeTrail.push({x,y});
    if(knifeTrail.length>200)knifeTrail.splice(0,100);
  } else if(tool==='grab'){
    const ids=[...ptrs.keys()];
    const idx=ids.indexOf(e.pointerId);
    if(idx<grabs.length){grabs[idx].tx=x;grabs[idx].ty=y;}
  }
});

function onPtrEnd(e){
  e.preventDefault();
  ptrs.delete(e.pointerId);
  if(tool==='knife'){
    knifeActive=false;
    if(knifeTrail.length>1)knifeT0=performance.now();
    else knifeTrail=[];
  } else {
    grabs=grabs.slice(0,ptrs.size);
  }
}
canvas.addEventListener('pointerup',onPtrEnd);
canvas.addEventListener('pointercancel',onPtrEnd);
canvas.addEventListener('contextmenu',e=>e.preventDefault());

function doStartGrab(x,y,slot){
  const plist=[];
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    const dx=p.x-x,dy=p.y-y,d2=dx*dx+dy*dy;
    if(d2<GRAB_R*GRAB_R){
      plist.push({idx:i,ox:p.x-x,oy:p.y-y,w:1-Math.sqrt(d2)/GRAB_R});
    }
  }
  if(!plist.length)return;
  const grab={plist,tx:x,ty:y};
  if(slot>=grabs.length)grabs.push(grab);
  else grabs[slot]=grab;
}

/* ═══════════════════════════════════════
   UI
═══════════════════════════════════════ */
const SWATCHES=['#e63030','#ff6b6b','#ff4f00','#ff8c42','#ff69b4','#c0392b','#b5451b','#9b1a1a'];

function setupUI(){
  const swDiv=document.getElementById('swatches');
  SWATCHES.forEach(col=>{
    const d=document.createElement('div');
    d.className='sw'+(col===fleshColor?' sel':'');
    d.style.background=col;
    d.addEventListener('click',()=>{
      setFleshColor(col);
      document.getElementById('cpk').value=col;
      swDiv.querySelectorAll('.sw').forEach(s=>s.classList.remove('sel'));
      d.classList.add('sel');
    });
    swDiv.appendChild(d);
  });

  document.getElementById('cpk').addEventListener('input',e=>{
    setFleshColor(e.target.value);
    swDiv.querySelectorAll('.sw').forEach(s=>s.classList.remove('sel'));
  });

  document.getElementById('bgrab').addEventListener('click',()=>{
    tool='grab';
    document.getElementById('bgrab').classList.add('on');
    document.getElementById('bknife').classList.remove('on');
  });
  document.getElementById('bknife').addEventListener('click',()=>{
    tool='knife';
    document.getElementById('bknife').classList.add('on');
    document.getElementById('bgrab').classList.remove('on');
  });
  document.getElementById('bcol').addEventListener('click',()=>{
    document.getElementById('cpanel').classList.toggle('h');
  });
  document.getElementById('breset').addEventListener('click',reset);
  document.getElementById('bfps').addEventListener('click',()=>{
    fpsShow=!fpsShow;
    document.getElementById('fps').classList.toggle('h',!fpsShow);
    document.getElementById('bfps').classList.toggle('on',fpsShow);
  });
  document.getElementById('bpar').addEventListener('click',()=>{
    const pp=document.getElementById('pp');
    pp.classList.toggle('h');
    document.getElementById('bpar').classList.toggle('on',!pp.classList.contains('h'));
  });
  document.addEventListener('click',e=>{
    if(!document.getElementById('cw').contains(e.target))
      document.getElementById('cpanel').classList.add('h');
  });

  /* Param sliders */
  [['ps','stiffness'],['pd','damping'],['pg','gravity'],['pw','wobble'],['psub','substeps']].forEach(([id,key])=>{
    const sl=document.getElementById(id);
    const sp=document.getElementById('v'+id.slice(1));
    sl.addEventListener('input',()=>{P[key]=+sl.value; sp.textContent=sl.value;});
  });
}

function setFleshColor(col){
  fleshColor=col;
  fleshRgb=hexRgb(col);
}

/* ═══════════════════════════════════════
   RESET
═══════════════════════════════════════ */
function reset(){
  buildMesh();
}

/* ═══════════════════════════════════════
   MAIN LOOP
═══════════════════════════════════════ */
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,0.05);
  lastT=ts;

  fpsN++; fpsTimer+=dt;
  if(fpsTimer>=1){ fpsVal=fpsN/fpsTimer|0; fpsN=0; fpsTimer=0; }

  acc+=dt;
  let steps=0;
  while(acc>=FIXED_DT&&steps<4){ stepPhysics(FIXED_DT); acc-=FIXED_DT; steps++; }
  if(acc>FIXED_DT)acc=0; // discard drift to avoid spiral of death

  render();
  requestAnimationFrame(loop);
}

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
buildMesh();
setupUI();
requestAnimationFrame(ts=>{ lastT=ts; requestAnimationFrame(loop); });
</script>
