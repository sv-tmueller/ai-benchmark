<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Melon Jelly</title>
<style>
  :root { color-scheme: dark; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #1f1c33;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f3f0ff;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  body.knife canvas { cursor: crosshair; }
  #toolbar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; padding: 6px; border-radius: 16px; z-index: 5;
    background: rgba(30, 27, 52, 0.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  button {
    font: inherit; font-weight: 600; font-size: 14px; color: #f3f0ff; cursor: pointer;
    padding: 9px 16px; border-radius: 11px; border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.07); transition: background 0.12s, transform 0.08s;
  }
  button:hover { background: rgba(255, 255, 255, 0.16); }
  button:active { transform: scale(0.96); }
  button.active { background: linear-gradient(180deg, #ff6b81, #e8344f); border-color: rgba(255, 255, 255, 0.35); }
  #colorWrap { position: relative; }
  #colorPop {
    position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%);
    width: 188px; padding: 12px; border-radius: 14px; z-index: 6;
    background: rgba(30, 27, 52, 0.92); border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
  }
  #swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .swatch { width: 100%; aspect-ratio: 1; padding: 0; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.25); }
  .swatch.sel { border-color: #fff; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35); }
  #pickerRow { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 13px; }
  #picker { width: 64px; height: 30px; padding: 0; border: none; background: none; cursor: pointer; }
  #fps {
    position: fixed; top: 14px; left: 14px; z-index: 4; font: 600 12px ui-monospace, Menlo, Consolas, monospace;
    padding: 4px 8px; border-radius: 8px; background: rgba(0, 0, 0, 0.35); color: #b9ffc9; pointer-events: none;
  }
  #panel {
    position: fixed; top: 12px; right: 12px; z-index: 5; width: 232px; border-radius: 14px;
    background: rgba(30, 27, 52, 0.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); font-size: 13px;
  }
  #panel summary { cursor: pointer; padding: 10px 14px; font-weight: 600; list-style: none; }
  #panel summary::-webkit-details-marker { display: none; }
  #panel summary::after { content: "\25BE"; float: right; opacity: 0.7; }
  #panel[open] summary::after { content: "\25B4"; }
  #panelBody { padding: 0 14px 12px; }
  .row { display: grid; grid-template-columns: 78px 1fr 40px; align-items: center; gap: 6px; margin: 7px 0; }
  .row input { width: 100%; accent-color: #ff6b81; }
  .row output { text-align: right; font-variant-numeric: tabular-nums; opacity: 0.8; }
  .chk { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  #defaults { margin-top: 10px; width: 100%; padding: 6px 10px; font-size: 12px; }
  #hint {
    position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 3; text-align: center;
    font-size: 12px; opacity: 0.55; pointer-events: none; white-space: nowrap; max-width: 96vw; overflow: hidden; text-overflow: ellipsis;
  }
  @media (max-width: 640px) {
    button { padding: 8px 11px; font-size: 13px; }
    #panel { top: 64px; width: 210px; }
    #hint { white-space: normal; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="toolbar">
  <button id="btnGrab" class="active" aria-pressed="true">Grab</button>
  <button id="btnKnife" aria-pressed="false">Knife</button>
  <div id="colorWrap">
    <button id="btnColor">Color</button>
    <div id="colorPop" hidden>
      <div id="swatches"></div>
      <div id="pickerRow"><span>Custom</span><input id="picker" type="color" value="#ff4a5e"></div>
    </div>
  </div>
  <button id="btnReset">Reset</button>
</div>

<div id="fps">60 FPS</div>

<details id="panel">
  <summary>Physics</summary>
  <div id="panelBody">
    <div id="sliders"></div>
    <label class="chk"><input type="checkbox" id="chkFps" checked> Show FPS</label>
    <button id="defaults">Restore defaults</button>
  </div>
</details>

<div id="hint">Drag to grab &middot; Shift / right-click / two fingers to pinch &middot; Knife: drag across the melon</div>

<script>
"use strict";
(() => {

/* ============================================================================
 * 1. CONFIG
 * World units: the view is scaled so the world is at least 560 x 700 units.
 * ========================================================================== */
const WORLD_H = 700, WORLD_MIN_W = 560;
const MELON_R = 135, RINGS = 22, SEG = 3;       // SEG ~ pi keeps triangles near-equilateral
const RIND_RINGS = 2;                           // outer rings that form the stiff rind layer
const RIND_FROM = RINGS - RIND_RINGS + 1;
const FIXED_DT = 1 / 120, MAX_STEPS = 6;
const MAX_SPEED = 2600;                         // velocity clamp, units/s
const CONTACT_D = 5.4;                          // min distance between particles of different pieces
const MIN_PIECE_TRIS = 4;                       // smaller crumbs are discarded by the knife
const MU_FLOOR = 1.2, MU_WALL = 0.3, FLOOR_DAMP = 8;
// XPBD compliances (1/stiffness). Rind is ~7x stiffer than flesh.
const ALPHA_FLESH = 2e-5, ALPHA_RIND = 3e-6, ALPHA_AREA = 4e-5, ALPHA_BEND = 5e-6;
const GRAB_RADIUS = 30, GRAB_REACH = 40, GRAB_ALPHA = 4e-5, MAX_PULL = 4;
const PINCH_RADIUS = 44, PINCH_SCALE = 0.3, PINCH_ALPHA = 3e-5;
const TRAIL_MS = 450;
const RIND_T = 7, PITH_T = 8;                   // rind / pith thickness in world units

const DEFAULTS = { stiffness: 1, volume: 1, damping: 0.8, wobble: 0.6, gravity: 1400, substeps: 8 };
/** @type {{stiffness:number, volume:number, damping:number, wobble:number, gravity:number, substeps:number}} */
const params = Object.assign({}, DEFAULTS);

/**
 * @typedef {{ids: Int32Array, runs: Int32Array[]}} Loop   boundary loop; runs = rind sections
 * @typedef {{loops: Loop[], parts: Int32Array, seeds: number[], hl: number, bb: number[]}} Piece
 * @typedef {{kind: 'grab'|'pinch'|'knife', wx: number, wy: number, idx: number[]|null,
 *            ox: number[], oy: number[], w: number[], s: number}} Pointer
 */

/* ============================================================================
 * 2. MESH  (rest-state half disc, flat side down, rind on the arc)
 * ========================================================================== */
const mesh = (() => {
  const rx = [0], ry = [0], ring = [0], start = [0];
  for (let k = 1; k <= RINGS; k++) {
    start[k] = rx.length;
    const n = SEG * k, r = MELON_R * k / RINGS;
    for (let j = 0; j <= n; j++) {
      const th = Math.PI * j / n;
      rx.push(r * Math.cos(th)); ry.push(-r * Math.sin(th)); ring.push(k);
    }
  }
  // Triangulate between neighbouring rings by merging their angular sequences.
  const tri = [];
  for (let k = 0; k < RINGS; k++) {
    const nI = k === 0 ? 0 : SEG * k, nO = SEG * (k + 1), sI = start[k], sO = start[k + 1];
    let i = 0, j = 0;
    while (i < nI || j < nO) {
      if (i < nI && (j >= nO || (i + 1) * nO <= (j + 1) * nI)) { tri.push(sI + i, sI + i + 1, sO + j); i++; }
      else { tri.push(sI + i, sO + j, sO + j + 1); j++; }
    }
  }
  const nT = tri.length / 3;
  const A = new Int32Array(nT), B = new Int32Array(nT), C = new Int32Array(nT), area = new Float64Array(nT);
  for (let t = 0; t < nT; t++) {
    let a = tri[3 * t], b = tri[3 * t + 1], c = tri[3 * t + 2];
    let ar = 0.5 * ((rx[b] - rx[a]) * (ry[c] - ry[a]) - (ry[b] - ry[a]) * (rx[c] - rx[a]));
    if (ar < 0) { const tmp = b; b = c; c = tmp; ar = -ar; }   // enforce one winding for all triangles
    A[t] = a; B[t] = b; C[t] = c; area[t] = ar;
  }
  const RX = Float64Array.from(rx), RY = Float64Array.from(ry), RG = Int32Array.from(ring);

  /** barycentric coordinates of (X,Y) w.r.t. rest triangle t (valid outside too: affine) */
  const bary = (t, X, Y) => {
    const a = A[t], b = B[t], c = C[t];
    const x1 = RX[a], y1 = RY[a], x2 = RX[b], y2 = RY[b], x3 = RX[c], y3 = RY[c];
    const d = (y2 - y3) * (x1 - x3) + (x3 - x2) * (y1 - y3);
    const u = ((y2 - y3) * (X - x3) + (x3 - x2) * (Y - y3)) / d;
    const v = ((y3 - y1) * (X - x3) + (x1 - x3) * (Y - y3)) / d;
    return [u, v, 1 - u - v];
  };
  // Seeds are glued to a triangle (barycentric) and point towards the centre via a second glued point.
  const seeds = [];
  for (const [f, cnt] of [[0.34, 3], [0.55, 5], [0.76, 7]]) {
    for (let i = 0; i < cnt; i++) {
      const th = Math.PI * (i + 0.5) / cnt, r = f * MELON_R;
      const sx = r * Math.cos(th), sy = -r * Math.sin(th);
      const qx = sx - Math.cos(th) * 5.5, qy = sy + Math.sin(th) * 5.5;
      for (let t = 0; t < nT; t++) {
        const [u, v, w] = bary(t, sx, sy);
        if (u >= -1e-6 && v >= -1e-6 && w >= -1e-6) {
          const [qu, qv, qw] = bary(t, qx, qy);
          seeds.push({ t, u, v, w, qu, qv, qw });
          break;
        }
      }
    }
  }
  // Rind bending constraints: every second particle along the outer arc.
  const bends = [];
  const nK = SEG * RINGS;
  for (let j = 0; j + 2 <= nK; j++) bends.push([start[RINGS] + j, start[RINGS] + j + 2, start[RINGS] + j + 1]);

  return { n: RX.length, rx: RX, ry: RY, ring: RG, A, B, C, area, nT, seeds, bends };
})();

/* ============================================================================
 * 3. STATE
 * ========================================================================== */
const N = mesh.n;
const x = new Float64Array(N), y = new Float64Array(N);
const px = new Float64Array(N), py = new Float64Array(N);
const vx = new Float64Array(N), vy = new Float64Array(N);
const snapX = new Float64Array(N), snapY = new Float64Array(N);
const pAlive = new Uint8Array(N), contact = new Uint8Array(N);
const pieceOf = new Int32Array(N).fill(-1);
const triAlive = new Uint8Array(mesh.nT);

/** Compiled topology: rebuilt on reset and after every cut. */
const topo = {
  act: new Int32Array(0), nAct: 0, nPieces: 0,
  ta: new Int32Array(0), tb: new Int32Array(0), tc: new Int32Array(0), tr: new Float64Array(0), nT: 0,
  ea: new Int32Array(0), eb: new Int32Array(0), er: new Float64Array(0), ek: new Uint8Array(0), nE: 0,
  ba: new Int32Array(0), bb: new Int32Array(0), br: new Float64Array(0), nB: 0,
};
/** @type {Piece[]} */
let pieces = [];

const view = { dpr: 1, cssW: 1, cssH: 1, scale: 1, worldW: WORLD_MIN_W, worldH: WORLD_H, floorY: WORLD_H - 46 };

/* ============================================================================
 * 4. CUTTING / TOPOLOGY
 * ========================================================================== */
/** Rebuild constraints, pieces and boundary loops from the set of living triangles. */
function compile() {
  const A = mesh.A, B = mesh.B, C = mesh.C, nTri = mesh.nT;
  const parent = new Int32Array(N);
  for (let i = 0; i < N; i++) parent[i] = i;
  const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  const union = (a, b) => { a = find(a); b = find(b); if (a !== b) parent[a] = b; };
  for (let t = 0; t < nTri; t++) if (triAlive[t]) { union(A[t], B[t]); union(B[t], C[t]); }

  const cnt = new Int32Array(N);
  for (let t = 0; t < nTri; t++) if (triAlive[t]) cnt[find(A[t])]++;
  for (let t = 0; t < nTri; t++) if (triAlive[t] && cnt[find(A[t])] < MIN_PIECE_TRIS) triAlive[t] = 0;

  pAlive.fill(0);
  const aliveTris = [];
  for (let t = 0; t < nTri; t++) {
    if (!triAlive[t]) continue;
    pAlive[A[t]] = 1; pAlive[B[t]] = 1; pAlive[C[t]] = 1;
    aliveTris.push(t);
  }
  pieceOf.fill(-1);
  const rootToPiece = new Map();
  const actList = [];
  for (let i = 0; i < N; i++) {
    if (!pAlive[i]) continue;
    const r = find(i);
    let id = rootToPiece.get(r);
    if (id === undefined) { id = rootToPiece.size; rootToPiece.set(r, id); }
    pieceOf[i] = id;
    actList.push(i);
  }
  const nPieces = rootToPiece.size;

  // Triangles (area constraints)
  const nT = aliveTris.length;
  const ta = new Int32Array(nT), tb = new Int32Array(nT), tc = new Int32Array(nT), tr = new Float64Array(nT);
  for (let k = 0; k < nT; k++) {
    const t = aliveTris[k];
    ta[k] = A[t]; tb[k] = B[t]; tc[k] = C[t]; tr[k] = mesh.area[t];
  }

  // Edges (deduplicated) and directed edge set for boundary detection
  const edgeIdx = new Map(), eA = [], eB = [], dirSet = new Set();
  const addEdge = (a, b) => {
    const lo = a < b ? a : b, hi = a < b ? b : a, key = lo * N + hi;
    if (!edgeIdx.has(key)) { edgeIdx.set(key, eA.length); eA.push(lo); eB.push(hi); }
  };
  for (let k = 0; k < nT; k++) {
    const a = ta[k], b = tb[k], c = tc[k];
    addEdge(a, b); addEdge(b, c); addEdge(c, a);
    dirSet.add(a * N + b); dirSet.add(b * N + c); dirSet.add(c * N + a);
  }
  const nE = eA.length;
  const ea = Int32Array.from(eA), eb = Int32Array.from(eB), er = new Float64Array(nE), ek = new Uint8Array(nE);
  for (let e = 0; e < nE; e++) {
    const a = ea[e], b = eb[e];
    er[e] = Math.hypot(mesh.rx[a] - mesh.rx[b], mesh.ry[a] - mesh.ry[b]);
    ek[e] = (mesh.ring[a] >= RIND_FROM && mesh.ring[b] >= RIND_FROM) ? 1 : 0;
  }
  const hasEdge = (a, b) => edgeIdx.has((a < b ? a : b) * N + (a < b ? b : a));
  const bA = [], bB = [];
  for (const [a, b, m] of mesh.bends) {
    if (pAlive[a] && pAlive[b] && pAlive[m] && hasEdge(a, m) && hasEdge(m, b)) { bA.push(a); bB.push(b); }
  }
  const nB = bA.length;
  const ba = Int32Array.from(bA), bb = Int32Array.from(bB), br = new Float64Array(nB);
  for (let e = 0; e < nB; e++) br[e] = Math.hypot(mesh.rx[ba[e]] - mesh.rx[bb[e]], mesh.ry[ba[e]] - mesh.ry[bb[e]]);

  // Boundary loops: directed edges whose reverse does not exist
  const out = new Map();
  for (const key of dirSet) {
    const u = Math.floor(key / N), v = key - u * N;
    if (!dirSet.has(v * N + u)) {
      let arr = out.get(u);
      if (!arr) { arr = []; out.set(u, arr); }
      arr.push(v);
    }
  }
  /** @type {Piece[]} */
  const newPieces = [];
  for (let p = 0; p < nPieces; p++) newPieces.push({ loops: [], parts: new Int32Array(0), seeds: [], hl: -1, bb: [0, 0, 0, 0] });
  for (const [u0, arr0] of out) {
    while (arr0.length) {
      const ids = [u0];
      let cur = arr0.pop(), guard = 0;
      while (cur !== u0 && guard++ < 100000) {
        ids.push(cur);
        const arr = out.get(cur);
        if (!arr || !arr.length) break;
        cur = arr.pop();
      }
      if (ids.length < 3) continue;
      const n = ids.length, f = new Array(n);
      for (let k = 0; k < n; k++) f[k] = mesh.ring[ids[k]] === RINGS && mesh.ring[ids[(k + 1) % n]] === RINGS;
      const runs = [];
      let anyFalse = false;
      for (let k = 0; k < n; k++) if (!f[k]) { anyFalse = true; break; }
      if (!anyFalse) runs.push(Int32Array.from(ids));
      else {
        for (let s = 0; s < n; s++) {
          if (!(f[s] && !f[(s - 1 + n) % n])) continue;
          const run = [ids[s]];
          let idx = s;
          while (f[idx % n] && run.length <= n) { idx++; run.push(ids[idx % n]); }
          runs.push(Int32Array.from(run));
        }
      }
      const pid = pieceOf[ids[0]];
      if (pid >= 0) newPieces[pid].loops.push({ ids: Int32Array.from(ids), runs });
    }
  }
  const parts = newPieces.map(() => []);
  for (const i of actList) parts[pieceOf[i]].push(i);
  for (let p = 0; p < nPieces; p++) {
    const pc = newPieces[p];
    pc.parts = Int32Array.from(parts[p]);
    // highlight anchor: an interior particle towards the upper-left of the rest shape
    let best = -1, bs = 1e9, bestAny = -1, bsAny = 1e9;
    for (const i of parts[p]) {
      const s = mesh.rx[i] * 0.6 + mesh.ry[i];
      if (s < bsAny) { bsAny = s; bestAny = i; }
      if (mesh.ring[i] <= RINGS - 4 && s < bs) { bs = s; best = i; }
    }
    pc.hl = best >= 0 ? best : bestAny;
  }
  for (let si = 0; si < mesh.seeds.length; si++) {
    const t = mesh.seeds[si].t;
    if (triAlive[t]) newPieces[pieceOf[A[t]]].seeds.push(si);
  }

  topo.act = Int32Array.from(actList); topo.nAct = actList.length; topo.nPieces = nPieces;
  topo.ta = ta; topo.tb = tb; topo.tc = tc; topo.tr = tr; topo.nT = nT;
  topo.ea = ea; topo.eb = eb; topo.er = er; topo.ek = ek; topo.nE = nE;
  topo.ba = ba; topo.bb = bb; topo.br = br; topo.nB = nB;
  pieces = newPieces;
}

/** proper segment/segment intersection */
function segCross(ax, ay, bx, by, cx, cy, dx, dy) {
  const d1 = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
  const d2 = (bx - ax) * (dy - ay) - (by - ay) * (dx - ax);
  const d3 = (dx - cx) * (ay - cy) - (dy - cy) * (ax - cx);
  const d4 = (dx - cx) * (by - cy) - (dy - cy) * (bx - cx);
  return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
}

/**
 * Remove every triangle (and with it every constraint) crossed by the knife segment.
 * The test is a swept segment, so fast drags cannot skip over the mesh.
 */
function cutSegment(ax, ay, bx, by) {
  const A = mesh.A, B = mesh.B, C = mesh.C;
  const minX = Math.min(ax, bx) - 1, maxX = Math.max(ax, bx) + 1, minY = Math.min(ay, by) - 1, maxY = Math.max(ay, by) + 1;
  let removed = 0;
  for (let t = 0; t < mesh.nT; t++) {
    if (!triAlive[t]) continue;
    const a = A[t], b = B[t], c = C[t];
    const tx0 = Math.min(x[a], x[b], x[c]), tx1 = Math.max(x[a], x[b], x[c]);
    const ty0 = Math.min(y[a], y[b], y[c]), ty1 = Math.max(y[a], y[b], y[c]);
    if (tx1 < minX || tx0 > maxX || ty1 < minY || ty0 > maxY) continue;
    if (segCross(ax, ay, bx, by, x[a], y[a], x[b], y[b]) ||
        segCross(ax, ay, bx, by, x[b], y[b], x[c], y[c]) ||
        segCross(ax, ay, bx, by, x[c], y[c], x[a], y[a])) { triAlive[t] = 0; removed++; }
  }
  if (removed) compile();
  return removed;
}

/* ============================================================================
 * 5. PHYSICS  (XPBD, fixed timestep, substeps)
 * ========================================================================== */
/** @type {Map<number, Pointer>} */
const pointers = new Map();

const HASH = 8192;
const cellHead = new Int32Array(HASH), cellNext = new Int32Array(N);
const hashCell = (cx, cy) => ((cx * 73856093) ^ (cy * 19349663)) & (HASH - 1);

/** Particles of different pieces repel each other so pieces stack instead of overlapping. */
function collidePieces() {
  const act = topo.act, n = topo.nAct, inv = 1 / CONTACT_D, d2max = CONTACT_D * CONTACT_D;
  cellHead.fill(-1);
  for (let k = 0; k < n; k++) {
    const i = act[k], h = hashCell(Math.floor(x[i] * inv), Math.floor(y[i] * inv));
    cellNext[i] = cellHead[h]; cellHead[h] = i;
  }
  for (let k = 0; k < n; k++) {
    const i = act[k], cx = Math.floor(x[i] * inv), cy = Math.floor(y[i] * inv);
    for (let oy = -1; oy <= 1; oy++) {
      for (let ox = -1; ox <= 1; ox++) {
        for (let j = cellHead[hashCell(cx + ox, cy + oy)]; j !== -1; j = cellNext[j]) {
          if (j <= i || pieceOf[j] === pieceOf[i]) continue;
          const dx = x[j] - x[i], dy = y[j] - y[i], d2 = dx * dx + dy * dy;
          if (d2 >= d2max) continue;
          const d = Math.sqrt(d2);
          const nx = d > 1e-6 ? dx / d : 1, ny = d > 1e-6 ? dy / d : 0;
          const corr = (CONTACT_D - d) * 0.5;
          x[i] -= nx * corr; y[i] -= ny * corr; x[j] += nx * corr; y[j] += ny * corr;
        }
      }
    }
  }
}

function applyPointers(ih2) {
  const W = view.worldW, FY = view.floorY;
  for (const p of pointers.values()) {
    if (p.kind === 'knife' || !p.idx) continue;
    const base = (p.kind === 'pinch' ? PINCH_ALPHA : GRAB_ALPHA) * ih2;
    for (let k = 0; k < p.idx.length; k++) {
      const i = p.idx[k];
      if (!pAlive[i]) continue;
      let tx = p.wx + p.ox[k] * p.s, ty = p.wy + p.oy[k] * p.s;
      tx = tx < 0 ? 0 : (tx > W ? W : tx);
      ty = ty < -400 ? -400 : (ty > FY ? FY : ty);
      // XPBD attachment to a moving target: a compliant spring, limited per substep (no teleporting)
      const f = 1 / (1 + base / p.w[k]);
      let dx = (tx - x[i]) * f, dy = (ty - y[i]) * f;
      const m = Math.hypot(dx, dy);
      if (m > MAX_PULL) { dx *= MAX_PULL / m; dy *= MAX_PULL / m; }
      x[i] += dx; y[i] += dy;
    }
  }
}

function collideBounds() {
  const FY = view.floorY, W = view.worldW, act = topo.act, n = topo.nAct;
  for (let k = 0; k < n; k++) {
    const i = act[k];
    contact[i] = 0;
    if (y[i] > FY) {
      const pen = y[i] - FY;
      y[i] = FY;
      const dxT = x[i] - px[i], lim = MU_FLOOR * pen;     // Coulomb friction on the position update
      x[i] = Math.abs(dxT) <= lim ? px[i] : x[i] - Math.sign(dxT) * lim;
      contact[i] = 1;
    } else if (y[i] < -3000) { y[i] = -3000; }
    if (x[i] < 0) {
      const pen = -x[i];
      x[i] = 0;
      const dyT = y[i] - py[i], lim = MU_WALL * pen;
      y[i] = Math.abs(dyT) <= lim ? py[i] : y[i] - Math.sign(dyT) * lim;
      contact[i] = 1;
    } else if (x[i] > W) {
      const pen = x[i] - W;
      x[i] = W;
      const dyT = y[i] - py[i], lim = MU_WALL * pen;
      y[i] = Math.abs(dyT) <= lim ? py[i] : y[i] - Math.sign(dyT) * lim;
      contact[i] = 1;
    }
  }
}

function simulate(dt) {
  const nSub = Math.max(8, params.substeps | 0);
  const h = dt / nSub, ih2 = 1 / (h * h);
  const st = Math.max(0.05, params.stiffness), vo = Math.max(0.05, params.volume);
  const aF = ALPHA_FLESH / st * ih2, aR = ALPHA_RIND / st * ih2, aA = ALPHA_AREA / vo * ih2, aB = ALPHA_BEND / st * ih2;
  const drag = Math.max(0, 1 - params.damping * h);
  const wob = 1 - params.wobble;
  // internal (edge-wise) damping removes wobble without slowing rigid motion
  const kd = 1 - Math.exp(-(15 + 385 * wob * wob) * h);
  const g = params.gravity;
  const fd = Math.max(0, 1 - FLOOR_DAMP * h), maxV2 = MAX_SPEED * MAX_SPEED, iv = 1 / h;
  const { act, nAct, ea, eb, er, ek, nE, ba, bb, br, nB, ta, tb, tc, tr, nT } = topo;
  const multi = topo.nPieces > 1;

  for (let s = 0; s < nSub; s++) {
    for (let k = 0; k < nAct; k++) {
      const i = act[k];
      px[i] = x[i]; py[i] = y[i];
      const u = vx[i] * drag, w = (vy[i] + g * h) * drag;
      vx[i] = u; vy[i] = w;
      x[i] += u * h; y[i] += w * h;
    }
    // distance constraints (flesh + stiffer rind)
    for (let e = 0; e < nE; e++) {
      const a = ea[e], b = eb[e];
      const dx = x[a] - x[b], dy = y[a] - y[b];
      const len = Math.sqrt(dx * dx + dy * dy);
      if (len < 1e-9) continue;
      const lam = -(len - er[e]) / (2 + (ek[e] ? aR : aF)) / len;
      const cx = dx * lam, cy = dy * lam;
      x[a] += cx; y[a] += cy; x[b] -= cx; y[b] -= cy;
    }
    // rind bending
    for (let e = 0; e < nB; e++) {
      const a = ba[e], b = bb[e];
      const dx = x[a] - x[b], dy = y[a] - y[b];
      const len = Math.sqrt(dx * dx + dy * dy);
      if (len < 1e-9) continue;
      const lam = -(len - br[e]) / (2 + aB) / len;
      const cx = dx * lam, cy = dy * lam;
      x[a] += cx; y[a] += cy; x[b] -= cx; y[b] -= cy;
    }
    // signed-area constraints: incompressible jelly, also un-inverts flipped triangles
    for (let t = 0; t < nT; t++) {
      const a = ta[t], b = tb[t], c = tc[t];
      const ax = x[a], ay = y[a], bx = x[b], by = y[b], cx = x[c], cy = y[c];
      const area = 0.5 * ((bx - ax) * (cy - ay) - (by - ay) * (cx - ax));
      const gax = 0.5 * (by - cy), gay = 0.5 * (cx - bx);
      const gbx = 0.5 * (cy - ay), gby = 0.5 * (ax - cx);
      const gcx = 0.5 * (ay - by), gcy = 0.5 * (bx - ax);
      const w = gax * gax + gay * gay + gbx * gbx + gby * gby + gcx * gcx + gcy * gcy;
      if (w < 1e-12) continue;                          // degenerate triangle guard
      const lam = -(area - tr[t]) / (w + aA);
      x[a] += lam * gax; y[a] += lam * gay;
      x[b] += lam * gbx; y[b] += lam * gby;
      x[c] += lam * gcx; y[c] += lam * gcy;
    }
    if (pointers.size) applyPointers(ih2);
    if (multi) collidePieces();
    collideBounds();

    for (let k = 0; k < nAct; k++) {
      const i = act[k];
      let u = (x[i] - px[i]) * iv, w = (y[i] - py[i]) * iv;
      if (contact[i]) { u *= fd; w *= fd; }
      const sp2 = u * u + w * w;
      if (!(sp2 < maxV2)) {
        if (sp2 === Infinity || sp2 !== sp2) { u = 0; w = 0; }
        else { const f = MAX_SPEED / Math.sqrt(sp2); u *= f; w *= f; }
      } else if (sp2 < 0.04) { u = 0; w = 0; }
      vx[i] = u; vy[i] = w;
    }
    for (let e = 0; e < nE; e++) {
      const a = ea[e], b = eb[e];
      const dx = x[a] - x[b], dy = y[a] - y[b];
      const len = Math.sqrt(dx * dx + dy * dy);
      if (len < 1e-9) continue;
      const nx = dx / len, ny = dy / len;
      const imp = ((vx[a] - vx[b]) * nx + (vy[a] - vy[b]) * ny) * kd * 0.5;
      vx[a] -= imp * nx; vy[a] -= imp * ny; vx[b] += imp * nx; vy[b] += imp * ny;
    }
  }
}

/* --- robustness: snapshot + recovery ------------------------------------- */
let snapTimer = 0;
function snapshot() { snapX.set(x); snapY.set(y); snapTimer = 0; }

function sanityCheck() {
  const act = topo.act, n = topo.nAct;
  let bad = false;
  for (let k = 0; k < n; k++) {
    const i = act[k];
    if (!(Math.abs(x[i]) < 1e5 && Math.abs(y[i]) < 1e5)) { bad = true; break; }   // also catches NaN
  }
  if (bad) {
    let ok = true;
    for (let i = 0; i < N; i++) if (!(Math.abs(snapX[i]) < 1e5 && Math.abs(snapY[i]) < 1e5)) { ok = false; break; }
    if (!ok) { resetSim(); return; }
    x.set(snapX); y.set(snapY); px.set(snapX); py.set(snapY); vx.fill(0); vy.fill(0);
    return;
  }
  if (++snapTimer >= 30) snapshot();
}

/** After a resize, pull particles back inside the world without creating fake velocity. */
function fitIntoBounds() {
  const act = topo.act;
  for (let k = 0; k < topo.nAct; k++) {
    const i = act[k];
    const nx = Math.min(Math.max(x[i], 0), view.worldW), ny = Math.min(y[i], view.floorY);
    if (nx !== x[i] || ny !== y[i]) { x[i] = nx; y[i] = ny; vx[i] = 0; vy[i] = 0; }
  }
}

function resetSim() {
  pointers.clear();
  trail.length = 0;
  const cx = view.worldW / 2, cy = view.floorY - 70;
  for (let i = 0; i < N; i++) {
    x[i] = cx + mesh.rx[i]; y[i] = cy + mesh.ry[i];
    px[i] = x[i]; py[i] = y[i]; vx[i] = 0; vy[i] = 0; contact[i] = 0;
  }
  triAlive.fill(1);
  compile();
  snapshot();
}

/* ============================================================================
 * 6. INPUT  (Pointer Events)
 * ========================================================================== */
let tool = 'grab';
/** @type {{x:number, y:number, t:number, brk:boolean}[]} */
const trail = [];

const toWorld = (e) => {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / view.scale, y: (e.clientY - r.top) / view.scale };
};

/** Pick the particles around the pointer with a soft falloff; offsets are kept so nothing teleports. */
function pickItems(kind, wx, wy) {
  let best = -1, bd = GRAB_REACH * GRAB_REACH;
  const act = topo.act;
  for (let k = 0; k < topo.nAct; k++) {
    const i = act[k], dx = x[i] - wx, dy = y[i] - wy, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  if (best < 0) return null;
  const pid = pieceOf[best], rad = kind === 'pinch' ? PINCH_RADIUS : GRAB_RADIUS;
  const idx = [], ox = [], oy = [], w = [];
  for (let k = 0; k < topo.nAct; k++) {
    const i = act[k];
    if (pieceOf[i] !== pid) continue;
    const dx = x[i] - wx, dy = y[i] - wy, d = Math.sqrt(dx * dx + dy * dy);
    if (d >= rad) continue;
    const t = 1 - d / rad;
    idx.push(i); ox.push(dx); oy.push(dy); w.push(Math.max(0.05, t * t));
  }
  return { idx, ox, oy, w };
}

function bindInput() {
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    const w = toWorld(e);
    const pinchMod = e.button === 2 || e.shiftKey;
    /** @type {Pointer} */
    let p;
    if (tool === 'knife' && !pinchMod) {
      p = { kind: 'knife', wx: w.x, wy: w.y, idx: null, ox: [], oy: [], w: [], s: 1 };
      trail.push({ x: w.x, y: w.y, t: performance.now(), brk: true });
    } else {
      const kind = pinchMod ? 'pinch' : 'grab';
      const it = pickItems(kind, w.x, w.y);
      p = { kind, wx: w.x, wy: w.y, idx: it ? it.idx : null, ox: it ? it.ox : [], oy: it ? it.oy : [],
            w: it ? it.w : [], s: kind === 'pinch' ? PINCH_SCALE : 1 };
    }
    pointers.set(e.pointerId, p);
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    if (p.kind === 'knife') {
      const list = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
      for (const ev of list) {
        const w = toWorld(ev);
        cutSegment(p.wx, p.wy, w.x, w.y);
        trail.push({ x: w.x, y: w.y, t: performance.now(), brk: false });
        p.wx = w.x; p.wy = w.y;
      }
    } else {
      const w = toWorld(e);
      p.wx = w.x; p.wy = w.y;
    }
  });
  const end = (e) => { pointers.delete(e.pointerId); };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('lostpointercapture', end);
  window.addEventListener('blur', () => pointers.clear());
}

/* ============================================================================
 * 7. RENDERING  (Canvas 2D)
 * ========================================================================== */
const canvas = /** @type {HTMLCanvasElement} */ (document.getElementById('c'));
const ctx = canvas.getContext('2d');

const colorTarget = [255, 74, 94], colorCur = [255, 74, 94];
const mix = (c, t, f) => [c[0] + (t[0] - c[0]) * f, c[1] + (t[1] - c[1]) * f, c[2] + (t[2] - c[2]) * f];
const rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;

function smoothClosed(ids) {
  const n = ids.length;
  if (n < 3) return;
  const l = ids[n - 1], f = ids[0];
  ctx.moveTo((x[l] + x[f]) / 2, (y[l] + y[f]) / 2);
  for (let k = 0; k < n; k++) {
    const p = ids[k], q = ids[(k + 1) % n];
    ctx.quadraticCurveTo(x[p], y[p], (x[p] + x[q]) / 2, (y[p] + y[q]) / 2);
  }
  ctx.closePath();
}

function smoothOpen(ids) {
  const n = ids.length;
  if (n < 2) return;
  ctx.moveTo(x[ids[0]], y[ids[0]]);
  for (let k = 1; k < n - 1; k++) {
    const p = ids[k], q = ids[k + 1];
    ctx.quadraticCurveTo(x[p], y[p], (x[p] + x[q]) / 2, (y[p] + y[q]) / 2);
  }
  ctx.lineTo(x[ids[n - 1]], y[ids[n - 1]]);
}

function tracePiece(pc) {
  ctx.beginPath();
  for (const lp of pc.loops) smoothClosed(lp.ids);
}

function drawShadow(pc) {
  const parts = pc.parts;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (let k = 0; k < parts.length; k++) {
    const i = parts[k];
    if (x[i] < minX) minX = x[i];
    if (x[i] > maxX) maxX = x[i];
    if (y[i] < minY) minY = y[i];
    if (y[i] > maxY) maxY = y[i];
  }
  pc.bb = [minX, minY, maxX, maxY];
  const hgt = Math.max(0, view.floorY - maxY);
  const alpha = 0.5 * Math.max(0, 1 - hgt / 320);
  const rad = (maxX - minX) * 0.55 + 6;
  if (alpha <= 0.01 || !(rad > 0)) return;
  ctx.save();
  ctx.translate((minX + maxX) / 2, view.floorY + 3);
  ctx.scale(1, 0.13);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rad);
  g.addColorStop(0, `rgba(0,0,0,${alpha})`);
  g.addColorStop(0.6, `rgba(0,0,0,${alpha * 0.45})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(-rad, -rad, rad * 2, rad * 2);
  ctx.restore();
}

function drawSeeds(pc) {
  const A = mesh.A, B = mesh.B, C = mesh.C;
  for (const si of pc.seeds) {
    const s = mesh.seeds[si], a = A[s.t], b = B[s.t], c = C[s.t];
    const cx = s.u * x[a] + s.v * x[b] + s.w * x[c], cy = s.u * y[a] + s.v * y[b] + s.w * y[c];
    const qx = s.qu * x[a] + s.qv * x[b] + s.qw * x[c], qy = s.qu * y[a] + s.qv * y[b] + s.qw * y[c];
    const dx = qx - cx, dy = qy - cy, L = Math.hypot(dx, dy);
    if (!(L > 0.5)) continue;
    const hw = L * 0.62;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.atan2(dy, dx));
    ctx.beginPath();
    ctx.moveTo(L * 1.1, 0);
    ctx.quadraticCurveTo(-0.1 * L, -hw * 1.7, -L * 1.2, 0);
    ctx.quadraticCurveTo(-0.1 * L, hw * 1.7, L * 1.1, 0);
    ctx.closePath();
    ctx.fillStyle = '#1c1210';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-L * 0.1, -hw * 0.35, L * 0.5, hw * 0.16, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fill();
    ctx.restore();
  }
}

function drawPiece(pc, col) {
  const [minX, minY, maxX, maxY] = pc.bb;
  const w = maxX - minX, h = maxY - minY;
  if (!(w >= 0 && h >= 0) || pc.loops.length === 0) return;
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const size = Math.max(w, h, 10);

  // translucent flesh body
  const g = ctx.createRadialGradient(cx, cy - h * 0.15, 2, cx, cy, size * 0.7);
  g.addColorStop(0, rgba(col.hi, 1));
  g.addColorStop(0.55, rgba(col.mid, 1));
  g.addColorStop(1, rgba(col.lo, 1));
  tracePiece(pc);
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = g;
  ctx.fill('evenodd');
  ctx.globalAlpha = 1;

  ctx.save();
  tracePiece(pc);
  ctx.clip('evenodd');
  ctx.lineJoin = 'round';

  // depth shading and the paler cut-face rim
  tracePiece(pc);
  ctx.strokeStyle = rgba(col.lo, 0.5); ctx.lineWidth = 20; ctx.stroke();
  tracePiece(pc);
  ctx.strokeStyle = rgba(col.rim, 0.55); ctx.lineWidth = 5; ctx.stroke();

  // pith (white) then rind (green), only along rind boundary runs
  ctx.lineCap = 'butt';
  for (const pass of [0, 1, 2]) {
    ctx.strokeStyle = pass === 0 ? '#f1f3d6' : (pass === 1 ? '#1d6b31' : '#38a84a');
    ctx.lineWidth = pass === 0 ? 2 * (RIND_T + PITH_T) : (pass === 1 ? 2 * RIND_T : 2 * RIND_T - 5);
    ctx.beginPath();
    for (const lp of pc.loops) for (const run of lp.runs) smoothOpen(run);
    ctx.stroke();
  }

  drawSeeds(pc);

  // gloss: broad sheen, anchored specular blob, thin rim light
  const sheen = ctx.createLinearGradient(minX, minY, minX + w * 0.6, minY + h * 0.95);
  sheen.addColorStop(0, 'rgba(255,255,255,0.30)');
  sheen.addColorStop(0.5, 'rgba(255,255,255,0.05)');
  sheen.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sheen;
  ctx.fillRect(minX - 2, minY - 2, w + 4, h + 4);
  if (pc.hl >= 0) {
    const hx = x[pc.hl], hy = y[pc.hl], r = Math.max(14, Math.min(w, h) * 0.4);
    const sg = ctx.createRadialGradient(hx, hy, 0, hx, hy, r);
    sg.addColorStop(0, 'rgba(255,255,255,0.42)');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(hx - r, hy - r, r * 2, r * 2);
    ctx.beginPath();
    ctx.ellipse(hx, hy, 11, 5, -0.55, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fill();
  }
  ctx.restore();

  tracePiece(pc);
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
}

function render(now) {
  const dpr = view.dpr, s = view.scale;
  ctx.setTransform(dpr * s, 0, 0, dpr * s, 0, 0);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const W = view.worldW, H = view.worldH, FY = view.floorY;

  const bg = ctx.createLinearGradient(0, 0, 0, FY);
  bg.addColorStop(0, '#3b3560'); bg.addColorStop(1, '#241f3d');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  const tb = ctx.createLinearGradient(0, FY, 0, H);
  tb.addColorStop(0, '#56507a'); tb.addColorStop(1, '#2b2645');
  ctx.fillStyle = tb;
  ctx.fillRect(0, FY, W, H - FY + 2);
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  ctx.fillRect(0, FY, W, 1.5);

  const col = {
    hi: mix(colorCur, [255, 255, 255], 0.3),
    mid: colorCur,
    lo: mix(colorCur, [50, 0, 12], 0.32),
    rim: mix(colorCur, [255, 255, 255], 0.55),
  };
  for (const pc of pieces) drawShadow(pc);
  for (const pc of pieces) drawPiece(pc, col);

  // knife trail
  while (trail.length && now - trail[0].t > TRAIL_MS) trail.shift();
  for (let i = 1; i < trail.length; i++) {
    if (trail[i].brk) continue;
    const a = 1 - (now - trail[i].t) / TRAIL_MS;
    if (a <= 0) continue;
    ctx.beginPath();
    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
    ctx.lineTo(trail[i].x, trail[i].y);
    ctx.strokeStyle = `rgba(140,210,255,${(a * 0.35).toFixed(3)})`; ctx.lineWidth = 9; ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${a.toFixed(3)})`; ctx.lineWidth = 2.5; ctx.stroke();
  }

  // grab / pinch cursors
  for (const p of pointers.values()) {
    if (p.kind === 'knife' || !p.idx) continue;
    ctx.beginPath();
    ctx.arc(p.wx, p.wy, p.kind === 'pinch' ? 9 : 7, 0, Math.PI * 2);
    ctx.strokeStyle = p.kind === 'pinch' ? 'rgba(255,230,120,0.85)' : 'rgba(255,255,255,0.75)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function updateColor(dt) {
  const k = 1 - Math.exp(-dt * 10);
  for (let i = 0; i < 3; i++) colorCur[i] += (colorTarget[i] - colorCur[i]) * k;
}

/* ============================================================================
 * 8. UI
 * ========================================================================== */
const SLIDERS = [
  { k: 'stiffness', label: 'Stiffness', min: 0.25, max: 4, step: 0.05, fmt: (v) => v.toFixed(2) },
  { k: 'volume', label: 'Volume', min: 0.25, max: 4, step: 0.05, fmt: (v) => v.toFixed(2) },
  { k: 'damping', label: 'Damping', min: 0, max: 4, step: 0.05, fmt: (v) => v.toFixed(2) },
  { k: 'wobble', label: 'Wobble', min: 0, max: 1, step: 0.01, fmt: (v) => v.toFixed(2) },
  { k: 'gravity', label: 'Gravity', min: 0, max: 3000, step: 10, fmt: (v) => String(Math.round(v)) },
  { k: 'substeps', label: 'Substeps', min: 8, max: 20, step: 1, fmt: (v) => String(Math.round(v)) },
];
const PRESETS = ['#ff4a5e', '#ff8a3d', '#ffd23f', '#7ddc5a', '#2ed8c3', '#4d8dff', '#a566ff', '#ff6fb5'];

function hexToRgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}

function setTool(name) {
  tool = name;
  pointers.clear();
  document.body.classList.toggle('knife', name === 'knife');
  for (const [id, n] of [['btnGrab', 'grab'], ['btnKnife', 'knife']]) {
    const b = document.getElementById(id);
    b.classList.toggle('active', n === name);
    b.setAttribute('aria-pressed', String(n === name));
  }
}

function bindUI() {
  document.getElementById('btnGrab').addEventListener('click', () => setTool('grab'));
  document.getElementById('btnKnife').addEventListener('click', () => setTool('knife'));
  document.getElementById('btnReset').addEventListener('click', () => resetSim());

  const pop = document.getElementById('colorPop'), picker = /** @type {HTMLInputElement} */ (document.getElementById('picker'));
  const swWrap = document.getElementById('swatches');
  const swatchEls = [];
  const setColor = (hex) => {
    const c = hexToRgb(hex);
    colorTarget[0] = c[0]; colorTarget[1] = c[1]; colorTarget[2] = c[2];
    picker.value = hex;
    swatchEls.forEach((el, i) => el.classList.toggle('sel', PRESETS[i] === hex.toLowerCase()));
  };
  PRESETS.forEach((hex) => {
    const b = document.createElement('button');
    b.className = 'swatch'; b.style.background = hex; b.title = hex; b.setAttribute('aria-label', 'Color ' + hex);
    b.addEventListener('click', () => setColor(hex));
    swWrap.appendChild(b); swatchEls.push(b);
  });
  picker.addEventListener('input', () => setColor(picker.value));
  document.getElementById('btnColor').addEventListener('click', () => { pop.hidden = !pop.hidden; });
  document.addEventListener('pointerdown', (e) => {
    if (!pop.hidden && !document.getElementById('colorWrap').contains(/** @type {Node} */ (e.target))) pop.hidden = true;
  }, true);
  setColor(PRESETS[0]);

  const box = document.getElementById('sliders');
  const refs = [];
  for (const s of SLIDERS) {
    const row = document.createElement('label');
    row.className = 'row';
    row.innerHTML = `<span>${s.label}</span><input type="range" min="${s.min}" max="${s.max}" step="${s.step}"><output></output>`;
    const inp = row.querySelector('input'), out = row.querySelector('output');
    const show = () => { out.textContent = s.fmt(params[s.k]); };
    inp.value = String(params[s.k]); show();
    inp.addEventListener('input', () => { params[s.k] = parseFloat(inp.value); show(); });
    refs.push({ s, inp, show });
    box.appendChild(row);
  }
  document.getElementById('defaults').addEventListener('click', () => {
    Object.assign(params, DEFAULTS);
    for (const r of refs) { r.inp.value = String(params[r.s.k]); r.show(); }
  });

  const fpsEl = document.getElementById('fps'), chk = /** @type {HTMLInputElement} */ (document.getElementById('chkFps'));
  const syncFps = () => { fpsEl.hidden = !chk.checked; };
  chk.addEventListener('change', syncFps); syncFps();

  window.addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLInputElement || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'g') setTool('grab');
    else if (k === 'k') setTool('knife');
    else if (k === 'r') resetSim();
    else if (k === 'f') { chk.checked = !chk.checked; syncFps(); }
  });
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  view.dpr = dpr; view.cssW = cw; view.cssH = ch;
  view.scale = Math.min(ch / WORLD_H, cw / WORLD_MIN_W);
  view.worldW = cw / view.scale; view.worldH = ch / view.scale;
  view.floorY = view.worldH - 46;
  fitIntoBounds();
}

/* ============================================================================
 * 9. MAIN LOOP
 * ========================================================================== */
const fpsEl = document.getElementById('fps');
let last = performance.now(), acc = 0, frames = 0, fpsT = last;

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
  last = now;
  acc += dt;
  let steps = 0;
  while (acc >= FIXED_DT && steps < MAX_STEPS) { simulate(FIXED_DT); acc -= FIXED_DT; steps++; }
  if (acc >= FIXED_DT) acc = 0;                 // too slow: drop the backlog instead of spiralling
  sanityCheck();
  updateColor(dt);
  render(now);
  frames++;
  if (now - fpsT >= 500) {
    fpsEl.textContent = Math.round(frames * 1000 / (now - fpsT)) + ' FPS';
    frames = 0; fpsT = now;
  }
}

resize();
window.addEventListener('resize', resize);
bindInput();
bindUI();
resetSim();
requestAnimationFrame((t) => { last = t; fpsT = t; frame(t); });

})();
</script>
</body>
