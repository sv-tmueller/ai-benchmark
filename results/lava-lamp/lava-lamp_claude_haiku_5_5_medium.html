<title>Photoreal ray-marched lava lamp studio shot</title>
<script type="application/json" id="bridgebench-manifest">{"id":"game-lava-lamp","title":"Photoreal ray-marched lava lamp studio shot","kind":"game","controls":[],"fixedStep":0.016666666666666666,"state":["heat","paletteIndex"],"api":["getState","reset","advance","destroy"]}</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0a0a}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------------------
// Manifest and fixed configuration
// ---------------------------------------------------------------------------
const MANIFEST = Object.freeze({
  id: 'game-lava-lamp',
  title: 'Photoreal ray-marched lava lamp studio shot',
  kind: 'game',
  controls: [],
  fixedStep: 1 / 60,
  state: ['heat', 'paletteIndex'],
  api: ['getState', 'reset', 'advance', 'destroy'],
});

const HEAT = 0.65;
const DT = 1 / 60;
const PREWARM_STEPS = 900;   // 15 s of simulated warm-up, done inside reset()
const MAX_BLOBS = 8;
const BLOB_COUNT = 7;
const CENTER_Y = -0.025;     // vertical centre of the lamp bounds (-1.5 .. 1.45)

// Palette 0 is Ember. Only Ember is defined; paletteIndex is fixed at 0.
const PALETTES = [
  { name: 'Ember', core: [0.72, 0.10, 0.03], edge: [1.0, 0.52, 0.16], pool: [1.0, 0.64, 0.18] },
];

// ---------------------------------------------------------------------------
// Deterministic helpers
// ---------------------------------------------------------------------------
function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Inner radius of the tapered bottle at height y (matches the shader).
function bottleR(y) {
  return 0.28 + (0.42 - 0.28) * clamp((1.2 - y) / 2.4, 0, 1);
}

// ---------------------------------------------------------------------------
// Simulation: wax blobs driven by heat and buoyancy, fixed-step integration
// ---------------------------------------------------------------------------
const state = { heat: HEAT, paletteIndex: 0 };
let sim = null;

function makeBlobs(seed) {
  const rnd = mulberry32(seed);
  const blobs = [];
  for (let i = 0; i < BLOB_COUNT; i++) {
    const r0 = i === 0 ? 0.22 + rnd() * 0.06 : 0.10 + rnd() * 0.12;
    blobs.push({
      x: (rnd() - 0.5) * 0.4,
      y: -0.9 + rnd() * 1.6,
      vx: 0,
      vy: 0,
      T: 0.5 + (rnd() - 0.5) * 0.2,
      r0,
      phase: rnd() * Math.PI * 2,
    });
  }
  return blobs;
}

function newSim(seed) {
  return { seed, epoch: sim ? sim.epoch + 1 : 1, blobs: makeBlobs(seed), elapsed: 0, substeps: 0 };
}

function stepSim(s, dt) {
  const bl = s.blobs;
  const t = s.elapsed;
  const heat = state.heat;

  // Cohesion between nearby masses: this produces necks and bridges.
  for (let i = 0; i < bl.length; i++) {
    for (let j = i + 1; j < bl.length; j++) {
      const a = bl[i];
      const b = bl[j];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      const reach = a.r0 + b.r0 + 0.12;
      if (d > 1e-4 && d < reach) {
        const f = (1 - d / reach) * 0.6;
        const fx = (dx / d) * f * dt;
        const fy = (dy / d) * f * dt;
        a.vx += fx; a.vy += fy;
        b.vx -= fx; b.vy -= fy;
      }
    }
  }

  for (const b of bl) {
    // Heating near the bottom, cooling near the top.
    const heatIn = heat * clamp((-0.45 - b.y) / 0.5, 0, 1) * 1.1;
    const coolOut = 0.22 * clamp((b.y + 0.2) / 0.6, 0, 1);
    b.T = clamp(b.T + dt * (heatIn - coolOut), 0, 1);

    const r = b.r0 * (0.85 + 0.3 * b.T);
    const ay = (b.T - 0.5) * 2.4 - 0.6 * b.vy;
    const ax = -0.09 * b.x + 0.15 * Math.sin(t * 0.7 + b.phase) - 0.8 * b.vx;
    b.vy += ay * dt;
    b.vx += ax * dt;
    b.y += b.vy * dt;
    b.x += b.vx * dt;

    // Stay above the pool and below the cap; stay inside the glass.
    const yMin = -0.95 + r * 0.5;
    const yMax = 1.0 - r;
    if (b.y < yMin) { b.y = yMin; b.vy = Math.abs(b.vy) * 0.3; }
    if (b.y > yMax) { b.y = yMax; b.vy = -Math.abs(b.vy) * 0.3; }
    const xl = Math.max(0, bottleR(b.y) - r - 0.03);
    if (Math.abs(b.x) > xl) { b.x = Math.sign(b.x) * xl; b.vx *= -0.3; }
    b.rDraw = r;
  }

  s.elapsed += dt;
  s.substeps += 1;
}

// ---------------------------------------------------------------------------
// Renderer: one fullscreen pass, orthographic ray march (fixed camera)
// ---------------------------------------------------------------------------
const VERT = `#version 300 es
const vec2 P[3] = vec2[3](vec2(-1.0, -1.0), vec2(3.0, -1.0), vec2(-1.0, 3.0));
void main() { gl_Position = vec4(P[gl_VertexID], 0.0, 1.0); }
`;

const FRAG = `#version 300 es
precision highp float;
out vec4 outColor;

uniform vec2 uRes;
uniform float uExt;
uniform vec3 uCenter;
uniform int uBlobCount;
uniform vec4 uBlobs[8];
uniform vec3 uCoreCol;
uniform vec3 uEdgeCol;
uniform vec3 uPoolCol;

const float EXPOSURE = 1.15;   // fixed shared exposure

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float bottleR(float y) {
  return mix(0.28, 0.42, clamp((1.2 - y) / 2.4, 0.0, 1.0));
}

// Glass: thin shell around the tapered bottle.
float sdGlass(vec3 p) {
  float d = abs(length(p.xz) - bottleR(p.y)) - 0.014;
  return max(d, abs(p.y) - 1.2);
}

// Interior of the bottle, slightly inset from the glass.
float sdInterior(vec3 p) {
  return max(length(p.xz) - (bottleR(p.y) - 0.035), abs(p.y) - 1.15);
}

// Wax: smooth implicit union of blobs plus a flattened amber pool, clipped to the bottle.
float sdWax(vec3 p) {
  float d = 10.0;
  for (int i = 0; i < 8; i++) {
    if (i >= uBlobCount) break;
    vec4 b = uBlobs[i];
    float di = length(p - b.xyz) - b.w;
    d = (i == 0) ? di : smin(d, di, 0.2);
  }
  vec3 q = p - vec3(0.0, -1.0, 0.0);
  float pool = (length(q * vec3(1.0, 3.5, 1.0)) - 0.4) / 3.5;
  d = smin(d, pool, 0.25);
  return max(d, sdInterior(p));
}

// Opaque silver hardware: rounded cap and foot.
float sdRoundCyl(vec3 p, float r, float h, float rr) {
  vec2 d = abs(vec2(length(p.xz), p.y)) - vec2(r - rr, h - rr);
  return min(max(d.x, d.y), 0.0) + length(max(d, 0.0)) - rr;
}

float sdHard(vec3 p) {
  float cap = sdRoundCyl(p - vec3(0.0, 1.325, 0.0), 0.30, 0.125, 0.05);
  float base = sdRoundCyl(p - vec3(0.0, -1.35, 0.0), 0.55, 0.15, 0.08);
  return min(cap, base);
}

float mapMode(int m, vec3 p) {
  if (m == 0) return sdWax(p);
  if (m == 1) return sdGlass(p);
  return sdHard(p);
}

vec3 normalMode(int m, vec3 p) {
  const float h = 0.0015;
  vec2 k = vec2(1.0, -1.0);
  return normalize(
    k.xyy * mapMode(m, p + k.xyy * h) +
    k.yyx * mapMode(m, p + k.yyx * h) +
    k.yxy * mapMode(m, p + k.yxy * h) +
    k.xxx * mapMode(m, p + k.xxx * h));
}

// Orthographic march from z = 5 toward -z; returns true on a hit.
bool march(int m, vec3 ro, vec3 rd, out float t) {
  t = 0.0;
  for (int i = 0; i < 128; i++) {
    float d = mapMode(m, ro + rd * t);
    if (d < 0.0006) return true;
    t += max(d * 0.7, 0.0005);
    if (t > 10.0) return false;
  }
  return false;
}

// Vertical softbox strips, expressed as bands in reflection-x.
float stripBand(float x) {
  float u = (x - 0.42) / 0.06;
  float v = (x + 0.42) / 0.06;
  return exp(-u * u) + 0.8 * exp(-v * v);
}

vec3 bgColor(vec2 uv, vec2 w) {
  vec2 c = uv - 0.5;
  float vig = smoothstep(0.1, 0.75, length(c) * 1.4);
  vec3 col = mix(vec3(0.075, 0.068, 0.062), vec3(0.022, 0.020, 0.021), vig);
  // Cool studio strips on the backdrop.
  float s1 = (w.x + 1.1) / 0.35;
  float s2 = (w.x - 1.1) / 0.35;
  col += vec3(0.05, 0.055, 0.065) * exp(-s1 * s1) * smoothstep(-0.2, 1.0, w.y) * 0.6;
  col += vec3(0.05, 0.055, 0.065) * exp(-s2 * s2) * smoothstep(-0.2, 1.0, w.y) * 0.6;
  // Heater glow pooled beneath the foot.
  vec2 g = (w - vec2(0.0, -1.85)) * vec2(0.8, 2.6);
  col += vec3(1.0, 0.42, 0.14) * 0.38 * exp(-dot(g, g));
  // Dark tabletop below the foot.
  col *= mix(0.55, 1.0, smoothstep(-1.58, -1.5, w.y));
  return col;
}

vec3 waxShade(vec3 pos, vec3 rd) {
  vec3 n = normalMode(0, pos);
  float depth = -sdWax(pos - n * 0.14);            // distance inside the wax
  float core = smoothstep(0.02, 0.22, depth);      // thick cores keep rich colour
  vec3 albedo = mix(uEdgeCol, uCoreCol, core);
  float poolMix = 1.0 - smoothstep(-0.98, -0.78, pos.y);
  albedo = mix(albedo, uPoolCol, poolMix * 0.8);

  vec3 L = normalize(vec3(0.0, -1.6, 0.8) - pos);
  float wrap = max(dot(n, L) * 0.5 + 0.5, 0.0);     // wrap lighting from the heater
  vec3 heaterCol = vec3(1.0, 0.48, 0.16);
  vec3 r = reflect(rd, n);
  vec3 spec = vec3(0.9, 0.95, 1.0) * stripBand(r.x) * 0.6;
  vec3 diffuse = albedo * (0.10 + 0.85 * wrap * heaterCol);
  vec3 sss = albedo * uEdgeCol * (1.0 - core) * 0.45;  // warm light through thin edges
  return diffuse + sss + spec;
}

vec3 metalShade(vec3 pos, vec3 rd) {
  vec3 n = normalMode(2, pos);
  vec3 r = reflect(rd, n);
  vec3 silver = vec3(0.80, 0.82, 0.86);
  vec3 L = normalize(vec3(0.0, -1.6, 0.8) - pos);
  float warm = max(dot(n, L), 0.0);
  vec3 cool = vec3(0.85, 0.92, 1.0) * stripBand(r.x) * 1.1;
  vec3 heaterBounce = vec3(1.0, 0.5, 0.2) * (1.0 - smoothstep(-0.7, 0.1, r.y)) * 0.55;
  vec3 ambient = vec3(0.10, 0.10, 0.11) * (0.6 + 0.4 * n.y);
  return silver * (ambient + warm * vec3(1.0, 0.55, 0.25) * 0.25) + (cool + heaterBounce) * silver * 0.9;
}

vec3 glassOverlay(vec3 col, vec3 rd, vec3 n) {
  float ndv = clamp(dot(-rd, n), 0.0, 1.0);
  float grazing = 1.0 - ndv;
  float F = 0.04 + 0.96 * grazing * grazing * grazing * grazing * grazing;
  vec3 r = reflect(rd, n);
  vec3 refl = vec3(0.92, 0.95, 1.0) * stripBand(r.x) * 1.5;
  refl += vec3(1.0, 0.5, 0.2) * (1.0 - smoothstep(-0.8, 0.0, r.y)) * 0.35;
  float rim = grazing * grazing;
  vec3 tint = mix(vec3(1.0), vec3(1.0, 0.86, 0.72), 0.5);
  col = col * tint * (1.0 - 0.06 * rim);
  col += refl * F * 1.6 + vec3(1.0, 0.55, 0.25) * rim * 0.22;
  return col;
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  float aspect = uRes.x / uRes.y;
  vec2 p = uv * 2.0 - 1.0;
  vec2 wxy = vec2(p.x * aspect, p.y) * uExt;
  vec2 world = vec2(wxy.x, wxy.y + uCenter.y);
  vec3 ro = vec3(world, 5.0);
  vec3 rd = vec3(0.0, 0.0, -1.0);

  // Glass first: it sets the refraction offset for the wax behind it.
  float tG = 0.0;
  bool hG = march(1, ro, rd, tG);
  vec3 ng = vec3(0.0, 0.0, 1.0);
  vec3 shift = vec3(0.0);
  if (hG) {
    ng = normalMode(1, ro + rd * tG);
    shift = vec3(-ng.x, -ng.y, 0.0) * 0.09;
  }

  vec3 col = bgColor(uv, world);

  // Clear liquid tints the background inside the bottle.
  float inside = step(abs(world.x), bottleR(world.y)) * step(abs(world.y), 1.2);
  col *= mix(vec3(1.0), vec3(1.0, 0.84, 0.66), inside * 0.7);

  float tW = 0.0;
  if (march(0, ro + shift, rd, tW)) {
    col = waxShade(ro + shift + rd * tW, rd);
  }

  if (hG) {
    col = glassOverlay(col, rd, ng);
  }

  float tH = 0.0;
  if (march(2, ro, rd, tH)) {
    col = metalShade(ro + rd * tH, rd);
  }

  col *= EXPOSURE;
  col = col / (1.0 + col);
  col = pow(clamp(col, 0.0, 1.0), vec3(1.0 / 2.2));
  outColor = vec4(col, 1.0);
}
`;

// ---------------------------------------------------------------------------
// WebGL setup
// ---------------------------------------------------------------------------
const canvas = document.createElement('canvas');
document.body.appendChild(canvas);

const gl = canvas.getContext('webgl2', {
  antialias: false,
  alpha: false,
  depth: false,
  stencil: false,
  preserveDrawingBuffer: true,
});

let prog = null;
let vao = null;
let U = {};
let blobData = new Float32Array(MAX_BLOBS * 4);

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(sh);
    gl.deleteShader(sh);
    throw new Error('shader compile failed: ' + log);
  }
  return sh;
}

if (gl) {
  const vs = compile(gl.VERTEX_SHADER, VERT);
  const fs = compile(gl.FRAGMENT_SHADER, FRAG);
  prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error('program link failed: ' + gl.getProgramInfoLog(prog));
  }
  gl.deleteShader(vs);
  gl.deleteShader(fs);
  vao = gl.createVertexArray();
  for (const name of ['uRes', 'uExt', 'uCenter', 'uBlobCount', 'uBlobs', 'uCoreCol', 'uEdgeCol', 'uPoolCol']) {
    U[name] = gl.getUniformLocation(prog, name);
  }
} else {
  console.error('WebGL2 is not available');
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.floor(window.innerWidth * dpr));
  const h = Math.max(1, Math.floor(window.innerHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  if (gl) gl.viewport(0, 0, w, h);
}

function draw() {
  if (!gl || !prog || destroyed) return;
  resize();
  const w = canvas.width;
  const h = canvas.height;
  // Fit the lamp bounds inside the central 80% of both dimensions.
  const aspect = w / h;
  const ext = Math.max(2.0, 0.8 / aspect);
  const pal = PALETTES[state.paletteIndex];

  blobData.fill(0);
  const n = Math.min(sim.blobs.length, MAX_BLOBS);
  for (let i = 0; i < n; i++) {
    const b = sim.blobs[i];
    blobData[i * 4] = b.x;
    blobData[i * 4 + 1] = b.y;
    blobData[i * 4 + 2] = 0;
    blobData[i * 4 + 3] = b.rDraw !== undefined ? b.rDraw : b.r0;
  }

  gl.useProgram(prog);
  gl.uniform2f(U.uRes, w, h);
  gl.uniform1f(U.uExt, ext);
  gl.uniform3f(U.uCenter, 0, CENTER_Y, 0);
  gl.uniform1i(U.uBlobCount, n);
  gl.uniform4fv(U.uBlobs, blobData);
  gl.uniform3fv(U.uCoreCol, pal.core);
  gl.uniform3fv(U.uEdgeCol, pal.edge);
  gl.uniform3fv(U.uPoolCol, pal.pool);
  gl.bindVertexArray(vao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ---------------------------------------------------------------------------
// Loop and benchmark replay API
// ---------------------------------------------------------------------------
let destroyed = false;
let rafId = 0;
let lastTime = 0;
let acc = 0;

function frame(now) {
  if (destroyed) return;
  const dtReal = lastTime ? Math.min((now - lastTime) / 1000, 0.1) : 0;
  lastTime = now;
  acc += dtReal;
  while (acc >= DT) {
    stepSim(sim, DT);
    acc -= DT;
  }
  draw();
  rafId = requestAnimationFrame(frame);
}

function onResize() { draw(); }

function onContextLost(e) { e.preventDefault(); }

function getState() {
  return { heat: state.heat, paletteIndex: state.paletteIndex };
}

function reset(seed) {
  const s = seed === undefined ? 1 : Math.floor(Number(seed));
  state.heat = HEAT;
  state.paletteIndex = 0;
  sim = newSim(Number.isFinite(s) ? s : 1);
  for (let i = 0; i < PREWARM_STEPS; i++) stepSim(sim, DT);
  // The epoch restarts after prewarm, so the same seed gives the same scene at elapsed 0.
  sim.elapsed = 0;
  sim.substeps = 0;
  acc = 0;
  lastTime = 0;
  draw();
}

// Deterministic fixed-step advance for replays; does not depend on wall-clock time.
function advance(seconds) {
  const steps = Math.max(0, Math.round(Number(seconds) / DT));
  for (let i = 0; i < steps; i++) stepSim(sim, DT);
  draw();
}

function destroy() {
  if (destroyed) return;
  destroyed = true;
  cancelAnimationFrame(rafId);
  window.removeEventListener('resize', onResize);
  canvas.removeEventListener('webglcontextlost', onContextLost);
  if (gl) {
    if (vao) gl.deleteVertexArray(vao);
    if (prog) gl.deleteProgram(prog);
    const lose = gl.getExtension('WEBGL_lose_context');
    if (lose) lose.loseContext();
  }
  vao = null;
  prog = null;
  canvas.remove();
}

window.BRIDGEBENCH_MANIFEST = MANIFEST;
window.BridgeBench = Object.freeze({
  manifest: MANIFEST,
  getState,
  reset,
  advance,
  destroy,
});

window.addEventListener('resize', onResize);
canvas.addEventListener('webglcontextlost', onContextLost);

reset(1);
rafId = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
