<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photoreal lava lamp studio shot</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0b0a; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec2 aPos;
void main() {
  gl_Position = vec4(aPos, 0.0, 1.0);
}
</script>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;

uniform vec2 uRes;
uniform vec4 uBlobs[7];
out vec4 outColor;

const int MAX_STEPS = 150;
const float IOR = 1.45;

float bottleR(float y) {
  return mix(0.44, 0.26, clamp((y + 1.0) * 0.5, 0.0, 1.0));
}

float smin(float a, float b, float k) {
  float h = max(k - abs(a - b), 0.0) / k;
  return min(a, b) - h * h * k * 0.25;
}

float box2(vec2 w) {
  return length(max(w, 0.0)) + min(max(w.x, w.y), 0.0);
}

// Distance to the two surfaces of the thin glass shell (zero on each surface).
float glassDist(vec3 p) {
  if (abs(p.y) > 1.0) return 1.0;
  return abs(abs(length(p.xz) - bottleR(p.y)) - 0.022);
}

vec3 glassNormal(vec3 p) {
  vec3 n = normalize(vec3(p.x, 0.0, p.z));
  if (length(p.xz) < bottleR(clamp(p.y, -1.0, 1.0))) n = -n;
  return n;
}

// Studio environment: charcoal room, two vertical softboxes, top light, warm heater bounce.
vec3 env(vec3 d) {
  vec3 c = vec3(0.04, 0.036, 0.033);
  c += vec3(0.03, 0.025, 0.02) * smoothstep(-0.5, 0.8, d.y);
  float strips = 1.0 - smoothstep(0.02, 0.09, abs(abs(d.x) - 0.78));
  strips *= smoothstep(-0.3, 0.0, d.z);
  c += vec3(1.25, 1.3, 1.4) * strips;
  c += vec3(0.7, 0.7, 0.72) * smoothstep(0.7, 0.98, d.y);
  c += vec3(1.0, 0.42, 0.12) * 0.6 * smoothstep(-0.7, 0.1, -d.y);
  return c;
}

// Wax: smooth union of the blobs in uBlobs, clipped to the inside of the bottle.
float waxField(vec3 p) {
  float d = length(p - uBlobs[0].xyz) - uBlobs[0].w;
  for (int i = 1; i < 7; i++) {
    float di = length(p - uBlobs[i].xyz) - uBlobs[i].w;
    d = smin(d, di, 0.22);
  }
  return d;
}

float waxSDF(vec3 p) {
  float clip = max(length(p.xz) - (bottleR(clamp(p.y, -1.0, 1.0)) - 0.035), abs(p.y) - 0.95);
  return max(waxField(p), clip);
}

// x = distance, y = material id (1 base, 2 cap, 3 wax). Glass is handled separately.
vec2 mapOpaque(vec3 p) {
  float yb = clamp(p.y, -1.4, -1.0);
  float rb = mix(0.52, 0.46, (yb + 1.4) / 0.4);
  float dBase = box2(vec2(length(p.xz) - rb, max(p.y + 1.0, -1.4 - p.y))) - 0.06;

  float dCap = box2(vec2(length(p.xz) - 0.27, max(p.y - 1.22, 0.98 - p.y))) - 0.03;

  vec2 res = vec2(dBase, 1.0);
  if (dCap < res.x) res = vec2(dCap, 2.0);
  float dW = waxSDF(p) * 0.8;
  if (dW < res.x) res = vec2(dW, 3.0);
  return res;
}

vec3 calcNormal(vec3 p) {
  const vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(
    mapOpaque(p + e.xyy).x - mapOpaque(p - e.xyy).x,
    mapOpaque(p + e.yxy).x - mapOpaque(p - e.yxy).x,
    mapOpaque(p + e.yyx).x - mapOpaque(p - e.yyx).x
  ));
}

vec3 shadeOpaque(vec3 p, vec3 rd, float id) {
  vec3 n = calcNormal(p);
  vec3 v = -rd;
  vec3 L1 = normalize(vec3(-0.55, 0.75, 0.55));
  vec3 keyCol = vec3(0.85, 0.92, 1.0);
  vec3 heatPos = vec3(0.0, -1.5, 0.2);
  vec3 Lh = normalize(heatPos - p);
  vec3 heatCol = vec3(1.0, 0.42, 0.12);
  float fr = pow(1.0 - max(dot(n, v), 0.0), 5.0);

  if (id < 2.5) {
    // brushed silver hardware: environment reflection tinted by studio and heater bounce
    vec3 base = vec3(0.72, 0.74, 0.78);
    vec3 col = base * env(reflect(rd, n)) * 0.9 + base * 0.05;
    col += keyCol * max(dot(n, L1), 0.0) * 0.15 * base;
    col += heatCol * 0.25 * max(-n.y, 0.0) * exp(-length(p - heatPos) * 1.2);
    return col;
  }

  // wax: thick cores stay deep red, thin edges let warm light through
  float core = clamp(-waxField(p + rd * 0.18) / 0.18, 0.0, 1.0);
  vec3 thin = vec3(1.0, 0.55, 0.18);
  vec3 thick = vec3(0.55, 0.06, 0.02);
  vec3 albedo = mix(thin, thick, core);
  float wrapK = max((dot(n, L1) + 0.4) / 1.4, 0.0);
  float wrapH = max((dot(n, Lh) + 0.4) / 1.4, 0.0);
  vec3 h = normalize(L1 + v);
  float spec = pow(max(dot(n, h), 0.0), 90.0) * 0.8;
  vec3 col = albedo * (keyCol * wrapK * 0.9 + heatCol * wrapH * 1.2);
  col += albedo * heatCol * (1.0 - core) * 0.35;
  col += keyCol * spec + env(reflect(rd, n)) * fr * 0.25;
  return col;
}

vec3 backdrop(vec3 p, vec3 rd) {
  vec3 c = mix(vec3(0.07, 0.06, 0.055), vec3(0.10, 0.088, 0.078), smoothstep(-1.0, 1.0, rd.y));
  if (rd.y < 0.0) {
    // dark tabletop with a soft heater glow pooled under the lamp
    float tp = (-1.42 - p.y) / rd.y;
    vec3 hp = p + rd * tp;
    float glow = exp(-length(hp.xz) * 2.0);
    c = vec3(0.03, 0.027, 0.025) + vec3(1.0, 0.45, 0.15) * glow * 0.18;
  }
  return c;
}

vec3 trace(vec3 ro, vec3 rd0) {
  vec3 org = ro;
  vec3 rd = rd0;
  vec3 acc = vec3(0.0);
  vec3 thr = vec3(1.0);
  float t = 0.0;
  float lastGlass = -1.0;

  for (int i = 0; i < MAX_STEPS; i++) {
    vec3 p = org + rd * t;
    vec2 o = mapOpaque(p);
    if (o.x < 0.0015) {
      return acc + thr * shadeOpaque(p, rd, o.y);
    }
    if (p.y < -1.42 || t > 12.0) break;

    float gd = glassDist(p);
    if (gd < 0.0015 && t - lastGlass > 0.02) {
      // crossing a glass surface: Fresnel reflection, then refraction through the wall
      lastGlass = 0.0;
      vec3 n = glassNormal(p);
      float cosI = dot(rd, n);
      float F = 0.04 + 0.96 * pow(1.0 - abs(cosI), 5.0);
      acc += thr * F * env(reflect(rd, n));
      thr *= (1.0 - F) * vec3(0.97, 0.99, 1.0);
      float eta = 1.0 / IOR;
      if (cosI > 0.0) {
        n = -n;
        eta = IOR;
      }
      vec3 nr = refract(rd, n, eta);
      rd = length(nr) > 0.0 ? normalize(nr) : reflect(rd, n);
      org = p;
      t = 0.006;
      continue;
    }

    t += min(o.x, gd) * 0.75 + 0.001;
  }

  vec3 pe = org + rd * t;
  return acc + thr * backdrop(pe, rd);
}

void main() {
  vec2 uv = (2.0 * gl_FragCoord.xy - uRes) / min(uRes.x, uRes.y);
  // fixed product-shot camera: lamp spans about 74% of the shorter viewport side
  vec3 ro = vec3(0.0, -0.075, 6.0);
  vec3 rd = normalize(vec3(uv * 0.3, -1.0));

  vec3 col = trace(ro, rd);

  float vig = smoothstep(1.6, 0.35, length(uv) * 0.9);
  col *= mix(0.55, 1.0, vig);
  col = col / (1.0 + col);
  col = pow(col, vec3(1.0 / 2.2));
  outColor = vec4(col, 1.0);
}
</script>
<script>
(function () {
  'use strict';

  var HEAT = 0.65;
  var PALETTE_INDEX = 0;          // Ember
  var PREWARM_SECONDS = 14.0;     // first frame is already warm and in motion
  var STEP_SECONDS = 1 / 60;      // fixed simulation step
  var MAX_STEPS_PER_FRAME = 4;
  var BLOB_COUNT = 7;             // blob 0 is the pool, 1..6 are rising forms
  var DEFAULT_SEED = 1;

  var manifest = {
    id: 'lava-lamp',
    title: 'Photoreal ray-marched lava lamp studio shot',
    controls: [],
    autoplay: true
  };

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function fract(x) { return x - Math.floor(x); }

  function bottleRadius(y) {
    var k = Math.min(1, Math.max(0, (y + 1) * 0.5));
    return 0.44 + (0.26 - 0.44) * k;
  }

  function makeParams(seed) {
    var rnd = mulberry32(seed >>> 0);
    var blobs = [];
    for (var i = 0; i < BLOB_COUNT - 1; i++) {
      blobs.push({
        phase: rnd(),
        rate: 0.04 + rnd() * 0.045,
        radius: 0.10 + rnd() * 0.09,
        wob: rnd() * Math.PI * 2,
        pulse: 0.6 + rnd() * 0.7,
        sway: 0.4 + rnd() * 0.5
      });
    }
    return blobs;
  }

  // Deterministic blob positions for a given simulation time (seconds).
  function fillBlobUniform(params, simT, out) {
    out[0] = 0.0;
    out[1] = -0.80 + 0.03 * Math.sin(simT * 0.4);
    out[2] = 0.0;
    out[3] = 0.30 + 0.02 * Math.sin(simT * 0.7);
    for (var i = 0; i < params.length; i++) {
      var b = params[i];
      var u = fract(b.phase + simT * b.rate * (0.8 + 0.4 * HEAT));
      var y = -0.68 + 1.30 * (0.5 - 0.5 * Math.cos(2 * Math.PI * u));
      var r = b.radius * (0.85 + 0.2 * Math.sin(simT * b.pulse + b.wob));
      var room = Math.max(0, bottleRadius(y) - 0.04 - r);
      var ang = b.wob + simT * 0.15 * b.sway;
      var o = 4 + i * 4;
      out[o] = Math.cos(ang) * room * 0.85;
      out[o + 1] = y;
      out[o + 2] = Math.sin(ang * 0.7 + b.wob) * room * 0.85;
      out[o + 3] = r;
    }
  }

  var canvas = document.createElement('canvas');
  document.body.appendChild(canvas);
  var gl = canvas.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: true });

  var program = null, vbo = null, uResLoc = null, uBlobsLoc = null;
  var rafId = 0;
  var destroyed = false;

  var state = { heat: HEAT, paletteIndex: PALETTE_INDEX };
  var params = makeParams(DEFAULT_SEED);
  var steps = 0;
  var accumulator = 0;
  var lastTs = null;
  var blobData = new Float32Array(28);

  function compile(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(sh));
    }
    return sh;
  }

  function setupGL() {
    if (!gl) {
      console.error('WebGL 2 is not available.');
      return;
    }
    var vs = compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent);
    var fs = compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent);
    program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.error(gl.getProgramInfoLog(program));
    }
    gl.deleteShader(vs);
    gl.deleteShader(fs);

    vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    var aPos = gl.getAttribLocation(program, 'aPos');
    gl.useProgram(program);
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

    uResLoc = gl.getUniformLocation(program, 'uRes');
    uBlobsLoc = gl.getUniformLocation(program, 'uBlobs[0]');
  }

  function renderFrame() {
    if (destroyed || !gl || !program) return;
    var simT = PREWARM_SECONDS + steps * STEP_SECONDS;
    fillBlobUniform(params, simT, blobData);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(program);
    gl.uniform2f(uResLoc, canvas.width, canvas.height);
    gl.uniform4fv(uBlobsLoc, blobData);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function resize() {
    if (destroyed) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.round(window.innerWidth * dpr));
    var h = Math.max(1, Math.round(window.innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    renderFrame();
  }

  function frame(ts) {
    if (destroyed) return;
    if (lastTs === null) lastTs = ts;
    accumulator += Math.min(0.1, (ts - lastTs) / 1000);
    lastTs = ts;
    var n = 0;
    while (accumulator >= STEP_SECONDS && n < MAX_STEPS_PER_FRAME) {
      steps++;
      accumulator -= STEP_SECONDS;
      n++;
    }
    if (n === MAX_STEPS_PER_FRAME) accumulator = 0;
    renderFrame();
    rafId = requestAnimationFrame(frame);
  }

  function getState() {
    return { heat: state.heat, paletteIndex: state.paletteIndex };
  }

  function reset(seed) {
    var n = Number(seed);
    var s = Number.isFinite(n) ? (n >>> 0) : 0;
    params = makeParams(s);
    state = { heat: HEAT, paletteIndex: PALETTE_INDEX };
    steps = 0;
    accumulator = 0;
    lastTs = null;
    renderFrame();
  }

  function destroy() {
    if (destroyed) return;
    destroyed = true;
    cancelAnimationFrame(rafId);
    window.removeEventListener('resize', resize);
    if (gl) {
      if (vbo) gl.deleteBuffer(vbo);
      if (program) gl.deleteProgram(program);
      var ext = gl.getExtension('WEBGL_lose_context');
      if (ext) ext.loseContext();
    }
    vbo = null;
    program = null;
  }

  document.documentElement.style.background = '#0d0b0a';
  setupGL();
  window.addEventListener('resize', resize);
  resize();
  reset(DEFAULT_SEED);
  rafId = requestAnimationFrame(frame);

  window.BridgeBench = {
    manifest: manifest,
    getState: getState,
    reset: reset,
    destroy: destroy
  };
})();
</script>
</body>
</html>
