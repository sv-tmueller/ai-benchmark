<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lava Lamp</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0e0c0b; }
  canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="application/json" id="bench-manifest">
{
  "id": "lava-lamp",
  "name": "Lava Lamp",
  "version": 1,
  "controls": [],
  "api": ["reset", "getState", "destroy"],
  "config": { "heat": 0.65, "paletteIndex": 0, "palette": "Ember" }
}
</script>
<script id="vs" type="x-shader/x-vertex">#version 300 es
void main() {
  vec2 v = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(v * 2.0 - 1.0, 0.0, 1.0);
}
</script>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uT;
uniform float uHeat;
uniform vec4 uA[8];
uniform vec4 uB[8];
out vec4 outColor;

const float PI = 3.14159265;
float uPx;
vec4 gB[8];   // xyz centre, w radius
float gS[8];  // vertical stretch

float hash1(float n) { return fract(sin(n * 127.1) * 43758.5453); }
float noise1(float x) {
  float i = floor(x), f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(hash1(i), hash1(i + 1.0), f);
}

// ---------- profiles ----------
float rBottle(float y) {
  float s = clamp((y + 0.58) / 1.28, 0.0, 1.0);
  return mix(0.205, 0.092, pow(s, 0.85));
}
float rBase(float y) {
  float t = clamp((y + 1.0) / 0.42, 0.0, 1.0);
  float R = mix(0.37, 0.236, pow(t, 0.75));
  R += 0.010 * exp(-pow((t - 0.93) / 0.045, 2.0));
  R -= 0.012 * exp(-pow((t - 0.55) / 0.03, 2.0));
  float b = clamp(t / 0.08, 0.0, 1.0);
  R *= sqrt(1.0 - (1.0 - b) * (1.0 - b));
  return R;
}
float rCap(float y) {
  float t = clamp((y - 0.70) / 0.30, 0.0, 1.0);
  float R = 0.128 * sqrt(max(1.0 - pow(t, 2.2), 0.0));
  R -= 0.008 * exp(-pow((t - 0.22) / 0.035, 2.0));
  return max(R, 0.0);
}
float prof(int part, float y) {
  return part == 0 ? rBase(y) : (part == 1 ? rBottle(y) : rCap(y));
}
float profSlope(int part, float y) {
  float e = 1e-3;
  return clamp((prof(part, y + e) - prof(part, y - e)) / (2.0 * e), -8.0, 8.0);
}

// ---------- wax ----------
float smin(float a, float b, float k) {
  float h = max(k - abs(a - b), 0.0) / k;
  return min(a, b) - h * h * k * 0.25;
}

void setupBlobs() {
  float sp = uHeat / 0.65;
  for (int i = 0; i < 8; i++) {
    vec4 a = uA[i], b = uB[i];
    float u = fract(uT * a.y * sp + a.x);
    float y01 = smoothstep(0.0, 0.55, u) * (1.0 - smoothstep(0.6, 1.0, u));
    float rad = a.z * (1.0 - 0.35 * y01);
    float cy = mix(-0.40, 0.56, y01);
    float ri = rBottle(cy) - 0.014;
    float amp = max(ri - rad * 0.95, 0.0) * b.x;
    float ang = 6.2831853 * (uT * b.z + b.w);
    vec2 xz = vec2(sin(ang), cos(ang * 0.8 + 1.3)) * amp;
    gB[i] = vec4(xz.x, cy, xz.y, rad);
    gS[i] = 1.0 + b.y * sin(PI * y01);
  }
}

float map(vec3 p) {
  float d = p.y - (-0.50 + 0.012 * sin(p.x * 18.0 + uT * 0.4) + 0.010 * sin(p.z * 23.0 - uT * 0.3));
  for (int i = 0; i < 8; i++) {
    vec3 q = p - gB[i].xyz;
    float s = (length(vec3(q.x, q.y / gS[i], q.z)) - gB[i].w) * 0.82;
    d = smin(d, s, 0.11);
  }
  d = max(d, length(p.xz) - (rBottle(p.y) - 0.014));
  d = max(d, -(p.y + 0.575));
  return d;
}

vec3 calcN(vec3 p) {
  vec2 e = vec2(1.0, -1.0) * 0.003;
  return normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx) +
                   e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx));
}

// ---------- lighting ----------
float glowY(float y) {
  return exp(-abs(y + 0.58) * (y > -0.58 ? 2.0 : 5.0));
}

vec3 env(vec3 r, float boost) {
  float vy = smoothstep(-0.55, -0.15, r.y) * (1.0 - smoothstep(0.65, 0.95, r.y));
  float w = 0.025;
  float fr = smoothstep(-0.2, 0.3, r.z);
  float s1 = smoothstep(0.46 - w, 0.46 + w, r.x) * (1.0 - smoothstep(0.60 - w, 0.60 + w, r.x));
  float s2 = smoothstep(-0.74 - w, -0.74 + w, r.x) * (1.0 - smoothstep(-0.68 - w, -0.68 + w, r.x));
  float s3 = smoothstep(-0.10 - w, -0.10 + w, r.x) * (1.0 - smoothstep(-0.075 - w, -0.075 + w, r.x));
  vec3 cool = vec3(0.70, 0.82, 1.0);
  vec3 c = vec3(0.045, 0.040, 0.037);
  c += cool * (s1 * 3.0 + s2 * 1.8 + s3 * 0.9) * vy * fr * boost;
  c += cool * smoothstep(0.7, 1.0, r.y) * 1.1;
  c += vec3(0.9, 0.38, 0.12) * smoothstep(0.2, -0.9, r.y) * 0.8;
  return c;
}

vec3 backdrop(vec2 p) {
  vec3 wall = vec3(0.095, 0.080, 0.070);
  vec2 q = p * vec2(0.9, 0.55);
  wall *= 0.55 + 0.9 * exp(-dot(q, q) * 1.3);
  wall += vec3(0.07, 0.03, 0.01) * exp(-pow(p.x * 1.6, 2.0) - pow((p.y + 0.4) * 0.9, 2.0));
  vec3 table = vec3(0.028, 0.023, 0.020) +
               vec3(0.03, 0.012, 0.004) * exp(-p.x * p.x * 2.0 - pow(p.y + 1.0, 2.0) * 10.0);
  float m = smoothstep(-0.74, -0.70, p.y);
  vec3 c = mix(table, wall, m);
  c *= 1.0 - 0.8 * exp(-pow(p.x / 0.45, 2.0) - pow((p.y + 1.0) / 0.05, 2.0));
  c += vec3(1.0, 0.4, 0.12) * 0.22 * exp(-pow(p.x / 0.55, 2.0) - pow((p.y + 1.04) / 0.09, 2.0)) * (1.0 - m);
  return c;
}

vec3 metal(vec2 p, float R, float Rp, int part) {
  float z = sqrt(max(R * R - p.x * p.x, 0.0));
  vec3 n = normalize(vec3(p.x, -R * Rp, max(z, 1e-3)));
  vec3 r = reflect(vec3(0.0, 0.0, -1.0), n);
  float streak = noise1(p.y * 380.0) - 0.5;
  r.x += streak * 0.06;
  r.y += streak * 0.02;
  vec3 e = env(normalize(r), 1.0);
  vec3 base = vec3(0.80, 0.82, 0.86);
  float F = 0.55 + 0.45 * pow(1.0 - n.z, 3.0);
  vec3 col = base * e * F;
  vec3 warm = vec3(1.0, 0.45, 0.14);
  if (part == 0) col += warm * glowY(p.y) * 0.5 * smoothstep(-0.4, 0.8, n.y + 0.3);
  if (part == 2) col += warm * 0.25 * (1.0 - n.y) * 0.6;
  col += base * vec3(0.06, 0.055, 0.05) * (0.4 + 0.6 * n.z);
  return col;
}

vec3 bottle(vec2 p, float R) {
  float rp = profSlope(1, p.y);
  float z0 = sqrt(max(R * R - p.x * p.x, 0.0));
  vec3 n = normalize(vec3(p.x, -R * rp, max(z0, 1e-3)));
  vec3 d = refract(vec3(0.0, 0.0, -1.0), n, 1.0 / 1.38);
  vec3 P = vec3(p.x, p.y, z0);
  float t = 0.0;
  bool hit = false;
  vec3 q = P;
  for (int i = 0; i < 56; i++) {
    q = P + d * t;
    if (t > 0.02 && (length(q.xz) > rBottle(q.y) + 0.001 || q.y < -0.585 || q.y > 0.705)) break;
    float s = map(q);
    if (s < 0.0015) { hit = true; break; }
    t += max(s * 0.75, 0.004);
    if (t > 0.7) break;
  }
  vec3 col;
  float nz = n.z;
  if (hit) {
    vec3 nn = calcN(q);
    float L = 0.0;
    vec3 pp = q + d * 0.01;
    for (int i = 0; i < 5; i++) {
      float s = map(pp);
      if (s > 0.0) break;
      float st = max(-s * 0.9, 0.01);
      L += st;
      pp += d * st;
    }
    float thick = 1.0 - exp(-L * 14.0);
    float hy = smoothstep(-0.5, 0.45, q.y);
    vec3 thin = mix(vec3(1.0, 0.62, 0.16), vec3(1.0, 0.42, 0.10), hy);
    vec3 core = mix(vec3(0.95, 0.22, 0.03), vec3(0.50, 0.045, 0.02), hy);
    vec3 w = mix(thin, core, thick);
    float heater = 0.35 + 1.2 * exp(-(q.y + 0.55) * 2.0);
    float diff = 0.45 + 0.55 * clamp(0.5 - nn.y * 0.6, 0.0, 1.0);
    float emis = (1.0 - thick) * 0.8;
    col = w * (diff * heater + emis * 0.9);
    vec3 hv = normalize(vec3(0.5, 0.5, 0.8));
    col += vec3(1.0, 0.85, 0.7) * pow(max(dot(nn, hv), 0.0), 60.0) * 0.5;
    col += vec3(1.0, 0.9, 0.8) * pow(max(dot(nn, normalize(vec3(-0.4, 0.6, 0.7))), 0.0), 90.0) * 0.25;
  } else {
    vec3 bg = backdrop(q.xy);
    col = bg * exp(-t * vec3(0.5, 1.1, 2.2));
    col += vec3(0.9, 0.38, 0.10) * 0.12 * glowY(q.y) * (1.0 - exp(-t * 2.0));
    col += vec3(0.9, 0.38, 0.10) * 0.05 * glowY(p.y);
  }
  // glass layer
  vec3 r = reflect(vec3(0.0, 0.0, -1.0), n);
  float Fg = 0.10 + 0.9 * pow(1.0 - nz, 4.0);
  col = col * (1.0 - Fg * 0.6) * mix(1.0, 0.6, pow(1.0 - nz, 3.0));
  col += env(normalize(r), 3.5 / 3.0 * 1.0) * Fg * 1.0;
  return col;
}

vec3 lamp(vec2 p, out float a) {
  a = 0.0;
  int part;
  float R;
  if (p.y < -0.58) {
    if (p.y < -1.0) return vec3(0.0);
    part = 0; R = rBase(p.y);
  } else if (p.y < 0.70) {
    part = 1; R = rBottle(p.y);
  } else {
    if (p.y > 1.0) return vec3(0.0);
    part = 2; R = rCap(p.y);
  }
  if (abs(p.x) > R + uPx) return vec3(0.0);
  a = clamp((R - abs(p.x)) / uPx + 0.5, 0.0, 1.0);
  if (part == 1) return bottle(p, R);
  return metal(p, R, profSlope(part, p.y), part);
}

vec3 aces(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

void main() {
  vec2 fc = gl_FragCoord.xy - 0.5 * uRes;
  float sc = min(uRes.y * 0.76 / 2.0, uRes.x * 0.76 / 0.74);
  uPx = 1.0 / sc;
  vec2 p = fc / sc;
  setupBlobs();
  vec3 col = backdrop(p);
  if (p.y < -1.0) {
    float am;
    vec3 Lm = lamp(vec2(p.x, -2.0 - p.y), am);
    float f = exp((p.y + 1.0) * 3.0) * 0.35;
    col = mix(col, Lm * 0.6 + col * 0.5, am * f);
  }
  float a;
  vec3 L = lamp(p, a);
  col = mix(col, L, a);
  col = aces(col * 1.25);
  vec2 v = gl_FragCoord.xy / uRes - 0.5;
  col *= 1.0 - 0.35 * dot(v, v);
  col = pow(col, vec3(1.0 / 2.2));
  col += (hash1(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) - 0.5) / 255.0;
  outColor = vec4(col, 1.0);
}
</script>
<script>
(function () {
  'use strict';
  var HEAT = 0.65, PALETTE = 0;
  var canvas = document.getElementById('c');
  var gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  var manifest = JSON.parse(document.getElementById('bench-manifest').textContent);
  var N = 8;
  var uA = new Float32Array(N * 4), uB = new Float32Array(N * 4);
  var simT = 0, acc = 0, lastTs = null, raf = 0, destroyed = false, seedUsed = 1;
  var STEP = 1 / 60;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function generate(seed) {
    var r = mulberry32((seed | 0) ^ 0x9e3779b9);
    var order = [], i, j, tmp;
    for (i = 0; i < N; i++) order.push(i);
    for (i = N - 1; i > 0; i--) { j = Math.floor(r() * (i + 1)); tmp = order[i]; order[i] = order[j]; order[j] = tmp; }
    var radii = [0.105, 0.085, 0.07, 0.06, 0.052, 0.09, 0.045, 0.075];
    for (i = 0; i < N; i++) {
      var phase = (order[i] + 0.15 + 0.7 * r()) / N;
      var freq = 0.022 + 0.016 * r();
      var rad = radii[i] * (0.9 + 0.2 * r());
      var o = i * 4;
      uA[o] = phase % 1; uA[o + 1] = freq; uA[o + 2] = rad; uA[o + 3] = 0;
      uB[o] = 0.6 + 0.4 * r(); uB[o + 1] = 0.4 + 0.5 * r();
      uB[o + 2] = 0.02 + 0.03 * r(); uB[o + 3] = r();
    }
    // guarantee a bridge: blob 1 trails blob 0 closely
    uA[4] = (uA[0] + 0.04) % 1; uA[5] = uA[1]; uA[6] = Math.min(uA[6], 0.075);
  }

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src.trim());
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  var vsH = compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent);
  var fsH = compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent);
  var prog = gl.createProgram();
  gl.attachShader(prog, vsH); gl.attachShader(prog, fsH);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  var vao = gl.createVertexArray();
  var loc = {
    res: gl.getUniformLocation(prog, 'uRes'),
    t: gl.getUniformLocation(prog, 'uT'),
    heat: gl.getUniformLocation(prog, 'uHeat'),
    a: gl.getUniformLocation(prog, 'uA'),
    b: gl.getUniformLocation(prog, 'uB')
  };

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.round(window.innerWidth * dpr));
    var h = Math.max(1, Math.round(window.innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, w, h);
  }

  function draw() {
    if (destroyed) return;
    gl.useProgram(prog);
    gl.bindVertexArray(vao);
    gl.uniform2f(loc.res, canvas.width, canvas.height);
    gl.uniform1f(loc.t, simT);
    gl.uniform1f(loc.heat, HEAT);
    gl.uniform4fv(loc.a, uA);
    gl.uniform4fv(loc.b, uB);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function advance(seconds) {
    acc += seconds;
    while (acc >= STEP) { simT += STEP; acc -= STEP; }
  }

  function frame(ts) {
    if (destroyed) return;
    if (lastTs !== null) advance(Math.min((ts - lastTs) / 1000, 0.1));
    lastTs = ts;
    draw();
    raf = requestAnimationFrame(frame);
  }

  function onResize() { resize(); draw(); }
  window.addEventListener('resize', onResize);

  function reset(seed) {
    if (destroyed) return;
    seed = (seed === undefined || seed === null || isNaN(Number(seed))) ? 1 : Number(seed);
    seedUsed = seed;
    HEAT = 0.65; PALETTE = 0;
    generate(seed);
    simT = 0; acc = 0; lastTs = null;
    resize();
    draw();
  }

  function getState() { return { heat: HEAT, paletteIndex: PALETTE }; }

  function destroy() {
    if (destroyed) return;
    destroyed = true;
    cancelAnimationFrame(raf);
    window.removeEventListener('resize', onResize);
    gl.deleteProgram(prog);
    gl.deleteShader(vsH);
    gl.deleteShader(fsH);
    gl.deleteVertexArray(vao);
    var ext = gl.getExtension('WEBGL_lose_context');
    if (ext) ext.loseContext();
  }

  var api = {
    manifest: manifest,
    reset: reset,
    getState: getState,
    destroy: destroy,
    step: function (ms) { advance(ms / 1000); draw(); },
    advance: function (ms) { advance(ms / 1000); draw(); }
  };
  window.benchmark = api;
  window.__benchManifest = manifest;
  window.__bridgebench = api;

  reset(1);
  raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
