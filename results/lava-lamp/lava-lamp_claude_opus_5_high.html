<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lava Lamp</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #14100e;
  }
  body { -webkit-tap-highlight-color: transparent; }
  canvas#stage {
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #14100e;
    touch-action: none;
    user-select: none;
    outline: none;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  "use strict";

  /* ----------------------------------------------------------------------
     Fixed configuration. No controls, visible or hidden.
     ---------------------------------------------------------------------- */
  const HEAT = 0.65;          // fixed heat
  const PALETTE_INDEX = 0;    // 0 = Ember
  const DEFAULT_SEED = 20260411;

  const NB = 10;              // wax masses above the pool
  const SUBSTEP = 1 / 120;    // fixed simulation substep (seconds)
  const MAX_SUBSTEPS = 48;
  const SCENE_PIXEL_BUDGET = 1.9e6;
  const CANVAS_PIXEL_BUDGET = 2.9e6;

  // Lamp bounds in world units (base foot .. cap crown).
  const CENTER_Y = 0.011;
  const HALF_H = 1.011 * 1.075;
  const HALF_W = 0.415 * 1.07;
  const CAM_D = 6.2;

  const POOL_SURFACE = -0.517;
  const Y_BOT = -0.545;

  /* ----------------------------------------------------------------------
     Shaders
     ---------------------------------------------------------------------- */

  const VERT = `#version 300 es
void main() {
  vec2 p = vec2((gl_VertexID == 1) ? 3.0 : -1.0, (gl_VertexID == 2) ? 3.0 : -1.0);
  gl_Position = vec4(p, 0.0, 1.0);
}`;

  const SCENE_FS = `#version 300 es
precision highp float;

#define NB ${NB}

out vec4 outColor;

uniform vec2  uRes;
uniform float uTanHalf;
uniform float uEncode;
uniform float uHeat;
uniform float uTime;
uniform vec4  uBlob[NB];   // xyz = centre, w = horizontal radius
uniform vec4  uBlobS[NB];  // x = vertical radius, y = tether amount, z = tether radius
uniform vec4  uPool;       // x = centre y, y = radius, z = half height, w = round

const float PI       = 3.14159265359;
const float TABLE_Y  = -1.0;
const vec3  BSC      = vec3(0.0, 0.011, 0.0);
const float BSR      = 1.16;

const vec3  LK_DIR = vec3(0.4874, 0.4100, -0.7705);  // cool key, upper left-rear
const vec3  LF_DIR = vec3(-0.6836, 0.3300, -0.6512); // cool fill
const vec3  LK_COL = vec3(0.80, 0.86, 1.00);
const vec3  LF_COL = vec3(0.64, 0.72, 0.92);
const vec3  WARM   = vec3(1.00, 0.34, 0.075);
const vec3  AMBER  = vec3(1.00, 0.56, 0.17);

/* ---------- helpers ---------- */
float dot2(vec2 v) { return dot(v, v); }

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

vec3 rotY(vec3 v, float a) {
  float s = sin(a), c = cos(a);
  return vec3(c * v.x + s * v.z, v.y, -s * v.x + c * v.z);
}

vec2 sphereInt(vec3 ro, vec3 rd, vec3 ce, float ra) {
  vec3 oc = ro - ce;
  float b = dot(oc, rd);
  float c = dot(oc, oc) - ra * ra;
  float h = b * b - c;
  if (h < 0.0) return vec2(-1.0, -1.0);
  h = sqrt(h);
  return vec2(-b - h, -b + h);
}

float sdSphere(vec3 p, float r) { return length(p) - r; }

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / max(k1, 1e-5);
}

float sdTorusY(vec3 p, float R, float r) {
  vec2 q = vec2(length(p.xz) - R, p.y);
  return length(q) - r;
}

float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
  vec3 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
  return length(pa - ba * h) - r;
}

float sdCone(vec3 p, float h, float r1, float r2) {
  vec2 q = vec2(length(p.xz), p.y);
  vec2 k1 = vec2(r2, h);
  vec2 k2 = vec2(r2 - r1, 2.0 * h);
  vec2 ca = vec2(q.x - min(q.x, (q.y < 0.0) ? r1 : r2), abs(q.y) - h);
  vec2 cb = q - k1 + k2 * clamp(dot(k1 - q, k2) / dot2(k2), 0.0, 1.0);
  float s = (cb.x < 0.0 && ca.y < 0.0) ? -1.0 : 1.0;
  return s * sqrt(min(dot2(ca), dot2(cb)));
}

float coneSeg(vec3 p, float y0, float y1, float r0, float r1) {
  return sdCone(p - vec3(0.0, (y0 + y1) * 0.5, 0.0), (y1 - y0) * 0.5, r0, r1);
}

float sdCylRound(vec3 p, float cy, float R, float hy, float rr) {
  vec2 d = vec2(length(p.xz) - R, abs(p.y - cy) - hy);
  return min(max(d.x, d.y), 0.0) + length(max(d, vec2(0.0))) - rr;
}

/* ---------- studio environment ---------- */
float softbox(float az, float y, float caz, float w, float hh, float cy) {
  float a = abs(mod(az - caz + PI, 2.0 * PI) - PI);
  float fa = smoothstep(w, w * 0.22, a);
  float fy = smoothstep(hh, hh * 0.40, abs(y - cy));
  return fa * fy;
}

vec3 envColor(vec3 rd) {
  float y = rd.y;
  vec3 col = mix(vec3(0.0150, 0.0136, 0.0130), vec3(0.0520, 0.0485, 0.0470),
                 smoothstep(-0.85, 0.90, y));
  col *= mix(0.52, 1.0, smoothstep(-0.55, 0.12, y));
  float az = atan(rd.x, rd.z);

  // thin vertical softbox strips
  float s1 = softbox(az, y,  2.55, 0.105, 0.95, 0.14);
  float s2 = softbox(az, y, -2.28, 0.076, 0.86, 0.10);
  float s3 = softbox(az, y,  0.96, 0.050, 0.66, 0.18);
  col += vec3(0.84, 0.90, 1.00) * s1 * 3.55;
  col += vec3(0.68, 0.77, 0.96) * s2 * 2.05;
  col += vec3(0.74, 0.80, 0.96) * s3 * 1.05;

  // warm heater bounce from the tabletop
  col += WARM * 0.17 * uHeat * smoothstep(0.30, -0.80, y);
  return col;
}

/* ---------- lamp hardware & glass ---------- */
float sdCavity(vec3 p) {
  return coneSeg(p, -0.662, 0.830, 0.268, 0.140) - 0.006;
}

float cavRadius(float y) {
  return mix(0.274, 0.146, clamp((y + 0.668) / 1.504, 0.0, 1.0));
}

float sdGlass(vec3 p) {
  float o = coneSeg(p, -0.700, 0.860, 0.287, 0.157) - 0.008;
  return max(o, -sdCavity(p));
}

float sdBase(vec3 p) {
  float d = coneSeg(p, -1.000, -0.886, 0.405, 0.338) - 0.010;
  d = smin(d, coneSeg(p, -0.900, -0.716, 0.342, 0.226) - 0.007, 0.040);
  d = smin(d, coneSeg(p, -0.724, -0.596, 0.221, 0.206) - 0.006, 0.030);
  d = max(d, -sdTorusY(p - vec3(0.0, -0.872, 0.0), 0.352, 0.012));
  d = max(d, -sdTorusY(p - vec3(0.0, -0.730, 0.0), 0.232, 0.010));
  return d;
}

float sdCap(vec3 p) {
  float d = coneSeg(p, 0.836, 0.930, 0.166, 0.120) - 0.006;
  d = smin(d, sdSphere(p - vec3(0.0, 0.918, 0.0), 0.104), 0.035);
  d = max(d, -sdTorusY(p - vec3(0.0, 0.858, 0.0), 0.172, 0.008));
  return d;
}

float mapObjects(vec3 p, out int id) {
  float d = sdBase(p); id = 2;
  float dc = sdCap(p);   if (dc < d) { d = dc; id = 3; }
  float dg = sdGlass(p); if (dg < d) { d = dg; id = 4; }
  return d;
}

float mapObjectsD(vec3 p) { int id; return mapObjects(p, id); }

vec3 objNormal(vec3 p) {
  const vec2 e = vec2(1.0, -1.0) * 0.0013;
  return normalize(e.xyy * mapObjectsD(p + e.xyy) +
                   e.yyx * mapObjectsD(p + e.yyx) +
                   e.yxy * mapObjectsD(p + e.yxy) +
                   e.xxx * mapObjectsD(p + e.xxx));
}

int castObjects(vec3 ro, vec3 rd, float tmax, out float tOut, int maxSteps) {
  tOut = tmax;
  vec2 bs = sphereInt(ro, rd, BSC, BSR);
  if (bs.y < 0.0 || bs.x > tmax) return 0;
  float t = max(bs.x, 0.0);
  float tend = min(bs.y, tmax);
  int id = 0;
  for (int i = 0; i < maxSteps; i++) {
    vec3 p = ro + rd * t;
    int cid;
    float d = mapObjects(p, cid);
    if (d < 0.0009 * max(1.0, t * 0.5)) { id = cid; break; }
    t += d * 0.92;
    if (t > tend) { id = 0; break; }
  }
  tOut = t;
  return id;
}

/* ---------- wax field ---------- */
float mapWax(vec3 p) {
  float d = sdCylRound(p, uPool.x, uPool.y, uPool.z, uPool.w);
  for (int i = 0; i < NB; i++) {
    vec4 b = uBlob[i];
    vec4 s = uBlobS[i];
    float db = sdEllipsoid(p - b.xyz, vec3(b.w, s.x, b.w));
    d = smin(d, db, 0.058);
    if (s.y > 0.05) {
      vec3 a = vec3(b.x * 0.30, ${POOL_SURFACE.toFixed(3)} - 0.028, b.z * 0.30);
      float dt = sdCapsule(p, a, b.xyz, s.z);
      d = smin(d, dt, 0.045);
    }
  }
  return d;
}

vec3 waxNormal(vec3 p) {
  const vec2 e = vec2(1.0, -1.0) * 0.0014;
  return normalize(e.xyy * mapWax(p + e.xyy) +
                   e.yyx * mapWax(p + e.yyx) +
                   e.yxy * mapWax(p + e.yxy) +
                   e.xxx * mapWax(p + e.xxx));
}

float waxThickness(vec3 p, vec3 rd) {
  float t = 0.0;
  for (int i = 0; i < 24; i++) {
    float d = mapWax(p + rd * t);
    if (d > -0.0006) break;
    t += max(-d * 0.92, 0.009);
    if (t > 0.72) break;
  }
  return min(t, 0.72);
}

vec3 shadeWax(vec3 p, vec3 n, vec3 rd) {
  float th = waxThickness(p + rd * 0.004, rd);

  // how close this point sits to the heater at the foot of the bottle
  float yl = clamp((p.y + 0.66) / 1.32, 0.0, 1.0);
  float heater = pow(max(1.0 - 0.72 * yl, 0.0), 1.6) * (0.45 + 0.85 * uHeat);

  // Beer-Lambert through the wax: thick cores stay deep orange-red,
  // thin edges transmit warm light
  vec3 kAbs = vec3(1.05, 6.10, 14.5) * (1.0 - 0.30 * heater);
  vec3 trans = exp(-kAbs * th);

  float back = clamp(dot(n, vec3(0.0, -1.0, 0.0)) * 0.5 + 0.5, 0.0, 1.0);
  vec3 emit = vec3(1.0, 0.46, 0.105) * (0.78 + 2.55 * heater) * (0.42 + 0.90 * back);

  vec3 body = trans * emit * 1.45;

  // rich saturated core where the wax is thick
  body += vec3(0.46, 0.040, 0.012) * (0.30 + 0.70 * heater) * (1.0 - exp(-th * 4.2));

  // thin-edge transmission
  body += AMBER * exp(-th * 9.5) * 0.52 * (0.34 + 0.66 * heater);

  // shallow subsurface scatter lit by the studio strips
  float sk = max(dot(n, LK_DIR), 0.0);
  float sf = max(dot(n, LF_DIR), 0.0);
  body += vec3(1.0, 0.30, 0.10) * (0.085 + 0.22 * sk + 0.08 * sf) * (0.45 + 0.55 * trans.r);

  // glossy wax surface
  vec3 r = reflect(rd, n);
  float ndv = max(dot(-rd, n), 0.0);
  float F = 0.030 + 0.46 * pow(1.0 - ndv, 5.0);
  vec3 spec = (envColor(r) * 0.55 + envColor(rotY(r, 0.09)) * 0.25 + envColor(rotY(r, -0.09)) * 0.20) * F * 1.15;

  return body + spec;
}

vec3 interiorBackground(vec3 ro, vec3 rd, vec3 pe) {
  vec3 col = envColor(rd) * 0.21;

  // warm glow rising from the heater through the clear liquid
  float ylow = min(ro.y, pe.y);
  float g = exp(-max(ylow + 0.46, 0.0) * 2.35);
  col += WARM * g * (0.34 + 0.52 * uHeat) * 0.62;

  // amber bulb pool at the foot of the bottle
  float db = length((pe - vec3(0.0, -0.648, 0.0)) * vec3(1.0, 2.5, 1.0));
  col += AMBER * exp(-pow(db / 0.27, 2.0)) * 1.55 * uHeat;

  // faint cool spill down the far glass wall
  col += vec3(0.30, 0.34, 0.44) * 0.045 * smoothstep(-0.7, 0.8, pe.y);

  return col * vec3(1.02, 0.99, 0.975);
}

vec3 traceInterior(vec3 ro, vec3 rd, int q) {
  int steps = (q == 1) ? 88 : 34;
  float t = 0.0;
  bool entered = false;
  vec3 p = ro;
  for (int i = 0; i < steps; i++) {
    p = ro + rd * t;
    float din = sdCavity(p);
    if (din < -0.0005) entered = true;
    if (entered && din > 0.004) break;
    float dw = 1.0;
    if (entered) {
      dw = mapWax(p);
      if (dw < 0.0016) {
        vec3 n = waxNormal(p);
        return shadeWax(p, n, rd);
      }
    }
    float st = min(max(dw * 0.85, 0.0018), abs(din) + 0.006);
    t += st;
    if (t > 1.9) break;
  }
  return interiorBackground(ro, rd, p);
}

/* ---------- materials ---------- */
vec3 shadeGlass(vec3 p, vec3 n, vec3 rd, int q) {
  float ndv = max(dot(-rd, n), 0.0);
  float F = clamp(0.042 + 0.958 * pow(1.0 - ndv, 5.0), 0.0, 1.0);
  vec3 refl = envColor(reflect(rd, n));

  vec3 rr = refract(rd, n, 1.0 / 1.36);
  vec3 inner;
  if (dot(rr, rr) < 0.5) {
    inner = refl;
  } else {
    inner = traceInterior(p + normalize(rr) * 0.006, normalize(rr), q);
  }

  float edge = pow(1.0 - ndv, 2.6);
  inner *= mix(vec3(1.0), vec3(0.80, 0.86, 0.90), edge * 0.55);

  return mix(inner, refl, F * 0.92) + refl * 0.055;
}

vec3 shadeMetal(vec3 p, vec3 n, vec3 rd, float rough) {
  vec3 r = reflect(rd, n);
  vec3 e = vec3(0.0);
  float wsum = 0.0;
  for (int i = -2; i <= 2; i++) {
    float fi = float(i);
    float wt = exp(-fi * fi * 0.42);
    e += envColor(rotY(r, fi * rough * 1.45)) * wt;
    wsum += wt;
  }
  e /= wsum;

  // lathe-turned banding: a faint vertical smear on top of the azimuthal blur
  vec3 r2 = normalize(r + vec3(0.0, 0.055 * sin(p.y * 190.0), 0.0));
  e = mix(e, envColor(r2), 0.22);

  vec3 tint = vec3(0.965, 0.953, 0.940);
  float F = 0.60 + 0.40 * pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
  vec3 col = e * tint * F;

  // warm heater bounce picked up by the hardware
  float hb = max(0.0, -n.y) * 0.85 + max(0.0, dot(n, normalize(vec3(0.0, -0.65, 0.76)))) * 0.45;
  float dist = length(p - vec3(0.0, -0.60, 0.0));
  col += WARM * hb * uHeat * 0.62 / (1.0 + 2.1 * dist * dist);

  // cool key glancing off the brushed surface
  float sk = pow(max(dot(normalize(reflect(rd, n)), LK_DIR), 0.0), 36.0);
  col += LK_COL * sk * 0.55;

  col += tint * 0.013;
  return col;
}

vec3 renderNoTable(vec3 ro, vec3 rd) {
  float t;
  int id = castObjects(ro, rd, 12.0, t, 54);
  if (id == 0) return envColor(rd);
  vec3 p = ro + rd * t;
  vec3 n = objNormal(p);
  if (id == 4) return shadeGlass(p, n, rd, 0);
  return shadeMetal(p, n, rd, (id == 2) ? 0.105 : 0.075);
}

vec3 shadeTable(vec3 p, vec3 rd) {
  vec3 n = vec3(0.0, 1.0, 0.0);
  float rr = length(p.xz);

  float occ = 1.0 - 0.95 * exp(-pow(rr * 1.95, 2.2));
  vec3 albedo = vec3(0.0305, 0.0272, 0.0262);

  vec3 dif = albedo * occ * (LK_COL * max(dot(n, LK_DIR), 0.0) * 0.58 +
                             LF_COL * max(dot(n, LF_DIR), 0.0) * 0.34 +
                             vec3(0.052, 0.052, 0.060));

  // heater pool grounding the lamp
  float g1 = exp(-pow(rr / 0.70, 2.0));
  float g2 = exp(-pow(rr / 1.60, 2.0));
  vec3 glow = (WARM * 0.88 * g1 + vec3(1.0, 0.42, 0.13) * 0.15 * g2) * uHeat * occ;

  // soft reflection of the lamp
  vec3 r = reflect(rd, n);
  vec3 ro2 = p + n * 0.004;
  vec3 refl;
  vec2 bs = sphereInt(ro2, r, BSC, BSR);
  if (bs.y > 0.0) refl = renderNoTable(ro2, r);
  else refl = envColor(r);
  float F = 0.026 + 0.44 * pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
  float gloss = exp(-rr * 0.58);

  return dif + glow + refl * F * (0.32 + 0.68 * gloss);
}

vec3 render(vec3 ro, vec3 rd) {
  float tPl = 1e9;
  if (rd.y < -1e-4) {
    float tt = (TABLE_Y - ro.y) / rd.y;
    if (tt > 0.0) tPl = tt;
  }
  float t;
  int id = castObjects(ro, rd, min(tPl, 14.0), t, 108);
  if (id != 0) {
    vec3 p = ro + rd * t;
    vec3 n = objNormal(p);
    if (id == 4) return shadeGlass(p, n, rd, 1);
    return shadeMetal(p, n, rd, (id == 2) ? 0.105 : 0.075);
  }
  if (tPl < 14.0) return shadeTable(ro + rd * tPl, rd);
  return envColor(rd);
}

void main() {
  vec2 q = (2.0 * gl_FragCoord.xy - uRes) / uRes.y;

  vec3 ta = vec3(0.0, ${CENTER_Y.toFixed(4)}, 0.0);
  vec3 ro = vec3(0.0, ${(CENTER_Y + 0.07).toFixed(4)}, ${CAM_D.toFixed(3)});
  vec3 fw = normalize(ta - ro);
  vec3 rt = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(fw + (q.x * rt + q.y * up) * uTanHalf);

  vec3 col = render(ro, rd);
  outColor = vec4(max(col, vec3(0.0)) * uEncode, 1.0);
}`;

  const BLUR_FS = `#version 300 es
precision highp float;
out vec4 outColor;
uniform sampler2D uTex;
uniform vec2  uDstTexel;
uniform vec2  uSrcTexel;
uniform vec2  uDir;
uniform float uMode;
uniform float uDecode;
uniform float uThresh;

void main() {
  vec2 uv = gl_FragCoord.xy * uDstTexel;
  if (uMode > 0.5) {
    vec3 c = vec3(0.0);
    c += texture(uTex, uv + vec2(-1.0, -1.0) * uSrcTexel).rgb;
    c += texture(uTex, uv + vec2( 1.0, -1.0) * uSrcTexel).rgb;
    c += texture(uTex, uv + vec2(-1.0,  1.0) * uSrcTexel).rgb;
    c += texture(uTex, uv + vec2( 1.0,  1.0) * uSrcTexel).rgb;
    c *= 0.25 * uDecode;
    float l = max(max(c.r, c.g), c.b);
    float k = max(l - uThresh, 0.0) / max(l, 1e-4);
    outColor = vec4(c * k, 1.0);
  } else {
    vec2 o = uDir * uSrcTexel * 2.2;
    vec3 c = texture(uTex, uv).rgb * 0.2270270270;
    c += (texture(uTex, uv + o * 1.0).rgb + texture(uTex, uv - o * 1.0).rgb) * 0.1945945946;
    c += (texture(uTex, uv + o * 2.0).rgb + texture(uTex, uv - o * 2.0).rgb) * 0.1216216216;
    c += (texture(uTex, uv + o * 3.0).rgb + texture(uTex, uv - o * 3.0).rgb) * 0.0540540541;
    c += (texture(uTex, uv + o * 4.0).rgb + texture(uTex, uv - o * 4.0).rgb) * 0.0162162162;
    outColor = vec4(c, 1.0);
  }
}`;

  const COMP_FS = `#version 300 es
precision highp float;
out vec4 outColor;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform vec2  uRes;
uniform float uDecode;
uniform float uBloomAmt;
uniform float uExposure;

vec3 aces(vec3 x) {
  const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
}

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 d = 0.25 / uRes;
  vec3 s = texture(uScene, uv + vec2(-d.x, -d.y)).rgb
         + texture(uScene, uv + vec2( d.x, -d.y)).rgb
         + texture(uScene, uv + vec2(-d.x,  d.y)).rgb
         + texture(uScene, uv + vec2( d.x,  d.y)).rgb;
  vec3 col = s * 0.25 * uDecode;

  col += texture(uBloom, uv).rgb * uBloomAmt;

  col *= uExposure;
  col = aces(col);
  col = pow(max(col, vec3(0.0)), vec3(1.0 / 2.2));

  vec2 v = uv - 0.5;
  float vig = 1.0 - 0.30 * pow(clamp(length(v) * 1.38, 0.0, 1.0), 2.3);
  col *= vig;

  col += (hash21(gl_FragCoord.xy) - 0.5) * 0.0035;
  outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

  /* ----------------------------------------------------------------------
     Deterministic wax arrangement (CPU side, pure function of seed + time)
     ---------------------------------------------------------------------- */

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const SIZE_TABLE = [0.122, 0.136, 0.100, 0.080, 0.128, 0.064, 0.110, 0.090, 0.058, 0.116];

  function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
  function smoother(x) {
    x = clamp(x, 0, 1);
    return x * x * x * (x * (x * 6 - 15) + 10);
  }
  function cavRadiusJS(y) {
    return 0.274 + (0.146 - 0.274) * clamp((y + 0.668) / 1.504, 0, 1);
  }

  function buildBlobs(seed) {
    const rnd = mulberry32(seed >>> 0);
    const list = [];
    for (let i = 0; i < NB; i++) {
      const r = [rnd(), rnd(), rnd(), rnd(), rnd(), rnd(), rnd(), rnd(), rnd()];
      // the first few phases are anchored so that the opening frame always
      // shows a tethered riser, a mass at the top and a sinking mass
      let u0;
      if (i === 0) u0 = 0.070 + r[0] * 0.050;
      else if (i === 1) u0 = 0.490 + r[0] * 0.070;
      else if (i === 2) u0 = 0.720 + r[0] * 0.090;
      else if (i === 3) u0 = 0.140 + r[0] * 0.060;
      else u0 = r[0];

      const riseEnd = 0.340 + r[1] * 0.110;
      const dwellEnd = riseEnd + 0.080 + r[2] * 0.085;
      const sinkEnd = Math.min(0.975, dwellEnd + 0.300 + r[3] * 0.095);

      list.push({
        period: 13.0 + r[4] * 9.5 + (i % 3) * 1.6,
        u0: u0,
        size: SIZE_TABLE[i] * (0.90 + r[5] * 0.22),
        topY: 0.255 + r[6] * 0.365,
        laneAng: r[7] * Math.PI * 2.0,
        laneR: 0.028 + r[8] * 0.072,
        drift: 0.042 + rnd() * 0.105,
        tetherEnd: 0.215 + rnd() * 0.080,
        ph: rnd() * Math.PI * 2.0,
        riseEnd: riseEnd,
        dwellEnd: dwellEnd,
        sinkEnd: sinkEnd
      });
    }
    return list;
  }

  function heightCurve(b, u) {
    if (u < b.riseEnd) return smoother(u / b.riseEnd);
    if (u < b.dwellEnd) return 1.0;
    if (u < b.sinkEnd) return 1.0 - smoother((u - b.dwellEnd) / (b.sinkEnd - b.dwellEnd));
    return 0.0;
  }

  function phaseOf(b, t) {
    let u = (t / b.period + b.u0) % 1;
    if (u < 0) u += 1;
    return u;
  }

  /* ----------------------------------------------------------------------
     WebGL plumbing
     ---------------------------------------------------------------------- */

  const canvas = document.getElementById('stage');
  const gl = canvas.getContext('webgl2', {
    alpha: false,
    antialias: false,
    depth: false,
    stencil: false,
    desynchronized: false,
    powerPreference: 'high-performance',
    preserveDrawingBuffer: true
  });

  let destroyed = false;
  let raf = 0;
  let last = null;
  let paused = false;

  let seed = DEFAULT_SEED >>> 0;
  let epoch = 0;
  let simTime = 0;
  let acc = 0;
  let blobs = buildBlobs(seed);

  const blobArr = new Float32Array(NB * 4);
  const blobSArr = new Float32Array(NB * 4);
  const poolArr = new Float32Array(4);

  if (!gl) {
    // No WebGL2: leave the stage dark rather than drawing any overlay text.
    if (typeof console !== 'undefined' && console.error) {
      console.error('lava-lamp: WebGL2 is required.');
    }
  }

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(sh);
      gl.deleteShader(sh);
      throw new Error('shader compile failed: ' + log);
    }
    return sh;
  }

  function link(vsSrc, fsSrc) {
    const vs = compile(gl.VERTEX_SHADER, vsSrc);
    const fs = compile(gl.FRAGMENT_SHADER, fsSrc);
    const pr = gl.createProgram();
    gl.attachShader(pr, vs);
    gl.attachShader(pr, fs);
    gl.linkProgram(pr);
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) {
      const log = gl.getProgramInfoLog(pr);
      gl.deleteProgram(pr);
      throw new Error('program link failed: ' + log);
    }
    return pr;
  }

  let progScene = null, progBlur = null, progComp = null;
  let vao = null;
  let hasFloat = false;
  let ENCODE = 1.0;

  const targets = { scene: null, blurA: null, blurB: null };
  let sceneW = 1, sceneH = 1, blurW = 1, blurH = 1;
  let uS = {}, uB = {}, uC = {};

  function makeTarget(w, h) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    if (hasFloat) {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    } else {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    }
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.bindTexture(gl.TEXTURE_2D, null);
    return { tex: tex, fbo: fbo, w: w, h: h };
  }

  function freeTarget(t) {
    if (!t) return;
    gl.deleteTexture(t.tex);
    gl.deleteFramebuffer(t.fbo);
  }

  function initGL() {
    hasFloat = !!gl.getExtension('EXT_color_buffer_float');
    ENCODE = hasFloat ? 1.0 : 0.22;

    progScene = link(VERT, SCENE_FS);
    progBlur = link(VERT, BLUR_FS);
    progComp = link(VERT, COMP_FS);

    vao = gl.createVertexArray();
    gl.bindVertexArray(vao);

    uS = {
      res: gl.getUniformLocation(progScene, 'uRes'),
      tan: gl.getUniformLocation(progScene, 'uTanHalf'),
      enc: gl.getUniformLocation(progScene, 'uEncode'),
      heat: gl.getUniformLocation(progScene, 'uHeat'),
      time: gl.getUniformLocation(progScene, 'uTime'),
      blob: gl.getUniformLocation(progScene, 'uBlob'),
      blobS: gl.getUniformLocation(progScene, 'uBlobS'),
      pool: gl.getUniformLocation(progScene, 'uPool')
    };
    uB = {
      tex: gl.getUniformLocation(progBlur, 'uTex'),
      dst: gl.getUniformLocation(progBlur, 'uDstTexel'),
      src: gl.getUniformLocation(progBlur, 'uSrcTexel'),
      dir: gl.getUniformLocation(progBlur, 'uDir'),
      mode: gl.getUniformLocation(progBlur, 'uMode'),
      dec: gl.getUniformLocation(progBlur, 'uDecode'),
      thr: gl.getUniformLocation(progBlur, 'uThresh')
    };
    uC = {
      scene: gl.getUniformLocation(progComp, 'uScene'),
      bloom: gl.getUniformLocation(progComp, 'uBloom'),
      res: gl.getUniformLocation(progComp, 'uRes'),
      dec: gl.getUniformLocation(progComp, 'uDecode'),
      amt: gl.getUniformLocation(progComp, 'uBloomAmt'),
      exp: gl.getUniformLocation(progComp, 'uExposure')
    };

    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);
    gl.disable(gl.CULL_FACE);
  }

  let tanHalf = 0.22;

  function resize() {
    if (destroyed || !gl) return;
    const cssW = Math.max(1, Math.floor(window.innerWidth));
    const cssH = Math.max(1, Math.floor(window.innerHeight));
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let cw = Math.max(1, Math.round(cssW * dpr));
    let ch = Math.max(1, Math.round(cssH * dpr));
    const cPix = cw * ch;
    if (cPix > CANVAS_PIXEL_BUDGET) {
      const k = Math.sqrt(CANVAS_PIXEL_BUDGET / cPix);
      cw = Math.max(1, Math.round(cw * k));
      ch = Math.max(1, Math.round(ch * k));
    }
    if (canvas.width !== cw || canvas.height !== ch) {
      canvas.width = cw;
      canvas.height = ch;
    }
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';

    // supersample a little when there is headroom, downsample when there is not
    let k = Math.sqrt(SCENE_PIXEL_BUDGET / (cw * ch));
    k = Math.min(Math.max(k, 0.60), 1.42);
    const nw = Math.max(16, Math.round(cw * k));
    const nh = Math.max(16, Math.round(ch * k));

    if (nw !== sceneW || nh !== sceneH) {
      sceneW = nw; sceneH = nh;
      blurW = Math.max(4, Math.floor(sceneW / 4));
      blurH = Math.max(4, Math.floor(sceneH / 4));
      freeTarget(targets.scene);
      freeTarget(targets.blurA);
      freeTarget(targets.blurB);
      targets.scene = makeTarget(sceneW, sceneH);
      targets.blurA = makeTarget(blurW, blurH);
      targets.blurB = makeTarget(blurW, blurH);
    }

    // fit the whole lamp inside the central 80% of both viewport dimensions
    const aspect = sceneW / sceneH;
    const visHalfH = Math.max(HALF_H / 0.8, (HALF_W / 0.8) / aspect);
    tanHalf = visHalfH / CAM_D;
  }

  /* ----------------------------------------------------------------------
     Simulation state -> uniforms
     ---------------------------------------------------------------------- */

  function updateField(t) {
    const ts = t * (0.52 + 0.84 * HEAT);

    poolArr[0] = -0.597 + 0.0075 * Math.sin(ts * 0.37);
    poolArr[1] = 0.290 + 0.004 * Math.sin(ts * 0.23 + 1.1);
    poolArr[2] = 0.045 + 0.005 * Math.sin(ts * 0.31 + 2.0);
    poolArr[3] = 0.035;

    for (let i = 0; i < NB; i++) {
      const b = blobs[i];
      const u = phaseOf(b, ts);
      const h = heightCurve(b, u);
      const y = Y_BOT + (b.topY - Y_BOT) * h;

      const du = 0.004;
      let up = u + du; if (up >= 1) up -= 1;
      let um = u - du; if (um < 0) um += 1;
      const vh = (heightCurve(b, up) - heightCurve(b, um)) / (2 * du * b.period);
      const vy = vh * (b.topY - Y_BOT);

      const stretch = clamp(1 + 2.6 * Math.abs(vy), 1, 1.58);
      const r = b.size * (0.94 + 0.06 * Math.sin(ts * 0.41 + b.ph));
      let rx = r / Math.sqrt(stretch);
      let ry = r * stretch;
      const rmax = cavRadiusJS(y) * 0.84;
      if (rx > rmax) {
        rx = rmax;
        ry = (r * r * r) / (rx * rx);
      }

      const ang = b.laneAng + ts * b.drift;
      let rad = b.laneR * (0.30 + 0.70 * (1 - h));
      const maxRad = Math.max(0, cavRadiusJS(y) - rx - 0.016);
      if (rad > maxRad) rad = maxRad;
      const x = Math.cos(ang) * rad;
      const z = Math.sin(ang) * rad;

      let tet = 0;
      if (u < b.tetherEnd) tet = smoother(1 - u / b.tetherEnd);
      const tr = 0.002 + 0.040 * tet * tet;

      const o = i * 4;
      blobArr[o] = x;
      blobArr[o + 1] = y;
      blobArr[o + 2] = z;
      blobArr[o + 3] = rx;
      blobSArr[o] = ry;
      blobSArr[o + 1] = tet;
      blobSArr[o + 2] = tr;
      blobSArr[o + 3] = 0;
    }
  }

  function advance(dt) {
    dt = clamp(dt, 0, 0.1);
    acc += dt;
    let n = 0;
    while (acc >= SUBSTEP && n < MAX_SUBSTEPS) {
      simTime += SUBSTEP;
      acc -= SUBSTEP;
      n++;
    }
    if (n >= MAX_SUBSTEPS) acc = 0;
  }

  function drawFullscreen() {
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function draw() {
    if (destroyed || !gl || !targets.scene) return;
    updateField(simTime);

    // --- scene pass ---
    gl.bindVertexArray(vao);
    gl.bindFramebuffer(gl.FRAMEBUFFER, targets.scene.fbo);
    gl.viewport(0, 0, sceneW, sceneH);
    gl.useProgram(progScene);
    gl.uniform2f(uS.res, sceneW, sceneH);
    gl.uniform1f(uS.tan, tanHalf);
    gl.uniform1f(uS.enc, ENCODE);
    gl.uniform1f(uS.heat, HEAT);
    gl.uniform1f(uS.time, simTime);
    gl.uniform4fv(uS.blob, blobArr);
    gl.uniform4fv(uS.blobS, blobSArr);
    gl.uniform4fv(uS.pool, poolArr);
    drawFullscreen();

    // --- bright pass / downsample ---
    gl.useProgram(progBlur);
    gl.uniform1i(uB.tex, 0);
    gl.uniform1f(uB.dec, 1.0 / ENCODE);
    gl.uniform1f(uB.thr, 0.92);

    gl.bindFramebuffer(gl.FRAMEBUFFER, targets.blurA.fbo);
    gl.viewport(0, 0, blurW, blurH);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, targets.scene.tex);
    gl.uniform1f(uB.mode, 1.0);
    gl.uniform2f(uB.dst, 1 / blurW, 1 / blurH);
    gl.uniform2f(uB.src, 1 / sceneW, 1 / sceneH);
    gl.uniform2f(uB.dir, 0, 0);
    drawFullscreen();

    // --- horizontal blur ---
    gl.bindFramebuffer(gl.FRAMEBUFFER, targets.blurB.fbo);
    gl.bindTexture(gl.TEXTURE_2D, targets.blurA.tex);
    gl.uniform1f(uB.mode, 0.0);
    gl.uniform2f(uB.dst, 1 / blurW, 1 / blurH);
    gl.uniform2f(uB.src, 1 / blurW, 1 / blurH);
    gl.uniform2f(uB.dir, 1, 0);
    drawFullscreen();

    // --- vertical blur ---
    gl.bindFramebuffer(gl.FRAMEBUFFER, targets.blurA.fbo);
    gl.bindTexture(gl.TEXTURE_2D, targets.blurB.tex);
    gl.uniform2f(uB.dir, 0, 1);
    drawFullscreen();

    // --- composite ---
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(progComp);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, targets.scene.tex);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, targets.blurA.tex);
    gl.uniform1i(uC.scene, 0);
    gl.uniform1i(uC.bloom, 1);
    gl.uniform2f(uC.res, canvas.width, canvas.height);
    gl.uniform1f(uC.dec, 1.0 / ENCODE);
    gl.uniform1f(uC.amt, 0.55);
    gl.uniform1f(uC.exp, 1.0);
    drawFullscreen();

    gl.activeTexture(gl.TEXTURE0);
  }

  function frame(nowMs) {
    if (destroyed) return;
    raf = window.requestAnimationFrame(frame);
    const t = nowMs * 0.001;
    if (last === null) last = t;
    const dt = t - last;
    last = t;
    if (!paused) advance(dt);
    draw();
  }

  function onResize() {
    resize();
    if (!destroyed) draw();
  }

  /* ----------------------------------------------------------------------
     BridgeBench manifest & API
     ---------------------------------------------------------------------- */

  const MANIFEST = {
    id: 'lava-lamp',
    name: 'lava-lamp',
    title: 'Lava Lamp — Ember',
    version: '1.0.0',
    apiVersion: '1.0',
    kind: 'scene',
    renderer: 'webgl2',
    deterministic: true,
    autoplay: true,
    interactive: false,
    controls: [],
    state: ['heat', 'paletteIndex'],
    capabilities: {
      reset: true,
      destroy: true,
      getState: true,
      pause: true,
      step: true,
      controls: false
    }
  };

  function doReset(s) {
    if (s === undefined || s === null || !isFinite(s)) s = seed;
    seed = (s >>> 0);
    blobs = buildBlobs(seed);
    epoch++;
    simTime = 0;
    acc = 0;
    last = null;
    paused = false;
    if (!destroyed && gl && targets.scene) draw();
    return bench.getState();
  }

  const bench = {
    manifest: MANIFEST,

    getState: function () {
      return { heat: HEAT, paletteIndex: PALETTE_INDEX };
    },

    reset: function (s) {
      return doReset(s);
    },

    pause: function () { paused = true; },

    resume: function () { paused = false; last = null; },

    isPaused: function () { return paused; },

    step: function (ms) {
      const dt = (typeof ms === 'number' && isFinite(ms)) ? ms / 1000 : SUBSTEP;
      advance(dt);
      if (!destroyed) draw();
    },

    destroy: function () {
      if (destroyed) return;
      destroyed = true;
      if (raf) window.cancelAnimationFrame(raf);
      raf = 0;
      window.removeEventListener('resize', onResize);
      if (gl) {
        try {
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.bindVertexArray(null);
          gl.useProgram(null);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, null);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, null);
          freeTarget(targets.scene); targets.scene = null;
          freeTarget(targets.blurA); targets.blurA = null;
          freeTarget(targets.blurB); targets.blurB = null;
          if (vao) { gl.deleteVertexArray(vao); vao = null; }
          if (progScene) { gl.deleteProgram(progScene); progScene = null; }
          if (progBlur) { gl.deleteProgram(progBlur); progBlur = null; }
          if (progComp) { gl.deleteProgram(progComp); progComp = null; }
          const lose = gl.getExtension('WEBGL_lose_context');
          if (lose) lose.loseContext();
        } catch (e) { /* teardown is best effort */ }
      }
    }
  };

  window.bench = bench;
  window.__bench = bench;
  window.BridgeBench = bench;

  /* ----------------------------------------------------------------------
     Boot
     ---------------------------------------------------------------------- */

  if (gl) {
    try {
      initGL();
      resize();
      window.addEventListener('resize', onResize, { passive: true });
      draw();
      raf = window.requestAnimationFrame(frame);
    } catch (err) {
      if (typeof console !== 'undefined' && console.error) console.error(err);
    }
  }

  try {
    window.dispatchEvent(new CustomEvent('bench:ready', { detail: { id: MANIFEST.id } }));
  } catch (e) { /* CustomEvent unavailable */ }
  window.benchReady = true;
})();
</script>
</body>
</html>
