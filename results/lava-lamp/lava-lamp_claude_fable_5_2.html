<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lava Lamp</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b1715; }
  canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; background: #1b1715; }
</style>
<script type="application/json" id="bridgebench-manifest">
{
  "id": "lava-lamp",
  "title": "Lava Lamp",
  "version": "1.0.0",
  "deterministic": true,
  "defaultSeed": 1,
  "controls": [],
  "stateKeys": ["heat", "paletteIndex"],
  "palettes": ["Ember"],
  "api": ["getManifest", "getState", "setState", "reset", "advance", "step", "seek", "pause", "resume", "render", "destroy"]
}
</script>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------
  // Fixed configuration
  // ------------------------------------------------------------------
  var HEAT = 0.65;
  var PALETTE_INDEX = 0; // Ember
  var DEFAULT_SEED = 1;

  var N = 7;            // wax bodies
  var NB = N * 2;       // head + tail sphere per body
  var NN = 5;           // neck capsules
  var STEP = 1 / 60;    // fixed simulation step
  var PREWARM_STEPS = 2880; // 48 s of prewarm
  var POOL_Y = 1.80;
  var Y_MIN = 1.72;
  var TOP_Y = 4.24;
  var TAU = Math.PI * 2;

  // Camera (fixed for the lifetime of the page)
  var CAM_POS = [0, 2.1, 11.0];
  var CAM_TGT = [0, 2.42, 0];

  // Lamp bounds used for framing (slightly conservative)
  var LAMP_Y0 = 0.0, LAMP_Y1 = 4.84, LAMP_R = 0.70;
  var FILL = 0.74; // lamp bounds occupy at most this fraction of each viewport dimension

  // ------------------------------------------------------------------
  // Shaders
  // ------------------------------------------------------------------
  var VERT = [
    'attribute vec2 aPos;',
    'void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }'
  ].join('\n');

  var FRAG = [
    'precision highp float;',
    '#define NB ' + NB,
    '#define NN ' + NN,
    '#define PI 3.14159265359',
    '#define TAU 6.28318530718',
    'uniform vec2 uRes;',
    'uniform vec2 uCenter;',
    'uniform float uScale;',
    'uniform vec3 uCamPos;',
    'uniform vec3 uCamR;',
    'uniform vec3 uCamU;',
    'uniform vec3 uCamF;',
    'uniform vec4 uBlob[NB];',
    'uniform vec4 uNeckA[NN];',
    'uniform vec4 uNeckB[NN];',
    'uniform float uSimTime;',
    'uniform float uHeat;',
    '',
    'const vec3 AMBER = vec3(1.0, 0.50, 0.12);',
    'const vec3 WAX_DEEP = vec3(0.60, 0.060, 0.010);',
    'const vec3 WAX_MID = vec3(1.0, 0.26, 0.035);',
    'const vec3 WAX_HOT = vec3(1.0, 0.62, 0.17);',
    'const vec3 SILVER = vec3(0.90, 0.905, 0.925);',
    'const vec3 COOL = vec3(0.84, 0.92, 1.0);',
    '',
    'float hash1(float n){ return fract(sin(n) * 43758.5453123); }',
    'float hash2(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453123); }',
    'float vnoise(float x){ float i = floor(x); float f = fract(x); f = f*f*(3.0-2.0*f); return mix(hash1(i), hash1(i+1.0), f); }',
    '',
    '// ---------------- studio ----------------',
    'vec3 backdrop(vec3 rd){',
    '  float k = smoothstep(0.0, 0.35, -rd.z);',
    '  vec2 tq = rd.xy / max(-rd.z, 0.08);',
    '  float g = exp(-(tq.x*tq.x*2.2 + (tq.y-0.02)*(tq.y-0.02)*3.0)) * k;',
    '  return vec3(0.036, 0.030, 0.0265) * (0.42 + 0.95*g);',
    '}',
    'float strip(float az, float c, float hw, float rough){',
    '  float d = abs(mod(az - c + PI, TAU) - PI);',
    '  float s = 0.012 + rough;',
    '  return (1.0 - smoothstep(hw - s, hw + s, d)) * (hw / (hw + rough*0.7));',
    '}',
    'vec3 studio(vec3 rd, float rough){',
    '  vec3 c = backdrop(rd);',
    '  float az = atan(rd.x, rd.z);',
    '  float el = rd.y;',
    '  float m = smoothstep(-0.32 - rough, -0.12, el) * (1.0 - smoothstep(0.62, 0.82 + rough, el));',
    '  c += COOL * 7.0 * strip(az, -0.95, 0.075, rough) * m;',
    '  c += COOL * 5.0 * strip(az, 1.20, 0.040, rough) * m;',
    '  c += vec3(0.80, 0.90, 1.0) * 4.0 * strip(az, 2.50, 0.035, rough) * m;',
    '  c += vec3(0.80, 0.90, 1.0) * 4.0 * strip(az, -2.42, 0.030, rough) * m;',
    '  float ff = smoothstep(-0.2, 0.9, dot(rd, normalize(vec3(0.2, 0.55, 0.8))));',
    '  c += vec3(0.150, 0.160, 0.175) * ff * ff;',
    '  c += vec3(0.05, 0.052, 0.058) * smoothstep(0.3, 1.0, el);',
    '  float fl = smoothstep(0.0, 0.10 + rough, -rd.y);',
    '  vec3 tcol = vec3(0.020, 0.0165, 0.014) + vec3(0.9, 0.36, 0.09) * 0.12 * (0.55 + 0.7*uHeat) * smoothstep(0.05, 0.7, -rd.y);',
    '  c = mix(c, tcol, fl);',
    '  return c;',
    '}',
    '',
    '// ---------------- lamp geometry ----------------',
    'float bottleR(float y){ return mix(0.60, 0.30, clamp((y - 1.30) / 3.0, 0.0, 1.0)); }',
    'float sdBottle(vec3 p, float inset){',
    '  float r = length(p.xz);',
    '  float d = (r - (bottleR(p.y) - inset)) * 0.995;',
    '  float dy = abs(p.y - 2.80) - (1.50 - inset);',
    '  return max(d, dy);',
    '}',
    'float baseR(float y){',
    '  float t = y - 0.62;',
    '  float a = clamp(t < 0.0 ? -t / 0.62 : t / 0.90, 0.0, 1.0);',
    '  float s = t < 0.0 ? pow(a, 1.7) : pow(a, 1.25);',
    '  return 0.33 + 0.33 * s;',
    '}',
    'float sdBase(vec3 p){',
    '  float r = length(p.xz);',
    '  float d = (r - baseR(p.y)) * 0.68;',
    '  d = max(d, abs(p.y - 0.76) - 0.76);',
    '  d = min(d, length(vec2(r - 0.665, p.y - 1.495)) - 0.030);',
    '  d = min(d, length(vec2(r - 0.655, p.y - 0.036)) - 0.036);',
    '  d = min(d, length(vec2(r - 0.335, p.y - 0.62)) - 0.028);',
    '  return d;',
    '}',
    'float sdCap(vec3 p){',
    '  float r = length(p.xz);',
    '  float R = mix(0.320, 0.245, clamp((p.y - 4.26) / 0.56, 0.0, 1.0));',
    '  float d = max((r - R) * 0.99, abs(p.y - 4.54) - 0.27);',
    '  d -= 0.012;',
    '  d = min(d, length(vec2(r - 0.325, p.y - 4.275)) - 0.022);',
    '  return d;',
    '}',
    'vec2 mapLamp(vec3 p){',
    '  vec2 res = vec2(sdBottle(p, 0.0), 1.0);',
    '  float db = sdBase(p);',
    '  if (db < res.x) res = vec2(db, 2.0);',
    '  float dc = sdCap(p);',
    '  if (dc < res.x) res = vec2(dc, 3.0);',
    '  return res;',
    '}',
    'vec3 lampNormal(vec3 p){',
    '  vec2 e = vec2(0.0012, -0.0012);',
    '  return normalize(e.xyy*mapLamp(p+e.xyy).x + e.yyx*mapLamp(p+e.yyx).x + e.yxy*mapLamp(p+e.yxy).x + e.xxx*mapLamp(p+e.xxx).x);',
    '}',
    'vec3 bottleNormal(vec3 p){',
    '  vec2 e = vec2(0.0015, -0.0015);',
    '  return normalize(e.xyy*sdBottle(p+e.xyy, 0.035) + e.yyx*sdBottle(p+e.yyx, 0.035) + e.yxy*sdBottle(p+e.yxy, 0.035) + e.xxx*sdBottle(p+e.xxx, 0.035));',
    '}',
    '',
    '// ---------------- wax field ----------------',
    'float smin(float a, float b, float k){ float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h*h*k*0.25; }',
    'float sdCapsule(vec3 p, vec3 a, vec3 b, float r){',
    '  vec3 pa = p - a; vec3 ba = b - a;',
    '  float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-5), 0.0, 1.0);',
    '  return length(pa - ba*h) - r;',
    '}',
    'float mapWax(vec3 p){',
    '  float swell = 0.028 * sin(p.x*4.6 + uSimTime*0.55) * cos(p.z*4.1 - uSimTime*0.43) + 0.03 * cos(length(p.xz)*3.2);',
    '  float d = (p.y - (1.80 + swell)) * 0.9;',
    '  for (int i = 0; i < NB; i++){',
    '    vec4 b = uBlob[i];',
    '    d = smin(d, length(p - b.xyz) - b.w, 0.22);',
    '  }',
    '  for (int i = 0; i < NN; i++){',
    '    vec4 a = uNeckA[i];',
    '    if (a.w > 0.002) d = smin(d, sdCapsule(p, a.xyz, uNeckB[i].xyz, a.w), 0.16);',
    '  }',
    '  return d;',
    '}',
    'vec3 waxNormal(vec3 p){',
    '  vec2 e = vec2(0.004, -0.004);',
    '  return normalize(e.xyy*mapWax(p+e.xyy) + e.yyx*mapWax(p+e.yyx) + e.yxy*mapWax(p+e.yxy) + e.xxx*mapWax(p+e.xxx));',
    '}',
    '',
    '// ---------------- shading ----------------',
    'vec3 shadeWax(vec3 p, vec3 rd){',
    '  vec3 n = waxNormal(p);',
    '  vec3 hp = vec3(0.0, 1.45, 0.0);',
    '  vec3 Lv = hp - p;',
    '  float dist = length(Lv);',
    '  vec3 L = Lv / max(dist, 1e-4);',
    '  float att = 1.0 / (1.0 + 0.22*dist*dist);',
    '  float pw = 0.55 + 0.7*uHeat;',
    '  float wrap = clamp((dot(n, L) + 0.55) / 1.55, 0.0, 1.0);',
    '  float thick = 0.0;',
    '  for (int i = 0; i < 5; i++){',
    '    float h = 0.05 + 0.07*float(i);',
    '    thick += clamp(-mapWax(p + rd*h) / 0.04, 0.0, 1.0) * 0.07;',
    '  }',
    '  float trans = exp(-thick * 9.0);',
    '  float sss = clamp(0.5 + mapWax(p + L*0.2) / 0.4, 0.0, 1.0);',
    '  float cosv = max(dot(n, -rd), 0.0);',
    '  float fres = pow(1.0 - cosv, 2.5);',
    '  vec3 col = WAX_DEEP * (0.30 + 1.5*wrap*att*pw);',
    '  col += WAX_MID * sss * att * 0.9 * pw;',
    '  col += WAX_HOT * (trans*0.9 + fres*0.35) * (0.35 + att) * pw;',
    '  float poolGlow = 1.0 - smoothstep(1.78, 2.45, p.y);',
    '  col += WAX_HOT * 0.85 * poolGlow * pw;',
    '  vec3 r = reflect(rd, n);',
    '  col += studio(r, 0.03) * (0.025 + 0.25*pow(1.0 - cosv, 5.0));',
    '  return col;',
    '}',
    'vec3 shadeMetal(vec3 p, vec3 rd, float id){',
    '  vec3 n = lampNormal(p);',
    '  float nz = vnoise(p.y*95.0)*0.65 + vnoise(p.y*33.0 + 7.3)*0.35;',
    '  n = normalize(n + vec3(0.0, (nz - 0.5)*0.09, 0.0));',
    '  vec3 r = reflect(rd, n);',
    '  vec3 e = 0.55*studio(r, 0.05) + 0.45*studio(r, 0.20);',
    '  float cosi = max(dot(-rd, n), 0.0);',
    '  vec3 F = SILVER + (vec3(1.0) - SILVER) * pow(1.0 - cosi, 5.0);',
    '  vec3 col = e * F * (0.92 + 0.16*nz);',
    '  float warm = 0.0;',
    '  if (id < 2.5){',
    '    float up = smoothstep(0.70, 1.52, p.y);',
    '    warm = up*up*(0.30 + 0.5*clamp(0.5 - 0.5*n.y, 0.0, 1.0));',
    '    warm += 1.1 * smoothstep(0.6, 1.0, n.y) * step(1.40, p.y);',
    '    warm += 0.22 * clamp(n.y, 0.0, 1.0) * (1.0 - smoothstep(0.0, 0.62, p.y));',
    '  } else {',
    '    warm = 0.9 * (1.0 - smoothstep(4.24, 4.60, p.y));',
    '  }',
    '  col += AMBER * 0.17 * warm * (0.55 + 0.7*uHeat);',
    '  float groove = smoothstep(0.0, 0.05, abs(p.y - 0.62) - 0.03);',
    '  col *= 0.8 + 0.2*groove;',
    '  return col;',
    '}',
    '',
    'bool traceLamp(vec3 ro, vec3 rd, out vec3 col, out vec3 hp){',
    '  col = vec3(0.0); hp = ro;',
    '  float a = dot(rd.xz, rd.xz);',
    '  if (a < 1e-6) return false;',
    '  float b = dot(ro.xz, rd.xz);',
    '  float c = dot(ro.xz, ro.xz) - 0.74*0.74;',
    '  float h = b*b - a*c;',
    '  if (h < 0.0) return false;',
    '  h = sqrt(h);',
    '  float t0 = (-b - h) / a;',
    '  float t1 = (-b + h) / a;',
    '  float ry = abs(rd.y) < 1e-5 ? 1e-5 : rd.y;',
    '  float ty0 = (-0.01 - ro.y) / ry;',
    '  float ty1 = (4.90 - ro.y) / ry;',
    '  t0 = max(t0, min(ty0, ty1));',
    '  t1 = min(t1, max(ty0, ty1));',
    '  if (t1 < max(t0, 0.0)) return false;',
    '  float t = max(t0, 0.0);',
    '  float m = 0.0;',
    '  bool hit = false;',
    '  for (int i = 0; i < 64; i++){',
    '    vec2 d = mapLamp(ro + rd*t);',
    '    if (d.x < 0.0015){ hit = true; m = d.y; break; }',
    '    t += d.x;',
    '    if (t > t1) break;',
    '  }',
    '  if (!hit) return false;',
    '  vec3 p = ro + rd*t;',
    '  hp = p;',
    '  if (m > 1.5){ col = shadeMetal(p, rd, m); return true; }',
    '',
    '  // glass bottle',
    '  vec3 n = lampNormal(p);',
    '  float cosi = max(dot(-rd, n), 0.0);',
    '  float F = 0.04 + 0.96*pow(1.0 - cosi, 5.0);',
    '  vec3 refl = studio(reflect(rd, n), 0.004);',
    '  vec3 rin = refract(rd, n, 1.0/1.33);',
    '  if (dot(rin, rin) < 0.5) rin = rd;',
    '  vec3 q = p - n*0.04;',
    '  float ti = 0.0;',
    '  bool wax = false;',
    '  for (int i = 0; i < 56; i++){',
    '    vec3 x = q + rin*ti;',
    '    float dw = mapWax(x);',
    '    float di = -sdBottle(x, 0.035);',
    '    if (dw < 0.002){ wax = true; break; }',
    '    if (di < 0.0) break;',
    '    ti += min(dw*0.9, di + 0.003);',
    '  }',
    '  vec3 xe = q + rin*ti;',
    '  vec3 inner;',
    '  if (wax){',
    '    inner = shadeWax(xe, rin);',
    '  } else {',
    '    vec3 ne = bottleNormal(xe);',
    '    vec3 rout = refract(rin, -ne, 1.33);',
    '    if (dot(rout, rout) < 0.5) rout = rin;',
    '    inner = backdrop(rout);',
    '    float capSh = smoothstep(4.12, 4.26, xe.y);',
    '    inner = mix(inner, vec3(0.045, 0.020, 0.010), capSh);',
    '    inner += 0.05 * studio(reflect(rin, -ne), 0.012) * (1.0 - capSh);',
    '  }',
    '  float ym = (q + rin*ti*0.5).y;',
    '  inner *= exp(-ti * vec3(0.05, 0.07, 0.10));',
    '  inner += vec3(1.0, 0.42, 0.10) * (0.036 * ti * exp(-max(ym - 1.6, 0.0)*0.9) + 0.005*ti) * (0.55 + 0.7*uHeat);',
    '  inner *= mix(1.0, 0.70, pow(1.0 - cosi, 3.0));',
    '  inner *= vec3(0.975, 0.985, 0.98);',
    '  col = mix(inner, refl, F);',
    '  return true;',
    '}',
    '',
    'vec3 aces(vec3 x){ return clamp((x*(2.51*x + 0.03)) / (x*(2.43*x + 0.59) + 0.14), 0.0, 1.0); }',
    '',
    'void main(){',
    '  vec2 pp = uCenter + (gl_FragCoord.xy - 0.5*uRes) * uScale;',
    '  vec3 ro = uCamPos;',
    '  vec3 rd = normalize(uCamF + pp.x*uCamR + pp.y*uCamU);',
    '  vec3 col;',
    '  vec3 c; vec3 hp;',
    '  if (traceLamp(ro, rd, c, hp)){',
    '    col = c;',
    '  } else if (rd.y < -1e-4){',
    '    float tf = -ro.y / rd.y;',
    '    vec3 ph = ro + rd*tf;',
    '    float rr = length(ph.xz);',
    '    float pw = 0.55 + 0.7*uHeat;',
    '    vec3 table = vec3(0.020, 0.0165, 0.014);',
    '    vec3 glowT = AMBER * (0.085*exp(-rr*rr*0.9) + 0.020*exp(-rr*0.5)) * pw;',
    '    float ao = 0.35 + 0.65*smoothstep(0.55, 1.05, rr);',
    '    vec3 fc = (table + glowT) * ao;',
    '    vec3 R = reflect(rd, vec3(0.0, 1.0, 0.0));',
    '    vec3 rc;',
    '    if (traceLamp(ph + vec3(0.0, 0.002, 0.0), R, c, hp)) rc = c * exp(-0.45*hp.y);',
    '    else rc = backdrop(R) * 0.6;',
    '    float Fr = 0.05 + 0.45*pow(1.0 - clamp(-rd.y, 0.0, 1.0), 4.0);',
    '    float edge = 1.0 - smoothstep(-4.5, -1.4, ph.z);',
    '    col = mix(fc + Fr*rc, backdrop(rd), edge);',
    '  } else {',
    '    col = backdrop(rd);',
    '  }',
    '  // soft photographic halo around the warm bottle',
    '  if (abs(rd.z) > 1e-4){',
    '    vec3 pz = ro + rd * (-ro.z / rd.z);',
    '    float dy = pz.y - clamp(pz.y, 1.6, 3.5);',
    '    float d2 = pz.x*pz.x + dy*dy;',
    '    col += vec3(1.0, 0.45, 0.15) * 0.020 * exp(-d2*1.1) * (0.55 + 0.7*uHeat);',
    '  }',
    '  vec2 vq = (gl_FragCoord.xy / uRes) - 0.5;',
    '  col *= 1.0 - 0.28*dot(vq, vq);',
    '  col = aces(col);',
    '  col = pow(col, vec3(1.0/2.2));',
    '  col += (hash2(gl_FragCoord.xy) - 0.5) / 255.0;',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  // ------------------------------------------------------------------
  // Deterministic simulation
  // ------------------------------------------------------------------
  var R0 = [0.25, 0.15, 0.22, 0.17, 0.24, 0.19, 0.14];
  var blobs = [];
  var seedValue = DEFAULT_SEED;
  var stepCount = 0;      // total steps including prewarm
  var accumulator = 0;    // accumulated real time not yet simulated
  var blobData = new Float32Array(NB * 4);
  var neckAData = new Float32Array(NN * 4);
  var neckBData = new Float32Array(NN * 4);

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
  function sstep(a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
  function bottleR(y) { return 0.60 + (0.30 - 0.60) * clamp((y - 1.30) / 3.0, 0, 1); }
  function maxRad(y, r) { return Math.max(0, bottleR(y) - 0.05 - r * 0.9); }

  function normSeed(seed) {
    var s = Number(seed);
    if (!isFinite(s)) return DEFAULT_SEED;
    return (Math.floor(s) >>> 0);
  }

  function seedInit(seed) {
    seedValue = normSeed(seed);
    var rng = mulberry32((seedValue ^ 0x9E3779B9) | 0);
    blobs = [];
    for (var i = 0; i < N; i++) {
      var r = R0[i] * (0.93 + 0.14 * rng());
      var y = Y_MIN + rng() * (3.9 - Y_MIN);
      var a = rng() * TAU;
      var rad = rng() * maxRad(y, r);
      var small = r < 0.17 ? 0.02 : 0.0;
      blobs.push({
        r: r,
        x: Math.cos(a) * rad, y: y, z: Math.sin(a) * rad,
        vx: 0, vy: 0, vz: 0,
        T: 0.25 + 0.7 * rng(),
        hot: rng() < 0.5,
        hr: 0.11 + 0.09 * rng(),
        cr: 0.08 + 0.07 * rng(),
        leak: 0.012 + 0.03 * rng() + small,
        go: 0.82 + 0.16 * rng(),
        drop: 0.20 + 0.10 * rng(),
        a: rng() * TAU,
        ph: rng() * TAU,
        spin: rng() - 0.5,
        laneR: 0.5 + rng(),
        tail: 0,
        link: -1,
        ax: 0, ay: 0, az: 0
      });
    }
    // blob 1 travels as a satellite of blob 0, joined by a wax neck
    blobs[1].link = 0;
    blobs[1].x = blobs[0].x * 0.5;
    blobs[1].z = blobs[0].z * 0.5;
    blobs[1].y = clamp(blobs[0].y - (blobs[0].r + blobs[1].r) * 1.2, Y_MIN, 3.9);
    stepCount = 0;
    accumulator = 0;
    for (var k = 0; k < PREWARM_STEPS; k++) stepSim();
  }

  function simTime() { return (stepCount - PREWARM_STEPS) * STEP; }

  function stepSim() {
    var dt = STEP;
    var t = simTime();
    var i, j, b, o;
    var B = 0.42, D = 1.7;
    var dragF = Math.exp(-D * dt);

    for (i = 0; i < N; i++) {
      b = blobs[i];
      var yn = clamp((b.y - Y_MIN) / (3.95 - Y_MIN), 0, 1);
      if (b.link < 0) {
        var hz = 1 - sstep(0.0, 0.20, yn);
        var cz = sstep(0.62, 0.97, yn);
        b.T += dt * (HEAT * b.hr * hz - b.cr * cz - b.leak * sstep(0.2, 0.6, yn));
        b.T = clamp(b.T, 0, 1);
        if (!b.hot && b.T >= b.go) b.hot = true;
        else if (b.hot && b.T <= b.drop) b.hot = false;
      } else {
        b.T = blobs[b.link].T;
        b.hot = blobs[b.link].hot;
      }
      var sizeF = 0.8 + 0.3 * (b.r / 0.25);
      b.ay = (b.hot ? B * (0.45 + 0.55 * b.T) : -B * (0.5 + 0.5 * (1 - b.T))) * sizeF;

      var mr = maxRad(b.y, b.r);
      var ang, lr;
      if (b.hot) { ang = b.a + 0.15 * t * b.spin; lr = Math.min(mr, 0.10 * b.laneR); }
      else { ang = b.a + 2.2 - 0.1 * t * b.spin; lr = 0.6 * mr; }
      var tx = Math.cos(ang) * lr, tz = Math.sin(ang) * lr;
      b.ax = 0.9 * (tx - b.x) + 0.035 * Math.sin(0.37 * t + b.ph + b.y * 1.7);
      b.az = 0.9 * (tz - b.z) + 0.035 * Math.cos(0.29 * t + b.ph * 1.3 + b.y * 1.3);
    }

    // soft pair repulsion so bodies merge visually without collapsing
    for (i = 0; i < N; i++) {
      b = blobs[i];
      for (j = i + 1; j < N; j++) {
        o = blobs[j];
        var dx = b.x - o.x, dy = b.y - o.y, dz = b.z - o.z;
        var d = Math.sqrt(dx * dx + dy * dy + dz * dz);
        var nx, ny, nz;
        if (d < 1e-6) { nx = 1; ny = 0; nz = 0; d = 1e-6; } else { nx = dx / d; ny = dy / d; nz = dz / d; }
        var dmin = (b.r + o.r) * 0.78;
        var f = 0;
        if (d < dmin) f += 2.5 * (dmin - d);
        if (o.link === i || b.link === j) {
          var L0 = (b.r + o.r) * 1.22;
          f -= 3.0 * (d - L0);
        }
        if (f !== 0) {
          b.ax += nx * f; b.ay += ny * f; b.az += nz * f;
          o.ax -= nx * f; o.ay -= ny * f; o.az -= nz * f;
        }
      }
    }

    for (i = 0; i < N; i++) {
      b = blobs[i];
      b.vx = (b.vx + b.ax * dt) * dragF;
      b.vy = (b.vy + b.ay * dt) * dragF;
      b.vz = (b.vz + b.az * dt) * dragF;
      b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
      var ymax = TOP_Y - b.r;
      if (b.y < Y_MIN) { b.y = Y_MIN; if (b.vy < 0) b.vy = 0; }
      if (b.y > ymax) { b.y = ymax; if (b.vy > 0) b.vy = 0; }
      var mr2 = maxRad(b.y, b.r);
      var rad = Math.sqrt(b.x * b.x + b.z * b.z);
      if (rad > mr2) {
        if (rad > 1e-6) {
          var s = mr2 / rad;
          var ux = b.x / rad, uz = b.z / rad;
          var vr = b.vx * ux + b.vz * uz;
          if (vr > 0) { b.vx -= vr * ux; b.vz -= vr * uz; }
          b.x *= s; b.z *= s;
        } else { b.x = 0; b.z = 0; }
      }
      var target = clamp(b.vy / 0.2, -1, 1) * b.r * 1.1;
      b.tail += (target - b.tail) * (1 - Math.exp(-2.5 * dt));
    }
    stepCount++;
  }

  function pairNeck(idx, i, j) {
    var a = blobs[i], b = blobs[j];
    var dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
    var d = Math.sqrt(dx * dx + dy * dy + dz * dz);
    var g = d / (a.r + b.r);
    var rad = Math.min(a.r, b.r) * 0.5 * clamp((2.1 - g) / 0.9, 0, 1);
    var k = idx * 4;
    neckAData[k] = a.x; neckAData[k + 1] = a.y; neckAData[k + 2] = a.z; neckAData[k + 3] = rad;
    neckBData[k] = b.x; neckBData[k + 1] = b.y; neckBData[k + 2] = b.z; neckBData[k + 3] = 0;
  }
  function poolNeck(idx, i) {
    var a = blobs[i];
    var h = (a.y - a.r) - POOL_Y;
    var rad = a.r * 0.40 * clamp(1 - h / 0.8, 0, 1);
    var k = idx * 4;
    neckAData[k] = a.x; neckAData[k + 1] = a.y; neckAData[k + 2] = a.z; neckAData[k + 3] = rad;
    neckBData[k] = a.x; neckBData[k + 1] = POOL_Y - 0.05; neckBData[k + 2] = a.z; neckBData[k + 3] = 0;
  }
  function packUniforms() {
    for (var i = 0; i < N; i++) {
      var b = blobs[i];
      var k = i * 4;
      blobData[k] = b.x; blobData[k + 1] = b.y; blobData[k + 2] = b.z; blobData[k + 3] = b.r;
      var k2 = (N + i) * 4;
      blobData[k2] = b.x;
      blobData[k2 + 1] = clamp(b.y - b.tail, Y_MIN - 0.1, TOP_Y - b.r * 0.62);
      blobData[k2 + 2] = b.z;
      blobData[k2 + 3] = b.r * 0.62;
    }
    pairNeck(0, 0, 1);
    pairNeck(1, 2, 3);
    poolNeck(2, 4);
    poolNeck(3, 5);
    poolNeck(4, 6);
  }

  // ------------------------------------------------------------------
  // Camera / framing
  // ------------------------------------------------------------------
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function norm(a) { var l = Math.sqrt(dot(a, a)) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }

  var camF = norm(sub(CAM_TGT, CAM_POS));
  var camR = norm(cross(camF, [0, 1, 0]));
  var camU = cross(camR, camF);
  var bounds = (function () {
    var xmin = 1e9, xmax = -1e9, ymin = 1e9, ymax = -1e9;
    var ys = [LAMP_Y0, (LAMP_Y0 + LAMP_Y1) * 0.5, LAMP_Y1];
    for (var k = 0; k < ys.length; k++) {
      for (var i = 0; i < 48; i++) {
        var a = i / 48 * TAU;
        var v = sub([Math.cos(a) * LAMP_R, ys[k], Math.sin(a) * LAMP_R], CAM_POS);
        var z = dot(v, camF);
        var px = dot(v, camR) / z, py = dot(v, camU) / z;
        if (px < xmin) xmin = px; if (px > xmax) xmax = px;
        if (py < ymin) ymin = py; if (py > ymax) ymax = py;
      }
    }
    return { cx: (xmin + xmax) * 0.5, cy: (ymin + ymax) * 0.5, w: xmax - xmin, h: ymax - ymin };
  })();

  // ------------------------------------------------------------------
  // Renderer
  // ------------------------------------------------------------------
  var canvas = document.getElementById('stage');
  var gl = null, program = null, vbo = null, vs = null, fs = null;
  var U = {};
  var destroyed = false;
  var paused = false;
  var rafId = 0;
  var lastTime = -1;
  var cssW = 0, cssH = 0;

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      if (window.console) console.error(gl.getShaderInfoLog(s));
      gl.deleteShader(s);
      return null;
    }
    return s;
  }

  function initGL() {
    var opts = { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' };
    gl = canvas.getContext('webgl2', opts) || canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts);
    if (!gl) return false;
    vs = compile(gl.VERTEX_SHADER, VERT);
    fs = compile(gl.FRAGMENT_SHADER, FRAG);
    if (!vs || !fs) return false;
    program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.bindAttribLocation(program, 0, 'aPos');
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      if (window.console) console.error(gl.getProgramInfoLog(program));
      return false;
    }
    gl.useProgram(program);
    vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    var names = ['uRes', 'uCenter', 'uScale', 'uCamPos', 'uCamR', 'uCamU', 'uCamF', 'uSimTime', 'uHeat'];
    for (var i = 0; i < names.length; i++) U[names[i]] = gl.getUniformLocation(program, names[i]);
    U.uBlob = gl.getUniformLocation(program, 'uBlob[0]') || gl.getUniformLocation(program, 'uBlob');
    U.uNeckA = gl.getUniformLocation(program, 'uNeckA[0]') || gl.getUniformLocation(program, 'uNeckA');
    U.uNeckB = gl.getUniformLocation(program, 'uNeckB[0]') || gl.getUniformLocation(program, 'uNeckB');
    gl.uniform3f(U.uCamPos, CAM_POS[0], CAM_POS[1], CAM_POS[2]);
    gl.uniform3f(U.uCamR, camR[0], camR[1], camR[2]);
    gl.uniform3f(U.uCamU, camU[0], camU[1], camU[2]);
    gl.uniform3f(U.uCamF, camF[0], camF[1], camF[2]);
    gl.uniform1f(U.uHeat, HEAT);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);
    return true;
  }

  function fitCanvas() {
    var w = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1);
    var h = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1);
    var scale = Math.min(window.devicePixelRatio || 1, 2);
    while (w * scale * h * scale > 2.2e6 && scale > 0.35) scale *= 0.92;
    var pw = Math.max(1, Math.round(w * scale));
    var ph = Math.max(1, Math.round(h * scale));
    if (canvas.width !== pw || canvas.height !== ph) {
      canvas.width = pw;
      canvas.height = ph;
    }
    cssW = w; cssH = h;
  }

  function render() {
    if (destroyed || !gl || !program) return;
    if (gl.isContextLost && gl.isContextLost()) return;
    var w = window.innerWidth, h = window.innerHeight;
    if (w !== cssW || h !== cssH) fitCanvas();
    var W = canvas.width, H = canvas.height;
    gl.viewport(0, 0, W, H);
    var s = Math.max(bounds.w / (FILL * W), bounds.h / (FILL * H));
    packUniforms();
    gl.useProgram(program);
    gl.uniform2f(U.uRes, W, H);
    gl.uniform2f(U.uCenter, bounds.cx, bounds.cy);
    gl.uniform1f(U.uScale, s);
    gl.uniform1f(U.uSimTime, simTime());
    gl.uniform4fv(U.uBlob, blobData);
    gl.uniform4fv(U.uNeckA, neckAData);
    gl.uniform4fv(U.uNeckB, neckBData);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function frame(now) {
    if (destroyed) return;
    rafId = window.requestAnimationFrame(frame);
    if (lastTime < 0) lastTime = now;
    var dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt < 0) dt = 0;
    if (dt > 0.1) dt = 0.1;
    if (!paused) {
      accumulator += dt;
      var guard = 0;
      while (accumulator >= STEP && guard < 12) {
        stepSim();
        accumulator -= STEP;
        guard++;
      }
      if (guard >= 12) accumulator = 0;
    }
    render();
  }

  function onResize() { if (!destroyed) { fitCanvas(); render(); } }
  function onLost(e) { e.preventDefault(); }
  function onRestored() {
    if (destroyed) return;
    program = null; vbo = null; vs = null; fs = null;
    if (initGL()) { fitCanvas(); render(); }
  }

  // ------------------------------------------------------------------
  // Benchmark API
  // ------------------------------------------------------------------
  var manifest = {
    id: 'lava-lamp',
    title: 'Lava Lamp',
    version: '1.0.0',
    deterministic: true,
    defaultSeed: DEFAULT_SEED,
    controls: [],
    stateKeys: ['heat', 'paletteIndex'],
    palettes: ['Ember'],
    api: ['getManifest', 'getState', 'setState', 'reset', 'advance', 'step', 'seek', 'pause', 'resume', 'render', 'destroy']
  };

  function getState() { return { heat: HEAT, paletteIndex: PALETTE_INDEX }; }

  function reset(seed) {
    if (destroyed) return getState();
    seedInit(seed === undefined || seed === null ? DEFAULT_SEED : seed);
    accumulator = 0;
    lastTime = -1;
    render();
    return getState();
  }

  function advance(seconds) {
    if (destroyed) return getState();
    var s = Number(seconds);
    if (!isFinite(s) || s <= 0) s = STEP;
    var n = Math.max(1, Math.round(s / STEP));
    if (n > 600000) n = 600000;
    for (var i = 0; i < n; i++) stepSim();
    render();
    return getState();
  }

  function seek(seconds) {
    if (destroyed) return getState();
    var s = Number(seconds);
    if (!isFinite(s) || s < 0) s = 0;
    seedInit(seedValue);
    var n = Math.min(600000, Math.round(s / STEP));
    for (var i = 0; i < n; i++) stepSim();
    accumulator = 0;
    lastTime = -1;
    render();
    return getState();
  }

  function destroy() {
    if (destroyed) return;
    destroyed = true;
    if (rafId) window.cancelAnimationFrame(rafId);
    rafId = 0;
    window.removeEventListener('resize', onResize);
    canvas.removeEventListener('webglcontextlost', onLost);
    canvas.removeEventListener('webglcontextrestored', onRestored);
    if (gl) {
      try {
        gl.bindBuffer(gl.ARRAY_BUFFER, null);
        gl.useProgram(null);
        if (vbo) gl.deleteBuffer(vbo);
        if (program) gl.deleteProgram(program);
        if (vs) gl.deleteShader(vs);
        if (fs) gl.deleteShader(fs);
        var ext = gl.getExtension('WEBGL_lose_context');
        if (ext) ext.loseContext();
      } catch (e) { /* already released */ }
    }
    gl = null; program = null; vbo = null; vs = null; fs = null;
    if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
  }

  var api = {
    manifest: manifest,
    getManifest: function () { return manifest; },
    getState: getState,
    setState: function () { return getState(); },
    reset: reset,
    advance: advance,
    step: function (dt) { return advance(dt === undefined ? STEP : dt); },
    seek: seek,
    pause: function () { paused = true; },
    resume: function () { paused = false; lastTime = -1; },
    render: render,
    destroy: destroy
  };

  // ------------------------------------------------------------------
  // Boot
  // ------------------------------------------------------------------
  seedInit(DEFAULT_SEED);
  var ok = false;
  try { ok = initGL(); } catch (e) { ok = false; if (window.console) console.error(e); }
  window.addEventListener('resize', onResize);
  canvas.addEventListener('webglcontextlost', onLost, false);
  canvas.addEventListener('webglcontextrestored', onRestored, false);
  fitCanvas();
  if (ok) render();
  rafId = window.requestAnimationFrame(frame);

  window.BridgeBench = api;
  window.bridgeBench = api;
  window.__bridgeBench = api;
  window.__BRIDGEBENCH__ = api;
  window.benchmark = api;
  try { window.dispatchEvent(new Event('bridgebench:ready')); } catch (e) { /* older engines */ }
})();
</script>
</body>
</html>
