<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meridian-9 Launch — Halcyon Aerospace</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --sans:"Avenir Next","Futura","Century Gothic","Segoe UI","Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;font-family:var(--sans)}
  #gl{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  /* ---- lower third ---- */
  #hud{position:fixed;left:0;right:0;bottom:0;padding:0 4vw 3.2vh;pointer-events:none;
       background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0));transition:opacity .4s}
  #hud.off{opacity:0}
  .lt{display:flex;align-items:flex-end;justify-content:space-between;gap:3vw;padding-top:9vh}
  .brand .wm{font-weight:600;font-size:clamp(15px,1.5vw,26px);letter-spacing:.52em}
  .brand .sub{margin-top:.5em;font-size:clamp(9px,.72vw,12px);letter-spacing:.3em;opacity:.7}
  .lbl{font-size:clamp(8px,.66vw,11px);letter-spacing:.28em;opacity:.62;margin-bottom:.35em;text-transform:uppercase}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(14px,1.45vw,24px);font-weight:500;letter-spacing:.02em;white-space:nowrap}
  .num small{font-size:.55em;opacity:.6;margin-left:.45em;letter-spacing:.12em}
  .clock{text-align:center}
  .clock .big{font-size:clamp(22px,2.6vw,44px);font-weight:400}
  .tele{display:flex;gap:2.6vw;text-align:right}
  .track{position:relative;height:1px;background:rgba(255,255,255,.22);margin-top:2.2vh}
  .track i{position:absolute;top:-3px;width:1px;height:7px;background:rgba(255,255,255,.6)}
  .track b{position:absolute;top:8px;transform:translateX(-50%);font-weight:400;font-size:clamp(7px,.56vw,10px);letter-spacing:.22em;opacity:.5}
  #prog{position:absolute;left:0;top:-1px;height:3px;width:0;background:#fff}
  /* ---- controls ---- */
  #controls{position:fixed;top:14px;right:16px;display:flex;gap:6px;opacity:.55;transition:opacity .2s}
  #controls:hover{opacity:1}
  button{font:500 10px var(--sans);letter-spacing:.2em;color:#fff;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.35);
         padding:6px 10px;border-radius:2px;cursor:pointer}
  button:hover{background:rgba(255,255,255,.16)}
  #debug{position:fixed;top:14px;left:16px;width:300px;padding:12px 14px;background:rgba(8,10,12,.78);border:1px solid rgba(255,255,255,.18);
         font:11px var(--mono);line-height:1.9;border-radius:3px}
  #debug[hidden]{display:none}
  #debug input[type=range]{width:100%}
  #debug label{display:block;cursor:pointer}
  #debug h4{margin:0 0 4px;font:600 10px var(--sans);letter-spacing:.3em}
  #err{position:fixed;inset:auto 0 45% 0;text-align:center;font:13px var(--mono);color:#f88;display:none}
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div class="lt">
    <div class="brand">
      <div class="wm">HALCYON</div>
      <div class="sub">MERIDIAN-9 &nbsp;·&nbsp; FLIGHT 27 &nbsp;·&nbsp; DAWNLINE</div>
    </div>
    <div class="clock">
      <div class="lbl" id="evt">TERMINAL COUNT</div>
      <div class="num big" id="clk">T−00:00:10</div>
    </div>
    <div class="tele">
      <div><div class="lbl">Altitude</div><div class="num"><span id="alt">0.0</span><small>KM</small></div></div>
      <div><div class="lbl">Speed</div><div class="num"><span id="spd">0</span><small>KM/H</small></div></div>
      <div><div class="lbl">Stage</div><div class="num" id="stg">1</div></div>
    </div>
  </div>
  <div class="track" id="track"><div id="prog"></div></div>
</div>

<div id="controls">
  <button id="bSpeed" title="Time scale">1×</button>
  <button id="bQual" title="Quality">HIGH</button>
  <button id="bSound" title="Sound">SOUND OFF</button>
</div>

<div id="debug" hidden>
  <h4>DEBUG &nbsp;(D)</h4>
  <div>T <span id="dT">-10.0</span> s &nbsp; <span id="dShot"></span> &nbsp; <span id="dFps"></span> fps</div>
  <input type="range" id="dScrub" min="-10" max="160" step="0.1" value="-10">
  <label><input type="checkbox" id="dPause"> pause (space)</label>
  <label><input type="checkbox" id="dLight" checked> plume light</label>
  <label><input type="checkbox" id="dBloom" checked> bloom</label>
  <label><input type="checkbox" id="dHeat" checked> heat distortion</label>
  <label><input type="checkbox" id="dFilm" checked> vignette / grain / lens dirt</label>
  <label><input type="checkbox" id="dHud" checked> HUD</label>
</div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Sky } from 'three/addons/objects/Sky.js';

window.addEventListener('error', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = String(e.message || e); });

/* =====================================================================================
   HELPERS
   ===================================================================================== */
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const sat = x => clamp(x, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = sat((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const mod = (a, b) => ((a % b) + b) % b;
const D2R = Math.PI / 180;
function mulberry(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// deterministic smooth wobble (sum of incommensurate sines) — used for camera shake / operator wander
const wob = (t, s) => Math.sin(t * 1.7 + s) * 0.5 + Math.sin(t * 2.9 + s * 2.3) * 0.3 + Math.sin(t * 5.3 + s * 4.1) * 0.2;
// deterministic per-particle random table
const RND = new Float32Array(8192 * 8);
{ const r = mulberry(90210); for (let i = 0; i < RND.length; i++) RND[i] = r(); }
const R = (i, k) => RND[(i * 8 + k) % RND.length];

/* =====================================================================================
   TIMELINE  — deterministic T-10 → T+160 s, everything below is a pure function of T
   ===================================================================================== */
const T0 = -10, T1 = 160, T_IGN = -3, T_MAXQ = 70, T_MECO = 150, T_SEP = 153, T_SES = 155.5;
const G = 9.81;
const UP = new THREE.Vector3(0, 1, 0);
const DOWN = new THREE.Vector3(-0.96, 0, -0.28).normalize();          // downrange (launch azimuth)
const PERP = new THREE.Vector3(DOWN.z, 0, -DOWN.x);                    // horizontal, perpendicular to ground track (camera side)
const PITCH_AXIS = new THREE.Vector3().crossVectors(UP, DOWN).normalize();
const PAD = new THREE.Vector3(0, 7.6, 0);                              // vehicle base at rest (on the launch mount)
const DECK_Y = 6.0;

// gravity turn: a few degrees per ten seconds, 48° from vertical by MECO
function pitchAt(t) { return 48 * D2R * Math.pow(sat((t - 7) / 143), 1.1); }
// thrust acceleration: 1.25 g at liftoff rising to ~3.2 g at MECO; second stage ~0.85 g after SES
function thrustAcc(t) {
  if (t <= T_MECO + 0.3) return G * (1.25 + 2.0 * Math.pow(sat(t / 150), 1.5)) * (1 - smooth(T_MECO - 0.4, T_MECO + 0.2, t));
  return G * 0.85 * smooth(T_SES, T_SES + 1.2, t);
}
function throttle(t) { return t < T_IGN ? 0 : smooth(T_IGN, T_IGN + 1.9, t) * (1 - smooth(T_MECO - 0.4, T_MECO + 0.2, t)); }
function throttle2(t) { return t < T_SES ? 0 : smooth(T_SES, T_SES + 0.9, t); }

// pre-integrated trajectory table (downrange x, altitude y, velocities)
const DT = 0.02, NSTEP = Math.ceil(T1 / DT) + 3;
const trX = new Float64Array(NSTEP), trY = new Float64Array(NSTEP), trVX = new Float64Array(NSTEP), trVY = new Float64Array(NSTEP);
{
  let x = 0, y = 0, vx = 0, vy = 0;
  for (let i = 0; i < NSTEP; i++) {
    trX[i] = x; trY[i] = y; trVX[i] = vx; trVY[i] = vy;
    const t = i * DT, th = pitchAt(t), a = thrustAcc(t);
    vx += a * Math.sin(th) * DT; vy += (a * Math.cos(th) - G) * DT;
    x += vx * DT; y += vy * DT;
    if (y < 0) { y = 0; vy = Math.max(0, vy); }
  }
}
function sample(t, o) {
  const f = clamp(t, 0, T1) / DT, i = Math.min(NSTEP - 2, Math.floor(f)), k = f - i;
  o.x = lerp(trX[i], trX[i + 1], k); o.y = lerp(trY[i], trY[i + 1], k);
  o.vx = lerp(trVX[i], trVX[i + 1], k); o.vy = lerp(trVY[i], trVY[i + 1], k);
  return o;
}
const _S = { x: 0, y: 0, vx: 0, vy: 0 };
function posAt(t, v) { sample(t, _S); return v.copy(PAD).addScaledVector(DOWN, _S.x).addScaledVector(UP, _S.y); }
function axisAt(t, v) { const th = pitchAt(clamp(t, 0, T1)); return v.copy(UP).multiplyScalar(Math.cos(th)).addScaledVector(DOWN, Math.sin(th)); }
// altitude → plume expansion (ambient pressure falls roughly exponentially, scale height ~7.4 km)
function expandAt(alt) { return Math.pow(1 - Math.exp(-alt / 7400), 2.2); }

/* =====================================================================================
   RENDERER + shared render targets
   ===================================================================================== */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', stencil: false });
renderer.setPixelRatio(1);                                   // we size the drawing buffer ourselves (DPR capped at 2)
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;          // applied by OutputPass
renderer.toneMappingExposure = 0.72;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(19, 1, 1, 300000);
const Q = { high: true, pf: 1 };                             // quality state (pf = particle-count factor)

// opaque scene is rendered ONCE into this target; its depth texture feeds every soft particle / plume shader
const depthTex = new THREE.DepthTexture(4, 4);
const sceneRT = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, depthTexture: depthTex });
const sharedU = {
  uDepth: { value: depthTex }, uRes: { value: new THREE.Vector2(4, 4) },
  uNear: { value: 1 }, uFar: { value: 300000 }, uTime: { value: 0 }
};
const DEPTH_GLSL = `
  uniform sampler2D uDepth; uniform vec2 uRes; uniform float uNear; uniform float uFar;
  float sceneDist(){ float d = texture2D(uDepth, gl_FragCoord.xy / uRes).x; return (uNear * uFar) / (uFar - d * (uFar - uNear)); }
`;

/* =====================================================================================
   PROCEDURAL TEXTURES (zero asset files)
   ===================================================================================== */
const FONT = '"Avenir Next","Futura","Century Gothic","Segoe UI","Helvetica Neue",Arial,sans-serif';
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAX_ANISO;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function spaced(g, txt, x, y, sp) { for (const ch of txt) { g.fillText(ch, x, y); x += g.measureText(ch).width + sp; } return x; }

// tileable fBm value noise, 4 decorrelated channels — used by plume sheath, smoke sprites, lens dirt
function makeNoiseTex(size) {
  const rnd = mulberry(1234);
  const layer = cells => {
    const g = new Float32Array(cells * cells); for (let i = 0; i < g.length; i++) g[i] = rnd();
    return (x, y) => {
      const fx = x * cells, fy = y * cells, x0 = Math.floor(fx), y0 = Math.floor(fy);
      let tx = fx - x0, ty = fy - y0; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
      const x1 = (x0 + 1) % cells, y1 = (y0 + 1) % cells;
      return lerp(lerp(g[y0 * cells + x0], g[y0 * cells + x1], tx), lerp(g[y1 * cells + x0], g[y1 * cells + x1], tx), ty);
    };
  };
  const chans = [[4, 8, 16, 32], [6, 12, 24, 48], [16, 32, 64], [3, 6, 12]].map(cs => cs.map(layer));
  const data = new Uint8Array(size * size * 4);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const u = x / size, v = y / size;
    for (let c = 0; c < 4; c++) {
      let s = 0, a = 0.5, n = 0;
      for (const L of chans[c]) { s += L(u, v) * a; n += a; a *= 0.5; }
      data[(y * size + x) * 4 + c] = Math.round(sat((s / n - 0.5) * 1.7 + 0.5) * 255);
    }
  }
  const t = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true; t.needsUpdate = true;
  return t;
}
const noiseTex = makeNoiseTex(256);

const PAINT = '#e3e1db';
// first stage: paint weathering, weld seams, frost band on the LOX tank, soot near the base, vertical wordmark
const texS1 = canvasTex(512, 2048, (g, w, h) => {
  const rnd = mulberry(11), H = 41.2, Y = m => (1 - m / H) * h;
  g.fillStyle = PAINT; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1500; i++) { g.fillStyle = rnd() < 0.6 ? 'rgba(60,55,50,0.035)' : 'rgba(255,255,255,0.05)'; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 3, 30 + rnd() * 260); }
  for (let i = 0; i < 5200; i++) {                                    // frost: ragged, whiter band over the LOX tank
    const m = 17.5 + 22 * rnd(), edge = Math.min(m - 17.5, 39.5 - m);
    if (rnd() * 3 > edge + 0.4) continue;
    const s = 8 + rnd() * 34; g.fillStyle = 'rgba(250,252,255,0.07)'; g.fillRect(rnd() * w - s / 2, Y(m) - s / 2, s, s * 0.6);
  }
  g.fillStyle = 'rgba(50,50,55,0.35)'; for (const m of [3.2, 9.5, 16.8, 24, 31, 38.4]) g.fillRect(0, Y(m), w, 2);
  g.fillStyle = 'rgba(50,50,55,0.13)'; for (const u of [0.31, 0.81]) g.fillRect(u * w, 0, 2, h);
  const lg = g.createLinearGradient(0, Y(0), 0, Y(10));                 // soot gradient
  lg.addColorStop(0, 'rgba(22,20,18,0.86)'); lg.addColorStop(0.35, 'rgba(30,27,24,0.45)'); lg.addColorStop(1, 'rgba(30,27,24,0)');
  g.fillStyle = lg; g.fillRect(0, Y(10), w, Y(0) - Y(10));
  for (let i = 0; i < 280; i++) { const len = (2 + rnd() * 14) / H * h; g.fillStyle = 'rgba(20,18,16,0.07)'; g.fillRect(rnd() * w, h - len, 2 + rnd() * 7, len); }
  for (const u0 of [0.04, 0.54]) {                                    // wordmark + emblem (fictional)
    g.save(); g.translate(u0 * w + 26, Y(21.5)); g.rotate(-Math.PI / 2);
    g.fillStyle = '#16222e'; g.font = '600 58px ' + FONT; g.textBaseline = 'middle'; spaced(g, 'HALCYON', 0, 0, 16); g.restore();
    const cx = u0 * w + 26, cy = Y(31.6);
    g.strokeStyle = '#16222e'; g.lineWidth = 5; g.beginPath(); g.arc(cx, cy, 24, 0, Math.PI * 2); g.stroke();
    g.fillStyle = '#16222e'; g.fillRect(cx - 34, cy + 5, 68, 5);
  }
});
const texS2 = canvasTex(512, 512, (g, w, h) => {
  const rnd = mulberry(12);
  g.fillStyle = PAINT; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 400; i++) { g.fillStyle = rnd() < 0.6 ? 'rgba(60,55,50,0.035)' : 'rgba(255,255,255,0.05)'; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 3, 20 + rnd() * 120); }
  for (let i = 0; i < 1400; i++) { const y = h * (0.30 + 0.5 * rnd()), s = 8 + rnd() * 30; g.fillStyle = 'rgba(250,252,255,0.07)'; g.fillRect(rnd() * w, y, s, s * 0.6); }
  g.fillStyle = 'rgba(50,50,55,0.35)'; g.fillRect(0, h * 0.27, w, 2); g.fillRect(0, h * 0.82, w, 2);
});
const texFair = canvasTex(1024, 320, (g, w, h) => {
  const rnd = mulberry(13);
  g.fillStyle = PAINT; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 500; i++) { g.fillStyle = rnd() < 0.6 ? 'rgba(60,55,50,0.03)' : 'rgba(255,255,255,0.05)'; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 3, 20 + rnd() * 160); }
  g.fillStyle = 'rgba(50,50,55,0.22)'; g.fillRect(w * 0.25, 0, 2, h); g.fillRect(w * 0.75, 0, 2, h);
  for (const x0 of [30, 30 + w / 2]) {
    g.strokeStyle = '#16222e'; g.lineWidth = 6; g.beginPath(); g.arc(x0 + 40, 150, 34, 0, Math.PI * 2); g.stroke();
    g.fillStyle = '#16222e'; g.fillRect(x0 - 6, 158, 92, 6);
    g.font = '600 30px ' + FONT; g.textBaseline = 'middle'; spaced(g, 'MERIDIAN-9', x0 + 108, 152, 7);
  }
});
const texGrid = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#0d0d0e'; g.fillRect(0, 0, w, h); g.strokeStyle = '#4c4c50'; g.lineWidth = 3;
  for (let i = 0; i <= w; i += 16) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.moveTo(0, i); g.lineTo(w, i); g.stroke(); }
});
const GROUND_SIZE = 90000;
const texGround = canvasTex(1024, 1024, (g, w, h) => {              // coastal scrub / sand, tileable
  const rnd = mulberry(5), cols = ['#4d5538', '#3f482f', '#7b7458', '#8d8468', '#59603f', '#6f6a4c'];
  g.fillStyle = '#6b6650'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 7000; i++) {
    const x = rnd() * w, y = rnd() * h, r = 1.5 + rnd() * rnd() * 22;
    g.fillStyle = cols[(rnd() * cols.length) | 0]; g.globalAlpha = 0.25 + rnd() * 0.3;
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
      const px = x + ox * w, py = y + oy * h;
      if (px < -r || px > w + r || py < -r || py > h + r) continue;
      g.beginPath(); g.arc(px, py, r, 0, 6.2832); g.fill();
    }
  }
  g.globalAlpha = 1;
}, [GROUND_SIZE / 90, GROUND_SIZE / 90]);
const texConc = canvasTex(512, 512, (g, w, h) => {
  const rnd = mulberry(6);
  g.fillStyle = '#8f8d86'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) { g.fillStyle = rnd() < 0.5 ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.06)'; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 3, 1 + rnd() * 3); }
  for (let i = 0; i < 40; i++) { g.fillStyle = 'rgba(30,28,25,0.08)'; g.beginPath(); g.arc(rnd() * w, rnd() * h, 10 + rnd() * 50, 0, 6.2832); g.fill(); }
  g.fillStyle = 'rgba(40,40,40,0.5)'; g.fillRect(0, 0, w, 2); g.fillRect(0, 256, w, 2); g.fillRect(0, 0, 2, h); g.fillRect(256, 0, 2, h);
}, [150 / 12, 150 / 12]);

/* =====================================================================================
   SKY  — Preetham analytic sky, low dawn sun; PMREM-filtered for image-based lighting
   ===================================================================================== */
const SUN_DIR = new THREE.Vector3(-0.8, 0.13, 0.55).normalize();     // behind-left of the press site
function makeSky() {
  const s = new Sky(); s.scale.setScalar(10000);
  const u = s.material.uniforms;
  u.turbidity.value = 5.5; u.rayleigh.value = 2.4; u.mieCoefficient.value = 0.004; u.mieDirectionalG.value = 0.82;
  u.sunPosition.value.copy(SUN_DIR);
  return s;
}
const sky = makeSky(); sky.frustumCulled = false; scene.add(sky);
const fogColor = new THREE.Color(0.62, 0.6, 0.62);
{
  const envScene = new THREE.Scene(); envScene.add(makeSky());
  const eg = new THREE.Mesh(new THREE.CircleGeometry(90, 24), new THREE.MeshBasicMaterial({ color: 0x3a3428 }));
  eg.rotation.x = -Math.PI / 2; eg.position.y = -0.5; envScene.add(eg);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(envScene).texture;
  // fog colour = the sky model's own horizon colour, sampled in the main viewing direction
  try {
    const rt = new THREE.WebGLRenderTarget(4, 4), cam = new THREE.PerspectiveCamera(3, 1, 0.1, 100);
    cam.lookAt(0.15, 0.045, -1); cam.updateMatrixWorld();
    renderer.setRenderTarget(rt); renderer.render(envScene, cam);

  sharedU.uRes.value.set(w, h);

}
function setQuality(high) {
  Q.high = high; Q.pf = high ? 1 : 0.5;
  for (const m of plumeMeshes) m.geometry = high ? plumeGeoHi : plumeGeoLo;
  heatPass.enabled = high && $('dHeat').checked;
  $('bQual').textContent = high ? 'HIGH' : 'LOW';

}
window.addEventListener('resize', resize);

/* =====================================================================================
   HUD  — lower third: wordmark, T-clock, altitude, velocity, stage
   ===================================================================================== */
const hud = { clk: $('clk'), alt: $('alt'), spd: $('spd'), stg: $('stg'), evt: $('evt'), prog: $('prog'), last: {} };
{
  const tr = $('track');
  for (const [t, name] of [[0, 'LIFTOFF'], [T_MAXQ, 'MAX-Q'], [T_MECO, 'MECO'], [T_SES, '']]) {
    const x = ((t - T0) / (T1 - T0) * 100) + '%';
    const i = document.createElement('i'); i.style.left = x; tr.appendChild(i);
    if (name) { const b = document.createElement('b'); b.style.left = x; b.textContent = name; tr.appendChild(b); }
  }
}
function setTxt(k, v) { if (hud.last[k] !== v) { hud.last[k] = v; hud[k].textContent = v; } }
const p2 = n => String(n).padStart(2, '0');
function updateHUD(T, st) {
  const s = T < 0 ? Math.ceil(-T) : Math.floor(T);
  setTxt('clk', 'T' + (T < 0 ? '−' : '+') + '00:' + p2(Math.floor(s / 60)) + ':' + p2(s % 60));
  setTxt('alt', (st.y / 1000).toFixed(1));
  setTxt('spd', Math.round(Math.hypot(st.vx, st.vy) * 3.6).toLocaleString('en-US').replace(/,/g, ' '));
  setTxt('stg', T < T_SEP ? '1' : '2');
  setTxt('evt', T < T_IGN ? 'TERMINAL COUNT' : T < 0 ? 'IGNITION' : T < 8 ? 'LIFTOFF' : T < 58 ? 'ASCENT' : T < 65 ? 'SUPERSONIC' :
    T < 77 ? 'MAX-Q' : T < T_MECO ? 'ASCENT' : T < T_SEP ? 'MECO' : T < T_SES ? 'STAGE SEPARATION' : 'SECOND ENGINE START');
  hud.prog.style.width = ((T - T0) / (T1 - T0) * 100).toFixed(2) + '%';
}

/* =====================================================================================
   AUDIO  — fully synthesised (Web Audio): rumble, roar, crackle, doppler fall; optional speech call-outs
   ===================================================================================== */
let AC = null, aud = null, audioOn = false;
function initAudio() {
  if (AC) return;
  const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
  AC = new Ctx(); const sr = AC.sampleRate, N = Math.floor(sr * 4);
  const brown = AC.createBuffer(1, N, sr), white = AC.createBuffer(1, N, sr), crack = AC.createBuffer(1, N, sr);
  const b = brown.getChannelData(0), w = white.getChannelData(0), c = crack.getChannelData(0);
  let last = 0, env = 0;
  for (let i = 0; i < N; i++) {
    const x = Math.random() * 2 - 1; last = (last + 0.02 * x) / 1.02; b[i] = last * 3.5; w[i] = x * 0.5;
    if (Math.random() < 0.0009) env = Math.random();                 // sparse impulsive bursts → crackle
    env *= 0.99896; c[i] = (Math.random() * 2 - 1) * env * env;
  }
  const dlt = b[N - 1] - b[0]; for (let i = 0; i < N; i++) b[i] -= dlt * i / (N - 1);     // seamless loop
  const src = buf => { const s = AC.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; };
  const filt = (type, f, q) => { const n = AC.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q; return n; };
  const gain = v => { const n = AC.createGain(); n.gain.value = v; return n; };
  const master = gain(0), comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
  const s1 = src(brown), s2 = src(white), s3 = src(crack);
  const lp = filt('lowpass', 120, 0.7), bp = filt('bandpass', 400, 0.5), cb = filt('bandpass', 1400, 0.8);
  const g1 = gain(0), g2 = gain(0), g3 = gain(0);
  s1.connect(lp); lp.connect(g1); g1.connect(master);
  s2.connect(bp); bp.connect(g2); g2.connect(master);
  s3.connect(cb); cb.connect(g3); g3.connect(master);
  aud = { master, s1, s2, s3, lp, bp, g1, g2, g3 };
}
const _l1 = new THREE.Vector3(), _l2 = new THREE.Vector3();
function updateAudio(T, fade) {
  if (!AC || !aud) return;
  const now = AC.currentTime, set = (p, v) => p.setTargetAtTime(v, now, 0.06);
  const d = posAt(T, _l1).distanceTo(CAM_A), d0 = posAt(T - 0.2, _l2).distanceTo(CAM_A);
  const te = T - d / 340;                                             // sound left the vehicle this long ago
  const th = throttle(te) + 0.25 * throttle2(te);
  const att = 1 / (1 + d / 700), elev = Math.asin(sat((_l1.y - CAM_A.y) / Math.max(d, 1))) / D2R;
  const rate = clamp(1 / (1 + Math.max(0, (d - d0) / 0.2) / 340), 0.45, 1);                // doppler-style pitch fall
  set(aud.g1.gain, th * att * 1.1 + 0.012); set(aud.lp.frequency, 60 + 380 * att);
  set(aud.g2.gain, th * att * att * 0.55 + 0.004); set(aud.bp.frequency, 220 + 520 * att);
  set(aud.g3.gain, th * smooth(8, 50, elev) * Math.min(1, 1.7 * att) * 0.75);              // crackle peaks as it passes overhead
  set(aud.s1.playbackRate, rate); set(aud.s2.playbackRate, rate); set(aud.s3.playbackRate, rate);
  set(aud.master.gain, audioOn ? 0.85 * fade : 0);
}
const CUES = [[-10, 'T minus ten'], [-9, 'nine'], [-8, 'eight'], [-7, 'seven'], [-6, 'six'], [-5, 'five'], [-4, 'four'], [-3, 'three'], [-2, 'two'], [-1, 'one'],
  [0, 'Liftoff'], [T_MAXQ, 'Max Q'], [T_MECO, 'MECO'], [T_SEP + 0.4, 'Stage separation'], [T_SES + 0.6, 'Second engine start']];
function speakCues(prev, T) {
  if (!audioOn || !('speechSynthesis' in window) || T - prev <= 0 || T - prev > 0.5) return;
  for (const [t, txt] of CUES) if (prev < t && T >= t) {
    if (timeScale > 1 && t < 0 && t > -10) continue;                  // no room for a per-second count at 2×
    try { const u = new SpeechSynthesisUtterance(txt); u.volume = 0.32; u.rate = 1.15; u.pitch = 0.8; window.speechSynthesis.speak(u); } catch (e) { /* omitted */ }
  }
}

/* =====================================================================================
   DEBUG  — hidden panel (press D): scrubber, pause, plume light / bloom / heat / film / HUD toggles
   ===================================================================================== */
let T = T0, playing = true, timeScale = 1, scrubbing = false, plumeLightOn = true;
const dbg = { panel: $('debug'), T: $('dT'), shot: $('dShot'), fps: $('dFps'), scrub: $('dScrub') };
function firstGesture() { initAudio(); if (AC && AC.state === 'suspended') AC.resume(); if (!audioOn && !firstGesture.done) { audioOn = true; $('bSound').textContent = 'SOUND ON'; } firstGesture.done = true; }
window.addEventListener('pointerdown', firstGesture);
window.addEventListener('keydown', e => {
  firstGesture();
  if (e.key === 'd' || e.key === 'D' || e.key === '`') dbg.panel.hidden = !dbg.panel.hidden;
  if (e.key === ' ') { playing = !playing; $('dPause').checked = !playing; e.preventDefault(); }
});
$('bSpeed').addEventListener('click', () => { timeScale = timeScale === 1 ? 2 : 1; $('bSpeed').textContent = timeScale + '×'; });
$('bQual').addEventListener('click', () => setQuality(!Q.high));
$('bSound').addEventListener('click', e => { e.stopPropagation(); initAudio(); if (AC && AC.state === 'suspended') AC.resume(); audioOn = firstGesture.done ? !audioOn : true; firstGesture.done = true; $('bSound').textContent = audioOn ? 'SOUND ON' : 'SOUND OFF'; if (!audioOn && 'speechSynthesis' in window) window.speechSynthesis.cancel(); });
$('bSound').addEventListener('pointerdown', e => e.stopPropagation());
dbg.scrub.addEventListener('pointerdown', () => { scrubbing = true; });
window.addEventListener('pointerup', () => { scrubbing = false; });
dbg.scrub.addEventListener('input', () => { T = parseFloat(dbg.scrub.value); });
$('dPause').addEventListener('change', e => { playing = !e.target.checked; });
$('dLight').addEventListener('change', e => { plumeLightOn = e.target.checked; });
$('dBloom').addEventListener('change', e => { bloomPass.enabled = e.target.checked; });
$('dHeat').addEventListener('change', e => { heatPass.enabled = e.target.checked && Q.high; });
$('dFilm').addEventListener('change', e => { filmMat.uniforms.uFilm.value = e.target.checked ? 1 : 0; });
$('dHud').addEventListener('change', e => { $('hud').classList.toggle('off', !e.target.checked); });

/* =====================================================================================
   MAIN LOOP  — evaluate the timeline at T, pose everything, render
   ===================================================================================== */
const ST = { x: 0, y: 0, vx: 0, vy: 0 };
const qPitch = new THREE.Quaternion(), qRoll = new THREE.Quaternion();
const _eng = new THREE.Vector3(), _ax = new THREE.Vector3(), _L = new THREE.Vector3(), _right = new THREE.Vector3(), _q = new THREE.Vector3();
function update(T) {
  // ---- vehicle pose ----
  sample(T, ST);
  const th = pitchAt(clamp(T, 0, T1)), speed = Math.hypot(ST.vx, ST.vy);
  posAt(T, vehicle.position); axisAt(T, _ax);
  qPitch.setFromAxisAngle(PITCH_AXIS, th);
  qRoll.setFromAxisAngle(UP, -0.9 * smooth(3, 11, T));                 // roll programme to launch azimuth
  vehicle.quaternion.copy(qPitch).multiply(qRoll);
  // ---- staging ----
  const ds = Math.max(0, T - T_SEP), d2 = Math.max(0, T - T_SES);
  const sepOff = 3.5 * ds + 0.5 * 8.3 * d2 * d2;

  vehicle.updateMatrixWorld(true);
  // ---- engines / plume ----
  const thr = throttle(T), thr2 = throttle2(T);
  const flick = 0.86 + 0.07 * Math.sin(T * 41.3) + 0.05 * Math.sin(T * 67.9 + 1.7) + 0.04 * Math.sin(T * 23.1 + 0.6);
  const ex = expandAt(ST.y), pw = thr * flick;
  const dia = smooth(-1, 8, T) * (0.4 + 0.6 * smooth(4, 28, T)) * (1 - smooth(50, 95, T));   // diamonds sharpen, then fade with expansion
  const green = smooth(T_IGN, T_IGN + 0.15, T) * (1 - smooth(T_IGN + 0.3, T_IGN + 0.9, T)) * 0.8;
  plume1.set(55 + 0.12 * Math.min(speed, 400) + 520 * ex, ex, pw, dia, green);
  plume2.set(240, 1, thr2 * flick * (0.9 + 2.2 * Math.exp(-d2 * 3)), 0, 0);
  glowMat.color.setRGB(0.02 + 14 * pw, 0.02 + 10 * pw, 0.02 + 6.5 * pw);
  glow2Mat.color.setRGB(0.01 + 9 * thr2, 0.01 + 8 * thr2, 0.01 + 8 * thr2);
  matVac.emissiveIntensity = 2.2 * thr2;
  _eng.copy(vehicle.position).addScaledVector(_ax, -1.3);
  const lightPw = plumeLightOn ? pw : 0;
  pl1.position.copy(_eng).addScaledVector(_ax, -5); pl1.intensity = 900 * lightPw;
  _L.copy(_eng).addScaledVector(_ax, -30); if (_L.y < 8.5) _L.y = 8.5;
  pl2.position.copy(_L); pl2.intensity = 6000 * lightPw;
  // ---- pad ----
  pad.visible = shot !== 3;
  strongback.rotation.z = 0.03 + 0.19 * smooth(-0.6, 3.2, T);          // throwback at liftoff
  renderer.shadowMap.autoUpdate = T < 25;
  // ---- camera, then camera-dependent uniforms ----
  updateCamera(T, ST, sepOff);
  pad.visible = shot !== 3;
  sky.position.copy(camera.position);
  sharedU.uNear.value = camera.near; sharedU.uFar.value = camera.far; sharedU.uTime.value = T + 20;
  spriteMat.uniforms.uSunView.value.copy(SUN_DIR).transformDirection(camera.matrixWorldInverse);
  // ---- particle effects ----
  updateVent(T); updateCloud(T, _L, lightPw); updateTrail(T); updateVapor(T); updateStage(T);
  // ---- heat distortion: capsule along the plume in screen space ----
  const hu = heatMat.uniforms; let hs = 0;
  if (thr > 0.01 && _q.copy(_eng).applyMatrix4(camera.matrixWorldInverse).z < 0) {
    const len = plume1.core.material.uniforms.uLen.value;
    _q.copy(_eng).project(camera); hu.uA.value.set(_q.x * 0.5 + 0.5, _q.y * 0.5 + 0.5);
    const ax0 = _q.x, ay0 = _q.y;
    _q.copy(_eng).addScaledVector(_ax, -len * 0.8).project(camera); hu.uB.value.set(_q.x * 0.5 + 0.5, _q.y * 0.5 + 0.5);
    _right.setFromMatrixColumn(camera.matrixWorld, 0);
    _q.copy(_eng).addScaledVector(_right, 14 * (1 + 8 * ex)).project(camera);
    hu.uRad.value = clamp(Math.hypot((_q.x - ax0) * camera.aspect, _q.y - ay0) * 0.5, 0.01, 0.35);
    hs = 0.0016 * pw;
  }
  hu.uStr.value = hs;
  // ---- film / fade ----
  const fade = smooth(T0, T0 + 1.4, T) * (1 - smooth(157.4, 159.8, T));
  filmMat.uniforms.uFade.value = fade;
  filmMat.uniforms.uDirt.value = pw * sat(1 - camera.position.distanceTo(_eng) / 1200) * 0.09;
  updateHUD(T, ST);

}

let lastNow = performance.now(), fpsAvg = 60, frameNo = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  const prev = T;
  if (playing && !scrubbing) T += dt * timeScale;
  if (T >= T1) { T = T0; if ('speechSynthesis' in window) window.speechSynthesis.cancel(); }
  if (playing && !scrubbing) speakCues(prev, T);
  const fade = update(T);
  updateAudio(T, fade);
  composer.render();
  // debug read-outs
  fpsAvg = lerp(fpsAvg, 1 / Math.max(dt, 1e-4), 0.05);
  if (!dbg.panel.hidden && (frameNo++ % 6 === 0)) {
    dbg.T.textContent = T.toFixed(1); dbg.shot.textContent = SHOT_NAMES[shot]; dbg.fps.textContent = fpsAvg.toFixed(0);
    if (!scrubbing) dbg.scrub.value = T.toFixed(1);

}
setQuality(true);
requestAnimationFrame(frame);
