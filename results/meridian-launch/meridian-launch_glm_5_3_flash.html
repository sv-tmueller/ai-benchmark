<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="dark"/>
<title>MERIDIAN-9 · Launch Coverage · Halcyon Aerospace</title>
<style>
/* ───────────────────────────── UI / HUD stylesheet ───────────────────────────── */
:root{
  --bg:#0b0e11; --ink:#eef2f4; --mut:#93a1ab; --dim:#5c6a73;
  --acc:#ffb454; --line:rgba(255,255,255,.16); --line2:rgba(255,255,255,.08);
  --panel:rgba(10,13,16,.55); --panel2:rgba(10,13,16,.78);
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --disp:"Bahnschrift","DIN Alternate","Franklin Gothic Medium","Arial Narrow","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--disp);color:var(--ink);font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
::selection{background:rgba(255,180,84,.35)}

/* ---------- HUD chrome ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20;font-family:var(--disp)}
.tag{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}
.hair{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border-radius:10px}

#camtag{position:absolute;top:16px;left:18px;display:flex;align-items:center;gap:10px;padding:9px 14px}
#camtag .rec{width:8px;height:8px;border-radius:50%;background:#ff4d3d;animation:blink 1.3s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
#camtag b{font-weight:600;letter-spacing:.14em;font-size:11px;color:var(--ink)}
#camtag span{font-family:var(--mono);font-size:10px;color:var(--acc);letter-spacing:.12em}

#brand{position:absolute;top:16px;right:18px;text-align:right;padding:9px 14px}
#brand b{display:block;font-weight:600;letter-spacing:.34em;font-size:11px}
#brand i{display:block;font-style:normal;margin-top:3px;font-size:9px;letter-spacing:.24em;color:var(--mut)}

/* lower third */
#lt{position:absolute;left:18px;bottom:18px;min-width:340px;padding:12px 16px 11px}
#lt .r1{display:flex;align-items:baseline;gap:14px}
#clock{font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#stagePill{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--acc);border:1px solid rgba(255,180,84,.4);padding:3px 8px;border-radius:5px}
#lt .r2{display:flex;gap:22px;margin-top:7px;padding-top:7px;border-top:1px solid var(--line2)}
#lt .r2 span{font-size:9px;letter-spacing:.2em;color:var(--mut)}
#lt .r2 b{display:block;font-family:var(--mono);font-weight:500;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px}
#statusV{margin-top:8px;font-size:10px;letter-spacing:.3em;color:var(--acc);text-transform:uppercase;transition:opacity .3s}

/* callout */
#callout{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-size:clamp(18px,3vw,32px);font-weight:600;letter-spacing:.42em;text-indent:.42em;color:#fff;opacity:0;text-shadow:0 1px 14px rgba(0,0,0,.65);transition:opacity .5s,letter-spacing 1.4s}
#callout.on{opacity:.92;letter-spacing:.5em}

/* control cluster */
#ctrls{position:absolute;right:18px;bottom:18px;display:flex;gap:8px;pointer-events:auto}
.ibtn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(9px);border-radius:9px;color:var(--mut);transition:color .15s,border-color .15s}
.ibtn:hover{color:var(--ink);border-color:rgba(255,255,255,.32)}
.ibtn.on{color:var(--acc);border-color:rgba(255,180,84,.5)}
.ibtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel);backdrop-filter:blur(9px)}
.seg button{padding:0 11px;font-family:var(--mono);font-size:11px;color:var(--mut);border-left:1px solid var(--line2)}
.seg button:first-child{border-left:0}
.seg button.on{color:var(--acc);background:rgba(255,180,84,.08)}

/* audio chip */
#sndChip{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);pointer-events:auto;display:flex;align-items:center;gap:9px;padding:10px 18px;font-size:10px;letter-spacing:.26em;color:var(--ink);cursor:pointer;transition:opacity .5s}
#sndChip svg{width:15px;height:15px;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round}
#sndChip.hide{opacity:0;pointer-events:none}

/* toast */
#toast{position:absolute;right:18px;bottom:70px;padding:9px 14px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--mut);opacity:0;transition:opacity .4s}
#toast.on{opacity:1}

/* fade */
#fade{position:fixed;inset:0;background:#000;opacity:1;pointer-events:none;z-index:40}

/* boot */
#boot{position:fixed;inset:0;background:var(--bg);z-index:100;display:grid;place-items:center;transition:opacity .8s}
#boot.off{opacity:0;pointer-events:none}
#boot .in{text-align:center;width:min(420px,80vw)}
#boot .mk{width:34px;height:34px;margin:0 auto 18px;stroke:var(--acc);fill:none;stroke-width:2}
#boot h1{font-size:22px;font-weight:600;letter-spacing:.5em;text-indent:.5em}
#boot p{margin-top:8px;font-size:9px;letter-spacing:.3em;color:var(--mut)}
#bar{margin:26px auto 10px;width:220px;height:2px;background:rgba(255,255,255,.12)}
#barF{height:100%;width:0%;background:var(--acc);transition:width .2s}
#bootMsg{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.1em;min-height:14px}

/* debug */
#dbg{position:fixed;top:70px;right:18px;width:264px;z-index:90;padding:14px 16px;pointer-events:auto;display:none}
#dbg.open{display:block}
#dbg h3{font-size:10px;letter-spacing:.3em;color:var(--acc);margin-bottom:12px}
#dbg .row{margin-bottom:11px}
#dbg label{display:block;font-size:9px;letter-spacing:.2em;color:var(--mut);margin-bottom:5px;text-transform:uppercase}
#dbg input[type=range]{width:100%;accent-color:var(--acc)}
#dbg .checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
#dbg .ck{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;color:var(--mut);cursor:pointer}
#dbg .ck input{accent-color:var(--acc)}
#statL{font-family:var(--mono);font-size:10px;color:var(--dim);border-top:1px solid var(--line2);padding-top:9px;line-height:1.7}
#hint{font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:8px;letter-spacing:.06em}
@media(prefers-reduced-motion:reduce){#camtag .rec{animation:none}}
</style>
</head>

<div id="boot"><div class="in">
  <svg class="mk" viewBox="0 0 24 24"><path d="M12 2l7 9h-4v11h-6V11H5z"/></svg>

<script type="importmap">

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass}     from 'three/addons/postprocessing/RenderPass.js';
import {ShaderPass}     from 'three/addons/postprocessing/ShaderPass.js';
import {UnrealBloomPass}from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass}     from 'three/addons/postprocessing/OutputPass.js';
import {SMAAPass}       from 'three/addons/postprocessing/SMAAPass.js';
import {Sky}            from 'three/addons/objects/Sky.js';

/* ════════════════════════════ 01 · CONFIG ════════════════════════════ */
const CFG={
  loop:{start:-10,end:163,fadeInEnd:-8,fadeOutStart:157.5,fadeOutEnd:160.5},
  ev:{lift:2.5,rollA:6,rollB:14,meco:145,sep:148,ses:151},
  phys:{g:9.81,KD:6.2e-5,H:8600,thB:1.35,thS:1.75,thSpan:[6,110],pitMax:78,pitSpan:[8,132],pitExp:0.8,dipMu:64,dipSig:5.5,dipAmp:0.14},
  veh:{R:1.83,top:68.9,mountTop:7.0},
  sun:{el:4.2,az:122},
  wind:new THREE.Vector3(-1.6,0,1.1),
  flightAz:68*Math.PI/180, padFace:200*Math.PI/180,
  quality:'high', speed:1, paused:false,
};
const COL={
  plumeA:new THREE.Color('#fff3dd'), plumeB:new THREE.Color('#ffa14d'), plumeC:new THREE.Color('#b34a18'),
  sheA:new THREE.Color('#8fb4ff'), sheB:new THREE.Color('#ff8a3c'), sheC:new THREE.Color('#8f4522'),
  vacA:new THREE.Color('#eef4ff'), vacB:new THREE.Color('#c9d8ff'), vacC:new THREE.Color('#8f9fdc'),
  fog:'#d6c3a8',
};

/* ════════════════════════════ 02 · UTILITIES ════════════════════════════ */
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ihash(x,y,s){let h=(x*374761393+y*668265263+s*1274126177)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}
function vnoise(x,y,s=0){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  return lerp(lerp(ihash(ix,iy,s),ihash(ix+1,iy,s),u),lerp(ihash(ix,iy+1,s),ihash(ix+1,iy+1,s),u),v)}
function fbm(x,y,o=4,s=0){let a=.5,f=1,r=0;for(let i=0;i<o;i++){r+=a*vnoise(x*f,y*f,s+i*77);f*=2.03;a*=.5}return r}
const fmtT=t=>{const sg=t<0?'\\u2212':'+';const a=Math.abs(t),m=Math.floor(a/60),sec=a-m*60;return `T${sg}${String(m).padStart(2,'0')}:${sec.toFixed(1).padStart(4,'0')}`};
const el=id=>document.getElementById(id);
const _v1=new THREE.Vector3(),_v2=new THREE.Vector3(),_v3=new THREE.Vector3(),_q1=new THREE.Quaternion();

/* ════════════════════════════ 03 · TIMELINE ════════════════════════════ */
const TL={mt:CFG.loop.start,prev:CFG.loop.start,playing:true,
  advance(dt){this.prev=this.mt;this.mt=clamp(this.mt+dt*CFG.speed,CFG.loop.start,CFG.loop.end)},
  jump(t){this.prev=this.mt;this.mt=clamp(t,CFG.loop.start,CFG.loop.end)},
  crossed(t){return this.prev<t&&this.mt>=t}};
const STATUS=[];// filled after trajectory (depends on detected max-Q)

/* ════════════════════════════ 04 · PROCEDURAL TEXTURES ════════════════════════════ */
const TX={list:[]};
function cvs(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function toTex(c,srgb=true){const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;TX.list.push(t);return t}

function texSmoke(sz,freq,aniso,seed){
  const c=cvs(sz,sz),g=c.getContext('2d'),im=g.createImageData(sz,sz),d=im.data;
  for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){
    const nx=x/sz-.5,ny=y/sz-.5,r=Math.sqrt(nx*nx+ny*ny)*2;
    let n=fbm(nx*freq+seed,ny*freq*aniso+seed*2,4,seed);
    const fall=1-Math.min(1,Math.max(0,(r-.28)/.78)); const f=fall*fall*(3-2*fall);
    let a=Math.pow(Math.max(0,n*f*1.55-.08),1.15); a=Math.min(1,a);
    const i=(y*sz+x)*4; d[i]=d[i+1]=d[i+2]=255; d[i+3]=a*255;
  }
  g.putImageData(im,0,0); const t=toTex(c,false); t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping; return t;
}
function texHull(soot,streaks,seed){
  const W=1024,H=2048,c=cvs(W,H),g=c.getContext('2d');
  g.fillStyle='#f1efe9';g.fillRect(0,0,W,H);
  // barrel bands + weld seams
  for(let i=1;i<6;i++){const y=H*i/6;g.strokeStyle='rgba(120,124,128,.28)';g.lineWidth=2;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();
    g.strokeStyle='rgba(120,124,128,.14)';g.beginPath();g.moveTo(0,y+4);g.lineTo(W,y+4);g.stroke();}
  for(let x=0;x<W;x+=128){g.strokeStyle='rgba(110,114,118,.12)';g.lineWidth=1;g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}
  // rivet rows
  g.fillStyle='rgba(105,110,114,.16)';
  for(let y=64;y<H;y+=64)for(let x=(y/64)%2?32:64;x<W;x+=64)g.fillRect(x,y,2,2);
  // environmental staining — vertical streaks, bottom-weighted
  const rnd=mulberry32(seed);
  for(let i=0;i<streaks;i++){
    const x=rnd()*W, w=1+rnd()*3, y0=H-H*Math.pow(rnd(),2.2)*soot, len=60+rnd()*420, a=.03+rnd()*.1;
    const gr=g.createLinearGradient(0,y0,0,y0+len);
    gr.addColorStop(0,`rgba(${90+rnd()*30|0},${88+rnd()*26|0},${84+rnd()*22|0},${a})`);
    gr.addColorStop(1,'rgba(90,90,90,0)');
    g.fillStyle=gr; g.fillRect(x,y0,w,len);
  }
  // base soot wash
  if(soot>0){const gr=g.createLinearGradient(0,H,0,H-H*.22);
    gr.addColorStop(0,`rgba(40,38,36,${.34*soot})`);gr.addColorStop(1,'rgba(40,38,36,0)');
    g.fillStyle=gr;g.fillRect(0,H-H*.22,W,H*.22);}
  // faint chromatic patches
  for(let i=0;i<10;i++){g.fillStyle=`rgba(${180+rnd()*40|0},${190+rnd()*30|0},${205|rnd()*20<<0},${.05})`;
    g.beginPath();g.ellipse(rnd()*W,rnd()*H,60+rnd()*120,30+rnd()*60,rnd()*3,0,7);g.fill();}
  return toTex(c);
}
function texCarbon(){
  const c=cvs(256,256),g=c.getContext('2d');
  g.fillStyle='#141618';g.fillRect(0,0,256,256);
  for(let y=0;y<256;y+=8)for(let x=0;x<256;x+=8){
    g.fillStyle=((x/8+y/8)%2)?'rgba(255,255,255,.028)':'rgba(0,0,0,.25)';g.fillRect(x,y,8,8);}
  for(let i=0;i<40;i++){g.strokeStyle='rgba(255,255,255,.03)';g.beginPath();const r=mulberry32(i)();
    g.arc(r*256,r*256,10+r*40,0,7);g.stroke();}
  return toTex(c);
}
function texBell(){
  const c=cvs(64,256),g=c.getContext('2d');
  const gr=g.createLinearGradient(0,256,0,0); // v=0 throat (bottom of lathe uv)
  ['#c99b6f','#8a5f47','#5a4442','#33373c','#22252a'].forEach((cc,i)=>gr.addColorStop(i/4,cc));
  g.fillStyle=gr;g.fillRect(0,0,64,256);
  const rnd=mulberry32(9);
  for(let i=0;i<70;i++){g.fillStyle=`rgba(20,18,16,${rnd()*.25})`;g.fillRect(rnd()*64,rnd()*256,1,4+rnd()*30);}
  return toTex(c);
}
function texGround(){
  const S=512,c=cvs(S,S),g=c.getContext('2d'),im=g.createImageData(S,S),d=im.data;
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const n=fbm(x/34,y/34,5,11), m=fbm(x/90+40,y/90,4,12);
    let r=203,g2=184,b=148;                       // sand base
    if(m>.56){const k=Math.min(1,(m-.56)*5);r=lerp(r,110,k);g2=lerp(g2,126,k);b=lerp(b,74,k);}   // scrub green
    if(n<.42){const k=(0.42-n)*1.4;r=lerp(r,222,k);g2=lerp(g2,206,k);b=lerp(b,168,k);}           // dry sand
    const sp=ihash(x,y,13); if(sp>.985){r*=.55;g2*=.55;b*=.55;}
    const i=(y*S+x)*4;d[i]=r;d[i+1]=g2;d[i+2]=b;d[i+3]=255;
  }
  g.putImageData(im,0,0);const t=toTex(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function texSea(){
  const S=256,c=cvs(S,S),g=c.getContext('2d'),im=g.createImageData(S,S),d=im.data;
  const hgt=new Float32Array(S*S);
  for(let i=0;i<S*S;i++)hgt[i]=fbm((i%S)/22,Math.floor(i/S)/22,4,31);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){

/* ════════════════════════════ 09 · TRAJECTORY TABLE ════════════════════════════ */
const TRAJ={t0:CFG.loop.start,dt:.05,data:null,n:0,maxQT:60,qMax:1,supT:40,scratch:{}};
function buildTrajectory(){
  const P=CFG.phys,EV=CFG.ev,T1=CFG.loop.end;
  const n=Math.ceil((T1-TRAJ.t0)/P? 0:P)||0; // placeholder guard
  const N=Math.ceil((T1-TRAJ.t0)/TRAJ.dt)+2;TRAJ.n=N;
  const F=['Y','X','VX','VY','BY','BX','BVX','BVY','UY','UX','UVX','UVY'];
  const D={};F.forEach(k=>D[k]=new Float32Array(N));
  const th=t=>P.g*(P.thB+P.thS*ss(P.thSpan[0],P.thSpan[1],t))*(1-P.dipAmp*Math.exp(-((t-P.dipMu)**2)/(2*P.dipSig*P.dipSig)));
  const pit=t=>THREE.MathUtils.degToRad(P.pitMax*Math.pow(ss(P.pitSpan[0],P.pitSpan[1],t),P.pitExp));
  let y=0,x=0,vx=0,vy=0,by=0,bx=0,bvx=0,bvy=0,uy=0,ux=0,uvx=0,uvy=0,thSep=0;
  let qi=0,qv=0,si=0;
  for(let k=0;k<N;k++){
    const t=TRAJ.t0+k*TRAJ.dt;
    if(t<EV.lift){D.Y[k]=D.BY[k]=D.UY[k]=0;/*rest*/}
    else if(t<EV.sep){
      const Tv=th(t),pt=pit(t),sp=Math.hypot(vx,vy)||1e-6,rho=Math.exp(-y/P.H);
      const Dr=P.KD*rho*sp*sp;
      const acc=(sx,syy,vxx,vyy,tt)=>{
        const dd=P.KD*Math.exp(-syy/P.H)*Math.hypot(vxx,vyy)**2,pp=pit(tt),TT=th(tt);
        return[(TT*Math.sin(pp)-dd*vxx/Math.max(Math.hypot(vxx,vyy),1e-6)),
               (TT*Math.cos(pp)-P.g-dd*vyy/Math.max(Math.hypot(vxx,vyy),1e-6))]}; // thrust applies pre-sep only
      // RK2 (thrust only pre-sep)
      const[a1x,a1y]=[Tv*Math.sin(pt)-Dr*vx/sp,Tv*Math.cos(pt)-P.g-Dr*vy/sp];
      const hm=TRAJ.dt/2,mx=vx+a1x*hm,my=vy+a1y*hm,hy2=y+a1y*hm*.5;
      const sp2=Math.hypot(mx,my)||1e-6,D2=P.KD*Math.exp(-hy2/P.H)*sp2*sp2,pt2=pit(t+hm),Tv2=th(t+hm);
      const a2x=Tv2*Math.sin(pt2)-D2*mx/sp2,a2y=Tv2*Math.cos(pt2)-P.g-D2*my/sp2;
      vx+=a2x*TRAJ.dt;vy+=a2y*TRAJ.dt;y+=vy*TRAJ.dt;x+=vx*TRAJ.dt;
      by=y;bx=x;bvx=vx;bvy=vy;uy=y;ux=x;uvx=vx;uvy=vy;thSep=pt;
      const q=1.225*Math.exp(-y/P.H)*(vx*vx+vy*vy);
      if(q>qv){qv=q;qi=k}
      if(vx*vx+vy*vy>340*340&&!si)si=k;
    }else{
      // booster: ballistic
      const sb=Math.hypot(bvx,bvy)||1e-6,rb=Math.exp(-by/P.H),Db=P.KD*rb*sb*sb;
      bvx+=-Db*bvx/sb*TRAJ.dt;bvy+=(-P.g-Db*bvy/sb)*TRAJ.dt;by+=bvy*TRAJ.dt;bx+=bvx*TRAJ.dt;
      // upper: vacuum burn
      const Tu=P.g*3.2*ss(EV.ses,EV.ses+1.6,t),pu=lerp(thSep,THREE.MathUtils.degToRad(24),ss(EV.ses,t+9,0)||ss(EV.ses,166,t));
      const su=Math.hypot(uvx,uvy)||1e-6,ru=Math.exp(-uy/P.H),Du=P.KD*ru*su*su*.4;
      uvx+=(Tu*Math.sin(pu)-Du*uvx/su)*TRAJ.dt;uvy+=(Tu*Math.cos(pu)-P.g-Du*uvy/su)*TRAJ.dt;
      uy+=uvy*TRAJ.dt;ux+=uvx*TRAJ.dt;
    }
    D.Y[k]=y;D.X[k]=x;D.VX[k]=vx;D.VY[k]=vy;
    D.BY[k]=by;D.BX[k]=bx;D.BVX[k]=bvx;D.BVY[k]=bvy;
    D.UY[k]=uy;D.UX[k]=ux;D.UVX[k]=uvx;D.UVY[k]=uvy;
  }
  TRAJ.data=D;TRAJ.qMax=qv;TRAJ.maxQT=TRAJ.t0+qi*TRAJ.dt;TRAJ.supT=TRAJ.t0+(si||2000)*TRAJ.dt;
  // status script anchored to detected events
  STATUS.length=0;
  STATUS.push([-10,'COUNTDOWN'],[0,'IGNITION'],[EV.lift,'LIFTOFF'],[EV.rollA,'ROLL PROGRAM'],
    [TRAJ.supT,'SUPERSONIC'],[TRAJ.maxQT-4,'MAX-Q'],[TRAJ.maxQT+7,'ASCENT'],
    [EV.meco,'MECO'],[EV.sep,'STAGE SEPARATION'],[EV.ses,'SECOND ENGINE START'],[EV.ses+6,'NOMINAL']);
}
function samp(t,out={}){
  const D=TRAJ.data;if(!D)return out;
  const u=clamp((t-TRAJ.t0)/TRAJ.dt,0,TRAJ.n-2),i=u|0,f=u-i;
  const L=k=>D[k][i]*(1-f)+D[k][i+1]*f;
  out.t=t;out.y=L('Y');out.x=L('X');out.vx=L('VX');out.vy=L('VY');
  out.by=L('BY');out.bx=L('BX');out.bvx=L('BVX');out.bvy=L('BVY');
  out.uy=L('UY');out.ux=L('UX');out.uvx=L('UVX');out.uvy=L('UVY');
  out.sp=Math.hypot(L('VX'),L('VY'));out.usp=Math.hypot(L('UVX'),L('UVY'));
  out.q=1.225*Math.exp(-out.y/CFG.phys.H)*out.sp*out.sp;
  return out;
}

const NOISE_GLSL=`
float hn2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);

uniform float uT,uNodeF,uBul,uSw;
varying vec2 vUv;varying vec3 vXY;varying float vProf;
void main(){
 vUv=uv;float z=1.-uv.y;

 float bul=1.+uBul*(.5+.5*sin(z*uNodeF*6.2831-uT*6.));

uniform vec3 uCa,uCb,uCc;uniform float uNodeF,uDia,uOp,uBr,uT,uFlow;
varying vec2 vUv;varying vec3 vXY;varying float vProf;
void main(){
 float z=1.-vUv.y;
 float rn=length(vXY)/vProf;
 float ph=z*uNodeF-uT*uFlow;
 float tr=abs(fract(ph)*2.-1.);

 float head=smoothstep(0.,.045,z);
 float env=head*pow(max(1.-z,0.),1.5);
 float tn=vn2(vec2(z*34.-uT*uFlow*2.6,vUv.x*5.));

const SHEATH_FRAG=NOISE_GLSL+`
uniform vec3 uSa,uSb,uSc;uniform float uOp,uBr,uT,uFlow;
varying vec2 vUv;varying vec3 vXY;varying float vProf;
void main(){

const PART_VERT=`
attribute vec3 iPos;attribute vec4 iA;
uniform float uProjY,uResY;
varying vec2 vUv;varying float vAl,vSeed,vDst;varying vec3 vWor,vN;
vec3 hs3(float s){vec3 p=fract(vec3(s)*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.xxy+p.yxx)*p.zyx);}

 vec3 camU=vec3(viewMatrix[0][1],viewMatrix[1][1],viewMatrix[2][1]);

const PART_FRAG=`
uniform sampler2D uTx,uDep;
uniform vec2 uRes;uniform float uNear,uFar,uSoft;
uniform vec3 uTint,uSunDir,uSunCol,uAmb,uFogC,uPlP,uPlC;

 vec2 tuv=vUv-.5;

class PSys{
  constructor(cap,opt){

      uPlP:{value:new THREE.Vector3(0,-10,0)},uPlC:{value:new THREE.Color(1,.55,.25)},
      uPlI:{value:0},uEmix:{value:opt.emis??1},uProjY:{value:1},uResY:{value:1080}};
    const m=new THREE.ShaderMaterial({vertexShader:PART_VERT,fragmentShader:PART_FRAG,uniforms:this.uni,
      transparent:true,depthWrite:false,blending:opt.blend??THREE.NormalBlending});
    this.mesh=new THREE.Mesh(g,m);this.mesh.frustumCulled=false;this.mesh.renderOrder=opt.order??10;
    this.mesh.layers.set(1);RD.scene.add(this.mesh);
  }
  spawn(px,py,pz,vx,vy,vz,life,size,grow,alpha,rot){
    const i=this.cur;this.cur=(this.cur+1)%this.cap;
    const j=i*3;this.px[j]=px;this.px[j+1]=py;this.px[j+2]=pz;
    this.vx[j]=vx;this.vx[j+1]=vy;this.vx[j+2]=vz;
    this.life[i]=life;this.age[i]=0;this.sz[i]=size;this.gr[i]=grow;this.al[i]=alpha;

  }

    for(let i=0;i<this.cap;i++){

      this.age[i]+=dt;
      const j=i*3,t=Math.min(this.age[i]/this.life[i],1);

function camUpdate(dt,rt){
  const sh=SHOTS.findIndex(s=>TL.mt>=s.t0&&TL.mt<s.t1);
  if(sh!==CAMD.idx){CAMD.idx=sh;const s=SHOTS[sh];
    s.pos(TL.mt);CAMD.cur.copy(_v1);s.tgt(TL.mt);CAMD.tgt.copy(_v2);
    CAMD.fov=s.fov(TL.mt);CAMD.name=s.n;
    RD.cam.near=s.near;RD.cam.far=s.far;RD.cam.updateProjectionMatrix();
    el('camName').textContent=s.n;}
  const s=SHOTS[CAMD.idx];
  s.pos(TL.mt);const dp=_v1.clone();
  s.tgt(TL.mt);const dg=_v2.clone();
  const k=1-Math.exp(-dt*s.lam);
  CAMD.cur.lerp(dp,k);CAMD.tgt.lerp(dg,k);

  _v3.copy(VEH.wp).project(RD.cam);

    CAMD.tgt.lerp(VEH.wp,Math.min(1,dt*2.5));}

  const n2=Math.sin(t*1.3+4)*.5+Math.sin(t*4.3+1)*.3+Math.sin(t*8.1+3)*.15+Math.sin(t*11.3)*.05;
  RD.cam.rotateY(n1*amp*.004);RD.cam.rotateX(n2*amp*.003);RD.cam.rotateZ(n1*amp*.0012);
  const fv=s.fov(TL.mt);

    uniforms:{tDiffuse:{value:null},uT:{value:0},uStr:{value:0},uC:{value:new THREE.Vector2(.5,.5)},
      uAsp:{value:1}},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:NOISE_GLSL+`
      uniform sampler2D tDiffuse;uniform float uT,uStr,uAsp;uniform vec2 uC;varying vec2 vUv;

      void main(){

    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`
      uniform sampler2D tDiffuse,uDirt;uniform float uT,uGrain,uVin,uDirtA;uniform vec2 uRes;varying vec2 vUv;

/* ════════════════════════════ 16 · SYNTHESISED AUDIO ════════════════════════════ */
const AUD={on:false,voice:true};
function initAudio(){
  if(AUD.ctx)return;
  try{
    const C=new(window.AudioContext||window.webkitAudioContext)();AUD.ctx=C;
    AUD.master=C.createGain();AUD.master.gain.value=AUD.on?.9:0;
    const cmp=C.createDynamicsCompressor();cmp.threshold.value=-14;cmp.ratio.value=5;
    AUD.master.connect(cmp);cmp.connect(C.destination);
    // brown noise bed
    const len=C.sampleRate*4,buf=C.createBuffer(1,len,C.sampleRate),d=buf.getChannelData(0);
    let lst=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;lst=(lst+.02*w)/1.02;d[i]=lst*3.2;}
    AUD.noise=buf;
    const src=C.createBufferSource();src.buffer=buf;src.loop=true;
    AUD.lp=C.createBiquadFilter();AUD.lp.type='lowpass';AUD.lp.frequency.value=80;
    AUD.rum=C.createGain();AUD.rum.gain.value=0;
    src.connect(AUD.lp);AUD.lp.connect(AUD.rum);AUD.rum.connect(AUD.master);src.start();
    // sub oscillator
    const sub=C.createOscillator();sub.frequency.value=27;AUD.subG=C.createGain();AUD.subG.gain.value=0;
    sub.connect(AUD.subG);AUD.subG.connect(AUD.master);sub.start();
    // doppler whistle
    const ws=C.createBufferSource();ws.buffer=buf;ws.loop=true;ws.playbackRate.value=2.4;
    AUD.wh=C.createBiquadFilter();AUD.wh.type='bandpass';AUD.wh.Q.value=9;AUD.wh.frequency.value=900;
    AUD.whG=C.createGain();AUD.whG.gain.value=0;
    ws.connect(AUD.wh);AUD.wh.connect(AUD.whG);AUD.whG.connect(AUD.master);ws.start();
    // vent hiss
    const hs=C.createBufferSource();hs.buffer=buf;hs.loop=true;
    AUD.hp=C.createBiquadFilter();AUD.hp.type='highpass';AUD.hp.frequency.value=1400;
    AUD.hsG=C.createGain();AUD.hsG.gain.value=0;
    hs.connect(AUD.hp);AUD.hp.connect(AUD.hsG);AUD.hsG.connect(AUD.master);hs.start();
    AUD.cracks=0;
    el('sndChip').classList.add('hide');el('btnSnd').classList.add('on');AUD.on=true;
    AUD.master.gain.setValueAtTime(.9,C.currentTime);
  }catch(e){/* audio unavailable */}
}
function audioTick(dt,power){
  if(!AUD.ctx||!AUD.on)return;
  const C=AUD.ctx,d=RD.cam.position.distanceTo(VEH.wp);
  const prox=Math.pow(clamp(1-d/2800,0,1),1.3);
  const lv=power*prox;
  AUD.rum.gain.setTargetAtTime(lv*.85,C.currentTime,.08);
  AUD.lp.frequency.setTargetAtTime(lerp(55,240,prox*prox),C.currentTime,.1);
  AUD.subG.gain.setTargetAtTime(lv*.5*(VEH.alt<1500?1:.4),C.currentTime,.1);
  const vr=_v3.copy(VEH.vel).normalize().dot(_v2.copy(VEH.wp).sub(RD.cam.position).normalize())||0;
  AUD.wh.frequency.setTargetAtTime(clamp(900*340/(340+Math.max(vr,0)*VEH.sp*.4),140,2400),C.currentTime,.15);
  AUD.whG.gain.setTargetAtTime(power*.05*clamp(1-d/4000,0,1),C.currentTime,.2);
  // vent hiss pre-launch
  AUD.hsG.gain.setTargetAtTime((TL.mt>-8&&TL.mt<1)?.028:0,C.currentTime,.4);
  // crackle bursts
  const oh=(Math.abs(VEH.wp.x-RD.cam.position.x)<200&&VEH.alt<1600)?1.8:1;
  const rate=lerp(1,22,prox)*oh*power;
  AUD.cracks+=rate*dt;
  while(AUD.cracks>1&&AUD.cracks<40){AUD.cracks--;
    const s=C.createBufferSource();s.buffer=AUD.noise;
    s.playbackRate.value=.7+Math.random()*1.6;
    const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=350+Math.random()*2100;bp.Q.value=3+Math.random()*6;
    const gn=C.createGain();const t0=C.currentTime;
    gn.gain.setValueAtTime(.16*lv+ .02,t0);gn.gain.exponentialRampToValueAtTime(.001,t0+.05+Math.random()*.08);
    const pn=C.createStereoPanner();pn.pan.value=Math.random()*1.4-.7;
    s.connect(bp);bp.connect(gn);gn.connect(pn);pn.connect(AUD.master);
    s.start(t0,Math.random()*3);s.stop(t0+.2);}
}
function speak(txt){
  if(!AUD.voice||!AUD.ctx||!('speechSynthesis'in window))return;
  try{const u=new SpeechSynthesisUtterance(txt);u.rate=1;u.pitch=.92;u.volume=.55;
    speechSynthesis.speak(u)}catch(e){}
}

function refillHistory(){ // regenerate trail / ground cloud ghosts when scrubbing into a phase
  const s=samp(TL.mt);
  if(TL.mt>6&&TL.mt<150&&s.y>60){
    for(let i=0;i<90;i++){const tt=TL.mt-i*.16,st=samp(tt);
      const fd=_v1.set(Math.sin(CFG.flightAz),0,Math.cos(CFG.flightAz));
      PS.trail.spawn(fd.x*st.x,CFG.veh.mountTop+st.y,fd.z*st.x,0,0,0,
        14,2.5+Math.min(st.y/1000,1)*8,.5,.13,0);}
  }
  if(TL.mt>0&&TL.mt<26){
