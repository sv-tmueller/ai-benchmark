<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian-9 Launch</title>
<style>
  html,body{margin:0;height:100%;background:#05070a;overflow:hidden;color:#eef3f8;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
  #fade{position:fixed;inset:0;background:#000;opacity:1;pointer-events:none}
  #hud{position:fixed;left:4.5vw;bottom:6.5vh;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  #wordmark{font-size:12px;font-weight:600;letter-spacing:.34em;opacity:.85;margin-bottom:10px}
  #clock{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    font-variant-numeric:tabular-nums;font-size:46px;line-height:1}
  #readout{display:flex;gap:30px;margin-top:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    font-variant-numeric:tabular-nums}
  .lbl{display:block;font-size:10px;letter-spacing:.22em;opacity:.6;margin-bottom:3px;font-family:system-ui,sans-serif}
  .val{font-size:17px}
  #debug{position:fixed;right:14px;top:14px;width:250px;padding:12px 14px;background:rgba(8,12,18,.9);
    border:1px solid #2a3440;font-size:12px;display:none;border-radius:4px}
</style>

{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

</script>

<body>
<div id="hud">
  <div id="wordmark">MERIDIAN-9 · HALCYON AEROSPACE</div>
  <div id="clock">T-00:10.0</div>
  <div id="readout">
    <div><span class="lbl">ALTITUDE</span><span class="val" id="alt">0.0 km</span></div>
    <div><span class="lbl">VELOCITY</span><span class="val" id="vel">0 m/s</span></div>
    <div><span class="lbl">STAGE</span><span class="val" id="stage">PAD</span></div>
  </div>
</div>
<div id="fade"></div>

  <div style="font-weight:600;letter-spacing:.12em;margin-bottom:8px">DEBUG · TIMELINE</div>
  <div id="dbgT" style="font-family:ui-monospace,monospace;margin-bottom:6px">T-00:10.0</div>
  <input id="scrub" type="range" min="-10" max="166" step="0.1" value="-10" style="width:100%">
  <div style="margin:10px 0">
    <button id="play">Pause</button>
    <select id="speed"><option value="1">1x</option><option value="2">2x</option></select>
    <select id="quality"><option value="high">High</option><option value="low">Low</option></select>
  </div>

  <div style="margin-top:8px;opacity:.6">Toggle: backtick · Pause: space</div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { Sky } from 'three/addons/objects/Sky.js';

/* ===== 0. CONFIG, MATH, TEXTURES ===== */
const V3 = THREE.Vector3;
const $ = id => document.getElementById(id);
const CFG = { quality: 'high', timeScale: 1, paused: false, plumeOn: true };
const QUAL = { rate: 1 };
const G = 9.81;
const T0 = -10, T_SEP = 150, T_LOOP = 166;
const VIS = 0.002;          // visual metres per true metre of altitude (keeps the stack in frame)
const MOUNT_H = 4.0;        // vehicle base height above the pad deck (m)
const NOZZLE_Y = -1.3;      // engine exit plane, booster-local (m)
const R = 1.85;             // booster radius (m)
const RING = 1.15;          // octaweb ring radius (m)
const SUN = new V3(0.06, 0.16, 0.985).normalize(); // low dawn sun, behind and beside the camera
const ENGINE_POS = [[0, 0]];
for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; ENGINE_POS.push([Math.cos(a) * RING, -Math.sin(a) * RING]); }

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rad = d => d * Math.PI / 180;
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; }; }
const randDir = () => { const u = Math.random() * 2 - 1, a = Math.random() * 6.2832, s = Math.sqrt(1 - u * u); return new V3(s * Math.cos(a), u, s * Math.sin(a)); };
function fmtT(t) {
  const a = Math.abs(t), m = Math.floor(a / 60), s = a - m * 60;
  return (t < 0 ? 'T-' : 'T+') + String(m).padStart(2, '0') + ':' + s.toFixed(1).padStart(4, '0');
}

/* ===== 1. TIMELINE & TRAJECTORY (precomputed table, 0.05 s steps) ===== */
const DT = 0.05, NTAB = Math.ceil((T_LOOP - T0) / DT) + 4;
const tabH = new Float64Array(NTAB), tabV = new Float64Array(NTAB);
{
  let v = 0, h = 0;
  for (let i = 0; i < NTAB; i++) {
    const t = T0 + i * DT;
    let net = 0;
    if (t >= 0 && t < T_SEP) net = (1.2 + 1.8 * (t / T_SEP) - 1) * G; // 1.2 g liftoff rising to ~3 g at MECO
    else if (t >= T_SEP) net = 0.05 * G;                              // weak upper-stage coast
    tabH[i] = h; tabV[i] = v;
    v += net * DT; h += v * DT;
  }
}
function at(tab, t) {
  const x = clamp((t - T0) / DT, 0, NTAB - 2), i = Math.floor(x), f = x - i;
  return tab[i] + (tab[i + 1] - tab[i]) * f;
}

/* ===== 2. PROCEDURAL TEXTURES (no asset files) ===== */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function fbmTexture(size, seed, octaves) {
  const rnd = rng(seed), lat = [];
  let n = 4;
  for (let o = 0; o < octaves; o++) {
    const arr = new Float32Array(n * n);
    for (let i = 0; i < arr.length; i++) arr[i] = rnd();
    lat.push({ n, arr }); n *= 2;
  }
  const data = new Uint8Array(size * size * 4);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    let v = 0, amp = 0.5, norm = 0;
    for (const { n: m, arr } of lat) {
      const fx = x / size * m, fy = y / size * m, ix = Math.floor(fx), iy = Math.floor(fy);
      const tx = ss(0, 1, fx - ix), ty = ss(0, 1, fy - iy);
      const g = (i, j) => arr[((iy + j) % m) * m + ((ix + i) % m)];
      v += amp * lerp(lerp(g(0, 0), g(1, 0), tx), lerp(g(0, 1), g(1, 1), tx), ty);
      norm += amp; amp *= 0.5;
    }
    const k = (y * size + x) * 4, val = Math.round(255 * v / norm);
    data[k] = data[k + 1] = data[k + 2] = val; data[k + 3] = 255;
  }
  const tex = new THREE.DataTexture(data, size, size);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.magFilter = tex.minFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return tex;
}
const NOISE = fbmTexture(256, 7, 6);
const paintTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#f1f1ed'; g.fillRect(0, 0, w, h);
  const r = rng(11);
  for (let i = 0; i < 3500; i++) { g.fillStyle = `rgba(120,120,116,${r() * 0.07})`; g.fillRect(r() * w, r() * h, 1 + r() * 2.5, 1 + r() * 2.5); }
  for (let i = 0; i < 240; i++) { // soot streaks rising from the base (canvas bottom = v 0)
    const x = r() * w, len = h * (0.04 + r() * 0.22);
    const gr = g.createLinearGradient(0, h, 0, h - len);
    gr.addColorStop(0, 'rgba(38,34,30,0.5)'); gr.addColorStop(1, 'rgba(38,34,30,0)');
    g.fillStyle = gr; g.fillRect(x, h - len, 1 + r() * 3, len);
  }
});
const groundTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#8c8a63'; g.fillRect(0, 0, w, h);
  const r = rng(29), cols = ['#6f7a4a', '#a39d74', '#5d6a3c', '#b8b08a', '#7b7550'];
  for (let i = 0; i < 9000; i++) { g.fillStyle = cols[(r() * cols.length) | 0]; g.globalAlpha = 0.25 + r() * 0.5; g.fillRect(r() * w, r() * h, 1.2, 1.2); }
  g.globalAlpha = 1;
});
groundTex.repeat.set(120, 120);
const heatTex = canvasTex(8, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#ffb070'); gr.addColorStop(0.45, '#7a2e0a'); gr.addColorStop(1, '#140a05');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const glowTex = canvasTex(128, 128, (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,0.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});

/* ===== 3. RENDERER, SCENE, SKY, ENVIRONMENT ===== */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   // updated once per frame, reused by the composer pass
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xe2b193, 0.00028);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.5, 30000);
camera.layers.enable(1);

function skyParams(u) {
  u['turbidity'].value = 4.5; u['rayleigh'].value = 1.8;
  u['mieCoefficient'].value = 0.006; u['mieDirectionalG'].value = 0.8;
  u['sunPosition'].value.copy(SUN);
}
const sky = new Sky(); sky.scale.setScalar(450000); scene.add(sky); skyParams(sky.material.uniforms);
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene(); const envSky = new Sky(); envSky.scale.setScalar(450000);
envScene.add(envSky); skyParams(envSky.material.uniforms);
scene.environment = pmrem.fromScene(envScene, 0.02).texture;

const sunLight = new THREE.DirectionalLight(0xffe0b0, 2.6);
sunLight.position.copy(SUN).multiplyScalar(300); sunLight.target.position.set(0, 20, 0);
scene.add(sunLight, sunLight.target);
sunLight.castShadow = true; sunLight.shadow.mapSize.set(2048, 2048);
Object.assign(sunLight.shadow.camera, { left: -90, right: 90, top: 110, bottom: -30, near: 10, far: 800 });
sunLight.shadow.camera.updateProjectionMatrix();
sunLight.shadow.bias = -0.0004; sunLight.shadow.normalBias = 0.03;

const ground = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000),
  new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.97 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const sea = new THREE.Mesh(new THREE.PlaneGeometry(40000, 6000),
  new THREE.MeshStandardMaterial({ color: 0x2a4a5a, roughness: 0.22, metalness: 0.1 }));
sea.rotation.x = -Math.PI / 2; sea.position.set(0, -0.3, -7500); scene.add(sea);

// pad silhouettes: split deck with a flame trench gap, strongback, towers, water tower
const concrete = new THREE.MeshStandardMaterial({ color: 0x8d8b86, roughness: 0.9 });
const steel = new THREE.MeshStandardMaterial({ color: 0x6a7078, roughness: 0.55, metalness: 0.5 });
function box(w, h, d, x, y, z, m) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  b.position.set(x, y, z); b.castShadow = b.receiveShadow = true; scene.add(b); return b;
}
box(18, 4, 2.3, 0, 2, 4.4, concrete); box(18, 4, 2.3, 0, 2, -4.4, concrete);
box(2.4, 44, 1.2, -3.9, 26, -2.6, steel);
for (const [x, z] of [[-34, -22], [34, -18], [-44, 22]]) {
  const t = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.9, 62, 6), steel);
  t.position.set(x, 31, z); t.castShadow = true; scene.add(t);
}
for (const [x, z] of [[-53, -43], [-59, -43], [-53, -49], [-59, -49]]) {
  const l = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 22, 6), steel);
  l.position.set(x, 11, z); scene.add(l);
}
const tank = new THREE.Mesh(new THREE.CylinderGeometry(6.5, 6.5, 8, 24), steel);
tank.position.set(-56, 26, -46); scene.add(tank);

/* ===== 4. VEHICLE ===== */
const vehicle = new THREE.Group(); vehicle.position.set(0, MOUNT_H, 0); scene.add(vehicle);
const tilt = new THREE.Group(); vehicle.add(tilt);          // pitch (gravity turn)
const booster = new THREE.Group(); tilt.add(booster);       // stage 1, engines, fins, legs
const upper = new THREE.Group(); tilt.add(upper);           // interstage, stage 2, fairing

const paintMat = new THREE.MeshPhysicalMaterial({ map: paintTex, roughness: 0.46, clearcoat: 0.25, clearcoatRoughness: 0.45 });
const blackMat = new THREE.MeshStandardMaterial({ color: 0x0c0e11, roughness: 0.62, metalness: 0.2 });
const bellMat = new THREE.MeshStandardMaterial({ color: 0x3a3f46, roughness: 0.32, metalness: 0.9,
  emissive: 0xffffff, emissiveMap: heatTex, emissiveIntensity: 0.9, side: THREE.DoubleSide });
const lineMat = new THREE.MeshStandardMaterial({ color: 0x8a8f96, roughness: 0.5, metalness: 0.4 });
const cyl = (rt, rb, h, s = 64, open = false) => new THREE.CylinderGeometry(rt, rb, h, s, 1, open);
function part(geo, mat, x, y, z) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; return m;
}
function strut(p1, p2, r, mat) {
  const dir = new V3().subVectors(p2, p1), m = new THREE.Mesh(cyl(r, r, dir.length(), 10), mat);
  m.position.copy(p1).add(p2).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new V3(0, 1, 0), dir.normalize());
  m.castShadow = true; return m;
}
function gridFin(a) {                        // plate spans radial (x) and vertical (y), thin tangentially
  const g = new THREE.Group();
  g.add(part(new THREE.BoxGeometry(1.9, 1.9, 0.08), blackMat, 0, 0, 0));
  for (const y of [-0.6, 0, 0.6]) g.add(part(new THREE.BoxGeometry(1.9, 0.07, 0.12), blackMat, 0, y, 0.06));
  for (const x of [-0.6, 0, 0.6]) g.add(part(new THREE.BoxGeometry(0.07, 1.9, 0.12), blackMat, x, 0, 0.06));
  g.position.set(Math.cos(a) * (R + 0.85), 36, -Math.sin(a) * (R + 0.85));
  g.rotation.y = a;
  return g;
}

// stage 1
booster.add(part(cyl(R, R, 40, 96), paintMat, 0, 20, 0));
booster.add(part(cyl(1.7, 1.7, 0.12), blackMat, 0, -0.06, 0));
for (let k = 0; k < 16; k++) {               // panel lines (local z = surface normal)
  const a = k / 16 * Math.PI * 2;
  const ln = part(new THREE.BoxGeometry(0.05, 37, 0.03), lineMat, Math.cos(a) * (R + 0.012), 21, -Math.sin(a) * (R + 0.012));
  ln.rotation.y = Math.PI / 2 + a; ln.castShadow = false; booster.add(ln);
}
for (let k = 0; k < 4; k++) booster.add(gridFin(k * Math.PI / 2));
for (let k = 0; k < 4; k++) {                // landing legs
  const a = Math.PI / 4 + k * Math.PI / 2;
  booster.add(strut(new V3(Math.cos(a) * (R - 0.25), 3.2, -Math.sin(a) * (R - 0.25)),
                    new V3(Math.cos(a) * (R + 3.4), 0.1, -Math.sin(a) * (R + 3.4)), 0.09, blackMat));
}
const bellGeo = cyl(0.22, 0.42, 1.3, 28, true);
for (const [x, z] of ENGINE_POS) booster.add(part(bellGeo, bellMat, x, -0.65, z));
const frost = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.03, R + 0.03, 6, 96, 1, true),
  new THREE.MeshStandardMaterial({ color: 0xf2f7ff, roughness: 0.85, transparent: true, opacity: 0.8, alphaMap: NOISE, depthWrite: false }));
frost.position.set(0, 18, 0); booster.add(frost);

// stage 2
upper.add(part(cyl(R + 0.03, R + 0.03, 2.5, 96), blackMat, 0, 41.25, 0));
upper.add(part(cyl(R - 0.02, R - 0.02, 14.5, 96), paintMat, 0, 49.75, 0));
const fairPts = [];
for (let i = 0; i <= 40; i++) {              // ogive fairing, 13 m, total stack ~70 m
  const t = i / 40, u = Math.max(0, (t - 0.42) / 0.58);
  fairPts.push(new THREE.Vector2((R - 0.02) * Math.sqrt(Math.max(0, 1 - u * u)), 57 + 13 * t));
}
upper.add(part(new THREE.LatheGeometry(fairPts, 72), paintMat, 0, 0, 0));

/* ===== 5. PLUMES (instanced core + sheath, shader-driven) ===== */
const VS_COMMON = `
uniform float uTime;
varying float vLen; varying float vR;
void main(){
  vec3 p = position;
  vLen = clamp(-p.y, 0.0, 1.0);
  vR = clamp(length(p.xz) / RU, 0.0, 1.0);
  float wob = sin(p.y*9.0 + uTime*14.0)*0.5 + sin((p.x+p.z)*6.0 + uTime*9.0)*0.5;
  p.xz *= 1.0 + 0.04*wob*vLen;
  vec4 lp = vec4(p, 1.0);
#ifdef USE_INSTANCING
  lp = instanceMatrix * lp;
#endif
  gl_Position = projectionMatrix * modelViewMatrix * lp;
}`;
const CORE_VS = VS_COMMON.replace('RU', 'mix(0.2, 0.5, vLen)');
const SHEATH_VS = VS_COMMON.replace('RU', 'mix(0.25, 0.95, vLen)');
const CORE_FS = `
uniform float uTime; uniform float uI; uniform float uD; uniform float uSharp;
varying float vLen; varying float vR;
void main(){
  float core = pow(1.0 - vR, 1.6) * (1.0 - 0.55*vLen);
  vec3 col = mix(vec3(0.72,0.86,1.0), vec3(1.0,0.84,0.6), smoothstep(0.0, 0.4, vLen));
  float ph = vLen * mix(5.0, 11.0, uSharp) - uTime * 2.2;           // shock diamonds: spatial nodes
  float node = pow(max(cos(ph*6.2831853), 0.0), mix(3.0, 12.0, uSharp));
  float dia = node * uD * (1.0 - vR*vR) * (1.0 - vLen*0.7);
  float flick = 0.94 + 0.06*sin(uTime*37.0 + vLen*9.0);
  vec3 outc = col*core*2.2 + vec3(1.0,0.97,0.92)*dia*3.0;
  gl_FragColor = vec4(outc * uI * flick, 1.0);
}`;
const SHEATH_FS = `
uniform float uTime; uniform float uI;
varying float vLen; varying float vR;
void main(){
  vec3 blue = vec3(0.7,0.85,1.0), orange = vec3(1.0,0.5,0.14), rust = vec3(0.42,0.13,0.04);
  vec3 col = mix(blue, orange, smoothstep(0.02, 0.35, vLen));
  col = mix(col, rust, smoothstep(0.45, 1.0, vR));
  float a = pow(1.0 - vR, 1.4) * (1.0 - 0.85*vLen);
  float flick = 0.95 + 0.05*sin(uTime*29.0 + vR*6.0);
  gl_FragColor = vec4(col * a * uI * flick * 1.4, 1.0);
}`;
function makePlumeMaterial(core) {
  return new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uI: { value: 0 }, uD: { value: 0.5 }, uSharp: { value: 0 } },
    vertexShader: core ? CORE_VS : SHEATH_VS, fragmentShader: core ? CORE_FS : SHEATH_FS,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
}
const plumeCoreGeo = cyl(0.2, 0.5, 1, 40, true).translate(0, -0.5, 0);
const plumeSheathGeo = cyl(0.25, 0.95, 1, 40, true).translate(0, -0.5, 0);
const coreMat = makePlumeMaterial(true), sheathMat = makePlumeMaterial(false);
const coreMesh = new THREE.InstancedMesh(plumeCoreGeo, coreMat, ENGINE_POS.length);
const sheathMesh = new THREE.InstancedMesh(plumeSheathGeo, sheathMat, ENGINE_POS.length);
for (const m of [coreMesh, sheathMesh]) { m.layers.set(1); m.frustumCulled = false; booster.add(m); }
const upperCore = new THREE.Mesh(plumeCoreGeo, makePlumeMaterial(true));
const upperSheath = new THREE.Mesh(plumeSheathGeo, makePlumeMaterial(false));
for (const m of [upperCore, upperSheath]) { m.position.set(0, 40.2, 0); m.layers.set(1); upper.add(m); }
const trench = new THREE.Mesh(plumeSheathGeo, makePlumeMaterial(false));  // sideways flame-trench jet
trench.position.set(0, MOUNT_H + NOZZLE_Y, 0); trench.rotation.z = Math.PI / 2;
trench.layers.set(1); scene.add(trench);
const plumeLight = new THREE.PointLight(0xffa868, 0, 260, 2);              // plume as a light source
plumeLight.position.set(0, NOZZLE_Y - 3, 0); tilt.add(plumeLight);
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new V3(), _p = new V3();
function setInstances(mesh, sxz, sy) {
  for (let i = 0; i < ENGINE_POS.length; i++) {
    _p.set(ENGINE_POS[i][0], NOZZLE_Y, ENGINE_POS[i][1]); _s.set(sxz, sy, sxz);

const FS_VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;

  uniforms: { tDiffuse: { value: null }, uCenter: { value: new THREE.Vector2(0.5, 0.5) }, uAmt: { value: 0 },
    uTime: U.uTime, uAspect: { value: 1 }, uRadius: { value: 0.18 } },
  vertexShader: FS_VS,
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 uCenter; uniform float uAmt; uniform float uTime;

let actx = null, master, rumbleG, rumbleF, crackG, crackF;

  const len = actx.sampleRate * 3;
  const brown = actx.createBuffer(1, len, actx.sampleRate), bd = brown.getChannelData(0);
  let b = 0;
  for (let i = 0; i < len; i++) { b = (b + 0.02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = b * 3.5; }
  const white = actx.createBuffer(1, len, actx.sampleRate), wd = white.getChannelData(0);
  for (let i = 0; i < len; i++) wd[i] = Math.random() * 2 - 1;
  const s1 = actx.createBufferSource(); s1.buffer = brown; s1.loop = true;

  rumbleG = actx.createGain(); rumbleG.gain.value = 0;

  rumbleG.gain.setTargetAtTime(0.9 * build, now, 0.08);
  rumbleF.frequency.setTargetAtTime(90 + 140 * build, now, 0.2);
  const over = ss(56, 66, t) * (1 - ss(74, 90, t));                  // crackle peaks as it passes overhead
  crackG.gain.setTargetAtTime(0.18 * over * (0.6 + 0.4 * Math.random()), now, 0.03);

  rig(t, vehicle.position, dt);
  camera.updateMatrixWorld();
  U.uPixelScale.value = innerHeight * renderer.getPixelRatio() / (2 * Math.tan(rad(camera.fov) / 2));
  const scr = coreW.clone().project(camera);
  heatPass.uniforms.uCenter.value.set(scr.x * 0.5 + 0.5, scr.y * 0.5 + 0.5);
  heatPass.uniforms.uAmt.value = CFG.quality === 'high' ? 0.9 * ign : 0;
  filmPass.uniforms.uDirt.value = ign * clamp(1 - camera.position.distanceTo(coreW) / 260, 0, 1);

  // HUD and fade
  $('clock').textContent = fmtT(t);
  $('alt').textContent = hk.toFixed(1) + ' km';
  $('vel').textContent = Math.round(v) + ' m/s';
  $('stage').textContent = t < 0 ? 'PAD' : t < T_SEP ? 'STAGE 1' : t < T_SEP + 1 ? 'MECO / SEP' : 'STAGE 2';
  $('fade').style.opacity = Math.max(ss(158, T_LOOP, t), 1 - ss(-10, -9, t));

  audioUpdate(t);
  if (actx) calls(t);
}

/* ===== 12. LOOP, DEBUG PANEL, START ===== */
let missionT = T0, lastNow = 0;
const scrub = $('scrub');
function loop(nowMs) {
  const now = nowMs / 1000, dtR = lastNow ? Math.min(0.1, now - lastNow) : 0; lastNow = now;
  const simDt = CFG.paused ? 0 : dtR * CFG.timeScale;
  if (!CFG.paused) missionT += simDt;
  if (missionT >= T_LOOP) { missionT = T0; fired.clear(); for (const p of pools) p.clear(); }
  update(missionT, simDt);
  if (document.activeElement !== scrub) scrub.value = missionT;
  $('dbgT').textContent = fmtT(missionT);
  renderer.shadowMap.needsUpdate = true;
  // opaque depth pre-pass, rendered once per frame for all soft particles (layer 0 only)
  camera.layers.set(0);
  renderer.setRenderTarget(depthRT); renderer.clear(); renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.shadowMap.needsUpdate = false;
  camera.layers.enable(1);
  composer.render();
}
function togglePause() { CFG.paused = !CFG.paused; $('play').textContent = CFG.paused ? 'Play' : 'Pause'; }
window.addEventListener('keydown', e => {
  initAudio();
  if (e.code === 'Backquote') { const d = $('debug'); d.style.display = d.style.display === 'block' ? 'none' : 'block'; }
  if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); togglePause(); }
});
window.addEventListener('pointerdown', initAudio);
window.addEventListener('resize', resize);
$('play').addEventListener('click', togglePause);
$('speed').addEventListener('change', e => { CFG.timeScale = parseFloat(e.target.value); });
$('quality').addEventListener('change', e => applyQuality(e.target.value));
$('plumeOn').addEventListener('change', e => { CFG.plumeOn = e.target.checked; });
scrub.addEventListener('input', () => {
  missionT = parseFloat(scrub.value); fired.clear(); for (const p of pools) p.clear();
});
applyQuality('high');
renderer.setAnimationLoop(loop);
</script>
