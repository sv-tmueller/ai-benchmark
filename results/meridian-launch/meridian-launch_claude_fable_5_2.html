  const diamond = (0.35 + 0.65 * ss((alt - 100) / 1400)) * (1 - ss((expand - 0.4) / 2.2));
  for (const m of [core, sheath]) { const u = m.material.uniforms; u.uLen.value = len * (m === sheath ? 1.25 : 1); u.uExpand.value = expand * (m === sheath ? 1.15 : 1); m.visible = thr > 0.001; }
  core.material.uniforms.uRad.value = 1.5; core.material.uniforms.uDiamond.value = diamond; core.material.uniforms.uGain.value = 14 * thr * flick / (1 + expand * 0.8);
  sheath.material.uniforms.uRad.value = 2.3; sheath.material.uniforms.uGain.value = 2.2 * thr / (1 + expand * 0.25);
  const tu = trenchFlame.material.uniforms; trenchFlame.visible = gf > 0.01; tu.uLen.value = 80 * gf; tu.uRad.value = 2.8; tu.uExpand.value = 1.3; tu.uGain.value = 9 * gf * flick;
  const s2t = ss((T - 157) / 0.8), su = s2Plume.material.uniforms; s2Plume.visible = s2t > 0; su.uLen.value = 140; su.uRad.value = 1.3; su.uExpand.value = 9; su.uGain.value = 1.6 * s2t;
  plumeLight.intensity = 2e4 * thr * flick * L; bellMat.emissiveIntensity = 2.5 * thr; vacMat.emissiveIntensity = 3 * s2t;
  // separation flash
  const fl = T >= 153 && T < 154 ? Math.exp(-(T - 153) * 7) : 0; flash.visible = fl > 0.01; flash.scale.setScalar(10 + 40 * fl); flash.material.color.setScalar(25 * fl);
  // --- emitters
  if (dt > 0) {
    if (T < 1.5) emit('vent', 14 * q, dt, () => { const y = rnd() < 0.5 ? 38 : 54; localPool.spawn({ x: 1.9, y, z: rr(-0.4, 0.4), vx: rr(1.5, 4), vy: rr(-0.8, 0.2), vz: rr(-1.4, 0.2), life: rr(2.5, 4.5), s0: 0.8, s1: rr(4, 7), a: 0.22, r: 0.95, g: 0.97, b: 1, buoy: -0.15, drag: 0.4 }); });
    if (gf > 0.01) {
      emit('jet', 16 * gf * q, dt, () => { const dk = rnd() < 0.3 ? 0.4 : 0.8; groundPool.spawn({ x: rr(-16, -5), y: rr(2, 5), z: rr(-4, 4), vx: -rr(50, 105), vy: rr(2, 12), vz: rr(-9, 9), life: rr(9, 15), s0: 7, s1: rr(45, 70), a: 0.75, r: dk, g: dk * 0.96, b: dk * 0.92, drag: 0.55, buoy: 2 }); });
      emit('bil', 9 * gf * q, dt, () => { const a = rr(0, 6.28), v = rr(12, 26); groundPool.spawn({ x: Math.cos(a) * 8, y: rr(1.5, 4), z: Math.sin(a) * 8, vx: Math.cos(a) * v, vy: rr(3, 8), vz: Math.sin(a) * v, life: rr(22, 32), s0: 8, s1: rr(55, 80), a: 0.6, r: 0.92, g: 0.92, b: 0.92, drag: 0.5, buoy: 1.4 }); });
    }
    if (thr > 0.05 && alt > 5) { const s0 = 5 * (1 + expand), wh = ss(alt / 2500), c = lerp(0.5, 0.92, wh);
      emit('trail', clamp(spd / (s0 * 0.9), 8, 40) * q, dt, () => { const f = rnd(), ev = 4 + expand * 5; trailPool.spawn({ x: eng.x - vx * dt * f - axis.x * 12, y: eng.y - vy * dt * f - axis.y * 12, z: rr(-1, 1), vx: -axis.x * 40 + rr(-ev, ev), vy: -axis.y * 40 + rr(-ev, ev), vz: rr(-ev, ev),
        life: rr(7, 10), s0, s1: 22 * (1 + expand * 1.2), a: 0.5 / (1 + expand * 0.45), r: c, g: lerp(0.42, 0.92, wh), b: lerp(0.36, 0.94, wh), drag: 1.2, heat: 1 }); }); }
    const mq = Math.exp(-Math.pow((T - 70) / 6, 2));                                                    // max-Q condensation skirt
    if (mq > 0.05 && thr > 0) emit('mq', 110 * mq * q, dt, () => { const a = rr(0, 6.28), y = rnd() < 0.65 ? 58.5 : 46, r = y > 50 ? 2.9 : 2.2; localPool.spawn({ x: Math.cos(a) * r, y, z: Math.sin(a) * r, vx: Math.cos(a) * 3, vy: -rr(35, 55), vz: Math.sin(a) * 3, life: rr(0.35, 0.6), s0: 4, s1: 10, a: 0.4 * mq, r: 1, g: 1, b: 1 }); });
    if (T > 153 && T < 154.6) emit('spark', 70 * q, dt, () => { const a = rr(0, 6.28), v = rr(2, 9); localPool.spawn({ x: Math.cos(a) * 1.8, y: 47.5, z: Math.sin(a) * 1.8, vx: Math.cos(a) * v, vy: rr(-5, 3), vz: Math.sin(a) * v, life: rr(1.5, 3.5), s0: 0.35, s1: 0.2, a: 1, r: 26, g: 20, b: 11 }); });
  }
  groundPool.update(dt, p => { const dx = p.x - eng.x, dy = p.y - eng.y, dz = p.z - eng.z; return L * thr * Math.min(1, 2500 / (dx * dx + dy * dy + dz * dz + 400)); });
  trailPool.update(dt, p => L * thr * Math.exp(-p.age * 2.2) * 0.8); localPool.update(dt, null);
  // --- camera, sky, post uniforms
  updateCamera(T, dt, pos, vel, axis, thr);
  sky.position.copy(camera.position); const su2 = sky.material.uniforms, hk = Math.exp(-camera.position.y / 12000);
  su2.rayleigh.value = 0.06 + 2.14 * hk; su2.turbidity.value = 1 + 5 * hk;
  SU.uSunV.value.copy(sunDir).transformDirection(camera.matrixWorldInverse);
  U.uTime.value = T;
  tmp.copy(eng).addScaledVector(axis, -15); const dist = camera.position.distanceTo(tmp); tmp.project(camera);
  const on = Math.abs(tmp.x) < 1.3 && Math.abs(tmp.y) < 1.3 && tmp.z < 1 ? 1 : 0, hu = heatPass.uniforms;
  hu.uC.value.set(tmp.x * 0.5 + 0.5, tmp.y * 0.5 + 0.5); hu.uR.value = 28 * (1 + expand * 0.3) / (dist * 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2)); hu.uAmt.value = thr * on; hu.uTime.value = T;
  gradePass.uniforms.uTime.value = performance.now() * 0.001; gradePass.uniforms.uDirt.value = thr * on * clamp(1 - dist / 2500, 0, 1);
  updateHUD(T, alt, spd); updateAudio(Math.max(thr, s2t * 0.15), PRESS.distanceTo(eng), T); prevT = T;
}

/* ===================== MAIN LOOP ===================== */
resize(); let last = performance.now(), fps = 60, frame = 0;
function tick(now) { requestAnimationFrame(tick);
  const real = Math.min(0.05, (now - last) / 1000); last = now; const dt = real * timeScale;
  T += dt; if (T >= T1) { T = T0; reset(); }
  update(dt); composer.render();
  fps = lerp(fps, 1 / Math.max(real, 1e-4), 0.05);
  if (++frame % 15 === 0 && $('dbg').style.display === 'block') { $('dFps').textContent = fps.toFixed(0); $('dT').textContent = T.toFixed(1); $('dScrub').value = T; } }
requestAnimationFrame(tick);
</script>
