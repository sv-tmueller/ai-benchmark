<script type="module">
import * as THREE from 'three';
import {Sky} from 'three/addons/objects/Sky.js';
import {Water} from 'three/addons/objects/Water.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

// ===== UTIL / SEEDED RNG =====
const V3=THREE.Vector3,$=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SEED=20240611,rng=mulberry(SEED),simRng=mulberry(SEED^0x5bd1e995);
const ri=(r,n)=>Math.floor(r()*n);
function h2(x,z){let h=Math.imul(x|0,374761393)^Math.imul(z|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vn(x,z){const ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz,ux=fx*fx*(3-2*fx),uz=fz*fz*(3-2*fz);return lerp(lerp(h2(ix,iz),h2(ix+1,iz),ux),lerp(h2(ix,iz+1),h2(ix+1,iz+1),ux),uz)}
function fbm(x,z){let s=0,a=.5,f=1;for(let i=0;i<4;i++){s+=a*vn(x*f+i*17.3,z*f-i*9.1);a*=.5;f*=2}return s/.9375*2-1}
const logged=new Set();
function safe(name,fn){try{return fn()}catch(e){const k=name+e.message;if(!logged.has(k)){logged.add(k);console.error('['+name+']',e)}}}
const C=h=>{const c=new THREE.Color(h);return[c.r,c.g,c.b]};

// ===== RENDERER / CAMERA =====
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.55;renderer.info.autoReset=false;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,1,20000);
const rt=new THREE.WebGLRenderTarget(innerWidth,innerHeight,{type:THREE.HalfFloatType,samples:4});
const composer=new EffectComposer(renderer,rt);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.3,.6,1);composer.addPass(bloom);composer.addPass(new OutputPass());
const cam={x:-230,z:-40,y:0,dist:620,yaw:.6,pitch:.75};

// ===== PROCEDURAL TEXTURES =====
function ctex(size,fn,rep,srgb=true){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');fn(g,size);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep,rep);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}
function speckle(g,s,n,lo,hi,sz=1){for(let i=0;i<n;i++){const v=lo+Math.floor(Math.random()*(hi-lo));g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(Math.random()*s,Math.random()*s,sz,sz)}}
const texAsphalt=ctex(256,(g,s)=>{g.fillStyle='#34363a';g.fillRect(0,0,s,s);speckle(g,s,5000,20,90,2);speckle(g,s,900,90,140,1)});
const texConcrete=ctex(256,(g,s)=>{g.fillStyle='#9a9a94';g.fillRect(0,0,s,s);speckle(g,s,3500,110,170,2);g.strokeStyle='rgba(60,60,55,.5)';g.lineWidth=2;g.strokeRect(0,0,s,s);g.beginPath();g.moveTo(s/2,0);g.lineTo(s/2,s);g.stroke()});
const texGrass=ctex(256,(g,s)=>{g.fillStyle='#bdbdbd';g.fillRect(0,0,s,s);speckle(g,s,9000,140,230,2);speckle(g,s,1500,90,160,3)},300);
const texWin=ctex(256,(g,s)=>{g.fillStyle='#ece8df';g.fillRect(0,0,s,s);speckle(g,s,2500,200,245,2);for(let i=0;i<4;i++)for(let j=0;j<4;j++){const x=i*64,y=j*64;g.fillStyle='#d4d0c6';g.fillRect(x+9,y+9,46,46);const gr=g.createLinearGradient(0,y,0,y+64);gr.addColorStop(0,'#38506a');gr.addColorStop(1,'#16222f');g.fillStyle=gr;g.fillRect(x+12,y+12,40,40);g.fillStyle='#bcb8ae';g.fillRect(x+10,y+52,44,3)}});
const texWinE=ctex(256,(g,s)=>{g.fillStyle='#000';g.fillRect(0,0,s,s);const r=mulberry(77);for(let i=0;i<4;i++)for(let j=0;j<4;j++)if(r()<.42){g.fillStyle=r()<.8?`rgb(255,${190+ri(r,40)},${110+ri(r,40)})`:'rgb(190,225,255)';g.fillRect(i*64+12,j*64+12,40,40)}});
const texGlass=ctex(256,(g,s)=>{for(let i=0;i<4;i++)for(let j=0;j<4;j++){const gr=g.createLinearGradient(i*64,j*64,i*64+64,j*64+64);gr.addColorStop(0,'#5d86a8');gr.addColorStop(.5,'#2d4a66');gr.addColorStop(1,'#1c3047');g.fillStyle=gr;g.fillRect(i*64,j*64,64,64);g.fillStyle='#aab6c0';g.fillRect(i*64,j*64,64,3);g.fillRect(i*64,j*64,3,64)}});
const texGlassE=ctex(256,(g,s)=>{g.fillStyle='#000';g.fillRect(0,0,s,s);const r=mulberry(91);for(let i=0;i<4;i++)for(let j=0;j<4;j++)if(r()<.55){g.fillStyle=r()<.7?'rgb(255,226,170)':'rgb(200,235,255)';g.fillRect(i*64+4,j*64+4,56,56)}});
const texGlow=ctex(128,(g,s)=>{const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.4,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,s,s)},0);
texGlow.wrapS=texGlow.wrapT=THREE.ClampToEdgeWrapping;
const waterNormal=(()=>{const s=256,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d'),im=g.createImageData(s,s),H=(x,y)=>Math.sin(x*.098+Math.sin(y*.049)*2)+Math.sin(y*.147+x*.049)*.7+Math.sin((x+y)*.196)*.4+Math.sin((x-y)*.294)*.25;
for(let y=0;y<s;y++)for(let x=0;x<s;x++){const dx=H(x+1,y)-H(x-1,y),dy=H(x,y+1)-H(x,y-1),n=new V3(-dx*.6,-dy*.6,1).normalize(),i=(y*s+x)*4;im.data[i]=(n.x*.5+.5)*255;im.data[i+1]=(n.y*.5+.5)*255;im.data[i+2]=(n.z*.5+.5)*255;im.data[i+3]=255}
g.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t})();

// ===== ENVIRONMENT (sky, sun, water, fog) =====
const sky=new Sky();sky.scale.setScalar(450000);scene.add(sky);
const skyU=sky.material.uniforms;skyU.turbidity.value=7;skyU.rayleigh.value=1.6;skyU.mieCoefficient.value=.005;skyU.mieDirectionalG.value=.8;
const envScene=new THREE.Scene(),envSky=new Sky();envSky.scale.setScalar(450000);envScene.add(envSky);
const pmrem=new THREE.PMREMGenerator(renderer);let envRT=null,lastEnvTod=-99;
const sun=new THREE.DirectionalLight(0xffffff,5),moon=new THREE.DirectionalLight(0x6a86d8,.3),hemi=new THREE.HemisphereLight(0x9bb8e8,0x3c3226,.4);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0003;sun.shadow.normalBias=.6;sun.shadow.camera.near=10;sun.shadow.camera.far=2600;
scene.add(sun,sun.target,moon,hemi);scene.fog=new THREE.FogExp2(0xa6c4e6,.00026);
const stars=(()=>{const n=1800,p=new Float32Array(n*3),r=mulberry(5);for(let i=0;i<n;i++){const u=r()*6.283,v=Math.pow(r(),.6),y=v,rr=Math.sqrt(1-y*y);p[i*3]=Math.cos(u)*rr*9000;p[i*3+1]=y*9000;p[i*3+2]=Math.sin(u)*rr*9000}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));const m=new THREE.Points(g,new THREE.PointsMaterial({color:0xdde6ff,size:1.7,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false}));m.frustumCulled=false;scene.add(m);return m})();
let water=null,waterFallback=null;
safe('water',()=>{water=new Water(new THREE.PlaneGeometry(9000,9000),{textureWidth:512,textureHeight:512,waterNormals:waterNormal,sunDirection:new V3(0,1,0),sunColor:0xffffff,waterColor:0x0b3b4a,distortionScale:2.4,fog:true});water.rotation.x=-Math.PI/2;water.material.uniforms.size.value=5;scene.add(water)});
if(!water){waterFallback=new THREE.Mesh(new THREE.PlaneGeometry(9000,9000).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:0x0b3b4a,roughness:.1,metalness:.3}));scene.add(waterFallback)}
const sunDir=new V3(),S={tod:16.5,day:0,night:0,dayF:1,speed:1,paused:false,money:150000,pop:0,jobsC:0,jobsI:0,jobsR:0,demand:{r:.3,c:.2,i:.2},income:0,upkeep:0,jam:0,date:new Date(Date.UTC(2025,5,1))};
const DAYLEN=180;
const nightMats=[],lampHeadMat=new THREE.MeshBasicMaterial({color:0xffffff,toneMapped:false}),poolMat=new THREE.MeshBasicMaterial({map:texGlow,color:0xffb66a,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,polygonOffset:true,polygonOffsetFactor:-6,polygonOffsetUnits:-6});
const headMat=new THREE.MeshBasicMaterial({color:0xffffff,toneMapped:false}),tailMat=new THREE.MeshBasicMaterial({color:0xff2010,toneMapped:false}),beamMat=new THREE.MeshBasicMaterial({map:texGlow,color:0xffe8b0,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,polygonOffset:true,polygonOffsetFactor:-6,polygonOffsetUnits:-6});
function updateEnv(){
 const a=(S.tod-6)/12*Math.PI;sunDir.set(Math.cos(a),Math.sin(a),.35).normalize();const el=sunDir.y;
 S.night=1-sstep(-.12,.1,el);S.dayF=sstep(-.05,.35,el);const N=S.night,D=S.dayF;
 skyU.sunPosition.value.copy(sunDir);
 sun.intensity=5.5*sstep(-.02,.25,el);sun.color.setRGB(1,lerp(.6,.96,D),lerp(.38,.9,D));sun.castShadow=el>.02;
 moon.intensity=.45*N;hemi.intensity=lerp(.14,.55,D);
 const sg=Math.exp(-Math.pow(el/.18,2)),dc=new THREE.Color(.62,.76,.92).lerp(new THREE.Color(.95,.6,.4),sg*.55),nc=new THREE.Color(.02,.03,.065);
 scene.fog.color.copy(nc.lerp(dc,1-N));scene.fog.density=lerp(.00036,.00026,D);
 renderer.toneMappingExposure=lerp(.9,.5,D);scene.environmentIntensity=lerp(.12,.9,D);
 bloom.strength=lerp(.15,.85,N);bloom.threshold=lerp(2.8,.95,N);
 for(const m of nightMats)m.emissiveIntensity=N*2.6;
 lampHeadMat.color.setRGB(lerp(.3,7,N),lerp(.28,5.2,N),lerp(.2,2.8,N));poolMat.opacity=N*.55;
 headMat.color.setRGB(lerp(.5,5,N),lerp(.5,4.6,N),lerp(.4,3.6,N));tailMat.color.setRGB(lerp(.8,4,N),.1,.05);beamMat.opacity=N*.45;stars.material.opacity=N;
 if(water){const u=water.material.uniforms;u.sunDirection.value.copy(sunDir);u.sunColor.value.setRGB(lerp(.02,1,D),lerp(.02,.95,D),lerp(.04,.9,D));u.waterColor.value.setRGB(lerp(.01,.04,D),lerp(.02,.22,D),lerp(.04,.28,D))}
 if(Math.abs(S.tod-lastEnvTod)>.35){lastEnvTod=S.tod;envSky.material.uniforms.sunPosition.value.copy(sunDir);for(const k of['turbidity','rayleigh','mieCoefficient','mieDirectionalG'])envSky.material.uniforms[k].value=skyU[k].value;
  const n=pmrem.fromScene(envScene,0,1,1000);if(envRT)envRT.dispose();envRT=n;scene.environment=n.texture}
}

// ===== TERRAIN =====
const MAP=2000,riverX=z=>380+90*Math.sin(z/310+.8);
function terrainH(x,z){
 const f=1-.72*Math.exp(-(Math.pow((x+150)/560,2)+Math.pow((z-20)/600,2)));
 let h=9+fbm(x/280,z/280)*15*f+fbm(x/55+9,z/55)*1.1*f;
 h=lerp(h,8,Math.exp(-Math.pow((z+90)/80,2))*sstep(-250,-480,x));
 h=lerp(h,8.5,Math.exp(-(Math.pow((x-700)/230,2)+Math.pow((z+40)/280,2)))*.88);
 h=lerp(h,-3.5,Math.exp(-Math.pow((x-riverX(z))/55,2))*.97);
 return h-34*sstep(880,1000,Math.max(Math.abs(x),Math.abs(z)));
}
const terrain=safe('terrain',()=>{
 const N=250,geo=new THREE.PlaneGeometry(MAP,MAP,N,N);geo.rotateX(-Math.PI/2);const p=geo.attributes.position;
 for(let i=0;i<p.count;i++)p.setY(i,terrainH(p.getX(i),p.getZ(i)));geo.computeVertexNormals();
 const nr=geo.attributes.normal,col=new Float32Array(p.count*3),g1=new THREE.Color(.2,.36,.1),g2=new THREE.Color(.36,.46,.15),sand=new THREE.Color(.7,.63,.45),rock=new THREE.Color(.38,.35,.31),dry=new THREE.Color(.5,.47,.24),c=new THREE.Color();
 for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),h=p.getY(i),sl=1-nr.getY(i);
  c.copy(g1).lerp(g2,vn(x/40,z/40)).lerp(dry,vn(x/130+5,z/130)*.5);c.lerp(rock,sstep(.07,.2,sl)).lerp(sand,sstep(1.9,.5,h));c.lerp(rock,sstep(20,30,h)*.6);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b}
 geo.setAttribute('color',new THREE.BufferAttribute(col,3));
 const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,map:texGrass,roughness:.96}));m.receiveShadow=true;scene.add(m);return m});

// ===== WORLD DATA MODEL / ROADS =====
const HW=6,SWI=6.2,SWO=8.6,TRIM=9.5,DISC=11.3;
const nodes=new Map(),segs=new Map();let nid=1,sid=1,lid=1,roadsDirty=true,buildDirty=true,propsDirty=true,lotsList=[];
const lerp2=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
const bez=(a,c,b,t)=>{const u=1-t;return[u*u*a.x+2*u*t*c.x+t*t*b.x,u*u*a.z+2*u*t*c.z+t*t*b.z]};
function mkNode(x,z){const n={id:nid++,x,z,y:terrainH(x,z),segs:new Set(),entry:false,owner:null};nodes.set(n.id,n);return n}
function computeSeg(s){
 const a=nodes.get(s.a),b=nodes.get(s.b),f=t=>s.c?bez(a,s.c,b,t):[lerp(a.x,b.x,t),lerp(a.z,b.z,t)];
 let L=0,pv=f(0);for(let i=1;i<=20;i++){const q=f(i/20);L+=Math.hypot(q[0]-pv[0],q[1]-pv[1]);pv=q}
 const N=Math.max(2,Math.ceil(L/5)),P=[];let minH=1e9;
 for(let i=0;i<=N;i++){const q=f(i/N),h=terrainH(q[0],q[1]);minH=Math.min(minH,h);P.push({x:q[0],z:q[1],h,y:0,s:0,tx:0,tz:0})}
 s.bridge=minH<.6;let acc=0;
 for(let i=0;i<=N;i++){const p=P[i];if(i)acc+=Math.hypot(p.x-P[i-1].x,p.z-P[i-1].z);p.s=acc;p.y=s.bridge?lerp(a.y,b.y,i/N):p.h;
  const q=P[Math.min(N,i+1)],o=P[Math.max(0,i-1)];let tx=q.x-o.x,tz=q.z-o.z;const l=Math.hypot(tx,tz)||1;p.tx=tx/l;p.tz=tz/l}
 s.pts=P;s.len=acc;s.N=N}

function updateCamera(dt){const sp=cam.dist*.9*dt*(keys.has('ShiftLeft')?2.5:1),f=[-Math.sin(cam.yaw),-Math.cos(cam.yaw)],r=[Math.cos(cam.yaw),-Math.sin(cam.yaw)];

 sun.target.position.set(cam.x,cam.y,cam.z);sun.position.copy(sun.target.position).addScaledVector(sunDir,1100);moon.position.set(cam.x-sunDir.x*500,cam.y+500,cam.z+200);moon.target.position.copy(sun.target.position)}
