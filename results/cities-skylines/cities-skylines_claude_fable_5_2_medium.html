/* ===================== CORE: utils, seeded RNG, world model ===================== */

const errs={};function safe(name,fn){try{return fn()}catch(e){errs[name]=(errs[name]||0)+1;if(errs[name]<4)console.error('['+name+']',e)}}

const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});

/* ===================== TERRAIN ===================== */

 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setIndex(new THREE.BufferAttribute(idx,1));g.computeVertexNormals();
 const grain=canvasTex(256,256,(x,w,h)=>{x.fillStyle='#e6e6e6';x.fillRect(0,0,w,h);for(let i=0;i<9000;i++){const v=170+frng()*85|0;x.fillStyle=`rgb(${v},${v},${v})`;x.fillRect(frng()*w,frng()*h,1+frng()*2,1+frng()*2)}});

/* ===================== ENVIRONMENT (sky, sun, shadows, fog, day/night) ===================== */
let sky,sun,hemi,stars,pmrem,envScene,envRT=null,lastEnvTod=-9,lastEnvT=0,lastExt=0;const sunDir=new THREE.Vector3(),ld=new THREE.Vector3();

/* ===================== GEOMETRY BUILDER (shared by roads/buildings/props) ===================== */
const ID={x:0,y:0,z:0,c:1,s:0};

  this.quad(M,[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],-1,0,0,col,uo,0,uo+ud,vh);
  this.quad(M,[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0],0,1,0,col)}

/* ===================== ROADS (graph, geometry, snapping, splitting) ===================== */
const RH=new Map(),RC=50,LANE=1.75,cConc=C(0x8e8e88);

  else{const cap=CAP[b.type][b.dens]*b.level;el.innerHTML=`<h3>${b.dens?'High':'Low'}-density ${ZNAME[b.type].toLowerCase()}</h3>`+row('Status',b.aband?'Abandoned':b.grow<1?'Under construction '+Math.round(b.grow*100)+'%':'Operating')+row('Level',b.level+' / 3')+row(b.type==='R'?'Residents':'Jobs',b.aband||b.grow<1?0:cap)+row('Land value',Math.round(l.lv=landValue(l)))+row('Tax','₡'+(cap*(b.type==='R'?1.1:b.type==='C'?.9:.8)).toFixed(0)+' / day')}}}

/* ===================== AUDIO (synthesized ambience + tool sounds) ===================== */
let AC=null;const A={muted:false};
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=frng()*2-1;A.nb=nb;
 A.master=AC.createGain();A.master.gain.value=.5;A.master.connect(AC.destination);
 const mk=(type,f,q)=>{const s=AC.createBufferSource();s.buffer=nb;s.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(A.master);s.start();return g};
 A.wind=mk('bandpass',380,.5);A.city=mk('lowpass',170,.7);A.traf=mk('bandpass',850,.4);
 const o=AC.createOscillator();o.frequency.value=4300;const lf=AC.createOscillator();lf.type='square';lf.frequency.value=13;const lg=AC.createGain();lg.gain.value=.5;const og=AC.createGain();og.gain.value=.5;A.crk=AC.createGain();A.crk.gain.value=0;
 lf.connect(lg);lg.connect(og.gain);o.connect(og);og.connect(A.crk);A.crk.connect(A.master);o.start();lf.start();$('mute').classList.add('on')}catch(e){console.warn('[audio]',e)}}
function tone(f0,f1,dur,type,vol){if(!AC||A.muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(A.master);o.start(t);o.stop(t+dur+.02)}
function burst(dur,f,vol){if(!AC||A.muted)return;const t=AC.currentTime,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=A.nb;fl.type='lowpass';fl.frequency.setValueAtTime(f,t);fl.frequency.exponentialRampToValueAtTime(80,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(g);g.connect(A.master);s.start(t);s.stop(t+dur)}
const sfx={click:()=>tone(700,640,.04,'sine',.07),road:()=>{tone(170,80,.14,'square',.12);burst(.12,1800,.2)},zone:()=>tone(520,820,.08,'sine',.09),doze:()=>{burst(.45,1200,.45);tone(90,40,.35,'sawtooth',.14)},err:()=>tone(150,95,.2,'sawtooth',.1),grow:()=>{if(cs.dist<500)tone(880,1320,.12,'triangle',.03)}};
function updAudio(){if(!AC)return;const z=sstep(60,1500,cs.dist),n=W.night,t=AC.currentTime;
 A.wind.gain.setTargetAtTime(.04+.32*z,t,.3);A.city.gain.setTargetAtTime((1-z)*(.55-.35*n)*Math.min(1,W.pop/3000),t,.3);A.traf.gain.setTargetAtTime((1-z)*.11*(1-.6*n)*Math.min(1,V.length/150),t,.3);A.crk.gain.setTargetAtTime((1-z)*n*.035,t,.5);
 if(n<.3&&z<.6&&frng()<.012){const f=2200+frng()*1800;tone(f,f*1.25,.07,'sine',.025);if(frng()<.5)setTimeout(()=>tone(f*1.1,f*1.4,.06,'sine',.02),110)}}

/* ===================== DEMO CITY (fixed seed) ===================== */
safe('demo-city',()=>{
 const G={},node=(x,z)=>{const k=x+','+z;return G[k]||(G[k]=hAt(x,z)>3?addNode(x,z):null)},link=(a,b)=>a&&b&&addSeg(a,b);
 for(let i=0;i<8;i++)for(let j=0;j<9;j++){const x=-620+i*104,z=-416+j*104,far=Math.hypot(x+204,z)>330;
  if(i<7&&!(far&&rng()<.16))link(node(x,z),node(x+104,z));if(j<8&&!(far&&rng()<.16))link(node(x,z),node(x,z+104))}
 for(let i=0;i<3;i++)for(let j=0;j<5;j++){const x=640+i*104,z=-208+j*104;if(i<2)link(node(x,z),node(x+104,z));if(j<4)link(node(x,z),node(x,z+104))}
 link(node(108,0),node(640,0));
 const a=node(-620,-416),b=node(-620,416);if(a&&b){const P=[];for(let i=0;i<=16;i++){const t=i/16,u=1-t;P.push({x:u*u*a.x+2*u*t*-800+t*t*b.x,z:u*u*a.z+t*t*b.z})}P[0]=a;P[16]=b;addSeg(a,b,P)}
 for(const n of[...W.nodes.values()])if(!n.segs.length)W.nodes.delete(n.id);
 conn();for(const s of W.segs.values())genLots(s);
 for(const l of W.lots.values()){const d=Math.hypot(l.x+204,l.z),r=rng(),r2=rng(),r3=rng();
  if(r3<.05){l.zone='P';continue}
  if(l.x>520){l.zone='I';l.dens=Math.abs(l.z)<110?1:0}
  else if(d<150){l.zone=r<.75?'C':'R';l.dens=1}
  else if(d<260){if(r<.5){l.zone='R';l.dens=1}else if(r<.8){l.zone='C';l.dens=0}else{l.zone='C';l.dens=1}}
  else if(d<400){if(r<.7){l.zone='R';l.dens=0}else if(r<.9){l.zone='C';l.dens=0}else{l.zone='R';l.dens=1}}
  else{l.zone=r<.92?'R':'C';l.dens=0}
  if(r2<.86&&l.seg.conn)l.b={type:l.zone,dens:l.dens,level:1+Math.min(2,(rng()*(d<260?3:2.2))|0),grow:1,aband:false}}
 for(const l of W.lots.values())l.lv=landValue(l);
 census();W.inc=Math.round(W.pop*1.1+W.cj*.9+W.ij*.8);W.upk=Math.round(W.roadLen*.05+W.parks*6);
 rebuildRoads();W.roadDirty=false;for(let i=0;i<16;i++)rebuildChunk(i);W.dirtyCh.clear();rebuildProps();W.propsDirty=false;
 buildLanes();for(let i=0;i<900;i++)spawn();initPeds();
});

/* ===================== MAIN LOOP ===================== */
let last=performance.now();
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000);last=t;const sdt=dt*W.speed;
 safe('camera',()=>updCam(dt));safe('environment',()=>updEnv(dt,sdt));safe('simulation',()=>updSim(sdt));
 safe('roads',()=>{if(W.roadDirty){W.roadDirty=false;rebuildRoads()}});
 safe('buildings',()=>updBuildings(sdt));
 safe('props',()=>{if(W.propsDirty&&t-propsT>900){propsT=t;W.propsDirty=false;rebuildProps()}});
 safe('zoning',()=>{if(W.zoneDirty&&zoneMesh.visible){W.zoneDirty=false;rebuildZones()}});
 safe('traffic',()=>updTraffic(sdt));safe('effects',()=>updFx(dt,sdt,t/1000));safe('ui',()=>updUI(dt));safe('audio',updAudio);
 safe('render',()=>composer.render())}
requestAnimationFrame(frame);
