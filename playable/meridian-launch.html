<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian Launch — playable</title>
<style>
html,body{margin:0;height:100%;background:#04060f;overflow:hidden;font-family:system-ui,sans-serif;color:#eee}
canvas{display:block;position:fixed;inset:0}
#ui{position:fixed;left:12px;bottom:12px;display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.45);padding:8px 12px;border-radius:999px;font-size:13px}
button{background:#2a2440;color:#eee;border:1px solid #4a3f6b;border-radius:999px;padding:6px 12px;cursor:pointer}
#hud{position:fixed;left:16px;top:14px;font-size:13px;line-height:1.7}
.bar{width:150px;height:9px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar>i{display:block;height:100%;width:0;background:#4ac0ff}
#msg{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);font-size:34px;font-weight:700;letter-spacing:2px;opacity:0;transition:opacity .3s}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">
  altitude <b id="alt">0.0</b> km &nbsp; target 100 km<br>
  speed <b id="spd">0</b> m/s &nbsp; <span class="bar"><i id="fuel"></i></span> fuel<br>
  <span id="state">on the pad</span>
</div>
<div id="msg"></div>
<div id="ui"><b>Meridian Launch</b>
<button id="launch">hold to thrust ⬆</button>
<button id="reset">reset</button><span id="fps"></span></div>
<div id="hint" style="position:fixed;right:14px;top:12px;font-size:12px;opacity:.7">hold mouse / space = thrust · R = reset</div>
<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
addEventListener('resize', resize); resize();

const PADY = 0;
let y = 0, v = 0, fuel = 100, thrusting = false, tSec = 0, won = false, crashed = false;
const STAR = [], CLOUD = [], PART = [];
for (let i = 0; i < 140; i++) STAR.push({ x: Math.random(), y: Math.random(), s: Math.random() * 1.8 + 0.4, p: Math.random() * 6.28 });
for (let i = 0; i < 8; i++) CLOUD.push({ x: Math.random(), y: 0.1 + Math.random() * 0.5, s: 0.6 + Math.random() * 1.2, v: 0.01 + Math.random() * 0.03 });

function reset() { y = 0; v = 0; fuel = 100; won = false; crashed = false; PART.length = 0; setMsg(''); setState('on the pad'); }
function setMsg(t) { const m = document.getElementById('msg'); m.textContent = t; m.style.opacity = t ? 1 : 0; }
function setState(t) { document.getElementById('state').textContent = t; }

function step(dt) {
  tSec += dt;
  if (!won && !crashed) {
    let a = -9.8;
    if (thrusting && fuel > 0) { a += 30; fuel = Math.max(0, fuel - 10 * dt); }
    v += a * dt; y += v * dt;
    if (y < 0) { y = 0; if (v < -6) { crashed = true; setMsg('CRASHED'); setState('crashed — press R'); } v = 0; }
    if (y >= 100000) { won = true; setMsg('MERIDIAN REACHED'); setState('orbit achieved'); }
  }
  for (const c of CLOUD) { c.x += c.v * dt; if (c.x > 1.3) c.x = -0.3; }
  if (thrusting && fuel > 0 && !won && !crashed && Math.random() < 0.9) PART.push({ x: W * 0.5 + (Math.random() - 0.5) * 10, y: H * 0.62 + 26, vy: 220 + Math.random() * 160, vx: (Math.random() - 0.5) * 60, life: 0.5 + Math.random() * 0.4, t: 0 });
  for (let i = PART.length - 1; i >= 0; i--) { const p = PART[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.t > p.life) PART.splice(i, 1); }
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const altF = Math.min(1, y / 100000);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, altF > 0.5 ? '#000208' : '#123a6a');
  sky.addColorStop(0.6, altF > 0.5 ? '#050a1c' : '#2a6aa0');
  sky.addColorStop(1, altF > 0.5 ? '#0a0f22' : '#8ac0e0');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  for (const s of STAR) { const a = Math.max(0.15, altF) * (0.5 + 0.5 * Math.sin(tSec * 2 + s.p)); ctx.fillStyle = 'rgba(255,255,255,' + a + ')'; ctx.fillRect(s.x * W, s.y * H, s.s, s.s); }
  for (const c of CLOUD) { ctx.fillStyle = 'rgba(255,255,255,' + (0.16 * (1 - altF)) + ')'; ctx.beginPath(); ctx.ellipse(c.x * W, c.y * H, 80 * c.s, 18 * c.s, 0, 0, 6.2832); ctx.fill(); }
  // ground
  const gY = H * 0.62 + y * 0.02;
  if (gY < H + 40) {
    ctx.fillStyle = '#1a2418'; ctx.fillRect(0, gY, W, H - gY + 40);
    ctx.fillStyle = '#2a3a26'; ctx.fillRect(0, gY, W, 8);
    ctx.fillStyle = '#4a4a52'; ctx.fillRect(W * 0.5 - 26, gY - 10, 52, 10);
  }
  // exhaust
  for (const p of PART) { const a = 1 - p.t / p.life; ctx.fillStyle = 'rgba(255,' + (140 + 100 * a | 0) + ',60,' + a * 0.9 + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, 3 + 6 * a, 0, 6.2832); ctx.fill(); }
  // rocket
  const rx = W * 0.5, ry = H * 0.62;
  ctx.save(); ctx.translate(rx, ry);
  if (thrusting && fuel > 0 && !won && !crashed) { const fl = 22 + Math.random() * 16; const fg = ctx.createLinearGradient(0, 24, 0, 24 + fl); fg.addColorStop(0, 'rgba(255,220,120,0.95)'); fg.addColorStop(1, 'rgba(255,60,20,0)'); ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(-7, 24); ctx.lineTo(7, 24); ctx.lineTo(0, 24 + fl); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle = '#e8eef5'; ctx.beginPath(); ctx.moveTo(0, -34); ctx.lineTo(10, 10); ctx.lineTo(-10, 10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#c03030'; ctx.beginPath(); ctx.moveTo(0, -34); ctx.lineTo(10, 10); ctx.lineTo(0, 10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3a5ac0'; ctx.beginPath(); ctx.moveTo(-10, 4); ctx.lineTo(-19, 20); ctx.lineTo(-10, 20); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10, 4); ctx.lineTo(19, 20); ctx.lineTo(10, 20); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(120,220,255,' + (0.5 + 0.5 * Math.sin(tSec * 4)) + ')'; ctx.beginPath(); ctx.arc(0, -20, 4, 0, 6.2832); ctx.fill();
  ctx.restore();
  // HUD
  document.getElementById('alt').textContent = (y / 1000).toFixed(1);
  document.getElementById('spd').textContent = Math.round(v);
  document.getElementById('fuel').style.width = fuel + '%';
}

function begin() { thrusting = true; }
function end() { thrusting = false; }
canvas.addEventListener('pointerdown', begin);
addEventListener('pointerup', end);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); begin(); } if (e.key.toLowerCase() === 'r') reset(); });
addEventListener('keyup', e => { if (e.code === 'Space') end(); });
const lb = document.getElementById('launch');
lb.addEventListener('pointerdown', begin); lb.addEventListener('pointerup', end);
document.getElementById('reset').onclick = reset;

let last = performance.now(), fn = 0, ft = last;
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (!isFinite(dt) || dt > 0.05) dt = 0.016;
  step(dt); render();
  fn++; if (now - ft > 500) { const el = document.getElementById('fps'); if (el) el.textContent = Math.round(fn * 1000 / (now - ft)) + ' fps'; fn = 0; ft = now; }
  requestAnimationFrame(loop);
}
render();
requestAnimationFrame(loop);
</script></body></html>
