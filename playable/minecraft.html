<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voxel Craft — playable</title>
<style>
html,body{margin:0;height:100%;background:#0b0a12;overflow:hidden;font-family:system-ui,sans-serif;color:#eee}
canvas{display:block;position:fixed;inset:0;cursor:crosshair}
#ui{position:fixed;left:12px;bottom:12px;display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.45);padding:8px 12px;border-radius:999px;font-size:13px}
button{background:#2a2440;color:#eee;border:1px solid #4a3f6b;border-radius:999px;padding:6px 12px;cursor:pointer}
button.active{background:#4a8cff;border-color:#8ab0ff}
#hud{position:fixed;right:14px;top:12px;font-size:12px;opacity:.75;text-align:right;line-height:1.5}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui"><b>Voxel Craft</b>
<button id="build" class="active">build</button>
<button id="mine">mine</button>
<button id="regen">new world</button><span id="fps"></span></div>
<div id="hud">click a tile to build · mine mode removes · WASD pan · drag to pan</div>
<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
addEventListener('resize', resize); resize();

const TW = 64, TH = 32, BH = 20, N = 14;
let ox = 0, oy = 120;
let mode = 'build', tSec = 0;
const h = [];
const CLOUD = [];
for (let i = 0; i < 7; i++) CLOUD.push({ x: Math.random(), y: 0.05 + Math.random() * 0.3, s: 0.6 + Math.random(), v: 0.01 + Math.random() * 0.03 });
const keys = {};

function regen() {
  h.length = 0;
  for (let y = 0; y < N; y++) { const row = []; for (let x = 0; x < N; x++) { const d = Math.hypot(x - N / 2, y - N / 2) / (N / 2); row.push(Math.max(0, Math.round(2.2 - d * 1.4 + Math.random() * 1.2))); } h.push(row); }
}
regen();
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); const r = Math.min(255, ((n >> 16) & 255) * f), g = Math.min(255, ((n >> 8) & 255) * f), b = Math.min(255, (n & 255) * f); return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')'; }
function topColor(gx, gy) { if (h[gy][gx] === 0) return '#3a6ea8'; if (h[gy][gx] >= 4) return '#e8eef5'; return '#5aa04a'; }

function iso(gx, gy, hh) { return { x: ox + (gx - gy) * TW / 2, y: oy + (gx + gy) * TH / 2 - hh * BH }; }

function cube(gx, gy, hh) {
  const p = iso(gx, gy, hh);
  const hw = TW / 2, hh2 = TH / 2;
  const top = topColor(gx, gy);
  // left face
  ctx.fillStyle = shade(top, 0.62);
  ctx.beginPath(); ctx.moveTo(p.x - hw, p.y); ctx.lineTo(p.x, p.y + hh2); ctx.lineTo(p.x, p.y + hh2 + BH); ctx.lineTo(p.x - hw, p.y + BH); ctx.closePath(); ctx.fill();
  // right face
  ctx.fillStyle = shade(top, 0.82);
  ctx.beginPath(); ctx.moveTo(p.x + hw, p.y); ctx.lineTo(p.x, p.y + hh2); ctx.lineTo(p.x, p.y + hh2 + BH); ctx.lineTo(p.x + hw, p.y + BH); ctx.closePath(); ctx.fill();
  // top face
  ctx.fillStyle = top;
  ctx.beginPath(); ctx.moveTo(p.x, p.y - hh2); ctx.lineTo(p.x + hw, p.y); ctx.lineTo(p.x, p.y + hh2); ctx.lineTo(p.x - hw, p.y); ctx.closePath(); ctx.fill();
  if (hh === 0) {
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.10 + 0.10 * Math.sin(tSec * 2 + gx + gy)) + ')';
    ctx.lineWidth = 1.4; ctx.beginPath();
    ctx.moveTo(p.x - hw * 0.6, p.y - 2 + Math.sin(tSec * 3 + gx) * 2); ctx.lineTo(p.x + hw * 0.4, p.y + 2 + Math.sin(tSec * 3 + gy) * 2); ctx.stroke();
  }
}

function step(dt) {
  tSec += dt;
  let px = 0, py = 0;
  if (keys['a']) px -= 1; if (keys['d']) px += 1; if (keys['w']) py -= 1; if (keys['s']) py += 1;
  ox += px * 320 * dt; oy += py * 320 * dt;
  for (const c of CLOUD) { c.x += c.v * dt; if (c.x > 1.3) c.x = -0.3; }
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#132a4a'); g.addColorStop(0.5, '#2a4a6a'); g.addColorStop(1, '#0d1420');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const c of CLOUD) { const x = c.x * W, y = c.y * H; ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.beginPath(); ctx.ellipse(x, y, 70 * c.s, 16 * c.s, 0, 0, 6.2832); ctx.fill(); ctx.beginPath(); ctx.ellipse(x + 40 * c.s, y + 5, 44 * c.s, 13 * c.s, 0, 0, 6.2832); ctx.fill(); }
  for (let s = 0; s <= 2 * N - 2; s++) {
    for (let gy = 0; gy < N; gy++) {
      const gx = s - gy;
      if (gx < 0 || gx >= N) continue;
      cube(gx, gy, h[gy][gx]);
    }
  }
  // selection marker
  if (hover) {
    const hh = h[hover.gy] ? h[hover.gy][hover.gx] : 0;
    const p = iso(hover.gx, hover.gy, hh);
    ctx.strokeStyle = 'rgba(255,230,120,' + (0.5 + 0.5 * Math.sin(tSec * 6)) + ')';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(p.x, p.y - TH / 2); ctx.lineTo(p.x + TW / 2, p.y); ctx.lineTo(p.x, p.y + TH / 2); ctx.lineTo(p.x - TW / 2, p.y); ctx.closePath(); ctx.stroke();
  }
  // player
  const pp = iso(N / 2 | 0, N / 2 | 0, h[N / 2 | 0][N / 2 | 0]) ;
  ctx.save(); ctx.translate(pp.x, pp.y - 24 + Math.sin(tSec * 3) * 3);
  ctx.fillStyle = '#e8c07a'; ctx.fillRect(-6, -14, 12, 12);
  ctx.fillStyle = '#3a5ac0'; ctx.fillRect(-7, -2, 14, 14);
  ctx.restore();
}

let hover = null;
function pick(sx, sy) {
  const dx = (sx - ox) * 2 / TW, dy = (sy - oy) * 2 / TH;
  const gx = Math.round((dy + dx) / 2), gy = Math.round((dy - dx) / 2);
  if (gx < 0 || gy < 0 || gx >= N || gy >= N) return null;
  return { gx, gy };
}
function act(sx, sy) {
  const c = pick(sx, sy); if (!c) return;
  if (mode === 'build') h[c.gy][c.gx] = Math.min(6, h[c.gy][c.gx] + 1);
  else h[c.gy][c.gx] = Math.max(0, h[c.gy][c.gx] - 1);
}
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, ox, oy, moved: false }; });
canvas.addEventListener('pointermove', e => {
  hover = pick(e.clientX, e.clientY);
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 6) { drag.moved = true; ox = drag.ox + dx; oy = drag.oy + dy; } }
});
canvas.addEventListener('pointerup', e => { if (drag && !drag.moved) act(e.clientX, e.clientY); drag = null; });
canvas.addEventListener('pointerleave', () => { hover = null; });
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
document.getElementById('build').onclick = () => { mode = 'build'; document.getElementById('build').classList.add('active'); document.getElementById('mine').classList.remove('active'); };
document.getElementById('mine').onclick = () => { mode = 'mine'; document.getElementById('mine').classList.add('active'); document.getElementById('build').classList.remove('active'); };
document.getElementById('regen').onclick = regen;

let last = performance.now(), fn = 0, ft = last;
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (!isFinite(dt) || dt > 0.05) dt = 0.016;
  step(dt); render();
  fn++; if (now - ft > 500) { const el = document.getElementById('fps'); if (el) el.textContent = Math.round(fn * 1000 / (now - ft)) + ' fps'; fn = 0; ft = now; }
  requestAnimationFrame(loop);
}
render();
requestAnimationFrame(loop);
</script></body></html>
