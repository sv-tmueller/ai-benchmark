<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunset Ocean — playable</title>
<style>
html,body{margin:0;height:100%;background:#0b0a12;overflow:hidden;font-family:system-ui,sans-serif;color:#eee}
canvas{display:block;position:fixed;inset:0}
#ui{position:fixed;left:12px;bottom:12px;display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.45);padding:8px 12px;border-radius:999px;font-size:13px}
button{background:#2a2440;color:#eee;border:1px solid #4a3f6b;border-radius:999px;padding:6px 12px;cursor:pointer}
input[type=range]{width:110px}
#hud{position:fixed;right:14px;top:12px;font-size:12px;opacity:.7;text-align:right}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui"><b>Sunset Ocean</b>
<button id="phase">next phase</button>
<label>wind <input id="wind" type="range" min="0" max="100" value="40"></label>
<button id="calm">calm</button><span id="fps"></span></div>
<div id="hud">move mouse = wind · click water = ripples</div>
<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1, horizon = 0;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; horizon = H * 0.55;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
addEventListener('resize', resize); resize();

const TOD = [
  { top: '#20143a', mid: '#ff7a3c', sun: '#ffd27a', w1: '#8a4a6a', w2: '#241636' },
  { top: '#123a5a', mid: '#ffd27a', sun: '#fff3c0', w1: '#2a6a8a', w2: '#0b2030' },
  { top: '#0b1a3a', mid: '#ff4d6a', sun: '#ff9a6a', w1: '#5a2a55', w2: '#150a20' },
  { top: '#060818', mid: '#3a2a6a', sun: '#c0c8ff', w1: '#1a2244', w2: '#05060f' }
];
let ti = 0, base = 0.15, wind = 0.4, targetWind = 0.4, tSec = 0;
const CL = [], RIPPLE = [];
for (let i = 0; i < 9; i++) CL.push({ x: Math.random() * 1.4 - 0.2, y: 0.08 + Math.random() * 0.32, s: 0.5 + Math.random() * 1.4, v: 0.006 + Math.random() * 0.02, a: 0.05 + Math.random() * 0.12 });
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }

function step(dt) {
  tSec += dt;
  wind += (targetWind - wind) * Math.min(1, dt * 2.5);
  const t01 = (base + tSec * 0.01) % 1;
  ti = Math.floor(t01 * TOD.length) % TOD.length;
  for (const c of CL) { c.x += c.v * dt; if (c.x > 1.3) c.x = -0.35; }
  for (let i = RIPPLE.length - 1; i >= 0; i--) { const r = RIPPLE[i]; r.t += dt; if (r.t > 3) RIPPLE.splice(i, 1); }
}

function render() {
  const P = TOD[ti];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const t01 = (base + tSec * 0.01) % 1;
  // sky
  const sg = ctx.createLinearGradient(0, 0, 0, horizon);
  sg.addColorStop(0, P.top); sg.addColorStop(1, P.mid);
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, horizon);
  // clouds
  for (const c of CL) {
    const x = c.x * W, y = c.y * horizon, w = 90 * c.s, h = 16 * c.s;
    ctx.fillStyle = hexA('#ffffff', c.a);
    ctx.beginPath(); ctx.ellipse(x, y, w, h, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + w * 0.5, y + 4, w * 0.6, h * 0.9, 0, 0, 6.2832); ctx.fill();
  }
  // sun
  const sx = W * (0.12 + 0.76 * t01), sy = horizon - Math.sin(t01 * Math.PI) * horizon * 0.5;
  const glow = ctx.createRadialGradient(sx, sy, 2, sx, sy, horizon * 0.55);
  glow.addColorStop(0, hexA(P.sun, 0.95)); glow.addColorStop(0.14, hexA(P.sun, 0.55)); glow.addColorStop(1, hexA(P.sun, 0));
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(sx, sy, horizon * 0.55, 0, 6.2832); ctx.fill();
  ctx.fillStyle = P.sun; ctx.beginPath(); ctx.arc(sx, sy, 16 + 4 * Math.sin(tSec), 0, 6.2832); ctx.fill();
  // water
  const wg = ctx.createLinearGradient(0, horizon, 0, H);
  wg.addColorStop(0, P.w1); wg.addColorStop(1, P.w2);
  ctx.fillStyle = wg; ctx.fillRect(0, horizon, W, H - horizon);
  // sun reflection column
  for (let r = 0; r < 44; r++) {
    const yy = horizon + (r / 44) * (H - horizon);
    const w = 12 + r * 2.6, flick = (0.22 + 0.22 * Math.sin(tSec * 3 + r)) * (1 - r / 50);
    ctx.fillStyle = hexA(P.sun, Math.max(0, flick));
    ctx.fillRect(sx - w / 2 + Math.sin(tSec * 2 + r) * 5 * wind, yy, w * (0.6 + 0.6 * wind), 3);
  }
  // wave lines
  const rows = 30;
  for (let r = 0; r < rows; r++) {
    const yy = horizon + ((r + 1) / rows) * (H - horizon);
    const amp = (1.5 + r * 0.6) * (0.35 + wind * 1.6);
    const ph = tSec * (0.8 + r * 0.06) + r * 0.7;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 7) {
      const y = yy + Math.sin(x * 0.011 + ph) * amp / (1 + r * 0.05);
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = hexA('#ffffff', 0.035 + 0.03 * Math.sin(r + tSec)); ctx.lineWidth = 1.3; ctx.stroke();
  }
  // ripples
  for (const rp of RIPPLE) { const a = (1 - rp.t / 3); ctx.strokeStyle = hexA(P.sun, a * 0.5); ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(rp.x, rp.y, rp.t * 90, rp.t * 26, 0, 0, 6.2832); ctx.stroke(); }
  // boat
  const bx = W * 0.5 + Math.sin(tSec * 0.3) * W * 0.12;
  const by = horizon + (H - horizon) * 0.34 + Math.sin(tSec * 1.6) * (4 + 8 * wind);
  ctx.save(); ctx.translate(bx, by); ctx.rotate(Math.sin(tSec * 1.6) * 0.04 * (0.5 + wind));
  ctx.fillStyle = '#231a14'; ctx.beginPath();
  ctx.moveTo(-26, 0); ctx.lineTo(26, 0); ctx.lineTo(18, 12); ctx.lineTo(-18, 12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f2ede2'; ctx.beginPath();
  ctx.moveTo(-2, 0); ctx.lineTo(-2, -34); ctx.lineTo(22, -4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3b2a1e'; ctx.fillRect(-28, -3, 56, 3);
  ctx.restore();
}

canvas.addEventListener('pointermove', e => { targetWind = 0.15 + (e.clientX / W) * 1.9; });
canvas.addEventListener('pointerdown', e => { RIPPLE.push({ x: e.clientX, y: Math.max(horizon + 6, e.clientY), t: 0 }); });
document.getElementById('phase').onclick = () => { base = (base + 0.25) % 1; };
document.getElementById('calm').onclick = () => { targetWind = 0.05; const s = document.getElementById('wind'); if (s) s.value = 5; };
document.getElementById('wind').oninput = e => { targetWind = e.target.value / 100 * 2; };
document.getElementById('c').onclick = null;

let last = performance.now(), fn = 0, ft = last;
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (!isFinite(dt) || dt > 0.05) dt = 0.016;
  step(dt); render();
  fn++; if (now - ft > 500) { const el = document.getElementById('fps'); if (el) el.textContent = Math.round(fn * 1000 / (now - ft)) + ' fps'; fn = 0; ft = now; }
  requestAnimationFrame(loop);
}
render();
requestAnimationFrame(loop);
</script></body></html>
