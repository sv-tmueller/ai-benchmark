<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melon Jelly — playable</title>
<style>
  html,body{margin:0;height:100%;background:#1b2430;color:#e8eef5;font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  #c{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
  #c.cutting{cursor:crosshair}
  #ui{position:fixed;left:12px;top:12px;display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.35);padding:8px 10px;border-radius:10px;backdrop-filter:blur(4px)}
  button{background:#2c3a4d;color:#e8eef5;border:1px solid #47617f;border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
  button.active{background:#4f8cff;border-color:#4f8cff;color:#fff}
  input[type=color]{width:34px;height:26px;border:none;background:none;padding:0;cursor:pointer}
  #hint{position:fixed;left:12px;bottom:12px;opacity:.7}
  #fps{position:fixed;right:12px;top:12px;opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="modeGrab" class="active">Grab</button>
  <button id="modeCut">Cut</button>
  <button id="reset">Reset</button>
  <label title="flesh colour"><input id="colorPicker" type="color" value="#ff7f7f"></label>
</div>
<div id="hint">Drag the jelly to wobble it. Switch to Cut and drag across it to slice.</div>
<div id="fps"></div>
<script>
'use strict';
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W=0,H=0,dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
let fleshColor='#ff7f7f';
const rindColor='#2f7d32';
let mode='grab';

function resize(){
  W=innerWidth;H=innerHeight;
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
}
addEventListener('resize',()=>{resize();});
resize();
/* ---------- soft-body jelly: verlet ring + centre ---------- */
const N = 44;
const P = [];
const SPR = [];
const SEED = [];
let R = 140, cIdx = 0, tSec = 0;
let grabbing = null;
const mouse = { x: 0, y: 0 };
let cutting = false, cutA = null, cutB = null;

function build() {
  P.length = 0; SPR.length = 0; SEED.length = 0;
  R = Math.max(70, Math.min(160, Math.min(W, H) * 0.3));
  const cx = W / 2, cy = H * 0.52;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    const x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
    P.push({ x, y, px: x, py: y });
  }
  cIdx = P.length;
  P.push({ x: cx, y: cy, px: cx, py: cy });
  const circ = (2 * Math.PI * R) / N;
  for (let i = 0; i < N; i++) {
    SPR.push({ a: i, b: (i + 1) % N, rest: circ, st: 0.5 });
    SPR.push({ a: i, b: cIdx, rest: R, st: 0.28 });
  }
  for (let s = 0; s < 26; s++) {
    SEED.push({ k: Math.floor(Math.random() * N), dx: (Math.random() - 0.5) * R * 0.7, dy: (Math.random() - 0.5) * R * 0.7, rot: Math.random() * Math.PI });
  }
}

function step(dt) {
  const G = 1400;
  for (const p of P) {
    const vx = (p.x - p.px) * 0.992, vy = (p.y - p.py) * 0.992;
    p.px = p.x; p.py = p.y;
    p.x += vx; p.y += vy + G * dt * dt;
  }
  const wob = 0.055 * Math.sin(tSec * 2.1) + 0.03 * Math.sin(tSec * 3.7 + 1.1);
  for (let k = 0; k < 5; k++) {
    for (const s of SPR) {
      const a = P[s.a], b = P[s.b];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 1e-6;
      const rest = s.rest * (1 + wob);
      const f = ((d - rest) / d) * 0.5 * s.st;
      a.x += dx * f; a.y += dy * f;
      b.x -= dx * f; b.y -= dy * f;
    }
    const floorY = H - 26;
    for (const p of P) {
      if (p.y > floorY) { p.y = floorY; p.px = p.x * 0.35 + p.px * 0.65; }
      if (p.x < 12) p.x = 12; else if (p.x > W - 12) p.x = W - 12;
      if (p.y < 12) p.y = 12;
    }
  }
  if (grabbing !== null) {
    const p = P[grabbing];
    p.x = mouse.x; p.y = mouse.y; p.px = mouse.x; p.py = mouse.y;
  }
  tSec += dt;
}
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const cx = P[cIdx].x, cy = P[cIdx].y;
  const pg = ctx.createLinearGradient(0, H - 44, 0, H);
  pg.addColorStop(0, 'rgba(255,255,255,0)'); pg.addColorStop(1, 'rgba(255,255,255,0.07)');
  ctx.fillStyle = pg; ctx.fillRect(0, H - 44, W, 44);
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(cx, H - 26, R * 0.85, 13, 0, 0, Math.PI * 2); ctx.fill();
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  ctx.beginPath();
  const m0 = mid(P[N - 1], P[0]); ctx.moveTo(m0.x, m0.y);
  for (let i = 0; i < N; i++) { const p = P[i], pn = P[(i + 1) % N], mm = mid(p, pn); ctx.quadraticCurveTo(p.x, p.y, mm.x, mm.y); }
  ctx.closePath();
  const grd = ctx.createRadialGradient(cx - R * 0.32, cy - R * 0.38, R * 0.08, cx, cy, R * 1.2);
  grd.addColorStop(0, '#ffc9c9'); grd.addColorStop(0.5, fleshColor); grd.addColorStop(1, '#cf4657');
  ctx.fillStyle = grd; ctx.fill();
  ctx.lineWidth = Math.max(5, R * 0.1); ctx.lineJoin = 'round'; ctx.strokeStyle = rindColor; ctx.stroke();
  ctx.fillStyle = 'rgba(25,25,25,0.85)';
  for (const s of SEED) { const p = P[s.k]; const x = p.x + s.dx * 0.55, y = p.y + s.dy * 0.55; ctx.save(); ctx.translate(x, y); ctx.rotate(s.rot); ctx.beginPath(); ctx.ellipse(0, 0, 3, 4.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
  if (cutting && cutA && cutB) { ctx.save(); ctx.setLineDash([7, 6]); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cutA.x, cutA.y); ctx.lineTo(cutB.x, cutB.y); ctx.stroke(); ctx.restore(); }
}

/* ---------- input ---------- */
function nearPoint(x, y) { let best = 0, bd = 1e9; for (let i = 0; i <= N; i++) { const p = P[i]; const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < bd) { bd = d; best = i; } } return best; }
function applyCut(a, b) {
  const ax = b.x - a.x, ay = b.y - a.y; const len2 = ax * ax + ay * ay || 1e-6;
  for (let i = SPR.length - 1; i >= 0; i--) {
    const s = SPR[i]; const p = P[s.a], q = P[s.b];
    const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    const t = Math.max(0, Math.min(1, ((mx - a.x) * ax + (my - a.y) * ay) / len2));
    if (Math.hypot(mx - (a.x + ax * t), my - (a.y + ay * t)) < 14) SPR.splice(i, 1);
  }
}
function pos(e) { const r = canvas.getBoundingClientRect(); const ex = e.clientX != null ? e.clientX : (e.touches ? e.touches[0].clientX : 0); const ey = e.clientY != null ? e.clientY : (e.touches ? e.touches[0].clientY : 0); return { x: ex - r.left, y: ey - r.top }; }
canvas.addEventListener('pointerdown', (e) => { const p = pos(e); mouse.x = p.x; mouse.y = p.y; if (mode === 'grab') { grabbing = nearPoint(p.x, p.y); } else { cutting = true; cutA = { x: p.x, y: p.y }; cutB = { x: p.x, y: p.y }; } });
canvas.addEventListener('pointermove', (e) => { const p = pos(e); mouse.x = p.x; mouse.y = p.y; if (cutting) cutB = { x: p.x, y: p.y }; });
canvas.addEventListener('pointerup', () => { if (cutting && cutA && cutB) applyCut(cutA, cutB); grabbing = null; cutting = false; cutA = null; cutB = null; });
canvas.addEventListener('pointercancel', () => { grabbing = null; cutting = false; });

const bG = document.getElementById('modeGrab'), bC = document.getElementById('modeCut'), bR = document.getElementById('reset');
function setMode(m) { mode = m; bG.classList.toggle('active', m === 'grab'); bC.classList.toggle('active', m === 'cut'); canvas.classList.toggle('cutting', m === 'cut'); }
bG.onclick = () => setMode('grab');
bC.onclick = () => setMode('cut');
bR.onclick = () => build();
document.getElementById('colorPicker').oninput = (e) => { fleshColor = e.target.value; };

/* ---------- loop ---------- */
let last = performance.now(), accF = 0, fpsN = 0, fpsT = last;
const DT = 1 / 120;
function loop(now) {
  let delta = (now - last) / 1000; last = now;
  if (!isFinite(delta) || delta <= 0) delta = 0.016; else if (delta > 0.05) delta = 0.05;
  accF += delta;
  let guard = 0; while (accF > DT && guard++ < 10) { step(DT); accF -= DT; }
  render();
  fpsN++; if (now - fpsT > 500) { const el = document.getElementById('fps'); if (el) el.textContent = Math.round((fpsN * 1000) / (now - fpsT)) + ' fps'; fpsN = 0; fpsT = now; }
  requestAnimationFrame(loop);
}
build();
render();
requestAnimationFrame(loop);


</script>
</body>
</html>
